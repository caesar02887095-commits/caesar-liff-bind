<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAESAR 司機任務</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f5f6f8;
      color: #222;
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 10px;
    }
    .topbar {
      background: #2c3e50;
      color: #fff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 14px;
      line-height: 1.55;
      opacity: 0.95;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin: 12px 0;
    }
    .tab-btn {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 11px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #d9dde3;
      color: #333;
    }
    .tab-btn.active {
      background: #EBA13A;
      color: #fff;
    }
    .panel {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #555;
    }
    .refresh-btn {
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 14px;
      font-weight: bold;
      background: #d9dde3;
      color: #333;
      cursor: pointer;
      white-space: nowrap;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: all 0.2s ease;
    }
    .card.done {
      background: #e5e7eb;
      opacity: 0.78;
      margin-left: 12px;
      padding: 10px 12px;
    }
    .card.done .card-top,
    .card.done .address-box,
    .card.done .btn-row,
    .card.done .depart-box {
      display: none;
    }
    .card.done .display-name {
      font-size: 15px;
      margin-bottom: 0;
      color: #374151;
    }
    .done-note {
      margin-top: 6px;
      font-size: 13px;
      color: #4b5563;
      line-height: 1.5;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }
    .left-badges {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .badge-sort {
      background: #0f172a;
      color: #fff;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: bold;
      min-width: 20px;
      text-align: center;
    }
    .badge-route {
      background: #eef1f5;
      color: #333;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
    }
    .badge-right {
      background: #e5e7eb;
      color: #374151;
      border-radius: 10px;
      padding: 6px 9px;
      font-size: 11px;
      font-weight: bold;
      line-height: 1.45;
      text-align: right;
      max-width: 165px;
      word-break: break-word;
    }
    .display-name {
      font-size: 19px;
      font-weight: bold;
      line-height: 1.35;
      margin-bottom: 6px;
      word-break: break-word;
    }
    .address-box {
      margin-top: 8px;
      background: #fff7ed;
      border: 1px solid #fdba74;
      color: #9a3412;
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 13px;
      line-height: 1.55;
    }
    .depart-box {
      margin-top: 8px;
      background: #ecfeff;
      border: 1px solid #67e8f9;
      color: #0f766e;
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 13px;
      line-height: 1.55;
    }
    .travel-connector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #64748b;
      font-size: 13px;
      margin: 2px 0 10px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .btn {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 11px 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-nav {
      background: #dbeafe;
      color: #1d4ed8;
    }
    .btn-done {
      background: #16a34a;
      color: #fff;
    }
    .btn-special {
      background: #d97706;
      color: #fff;
    }
.btn-start {
      background: #0891b2;
      color: #fff;
    }

    .btn-photo {
      background: #7c3aed;
      color: #fff;
    }

    .photo-note {
      margin-top: 8px;
      font-size: 12px;
      color: #6b7280;
      line-height: 1.5;
    }
    .photo-preview-grid {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .photo-thumb {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      aspect-ratio: 1 / 1;
    }
    .photo-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo-delete-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 999px;
      background: rgba(17,24,39,0.78);
      color: #fff;
      font-size: 16px;
      line-height: 24px;
      text-align: center;
      cursor: pointer;
      padding: 0;
    }
    .empty {
      text-align: center;
      color: #666;
      padding: 28px 14px;
      background: #fff;
      border-radius: 12px;
      font-size: 15px;
    }
    .loading {
      text-align: center;
      padding: 24px 14px;
      color: #666;
      font-size: 15px;
    }
    .page-loading-panel {
      display: none;
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid #e5e7eb;
    }
    .page-loading-panel.show {
      display: block;
    }
    .page-loading-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 13px;
      color: #475569;
      font-weight: bold;
    }
    .page-loading-percent {
      color: #94a3b8;
      font-weight: bold;
      flex-shrink: 0;
    }
    .page-loading-bar {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: #e5e7eb;
      overflow: hidden;
    }
    .page-loading-fill {
      width: 8%;
      height: 100%;
      border-radius: 999px;
      background: #EBA13A;
      transition: width 0.25s ease;
    }
    .page-loading-note {
      margin-top: 8px;
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
    }
    .page-loading-retry {
      display: none;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      background: #d9dde3;
      color: #333;
    }
    .page-loading-retry.show {
      display: inline-block;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 11px;
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 14px;
      line-height: 1.55;
    }
    .footer-note {
      margin-top: 12px;
      font-size: 12px;
      color: #777;
      text-align: center;
      line-height: 1.6;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .overlay.show {
      display: flex;
    }
    .overlay-box {
      background: #fff;
      border-radius: 14px;
      padding: 20px 24px;
      min-width: 180px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.18);
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 4px solid #e5e7eb;
      border-top: 4px solid #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    .overlay-text {
      font-size: 14px;
      color: #374151;
      font-weight: bold;
    }
    .overlay-preview {
      display: none;
      gap: 8px;
      justify-content: center;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .overlay-preview.show {
      display: flex;
    }
    .overlay-preview img {
      width: 58px;
      height: 58px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      background: #f3f4f6;
    }
    .manual-add-notice {
      display: none;
      background: #fffbeb;
      border: 1px solid #f59e0b;
      color: #92400e;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.5;
    }

    .manual-add-notice.show {
      display: block;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title">CAESAR 司機任務</div>
      <div class="sub" id="driverInfo">載入中...</div>
    </div>

    <div id="errorBox"></div>

    <div class="tabs">
      <button class="tab-btn" id="tabAM" onclick="switchPeriod('上午')">上午任務</button>
      <button class="tab-btn" id="tabPM" onclick="switchPeriod('下午')">下午任務</button>
    </div>

    <div class="panel">
      <div class="status-bar">
        <div id="summaryText">讀取中...</div>
        <button class="refresh-btn" onclick="loadTasks()">重新整理</button>
      </div>
    </div>

    <div class="manual-add-notice" id="manualAddNotice"></div>

    <div class="page-loading-panel" id="pageLoadingPanel">
      <div class="page-loading-row">
        <div id="pageLoadingText">正在讀取司機任務...</div>
        <div class="page-loading-percent" id="pageLoadingPercent">0%</div>
      </div>
      <div class="page-loading-bar">
        <div class="page-loading-fill" id="pageLoadingFill"></div>
      </div>
      <div class="page-loading-note" id="pageLoadingNote">請稍候，系統正在整理今日路線。</div>
      <button class="page-loading-retry" id="pageLoadingRetry" onclick="loadTasks()">重新整理</button>
    </div>

    <div id="taskContainer">
      <div class="loading">任務載入中...</div>
    </div>

    <div class="footer-note">
      本頁僅提供任務查看、導航與回報功能。<br />
      實際配送明細仍以紙本單據為準。
    </div>
  </div>

  <div class="overlay" id="loadingOverlay">
    <div class="overlay-box">
      <div class="spinner"></div>
      <div class="overlay-text" id="overlayText">處理中...</div>
      <div class="overlay-preview" id="overlayPreview"></div>
    </div>
  </div>

  <script>
    const LIFF_ID = '2009380550-ow9SlJK4';
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxmUEj7tu2ZbqZaIESXhu9oS73QdE8qOGRKmHONqHXf-H6pL3zdYxuSvssjOExQNJjlhA/exec';

    let currentDriverName = '';
    let pendingGroupStates = {};
    let localCompletedGroups = {};
    let pendingDeparture = false;
    let currentPeriod = '上午';
    let currentTasks = [];
    let currentBatchId = '';
    let departureStarted = false;
    let groupedStopsCache = [];
    const PHOTO_SUPPLEMENT_WINDOW_MIN = 10;
    let overlayPreviewUrls = [];
    let driverActionDelegationBound = false;
    // 已關閉固定時間輪詢：司機頁只在開頁、手動重新整理、切回頁面、操作後重新讀取。
    let suppressAutoReloadUntil = 0;
    let pageLoadingTimer10 = null;
    let pageLoadingTimer30 = null;

    function getQueryParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name) || '';
    }

    async function initPage() {
      try {
        showPageProgress('正在初始化司機頁...', 10, '請稍候，系統正在準備司機任務畫面。');
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        const queryDriver = getQueryParam('driver');
        const queryPeriod = getQueryParam('period');

        currentPeriod = queryPeriod || getDefaultPeriod();
        updatePageProgress('正在驗證司機權限...', 24, '系統正在確認此 LINE 帳號是否已綁定司機。');
        const auth = await verifyDriverAccess(profile.userId || '', queryDriver);
        currentDriverName = auth.driverName || '';

        setTabs();
        await loadTasks();
      } catch (err) {
        const msg = err.message || err;
        showError('初始化失敗：' + msg);
        renderAuthDenied(msg);
        completePageProgress('司機權限驗證失敗');
      }
    }

    function setTabs() {
      document.getElementById('tabAM').classList.toggle('active', currentPeriod === '上午');
      document.getElementById('tabPM').classList.toggle('active', currentPeriod === '下午');
    }

    function switchPeriod(period) {
      currentPeriod = period;
      setTabs();
      loadTasks();
    }



    async function verifyDriverAccess(uid, requestedDriver) {
      const url =
        `${GAS_WEBAPP_URL}?action=get_driver_access` +
        `&uid=${encodeURIComponent(uid || '')}` +
        `&driver=${encodeURIComponent(requestedDriver || '')}` +
        `&ts=${Date.now()}`;

      const resp = await fetch(url, { cache: 'no-store' });
      const json = await resp.json();
      if (!json.ok) {
        throw new Error(json.error || '司機權限驗證失敗');
      }

      const data = json.data || {};
      if (!data.authorized) {
        const code = data.code ? `（${data.code}）` : '';
        const uidNote = uid ? `｜LINE_UID：${uid}` : '';
        throw new Error((data.message || '此 LINE 帳號尚未綁定司機權限') + code + uidNote);
      }
      return data;
    }

    function renderAuthDenied(message) {
      const list = document.getElementById('taskContainer');
      if (!list) return;
      document.getElementById('driverInfo').innerHTML =
        `司機權限：<b>未通過</b><br>目前查看：<b>${escapeHtml(currentPeriod || '')}</b>`;
      list.innerHTML = `
        <div class="empty">
          <b>無法開啟司機任務</b><br>
          ${escapeHtml(message || '此 LINE 帳號尚未綁定司機權限。')}<br>
          請確認 DRIVER_DB 已填入此司機的 LINE_UID，且啟用欄位為 Y。
        </div>
      `;
    }

    function setPendingGroupState(groupKey, payload) {
      pendingGroupStates[groupKey] = {
        ...(pendingGroupStates[groupKey] || {}),
        ...payload,
        expireAt: Date.now() + 60000
      };
    }

    function cleanupPendingStates() {
      const now = Date.now();
      Object.keys(pendingGroupStates).forEach(key => {
        const item = pendingGroupStates[key];
        if (!item || !item.expireAt || item.expireAt < now) delete pendingGroupStates[key];
      });
    }

    function cleanupLocalCompletedGroups() {
      const now = Date.now();
      Object.keys(localCompletedGroups).forEach(key => {
        const item = localCompletedGroups[key];
        if (!item || !item.expireAt || item.expireAt < now) delete localCompletedGroups[key];
      });
    }

    function applyPendingStatesToTasks(tasks) {
      cleanupPendingStates();
      return (Array.isArray(tasks) ? tasks : []).map(task => {
        const shopName = String(task.shopName || '').trim();
        const rawAddress = String(task.address || '').trim();
        const normalizedAddress = (!rawAddress || rawAddress === '送店') ? '__STORE__' : rawAddress;
        const key = `${shopName}__${normalizedAddress}`;
        const pending = pendingGroupStates[key];
        if (!pending) return task;
        return {
          ...task,
          status: pending.status || task.status,
          reportedAt: pending.reportedAt || task.reportedAt,
          photoCount: typeof pending.photoCount === 'number' ? pending.photoCount : task.photoCount,
          draftPhotos: Array.isArray(pending.draftPhotos) ? pending.draftPhotos : task.draftPhotos,
          etaText: pending.clearEta ? '' : task.etaText
        };
      });
    }

    async function loadTasks(silent = false) {
      try {
        if (silent && Date.now() < suppressAutoReloadUntil) return;
        clearError();
        if (!silent) {
          showPageProgress('正在讀取司機任務...', 35, '系統正在確認今日路線與配送狀態。');
          renderLoading();
        }

        document.getElementById('driverInfo').innerHTML =
          `司機：<b>${escapeHtml(currentDriverName || '未辨識')}</b><br>司機權限：<b>已通過</b><br>目前查看：<b>${currentPeriod}</b>`;

        const url =
          `${GAS_WEBAPP_URL}?action=get_driver_tasks` +
          `&driver=${encodeURIComponent(currentDriverName)}` +
          `&period=${encodeURIComponent(currentPeriod)}` +
          `&ts=${Date.now()}`;

        const resp = await fetch(url, { cache: 'no-store' });
        const json = await resp.json();

        if (!json.ok) {
          throw new Error(json.error || '讀取任務失敗');
        }

        if (!silent) updatePageProgress('正在整理配送順序...', 78, '系統正在整理站點、配送狀態與照片資訊。');
        currentTasks = applyPendingStatesToTasks((json.data && json.data.tasks) ? json.data.tasks : []);
        currentBatchId = (json.data && json.data.batchId) ? json.data.batchId : '';
        cleanupLocalCompletedGroups();
        const serverDoneStatuses = new Set(['已完成','放門口','改送隔壁','聯繫後改期','取消配送','特殊回報']);
        currentTasks.forEach(task => {
          const shopName = String(task.shopName || '').trim();
          const rawAddress = String(task.address || '').trim();
          const normalizedAddress = (!rawAddress || rawAddress === '送店') ? '__STORE__' : rawAddress;
          const key = `${shopName}__${normalizedAddress}`;
          if (serverDoneStatuses.has(String(task.status || '').trim()) && localCompletedGroups[key]) {
            delete localCompletedGroups[key];
          }
        });
        const serverHasDeparted = currentTasks.some(task => String(task.etaText || '').trim() || ['已完成','放門口','改送隔壁','聯繫後改期','取消配送','特殊回報'].includes(String(task.status || '').trim()));
        if (serverHasDeparted) pendingDeparture = false;
        renderTasks(currentTasks);
        loadManualAddNotice();
        if (!silent) completePageProgress('司機任務載入完成');
      } catch (err) {
        if (!silent) {
          updatePageProgress('司機任務讀取失敗', 100, '請確認網路狀態後重新整理。');
          showError('讀取任務失敗：' + (err.message || err));
          renderEmpty('目前無法讀取任務。');
        }
      }
    }


    async function loadManualAddNotice() {
      try {
        const resp = await fetch(`${GAS_WEBAPP_URL}?action=get_manual_add_status&ts=${Date.now()}`, { cache: 'no-store' });
        const json = await resp.json();
        const data = json && json.data ? json.data : {};
        const count = Number(data.pendingCount || 0);
        const box = document.getElementById('manualAddNotice');
        if (!box) return;
        if (count > 0) {
          box.classList.add('show');
          box.textContent = `目前有加單尚未排車：${count} 筆，請等待調度安排。`;
        } else {
          box.classList.remove('show');
          box.textContent = '';
        }
      } catch (err) {
        console.warn('loadManualAddNotice failed', err);
      }
    }

    function renderLoading() {
      document.getElementById('summaryText').textContent = '載入中...';
      document.getElementById('taskContainer').innerHTML = '<div class="loading">任務載入中...</div>';
    }

    function renderEmpty(text) {
      document.getElementById('summaryText').textContent = '目前沒有任務';
      document.getElementById('taskContainer').innerHTML = `<div class="empty">${escapeHtml(text)}</div>`;
    }

    function getStorageKey() {
      const scope = currentBatchId || currentPeriod;
      return `caesar_driver_state__${currentDriverName}__${scope}`;
    }

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(getStorageKey());
        if (!raw) return { completedList: [], lastCompletedKey: '', departed: false };
        const parsed = JSON.parse(raw);
        return {
          completedList: Array.isArray(parsed.completedList) ? parsed.completedList : [],
          lastCompletedKey: parsed.lastCompletedKey || '',
          departed: !!parsed.departed
        };
      } catch (e) {
        return { completedList: [], lastCompletedKey: '', departed: false };
      }
    }

    function saveLocalState(state) {
      localStorage.setItem(getStorageKey(), JSON.stringify(state));
    }

    function groupTasksByStop(tasks) {
      const map = {};

      tasks.forEach(task => {
        const shopName = String(task.shopName || '').trim();
        const rawAddress = String(task.address || '').trim();
        const normalizedAddress = (!rawAddress || rawAddress === '送店') ? '__STORE__' : rawAddress;
        const key = `${shopName}__${normalizedAddress}`;

        if (!map[key]) {
          map[key] = {
            key,
            shopName,
            address: rawAddress,
            phone: String(task.phone || '').trim(),
            routeGroup: task.routeGroup || '',
            taskIds: [],
            orderNos: [],
            tasks: [],
            isStore: (!rawAddress || rawAddress === '送店'),
            sortOrder: task.sortOrder || '',
            photoCount: 0,
            draftPhotos: [],
            status: task.status || '',
            reportedAt: task.reportedAt || '',
            note: ''
          };
        }

        map[key].taskIds.push(task.taskId || '');
        map[key].orderNos.push(task.orderNo || '');
        map[key].tasks.push(task);
        map[key].photoCount = Math.max(map[key].photoCount || 0, Number(task.photoCount || 0));
        const taskPhotos = Array.isArray(task.draftPhotos) ? task.draftPhotos : [];
        if (taskPhotos.length > (map[key].draftPhotos || []).length) {
          map[key].draftPhotos = taskPhotos;
        }
        map[key].status = task.status || map[key].status || '';
        map[key].reportedAt = task.reportedAt || map[key].reportedAt || '';
      });

      return Object.values(map).sort((a, b) => {
        const orderA = Number(a.sortOrder || 999999);
        const orderB = Number(b.sortOrder || 999999);
        if (orderA !== orderB) return orderA - orderB;
        return String(getMainLabel(a) || '').localeCompare(String(getMainLabel(b) || ''), 'zh-Hant');
      });
    }

    function getMainLabel(group) {
      const address = String(group.address || '').trim();
      const shopName = String(group.shopName || '').trim();
      return group.isStore ? (shopName || '未填店家') : (address || shopName || '未填地址');
    }

    function renderTasks(tasks) {
      const grouped = groupTasksByStop(tasks);

      const completedStatusSet = new Set(['已完成', '放門口', '改送隔壁', '聯繫後改期', '取消配送', '特殊回報']);
      const serverDeparted = tasks.some(task => {
        const status = String(task.status || '').trim();
        const etaText = String(task.etaText || '').trim();
        return !!etaText || completedStatusSet.has(status);
      });
      departureStarted = !!pendingDeparture || serverDeparted;
      const serverCompletedGroups = grouped.filter(g => completedStatusSet.has(String(g.status || '').trim()));
      cleanupLocalCompletedGroups();
      const serverCompletedKeySet = new Set(serverCompletedGroups.map(g => g.key));
      const localCompletedList = Object.values(localCompletedGroups).filter(item => item && !serverCompletedKeySet.has(item.key));
      const pendingGroups = grouped.filter(g => !completedStatusSet.has(String(g.status || '').trim()) && !localCompletedGroups[g.key]);
      const completedList = serverCompletedGroups.map(g => ({
        key: g.key,
        label: getMainLabel(g),
        taskIds: g.taskIds || [],
        note: (g.status && g.status !== '已完成') ? g.status : '',
        photoCount: Number(g.photoCount || 0),
        draftPhotos: Array.isArray(g.draftPhotos) ? g.draftPhotos : [],
        reportedAt: g.reportedAt || '',
        completedAt: g.reportedAt ? new Date(g.reportedAt).getTime() : Date.now()
      })).concat(localCompletedList.sort((a,b)=> (a.completedAt||0)-(b.completedAt||0)));

      groupedStopsCache = pendingGroups.slice();

      document.getElementById('summaryText').textContent =
        `剩 ${pendingGroups.length} 站 / ${pendingGroups.reduce((sum, g) => sum + g.taskIds.length, 0)} 張待配送單`;

      const htmlParts = [];

      htmlParts.push(`
        <div class="card ${departureStarted ? 'done' : ''}" id="departure-card">
          <div class="card-top">
            <div class="left-badges">
              <div class="badge-sort">起點</div>
              <div class="badge-route">公司</div>
            </div>
            <div class="badge-right">出發</div>
          </div>
          <div class="display-name">公司出發</div>
          <div class="depart-box">
            出發前請確認：<br>
            1. 紙本單據齊全<br>
            2. 路線已確認<br>
            3. 手機 / 導航 / 聯絡正常
          </div>
          <div class="btn-row">
            <button class="btn btn-start" id="btn-start-departure">出發</button>
          </div>
        </div>
      `);

      if (departureStarted && pendingGroups.length > 0 && completedList.length === 0) {
        htmlParts.push(`
          <div class="travel-connector">
            <span>🚚 司機配送中</span>
          </div>
        `);
      }

      completedList.forEach((item, idx) => {
        const doneText = item.note
          ? `${item.label || ''} (${item.note})`
          : `${item.label || ''}`;
        const canSupplement = canSupplementPhoto(item);
        const photoText = item.photoCount ? ` 已有${item.photoCount}張照片` : ' 可補照片';

        htmlParts.push(`
          <div class="card done">
            <div class="display-name">${escapeHtml(doneText)}</div>
            ${item.syncPending ? `<div class="done-note">已送出｜系統同步中</div>` : ''}
            ${renderDraftPhotoGrid(item)}
            ${canSupplement ? `<div class="btn-row" style="display:flex; margin-top:8px;"><button class="btn btn-photo btn-photo-upload" data-group-key="${escapeHtml(item.key)}" data-taskids="${escapeHtml(encodeURIComponent(JSON.stringify(item.taskIds || [])))}">補傳照片${escapeHtml(photoText)}</button></div>` : ''}
          </div>
        `);

        if (idx === completedList.length - 1 && pendingGroups.length > 0) {
          htmlParts.push(`
            <div class="travel-connector">
              <span>🚚 司機配送中</span>
            </div>
          `);
        }
      });

      if (!pendingGroups.length && !completedList.length) {
        htmlParts.push(`<div class="empty">目前 ${escapeHtml(currentPeriod)} 沒有待配送任務</div>`);
      } else {
        pendingGroups.forEach((group, index) => {
          const firstTask = group.tasks[0];
          const navTarget = getNavigationTarget(firstTask);
          const mainLabel = getMainLabel(group);

          const addressBlock = !group.isStore
            ? `
              <div class="address-box">
                <b>指定送達</b><br>
                地址：${escapeHtml(firstTask.address || '未填')}
              </div>
            `
            : '';

          htmlParts.push(`
            <div class="card" id="card-${escapeHtml(group.key)}">
              <div class="card-top">
                <div class="left-badges">
                  <div class="badge-sort">${escapeHtml(String(index + 1))}</div>
                  <div class="badge-route">${escapeHtml(group.routeGroup || '未分組')}</div>
                </div>
                <div class="badge-right">${escapeHtml(group.orderNos.join(', '))}</div>
              </div>

              <div class="display-name">${escapeHtml(mainLabel)}</div>
              ${addressBlock}

              <div class="btn-row">
                <button class="btn btn-nav" data-nav="${escapeHtml(navTarget)}">導航</button>
                <button class="btn btn-photo btn-photo-upload" data-group-key="${escapeHtml(group.key)}" data-taskids="${escapeHtml(encodeURIComponent(JSON.stringify(group.taskIds)))}">傳照片${group.photoCount ? `(${group.photoCount})` : ''}</button>
                <button class="btn btn-done" data-group-key="${escapeHtml(group.key)}" data-taskids="${escapeHtml(encodeURIComponent(JSON.stringify(group.taskIds)))}">完成配送</button>
                <button class="btn btn-special" data-group-key="${escapeHtml(group.key)}" data-taskids="${escapeHtml(encodeURIComponent(JSON.stringify(group.taskIds)))}">特殊回報</button>

            </div>
          `);

      document.getElementById('taskContainer').innerHTML = htmlParts.join('');

    function renderDraftPhotoGrid(group) {
      const photos = Array.isArray(group.draftPhotos) ? group.draftPhotos : [];
      if (!photos.length) return '';
      return `
        <div class="photo-preview-grid">
          ${photos.map((photo, idx) => `
            <div class="photo-thumb">
              <a href="${escapeHtml(photo.url || photo.previewUrl || '')}" target="_blank" rel="noopener">
                <img loading="lazy" decoding="async" src="${escapeHtml(photo.previewUrl || photo.url || '')}" alt="draft-photo-${idx + 1}">
              </a>
              <button class="photo-delete-btn btn-photo-delete"
                      data-group-key="${escapeHtml(group.key)}"
                      data-taskids="${escapeHtml(encodeURIComponent(JSON.stringify(group.taskIds)))}"
                      data-photo-index="${idx}"
                      data-file-id="${escapeHtml(photo.fileId || '')}">×</button>
            </div>
          `).join('')}
        </div>
      `;
    }

    function bindActionButtons() {
      // v54 Android 載入優化：改用事件委派。
      // 原本每次 renderTasks() 都會 querySelectorAll 並重新綁定每顆按鈕，
      // Android LINE WebView 在多任務卡片時會明顯卡頓。現在只在 taskContainer 綁一次。
      if (driverActionDelegationBound) return;

      const container = document.getElementById('taskContainer');
      if (!container) return;

      container.addEventListener('click', async (ev) => {
        const target = ev.target && ev.target.closest ? ev.target.closest('button') : null;
        if (!target) return;

        if (target.id === 'btn-start-departure') {
          ev.preventDefault();
          await startDeparture();
          return;
        }

        if (target.classList.contains('btn-nav')) {
          ev.preventDefault();
          openMap(target.getAttribute('data-nav') || '');
          return;
        }

        if (target.classList.contains('btn-done')) {
          ev.preventDefault();
          const groupKey = target.getAttribute('data-group-key') || '';
          const taskIdsJson = decodeURIComponent(target.getAttribute('data-taskids') || '');
          await submitGroupedStatus(taskIdsJson, 'DONE', groupKey, '');
          return;
        }

        if (target.classList.contains('btn-photo-upload')) {
          ev.preventDefault();
          const groupKey = target.getAttribute('data-group-key') || '';
          const taskIdsJson = decodeURIComponent(target.getAttribute('data-taskids') || '[]');
          await chooseAndUploadPhotos(taskIdsJson, groupKey);
          return;
        }

        if (target.classList.contains('btn-photo-delete')) {
          ev.preventDefault();
          ev.stopPropagation();
          const groupKey = target.getAttribute('data-group-key') || '';
          const taskIdsJson = decodeURIComponent(target.getAttribute('data-taskids') || '[]');
          const photoIndex = Number(target.getAttribute('data-photo-index') || '-1');
          const fileId = target.getAttribute('data-file-id') || '';
          await deleteUploadedPhoto(taskIdsJson, groupKey, photoIndex, fileId);
          return;
        }

        if (target.classList.contains('btn-special')) {
          ev.preventDefault();
          const groupKey = target.getAttribute('data-group-key') || '';
          const taskIdsJson = decodeURIComponent(target.getAttribute('data-taskids') || '');
          await submitGroupedSpecial(taskIdsJson, groupKey);
        }
      });

      driverActionDelegationBound = true;
    }


    function showSyncNotice(message) {
      const box = document.getElementById('errorBox');
      if (!box) return;
      box.innerHTML = `<div class="error" style="background:#ecfeff;color:#0f766e;border:1px solid #67e8f9;">${escapeHtml(message || '已送出，系統同步中')}</div>`;
      setTimeout(() => {
        if (box && box.innerHTML.indexOf('系統同步') !== -1) box.innerHTML = '';
      }, 3500);
    }

    function showSyncWarning(message) {
      const box = document.getElementById('errorBox');
      if (!box) return;
      box.innerHTML = `<div class="error" style="background:#fffbeb;color:#92400e;border:1px solid #f59e0b;">${escapeHtml(message || '同步狀態尚未確認，請稍後重新整理。')}</div>`;
    }

    async function postDriverActionWithSoftTimeout(payload, timeoutMs = 1800) {
      const fetchPromise = fetch(GAS_WEBAPP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).then(async resp => {
        const text = await resp.text();
        let json = {};
        try { json = JSON.parse(text); } catch (e) { throw new Error(text || '系統回應格式錯誤'); }
        if (!json.ok) throw new Error(json.message || json.error || '送出失敗');
        return json;
      });

      let timeoutId = null;
      const timeoutPromise = new Promise(resolve => {
        timeoutId = setTimeout(() => resolve({ ok: true, timeout: true, message: '已送出，系統同步中' }), timeoutMs);
      });

      const result = await Promise.race([fetchPromise, timeoutPromise]);
      if (timeoutId) clearTimeout(timeoutId);

      if (result && result.timeout) {
        fetchPromise.catch(err => {
          console.warn('driver action background confirm failed:', err);
          showSyncWarning('已先更新畫面，但送出狀態尚未確認。請稍後重新整理確認。');
        });
      }
      return result;
    }

    async function startDeparture() {
      if (window.__driverActionLock) return;
      window.__driverActionLock = true;
      const previousDeparture = departureStarted;
      try {
        pendingDeparture = true;
        departureStarted = true;
        suppressAutoReloadUntil = Date.now() + 12000;
        renderTasks(currentTasks);
        showSyncNotice('已送出公司出發｜系統同步中，ETA 將於背景更新');

        const payload = {
          action: 'mark_driver_departure',
          driverName: currentDriverName,
          period: currentPeriod,
          routeDate: new Date().toISOString()
        };

        await postDriverActionWithSoftTimeout(payload, 1800);
        setTimeout(() => { suppressAutoReloadUntil = 0; loadTasks(true); }, 5000);
      } catch (err) {
        departureStarted = previousDeparture;
        pendingDeparture = false;
        renderTasks(currentTasks);
        alert('出發送出失敗：' + (err.message || err));
      } finally {
        setTimeout(() => { window.__driverActionLock = false; }, 800);
        hideOverlay();
      }
    }

    function isStoreTask(task) {
      const addr = String(task.address || '').trim();
      return !addr || addr === '送店';
    }

    function getNavigationTarget(task) {
      if (isStoreTask(task)) return task.shopName || task.displayName || '';
      return task.address || task.shopName || '';
    }

    function openMap(target) {
      if (!target) return;
      const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(target)}`;
      window.open(url, '_blank');
    }

    async function submitGroupStatus(taskIds, actionType, note = '') {
      let gpsInfo = '';
      try { gpsInfo = await getCurrentGpsText(); } catch (gpsErr) { gpsInfo = ''; }
      const payload = { action: 'update_driver_group_status', taskIds, driverName: currentDriverName, actionType, note, gpsInfo };
      return postDriverActionWithSoftTimeout(payload, 1800);
    }

    async function submitGroupedStatus(taskIdsJson, actionType, groupKey, note = '') {
      let taskIds = [];
      try { taskIds = JSON.parse(taskIdsJson); } catch (e) { alert('任務資料格式錯誤'); return; }
      if (window.__driverActionLock) return;
      window.__driverActionLock = true;

      const displayStatus = actionType === 'DONE' ? '已完成' : (note || '特殊回報');
      const previousTasks = currentTasks.map(t => ({ ...t }));
      const previousCompletedGroups = { ...localCompletedGroups };
      const previousPendingStates = { ...pendingGroupStates };

      try {
        suppressAutoReloadUntil = Date.now() + 12000;
        markGroupDone(groupKey, displayStatus, true);
        showSyncNotice((actionType === 'DONE' ? '已送出完成回報' : '已送出特殊回報') + '｜系統同步中');
        await submitGroupStatus(taskIds, actionType, note);
        setTimeout(() => { suppressAutoReloadUntil = 0; loadTasks(true); }, 5000);
      } catch (err) {
        currentTasks = previousTasks;
        localCompletedGroups = previousCompletedGroups;
        pendingGroupStates = previousPendingStates;
        renderTasks(currentTasks);
        alert('整站回報送出失敗：' + (err.message || err));
      } finally {
        setTimeout(() => { window.__driverActionLock = false; }, 800);
        hideOverlay();
      }
    }

    async function submitGroupedSpecial(taskIdsJson, groupKey) {
      let taskIds = [];
      try {
        taskIds = JSON.parse(taskIdsJson);
      } catch (e) {
        alert('任務資料格式錯誤');
        return;
      }

      const choice = prompt(
        '請輸入特殊回報代碼：\n' +
        '1 = 客戶同意放門口\n' +
        '2 = 改送隔壁\n' +
        '3 = 聯繫後改期\n' +
        '4 = 客戶取消\n' +
        '5 = 其他'
      );
      if (!choice) return;

      let actionType = 'OTHER';
      let note = '';

      if (choice === '1') {
        actionType = 'DROP_OFF';
        note = '放門口';
      } else if (choice === '2') {
        actionType = 'NEIGHBOR';
        note = '改送隔壁';
      } else if (choice === '3') {
        actionType = 'RESCHEDULED';
        note = '聯繫後改期';
      } else if (choice === '4') {
        actionType = 'CANCELLED';
        note = '取消配送';
      } else if (choice === '5') {
        actionType = 'OTHER';
        note = prompt('請輸入補充說明') || '特殊回報';
      } else {
        alert('無效選項');
        return;
      }

      await submitGroupedStatus(taskIdsJson, actionType, groupKey, note);
    }

    function markGroupDone(groupKey, note = '', syncPending = false) {
      const group = groupedStopsCache.find(x => x.key === groupKey);
      if (!group) return;

      const finalStatus = note || '已完成';
      const now = new Date();
      setPendingGroupState(groupKey, { status: finalStatus, reportedAt: now.toISOString(), clearEta: true, photoCount: Number(group.photoCount || 0), draftPhotos: Array.isArray(group.draftPhotos) ? group.draftPhotos : [] });

      currentTasks = currentTasks.map(task => {
        const shopName = String(task.shopName || '').trim();
        const rawAddress = String(task.address || '').trim();
        const normalizedAddress = (!rawAddress || rawAddress === '送店') ? '__STORE__' : rawAddress;
        const key = `${shopName}__${normalizedAddress}`;
        if (key !== groupKey) return task;
        return {
          ...task,
          status: finalStatus,
          reportedAt: now.toISOString()
        };
      });

      groupedStopsCache = groupedStopsCache.filter(x => x.key !== groupKey);
      localCompletedGroups[groupKey] = {
        key: groupKey,
        label: getMainLabel(group),
        taskIds: group.taskIds || [],
        note: finalStatus !== '已完成' ? finalStatus : '',
        photoCount: Number(group.photoCount || 0),
        draftPhotos: Array.isArray(group.draftPhotos) ? group.draftPhotos : [],
        reportedAt: now.toISOString(),
        completedAt: now.getTime(),
        syncPending: !!syncPending,
        expireAt: Date.now() + 120000
      };
      renderTasks(currentTasks);
    }

    function canSupplementPhoto(item) {
      const completedAt = Number(item && item.completedAt || 0);
      if (!completedAt) return false;
      return (Date.now() - completedAt) <= PHOTO_SUPPLEMENT_WINDOW_MIN * 60 * 1000;
    }

    function chooseImageFiles_(maxCount) {
      return new Promise(resolve => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.multiple = true;
        input.onchange = () => {
          const files = Array.from(input.files || []).slice(0, Math.max(1, maxCount || 2));
          resolve(files);
        };
        input.click();
      });
    }

    async function compressImageFile_(file) {
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      const img = await new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = dataUrl;
      });
      const maxSide = 960;
      let { width, height } = img;
      if (width > height && width > maxSide) {
        height = Math.round(height * (maxSide / width));
        width = maxSide;
      } else if (height >= width && height > maxSide) {
        width = Math.round(width * (maxSide / height));
        height = maxSide;
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      const compressed = canvas.toDataURL('image/jpeg', 0.65);
      return {
        fileName: file.name || 'photo.jpg',
        mimeType: 'image/jpeg',
        dataBase64: compressed.split(',')[1]
      };
    }

    async function uploadGroupPhotos(taskIds, groupKey) {
      const group = groupedStopsCache.find(x => x.key === groupKey) || {};
      const existingPhotos = Array.isArray(group.draftPhotos) ? group.draftPhotos : [];
      if (existingPhotos.length >= 2) {
        alert('最多只能上傳 2 張照片');
        return null;
      }
      const remainCount = Math.max(0, 2 - existingPhotos.length);
      const files = await chooseImageFiles_(remainCount);
      if (!files.length) return null;
      const picked = files.slice(0, remainCount);
      if (!picked.length) {
        alert('最多只能上傳 2 張照片');
        return null;
      }
      const previewUrls = picked.map(file => URL.createObjectURL(file));
      showOverlay('已選取照片，正在準備上傳...', previewUrls);
      suppressAutoReloadUntil = Date.now() + 5000;
      try {
        const photos = [];
        for (let i = 0; i < picked.length; i++) {
          showOverlay(`正在壓縮照片 ${i + 1}/${picked.length}...`);
          photos.push(await compressImageFile_(picked[i]));
        }
        showOverlay('正在上傳照片，請稍候...');
        const resp = await fetch(GAS_WEBAPP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'upload_driver_photos', taskIds, driverName: currentDriverName, photos })
        });
        const text = await resp.text();
        let json = {};
        try { json = JSON.parse(text); } catch (e) { throw new Error(text || '照片上傳失敗'); }
        if (!json.ok) throw new Error(json.message || json.error || '照片上傳失敗');
        showOverlay('照片已上傳，正在更新畫面...');
        syncPhotoStateToGroup_(groupKey, Number(json.totalCount || (existingPhotos.length + photos.length)), Array.isArray(json.photos) ? json.photos : []);
        renderTasks(currentTasks);
        return json;
      } finally {
        hideOverlay();
      }
    }

    async function chooseAndUploadPhotos(taskIdsJson, groupKey) {
      let taskIds = [];
      try { taskIds = JSON.parse(taskIdsJson); } catch (e) { alert('任務資料格式錯誤'); return; }
      try {
        await uploadGroupPhotos(taskIds, groupKey);
      } catch (err) {
        alert('照片上傳失敗：' + (err.message || err));
      }
    }
    async function deleteUploadedPhoto(taskIdsJson, groupKey, photoIndex, fileId = '') {
      let taskIds = [];
      try { taskIds = JSON.parse(taskIdsJson); } catch (e) { alert('任務資料格式錯誤'); return; }
      if (photoIndex < 0) return;
      showOverlay('刪除照片中...');
      suppressAutoReloadUntil = Date.now() + 5000;
      try {
        const resp = await fetch(GAS_WEBAPP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'delete_driver_photo', taskIds, driverName: currentDriverName, photoIndex, fileId })
        });
        const text = await resp.text();
        let json = {};
        try { json = JSON.parse(text); } catch (e) { throw new Error(text || '照片刪除失敗'); }
        if (!json.ok) throw new Error(json.message || json.error || '照片刪除失敗');
        syncPhotoStateToGroup_(groupKey, Number(json.totalCount || 0), Array.isArray(json.photos) ? json.photos : []);
        renderTasks(currentTasks);
      } catch (err) {
        alert('照片刪除失敗：' + (err.message || err));
      } finally {
        hideOverlay();
      }
    }

    function syncPhotoStateToGroup_(groupKey, count, photos) {
      groupedStopsCache = groupedStopsCache.map(item => item.key === groupKey ? { ...item, photoCount: count, draftPhotos: Array.isArray(photos) ? photos : [] } : item);
      currentTasks = currentTasks.map(task => {
        const shopName = String(task.shopName || '').trim();
        const rawAddress = String(task.address || '').trim();
        const normalizedAddress = (!rawAddress || rawAddress === '送店') ? '__STORE__' : rawAddress;
        const key = `${shopName}__${normalizedAddress}`;
        return key === groupKey ? { ...task, photoCount: count, draftPhotos: Array.isArray(photos) ? photos : [] } : task;
      });
      setPendingGroupState(groupKey, { photoCount: count, draftPhotos: Array.isArray(photos) ? photos : [] });
    }

    function getCurrentGpsText() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error('裝置不支援定位'));
          return;
        }

        navigator.geolocation.getCurrentPosition(
          pos => {
            resolve(`${pos.coords.latitude},${pos.coords.longitude}`);
          },
          err => reject(err),
          {
            enableHighAccuracy: true,
            timeout: 1200,
            maximumAge: 0
          }
        );
      });
    }

    function showPageProgress(text, percent, note) {
      const panel = document.getElementById('pageLoadingPanel');
      if (!panel) return;
      panel.classList.add('show');
      updatePageProgress(text || '正在讀取資料...', percent || 8, note || '請稍候。');
      clearPageProgressTimers();
      pageLoadingTimer10 = setTimeout(() => {
        updatePageProgress('資料較多，系統仍在整理中...', 88, '請不要關閉頁面，系統仍在讀取司機任務。');
      }, 10000);
      pageLoadingTimer30 = setTimeout(() => {
        const retry = document.getElementById('pageLoadingRetry');
        if (retry) retry.classList.add('show');
        updatePageProgress('系統仍在讀取中', 92, '若等待過久，可按「重新整理」。');
      }, 30000);
    }

    function updatePageProgress(text, percent, note) {
      const p = Math.max(0, Math.min(100, Number(percent || 0)));
      const textEl = document.getElementById('pageLoadingText');
      const percentEl = document.getElementById('pageLoadingPercent');
      const fillEl = document.getElementById('pageLoadingFill');
      const noteEl = document.getElementById('pageLoadingNote');
      const retryEl = document.getElementById('pageLoadingRetry');
      if (textEl) textEl.textContent = text || '正在讀取資料...';
      if (percentEl) percentEl.textContent = `${Math.round(p)}%`;
      if (fillEl) fillEl.style.width = `${p}%`;
      if (noteEl) noteEl.textContent = note || '';
      if (retryEl && p < 100) retryEl.classList.remove('show');
    }

    function completePageProgress(text) {
      clearPageProgressTimers();
      updatePageProgress(text || '載入完成', 100, '資料已更新。');
      setTimeout(() => {
        const panel = document.getElementById('pageLoadingPanel');
        const retry = document.getElementById('pageLoadingRetry');
        if (panel) panel.classList.remove('show');
        if (retry) retry.classList.remove('show');
      }, 450);
    }

    function clearPageProgressTimers() {
      if (pageLoadingTimer10) clearTimeout(pageLoadingTimer10);
      if (pageLoadingTimer30) clearTimeout(pageLoadingTimer30);
      pageLoadingTimer10 = null;
      pageLoadingTimer30 = null;
    }

    function showOverlay(text, previewUrls) {
      document.getElementById('overlayText').textContent = text || '處理中...';

      if (Array.isArray(previewUrls)) {
        clearOverlayPreviewUrls_();
        overlayPreviewUrls = previewUrls;
        const previewEl = document.getElementById('overlayPreview');
        if (previewEl) {
          previewEl.innerHTML = previewUrls.map(url => `<img src="${escapeHtml(url)}" alt="upload-preview">`).join('');
          previewEl.classList.toggle('show', previewUrls.length > 0);
        }
      }

      document.getElementById('loadingOverlay').classList.add('show');
    }

    function clearOverlayPreviewUrls_() {
      overlayPreviewUrls.forEach(url => {
        try { URL.revokeObjectURL(url); } catch (e) {}
      });
      overlayPreviewUrls = [];
      const previewEl = document.getElementById('overlayPreview');
      if (previewEl) {
        previewEl.innerHTML = '';
        previewEl.classList.remove('show');
      }
    }

    function hideOverlay() {
      document.getElementById('loadingOverlay').classList.remove('show');
      clearOverlayPreviewUrls_();
    }

    function getDefaultPeriod() {
      const now = new Date();
      return now.getHours() < 12 ? '上午' : '下午';
    }

    function showError(msg) {
      document.getElementById('errorBox').innerHTML = `<div class="error">${escapeHtml(msg)}</div>`;
    }

    function clearError() {
      document.getElementById('errorBox').innerHTML = '';
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) loadTasks(true);
    });

    initPage();
  </script>
</body>
</html>
