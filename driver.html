<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAESAR 司機任務</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }

    .topbar {
      background: #2c3e50;
      color: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .sub {
      font-size: 14px;
      opacity: 0.9;
      line-height: 1.6;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin: 16px 0;
    }

    .tab-btn {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #d9dde3;
      color: #333;
    }

    .tab-btn.active {
      background: #EBA13A;
      color: #fff;
    }

    .panel {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
      color: #555;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }

    .order-badge {
      background: #2c3e50;
      color: #fff;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
    }

    .route-badge {
      background: #eef1f5;
      color: #333;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      white-space: nowrap;
    }

    .display-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .meta {
      font-size: 14px;
      color: #555;
      line-height: 1.7;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .btn {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-nav {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .btn-done {
      background: #16a34a;
      color: #fff;
    }

    .btn-special {
      background: #f59e0b;
      color: #fff;
    }

    .empty {
      text-align: center;
      color: #666;
      padding: 36px 16px;
      background: #fff;
      border-radius: 12px;
    }

    .loading {
      text-align: center;
      padding: 30px 16px;
      color: #666;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 14px;
      line-height: 1.6;
    }

    .footer-note {
      margin-top: 16px;
      font-size: 12px;
      color: #777;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title">CAESAR 司機任務</div>
      <div class="sub" id="driverInfo">載入中...</div>
    </div>

    <div id="errorBox"></div>

    <div class="tabs">
      <button class="tab-btn" id="tabAM" onclick="switchPeriod('上午')">上午任務</button>
      <button class="tab-btn" id="tabPM" onclick="switchPeriod('下午')">下午任務</button>
    </div>

    <div class="panel">
      <div class="status-bar">
        <div id="summaryText">讀取中...</div>
        <button class="tab-btn" style="max-width:140px;" onclick="loadTasks()">重新整理</button>
      </div>
    </div>

    <div id="taskContainer">
      <div class="loading">任務載入中...</div>
    </div>

    <div class="footer-note">
      本頁僅提供任務查看、導航與回報功能。<br />
      實際配送明細仍以紙本單據為準。
    </div>
  </div>

  <script>
    /*************************************************
     * 你要自行修改的 2 個地方
     *************************************************/
    const LIFF_ID = '2009380550-ow9SlJK4';
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxmUEj7tu2ZbqZaIESXhu9oS73QdE8qOGRKmHONqHXf-H6pL3zdYxuSvssjOExQNJjlhA/exec';

    /*************************************************
     * 全域狀態
     *************************************************/
    let currentDriverName = '';
    let currentPeriod = getDefaultPeriod();
    let currentTasks = [];

    /*************************************************
     * 頁面初始化
     *************************************************/
    async function initPage() {
      try {
        setTabs();

        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();

        // 先用 LINE 顯示名稱當司機名稱
        // 若你之後要改成 UID -> DRIVER_DB 對應，也可以再升級
        currentDriverName = profile.displayName || '';

        document.getElementById('driverInfo').innerHTML =
          `司機：<b>${escapeHtml(currentDriverName)}</b><br>目前查看：<b>${currentPeriod}</b>`;

        await loadTasks();
      } catch (err) {
        showError('初始化失敗：' + (err.message || err));
      }
    }

    /*************************************************
     * 任務讀取
     *************************************************/
    async function loadTasks() {
      try {
        clearError();
        renderLoading();
        setTabs();

        document.getElementById('driverInfo').innerHTML =
          `司機：<b>${escapeHtml(currentDriverName || '未辨識')}</b><br>目前查看：<b>${currentPeriod}</b>`;

        const url =
          `${GAS_WEBAPP_URL}?action=get_driver_tasks` +
          `&driver=${encodeURIComponent(currentDriverName)}` +
          `&period=${encodeURIComponent(currentPeriod)}`;

        const resp = await fetch(url, { method: 'GET' });
        const json = await resp.json();

        if (!json.ok) {
          throw new Error(json.error || '讀取任務失敗');
        }

        currentTasks = (json.data && json.data.tasks) ? json.data.tasks : [];
        renderTasks(currentTasks);
      } catch (err) {
        showError('讀取任務失敗：' + (err.message || err));
        renderEmpty('目前無法讀取任務。');
      }
    }

    function switchPeriod(period) {
      currentPeriod = period;
      setTabs();
      loadTasks();
    }

    function setTabs() {
      document.getElementById('tabAM').classList.toggle('active', currentPeriod === '上午');
      document.getElementById('tabPM').classList.toggle('active', currentPeriod === '下午');
    }

    /*************************************************
     * 任務卡片渲染
     *************************************************/
    function renderLoading() {
      document.getElementById('summaryText').textContent = '載入中...';
      document.getElementById('taskContainer').innerHTML =
        '<div class="loading">任務載入中...</div>';
    }

    function renderEmpty(text) {
      document.getElementById('summaryText').textContent = '目前沒有任務';
      document.getElementById('taskContainer').innerHTML =
        `<div class="empty">${escapeHtml(text)}</div>`;
    }

    function renderTasks(tasks) {
      document.getElementById('summaryText').textContent =
        `共 ${tasks.length} 筆待配送任務`;

      if (!tasks.length) {
        renderEmpty(`目前 ${currentPeriod} 沒有待配送任務`);
        return;
      }

      const html = tasks.map(task => {
        const navButton = task.address
          ? `<button class="btn btn-nav" onclick="openMap('${escapeJs(task.address)}')">導航</button>`
          : '';

        return `
          <div class="card">
            <div class="card-top">
              <div class="order-badge">順序 ${escapeHtml(task.sortOrder || '未排')}</div>
              <div class="route-badge">${escapeHtml(task.routeGroup || '未分組')}</div>
            </div>

            <div class="display-name">${escapeHtml(task.displayName || '')}</div>

            <div class="meta">
              配送時段：${escapeHtml(task.deliveryPeriod || '')}<br>
              單號：${escapeHtml(task.orderNo || '')}<br>
              店名：${escapeHtml(task.shopName || '')}
            </div>

            <div class="btn-row">
              ${navButton}
              <button class="btn btn-done" onclick="submitStatus('${escapeJs(task.taskId)}','DONE')">完成配送</button>
              <button class="btn btn-special" onclick="submitSpecial('${escapeJs(task.taskId)}')">特殊回報</button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('taskContainer').innerHTML = html;
    }

    /*************************************************
     * 導航
     *************************************************/
    function openMap(address) {
      if (!address) return;
      const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`;
      window.open(url, '_blank');
    }

    /*************************************************
     * 狀態回報
     *************************************************/
    async function submitStatus(taskId, actionType, note = '') {
      try {
        let gpsInfo = '';
        try {
          gpsInfo = await getCurrentGpsText();
        } catch (gpsErr) {
          // 不阻斷回報流程
          gpsInfo = '';
        }

        const payload = {
          action: 'update_driver_status',
          taskId: taskId,
          driverName: currentDriverName,
          actionType: actionType,
          note: note,
          gpsInfo: gpsInfo
        };

        const resp = await fetch(GAS_WEBAPP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const json = await resp.json();

        if (!json.ok) {
          throw new Error(json.message || json.error || '回報失敗');
        }

        alert('回報成功');
        await loadTasks();
      } catch (err) {
        alert('回報失敗：' + (err.message || err));
      }
    }

    async function submitSpecial(taskId) {
      const choice = prompt(
        '請輸入特殊回報代碼：\n' +
        '1 = 客戶同意放門口\n' +
        '2 = 改送隔壁\n' +
        '3 = 聯繫後改期\n' +
        '4 = 其他'
      );

      if (!choice) return;

      let actionType = 'OTHER';
      let note = '';

      if (choice === '1') {
        actionType = 'DROP_OFF';
        note = '客戶同意放門口';
      } else if (choice === '2') {
        actionType = 'NEIGHBOR';
        note = '改送隔壁';
      } else if (choice === '3') {
        actionType = 'RESCHEDULED';
        note = '聯繫後改期';
      } else if (choice === '4') {
        actionType = 'OTHER';
        note = prompt('請輸入補充說明') || '';
      } else {
        alert('無效選項');
        return;
      }

      await submitStatus(taskId, actionType, note);
    }

    /*************************************************
     * GPS
     *************************************************/
    function getCurrentGpsText() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error('裝置不支援定位'));
          return;
        }

        navigator.geolocation.getCurrentPosition(
          pos => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            resolve(`${lat},${lng}`);
          },
          err => {
            reject(err);
          },
          {
            enableHighAccuracy: true,
            timeout: 5000,
            maximumAge: 0
          }
        );
      });
    }

    /*************************************************
     * 小工具
     *************************************************/
    function getDefaultPeriod() {
      const now = new Date();
      return now.getHours() < 12 ? '上午' : '下午';
    }

    function showError(msg) {
      document.getElementById('errorBox').innerHTML =
        `<div class="error">${escapeHtml(msg)}</div>`;
    }

    function clearError() {
      document.getElementById('errorBox').innerHTML = '';
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeJs(str) {
      return String(str || '')
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"')
        .replace(/\n/g, '\\n')
        .replace(/\r/g, '');
    }

    initPage();
  </script>
</body>
</html>
