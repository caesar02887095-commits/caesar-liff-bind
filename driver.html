<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAESAR 司機任務</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 10px;
    }

    .topbar {
      background: #2c3e50;
      color: #fff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .sub {
      font-size: 14px;
      line-height: 1.55;
      opacity: 0.95;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin: 12px 0;
    }

    .tab-btn {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 11px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #d9dde3;
      color: #333;
    }

    .tab-btn.active {
      background: #EBA13A;
      color: #fff;
    }

    .panel {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #555;
    }

    .panel-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .refresh-btn, .sort-mode-btn, .save-sort-btn, .cancel-sort-btn {
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    .refresh-btn {
      background: #d9dde3;
      color: #333;
    }

    .sort-mode-btn {
      background: #c7d2fe;
      color: #3730a3;
    }

    .save-sort-btn {
      background: #16a34a;
      color: #fff;
    }

    .cancel-sort-btn {
      background: #e5e7eb;
      color: #374151;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: all 0.2s ease;
    }

    .card.done {
      background: #e5e7eb;
      opacity: 0.68;
      margin-left: 12px;
      padding: 8px 12px;
    }

    .card.done .card-top,
    .card.done .address-box,
    .card.done .btn-row,
    .card.done .sort-row {
      display: none;
    }

    .card.done .display-name {
      font-size: 15px;
      margin-bottom: 0;
      color: #4b5563;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }

    .left-badges {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge-sort {
      background: #0f172a;
      color: #fff;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: bold;
      min-width: 20px;
      text-align: center;
    }

    .badge-route {
      background: #eef1f5;
      color: #333;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
    }

    .badge-right {
      background: #e5e7eb;
      color: #374151;
      border-radius: 10px;
      padding: 6px 9px;
      font-size: 11px;
      font-weight: bold;
      line-height: 1.45;
      text-align: right;
      max-width: 165px;
      word-break: break-word;
    }

    .display-name {
      font-size: 19px;
      font-weight: bold;
      line-height: 1.35;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .address-box {
      margin-top: 8px;
      background: #fff7ed;
      border: 1px solid #fdba74;
      color: #9a3412;
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 13px;
      line-height: 1.55;
    }

    .depart-box {
      margin-top: 8px;
      background: #ecfeff;
      border: 1px solid #67e8f9;
      color: #0f766e;
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 13px;
      line-height: 1.55;
    }

    .travel-connector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #64748b;
      font-size: 13px;
      margin: 2px 0 10px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .sort-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .btn {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 11px 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-nav {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .btn-done {
      background: #16a34a;
      color: #fff;
    }

    .btn-special {
      background: #d97706;
      color: #fff;
    }

    .btn-start {
      background: #0891b2;
      color: #fff;
    }

    .btn-move {
      background: #ede9fe;
      color: #5b21b6;
    }

    .empty {
      text-align: center;
      color: #666;
      padding: 28px 14px;
      background: #fff;
      border-radius: 12px;
      font-size: 15px;
    }

    .loading {
      text-align: center;
      padding: 24px 14px;
      color: #666;
      font-size: 15px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 11px;
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 14px;
      line-height: 1.55;
    }

    .footer-note {
      margin-top: 12px;
      font-size: 12px;
      color: #777;
      text-align: center;
      line-height: 1.6;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .overlay.show {
      display: flex;
    }

    .overlay-box {
      background: #fff;
      border-radius: 14px;
      padding: 20px 24px;
      min-width: 180px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.18);
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 4px solid #e5e7eb;
      border-top: 4px solid #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    .overlay-text {
      font-size: 14px;
      color: #374151;
      font-weight: bold;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title">CAESAR 司機任務</div>
      <div class="sub" id="driverInfo">載入中...</div>
    </div>

    <div id="errorBox"></div>

    <div class="tabs">
      <button class="tab-btn" id="tabAM" onclick="switchPeriod('上午')">上午任務</button>
      <button class="tab-btn" id="tabPM" onclick="switchPeriod('下午')">下午任務</button>
    </div>

    <div class="panel">
      <div class="status-bar">
        <div id="summaryText">讀取中...</div>
        <div class="panel-actions">
          <button class="sort-mode-btn" id="sortModeBtn" onclick="toggleSortMode()">調整排序</button>
          <button class="refresh-btn" onclick="loadTasks()">重新整理</button>
        </div>
      </div>
      <div class="status-bar" id="sortActions" style="display:none; margin-top:10px;">
        <div>用上移 / 下移調整後按儲存</div>
        <div class="panel-actions">
          <button class="save-sort-btn" onclick="saveCurrentOrder()">儲存排序</button>
          <button class="cancel-sort-btn" onclick="cancelSortMode()">取消</button>
        </div>
      </div>
    </div>

    <div id="taskContainer">
      <div class="loading">任務載入中...</div>
    </div>

    <div class="footer-note">
      本頁僅提供任務查看、導航與回報功能。<br />
      實際配送明細仍以紙本單據為準。
    </div>
  </div>

  <div class="overlay" id="loadingOverlay">
    <div class="overlay-box">
      <div class="spinner"></div>
      <div class="overlay-text" id="overlayText">處理中...</div>
    </div>
  </div>

  <script>
    const LIFF_ID = '2009380550-ow9SlJK4';
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxmUEj7tu2ZbqZaIESXhu9oS73QdE8qOGRKmHONqHXf-H6pL3zdYxuSvssjOExQNJjlhA/exec';

    let currentDriverName = '';
    let currentPeriod = getDefaultPeriod();
    let currentTasks = [];
    let departureStarted = false;
    let groupedStopsCache = [];
    let sortMode = false;

    async function initPage() {
      try {
        setTabs();

        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        currentDriverName = profile.displayName || '';

        document.getElementById('driverInfo').innerHTML =
          `司機：<b>${escapeHtml(currentDriverName)}</b><br>目前查看：<b>${currentPeriod}</b>`;

        await loadTasks();
      } catch (err) {
        showError('初始化失敗：' + (err.message || err));
      }
    }

    async function loadTasks() {
      try {
        clearError();
        renderLoading();
        setTabs();

        document.getElementById('driverInfo').innerHTML =
          `司機：<b>${escapeHtml(currentDriverName || '未辨識')}</b><br>目前查看：<b>${currentPeriod}</b>`;

        const url =
          `${GAS_WEBAPP_URL}?action=get_driver_tasks` +
          `&driver=${encodeURIComponent(currentDriverName)}` +
          `&period=${encodeURIComponent(currentPeriod)}`;

        const resp = await fetch(url, { method: 'GET' });
        const json = await resp.json();

        if (!json.ok) {
          throw new Error(json.error || '讀取任務失敗');
        }

        currentTasks = (json.data && json.data.tasks) ? json.data.tasks : [];
        renderTasks(currentTasks);
      } catch (err) {
        showError('讀取任務失敗：' + (err.message || err));
        renderEmpty('目前無法讀取任務。');
      }
    }

    function switchPeriod(period) {
      currentPeriod = period;
      setTabs();
      loadTasks();
    }

    function setTabs() {
      document.getElementById('tabAM').classList.toggle('active', currentPeriod === '上午');
      document.getElementById('tabPM').classList.toggle('active', currentPeriod === '下午');
    }

    function renderLoading() {
      document.getElementById('summaryText').textContent = '載入中...';
      document.getElementById('taskContainer').innerHTML =
        '<div class="loading">任務載入中...</div>';
    }

    function renderEmpty(text) {
      document.getElementById('summaryText').textContent = '目前沒有任務';
      document.getElementById('taskContainer').innerHTML =
        `<div class="empty">${escapeHtml(text)}</div>`;
    }

    function getStorageKey() {
      const dateKey = new Date().toISOString().slice(0, 10);
      return `caesar_driver_state__${currentDriverName}__${currentPeriod}__${dateKey}`;
    }

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(getStorageKey());
        if (!raw) return { completed: {}, lastCompletedKey: '' };
        const parsed = JSON.parse(raw);
        return {
          completed: parsed.completed || {},
          lastCompletedKey: parsed.lastCompletedKey || ''
        };
      } catch (e) {
        return { completed: {}, lastCompletedKey: '' };
      }
    }

    function saveLocalState(state) {
      localStorage.setItem(getStorageKey(), JSON.stringify(state));
    }

    function groupTasksByStop(tasks) {
      const map = {};

      tasks.forEach(task => {
        const shopName = String(task.shopName || '').trim();
        const rawAddress = String(task.address || '').trim();
        const normalizedAddress = (!rawAddress || rawAddress === '送店') ? '__STORE__' : rawAddress;
        const key = `${shopName}__${normalizedAddress}`;

        if (!map[key]) {
          map[key] = {
            key,
            shopName: shopName,
            address: rawAddress,
            phone: String(task.phone || '').trim(),
            routeGroup: task.routeGroup || '',
            sortOrder: task.sortOrder || '',
            taskIds: [],
            orderNos: [],
            tasks: [],
            isStore: (!rawAddress || rawAddress === '送店')
          };
        }

        map[key].taskIds.push(task.taskId || '');
        map[key].orderNos.push(task.orderNo || '');
        map[key].tasks.push(task);

        const currentSort = Number(map[key].sortOrder || 999999);
        const nextSort = Number(task.sortOrder || 999999);
        if (nextSort < currentSort) {
          map[key].sortOrder = task.sortOrder || '';
        }
      });

      return Object.values(map).sort((a, b) => {
        const sortA = Number(a.sortOrder || 999999);
        const sortB = Number(b.sortOrder || 999999);
        if (sortA !== sortB) return sortA - sortB;
        return String(a.shopName || '').localeCompare(String(b.shopName || ''), 'zh-Hant');
      });
    }

    function renderTasks(tasks) {
      let grouped = groupTasksByStop(tasks);
      const localState = loadLocalState();

      grouped.forEach(group => {
        if (localState.completed[group.key]) {
          group._done = true;
        }
      });

      const completedGroups = grouped.filter(g => g._done);
      const pendingGroups = grouped.filter(g => !g._done);

      groupedStopsCache = pendingGroups.slice();

      document.getElementById('summaryText').textContent =
        `剩 ${pendingGroups.length} 站 / ${pendingGroups.reduce((sum, g) => sum + g.taskIds.length, 0)} 張待配送單`;

      const htmlParts = [];

      htmlParts.push(`
        <div class="card ${departureStarted ? 'done' : ''}" id="departure-card">
          <div class="card-top">
            <div class="left-badges">
              <div class="badge-sort">起點</div>
              <div class="badge-route">公司</div>
            </div>
            <div class="badge-right">出發</div>
          </div>

          <div class="display-name">公司出發</div>

          <div class="depart-box">
            出發前請確認：<br>
            1. 紙本單據齊全<br>
            2. 路線已確認<br>
            3. 手機 / 導航 / 聯絡正常
          </div>

          <div class="btn-row">
            <button class="btn btn-start" id="btn-start-departure">出發</button>
          </div>
        </div>
      `);

      completedGroups.forEach(group => {
        htmlParts.push(renderDoneCard(group));
      });

      if (localState.lastCompletedKey && pendingGroups.length > 0) {
        htmlParts.push(`
          <div class="travel-connector">
            <span>🚚 司機配送中</span>
          </div>
        `);
      }

      if (!pendingGroups.length && !completedGroups.length) {
        htmlParts.push(`<div class="empty">目前 ${escapeHtml(currentPeriod)} 沒有待配送任務</div>`);
      } else {
        pendingGroups.forEach((group, index) => {
          htmlParts.push(renderPendingCard(group, index + 1));
        });
      }

      document.getElementById('taskContainer').innerHTML = htmlParts.join('');
      bindActionButtons();
    }

    function renderDoneCard(group) {
      return `
        <div class="card done" id="card-${escapeHtml(group.key)}">
          <div class="display-name">${escapeHtml(group.shopName || '')}</div>
        </div>
      `;
    }

    function renderPendingCard(group, stepNo) {
      const firstTask = group.tasks[0];
      const navTarget = getNavigationTarget(firstTask);
      const isStore = group.isStore;
      const rightBadgeText = group.orderNos.join('<br>');

      const addressBlock = !isStore
        ? `
          <div class="address-box">
            <b>非送店 / 工地配送</b><br>
            地址：${escapeHtml(firstTask.address || '未填')}
            ${group.phone ? `<br>電話：${escapeHtml(group.phone)}` : ''}
          </div>
        `
        : '';

      const sortRow = sortMode ? `
        <div class="sort-row">
          <button class="btn btn-move" data-move="up" data-group-key="${escapeHtml(group.key)}">上移</button>
          <button class="btn btn-move" data-move="down" data-group-key="${escapeHtml(group.key)}">下移</button>
        </div>
      ` : '';

      return `
        <div class="card" id="card-${escapeHtml(group.key)}" data-group-key="${escapeHtml(group.key)}">
          <div class="card-top">
            <div class="left-badges">
              <div class="badge-sort">${escapeHtml(String(stepNo))}</div>
              <div class="badge-route">${escapeHtml(group.routeGroup || '未分組')}</div>
            </div>
            <div class="badge-right">${rightBadgeText}</div>
          </div>

          <div class="display-name">${escapeHtml(group.shopName || '')}</div>

          ${addressBlock}

          ${sortRow}

          <div class="btn-row">
            <button class="btn btn-nav" data-nav="${escapeHtml(navTarget)}">導航</button>
            <button class="btn btn-done"
              data-group-key="${escapeHtml(group.key)}"
              data-taskids="${escapeHtml(encodeURIComponent(JSON.stringify(group.taskIds)))}">完成配送</button>
            <button class="btn btn-special"
              data-group-key="${escapeHtml(group.key)}"
              data-taskids="${escapeHtml(encodeURIComponent(JSON.stringify(group.taskIds)))}">特殊回報</button>
          </div>
        </div>
      `;
    }

    function bindActionButtons() {
      const startBtn = document.getElementById('btn-start-departure');
      if (startBtn) {
        startBtn.addEventListener('click', startDeparture);
      }

      document.querySelectorAll('.btn-nav').forEach(btn => {
        btn.addEventListener('click', () => {
          const navTarget = btn.getAttribute('data-nav') || '';
          openMap(navTarget);
        });
      });

      document.querySelectorAll('.btn-done').forEach(btn => {
        btn.addEventListener('click', async () => {
          const taskIdsJson = decodeURIComponent(btn.getAttribute('data-taskids') || '');
          const groupKey = btn.getAttribute('data-group-key') || '';
          await submitGroupedStatus(taskIdsJson, 'DONE', groupKey);
        });
      });

      document.querySelectorAll('.btn-special').forEach(btn => {
        btn.addEventListener('click', async () => {
          const taskIdsJson = decodeURIComponent(btn.getAttribute('data-taskids') || '');
          const groupKey = btn.getAttribute('data-group-key') || '';
          await submitGroupedSpecial(taskIdsJson, groupKey);
        });
      });

      document.querySelectorAll('.btn-move').forEach(btn => {
        btn.addEventListener('click', () => {
          const direction = btn.getAttribute('data-move');
          const groupKey = btn.getAttribute('data-group-key');
          moveGroup(groupKey, direction);
        });
      });
    }

    function moveGroup(groupKey, direction) {
      const index = groupedStopsCache.findIndex(x => x.key === groupKey);
      if (index < 0) return;

      if (direction === 'up' && index > 0) {
        const temp = groupedStopsCache[index - 1];
        groupedStopsCache[index - 1] = groupedStopsCache[index];
        groupedStopsCache[index] = temp;
      }

      if (direction === 'down' && index < groupedStopsCache.length - 1) {
        const temp = groupedStopsCache[index + 1];
        groupedStopsCache[index + 1] = groupedStopsCache[index];
        groupedStopsCache[index] = temp;
      }

      renderTasksFromCache();
    }

    function renderTasksFromCache() {
      const localState = loadLocalState();
      const completedGroups = [];

      Object.keys(localState.completed || {}).forEach(key => {
        const saved = localState.completed[key];
        completedGroups.push(saved);
      });

      const htmlParts = [];

      htmlParts.push(`
        <div class="card ${departureStarted ? 'done' : ''}" id="departure-card">
          <div class="card-top">
            <div class="left-badges">
              <div class="badge-sort">起點</div>
              <div class="badge-route">公司</div>
            </div>
            <div class="badge-right">出發</div>
          </div>
          <div class="display-name">公司出發</div>
          <div class="depart-box">
            出發前請確認：<br>
            1. 紙本單據齊全<br>
            2. 路線已確認<br>
            3. 手機 / 導航 / 聯絡正常
          </div>
          <div class="btn-row">
            <button class="btn btn-start" id="btn-start-departure">出發</button>
          </div>
        </div>
      `);

      completedGroups.forEach(group => {
        htmlParts.push(renderDoneCard(group));
      });

      if (localState.lastCompletedKey && groupedStopsCache.length > 0) {
        htmlParts.push(`
          <div class="travel-connector">
            <span>🚚 司機配送中</span>
          </div>
        `);
      }

      groupedStopsCache.forEach((group, index) => {
        htmlParts.push(renderPendingCard(group, index + 1));
      });

      document.getElementById('taskContainer').innerHTML = htmlParts.join('');
      document.getElementById('summaryText').textContent =
        `剩 ${groupedStopsCache.length} 站 / ${groupedStopsCache.reduce((sum, g) => sum + g.taskIds.length, 0)} 張待配送單`;
      bindActionButtons();
    }

    function toggleSortMode() {
      sortMode = !sortMode;
      document.getElementById('sortActions').style.display = sortMode ? 'flex' : 'none';
      renderTasksFromCacheOrFresh();
    }

    function cancelSortMode() {
      sortMode = false;
      document.getElementById('sortActions').style.display = 'none';
      loadTasks();
    }

    function renderTasksFromCacheOrFresh() {
      if (groupedStopsCache.length > 0) {
        renderTasksFromCache();
      } else {
        renderTasks(currentTasks);
      }
    }

    async function saveCurrentOrder() {
      try {
        showOverlay('儲存排序中...');

        const orderedTaskIds = [];
        groupedStopsCache.forEach(group => {
          group.taskIds.forEach(taskId => orderedTaskIds.push(taskId));
        });

        const payload = {
          action: 'save_driver_order',
          driverName: currentDriverName,
          period: currentPeriod,
          orderedTaskIds: orderedTaskIds
        };

        const resp = await fetch(GAS_WEBAPP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const text = await resp.text();
        let json = {};
        try {
          json = JSON.parse(text);
        } catch (e) {
          throw new Error(text || '儲存排序失敗');
        }

        if (!json.ok) {
          throw new Error(json.message || json.error || '儲存排序失敗');
        }

        alert('排序已儲存');
        sortMode = false;
        document.getElementById('sortActions').style.display = 'none';
        await loadTasks();
      } catch (err) {
        alert('儲存排序失敗：' + (err.message || err));
      } finally {
        hideOverlay();
      }
    }

    function startDeparture() {
      departureStarted = true;
      const card = document.getElementById('departure-card');
      if (card) card.classList.add('done');
      alert('已標記出發');
    }

    function isStoreTask(task) {
      const addr = String(task.address || '').trim();
      return !addr || addr === '送店';
    }

    function getNavigationTarget(task) {
      if (isStoreTask(task)) {
        return task.shopName || task.displayName || '';
      }
      return task.address || task.shopName || '';
    }

    function openMap(target) {
      if (!target) return;
      const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(target)}`;
      window.open(url, '_blank');
    }

    async function submitStatus(taskId, actionType, note = '') {
      let gpsInfo = '';
      try {
        gpsInfo = await getCurrentGpsText();
      } catch (gpsErr) {
        gpsInfo = '';
      }

      const payload = {
        action: 'update_driver_status',
        taskId: taskId,
        driverName: currentDriverName,
        actionType: actionType,
        note: note,
        gpsInfo: gpsInfo
      };

      const resp = await fetch(GAS_WEBAPP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });

      const text = await resp.text();

      let json = {};
      try {
        json = JSON.parse(text);
      } catch (e) {
        throw new Error(text || '回報失敗');
      }

      if (!json.ok) {
        throw new Error(json.message || json.error || '回報失敗');
      }

      return json;
    }

    async function submitGroupedStatus(taskIdsJson, actionType, groupKey, note = '') {
      let taskIds = [];
      try {
        taskIds = JSON.parse(taskIdsJson);
      } catch (e) {
        alert('任務資料格式錯誤');
        return;
      }

      try {
        showOverlay(actionType === 'DONE' ? '回報配送完成中...' : '送出特殊回報中...');

        for (const taskId of taskIds) {
          await submitStatus(taskId, actionType, note);
        }

        markGroupDone(groupKey);
        updateSummaryAfterDone(taskIds.length);
        alert('整站回報成功');
      } catch (err) {
        alert('整站回報失敗：' + (err.message || err));
      } finally {
        hideOverlay();
      }
    }

    async function submitGroupedSpecial(taskIdsJson, groupKey) {
      let taskIds = [];
      try {
        taskIds = JSON.parse(taskIdsJson);
      } catch (e) {
        alert('任務資料格式錯誤');
        return;
      }

      const choice = prompt(
        '請輸入特殊回報代碼：\n' +
        '1 = 客戶同意放門口\n' +
        '2 = 改送隔壁\n' +
        '3 = 聯繫後改期\n' +
        '4 = 客戶取消\n' +
        '5 = 其他'
      );

      if (!choice) return;

      let actionType = 'OTHER';
      let note = '';

      if (choice === '1') {
        actionType = 'DROP_OFF';
        note = '客戶同意放門口';
      } else if (choice === '2') {
        actionType = 'NEIGHBOR';
        note = '改送隔壁';
      } else if (choice === '3') {
        actionType = 'RESCHEDULED';
        note = '聯繫後改期';
      } else if (choice === '4') {
        actionType = 'CANCELLED';
        note = '客戶取消';
      } else if (choice === '5') {
        actionType = 'OTHER';
        note = prompt('請輸入補充說明') || '';
      } else {
        alert('無效選項');
        return;
      }

      await submitGroupedStatus(taskIdsJson, actionType, groupKey, note);
    }

    function markGroupDone(groupKey) {
      const group = groupedStopsCache.find(x => x.key === groupKey);
      if (!group) return;

      const localState = loadLocalState();
      localState.completed[groupKey] = {
        key: group.key,
        shopName: group.shopName
      };
      localState.lastCompletedKey = groupKey;
      saveLocalState(localState);

      groupedStopsCache = groupedStopsCache.filter(x => x.key !== groupKey);
      renderTasksFromCache();
    }

    function updateSummaryAfterDone(doneOrderCount) {
      const localState = loadLocalState();
      const remainingTasks = groupedStopsCache.reduce((sum, g) => sum + g.taskIds.length, 0);
      document.getElementById('summaryText').textContent =
        `剩 ${groupedStopsCache.length} 站 / ${remainingTasks} 張待配送單`;
    }

    function getCurrentGpsText() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error('裝置不支援定位'));
          return;
        }

        navigator.geolocation.getCurrentPosition(
          pos => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            resolve(`${lat},${lng}`);
          },
          err => reject(err),
          {
            enableHighAccuracy: true,
            timeout: 2500,
            maximumAge: 0
          }
        );
      });
    }

    function showOverlay(text) {
      document.getElementById('overlayText').textContent = text || '處理中...';
      document.getElementById('loadingOverlay').classList.add('show');
    }

    function hideOverlay() {
      document.getElementById('loadingOverlay').classList.remove('show');
    }

    function getDefaultPeriod() {
      const now = new Date();
      return now.getHours() < 12 ? '上午' : '下午';
    }

    function showError(msg) {
      document.getElementById('errorBox').innerHTML =
        `<div class="error">${escapeHtml(msg)}</div>`;
    }

    function clearError() {
      document.getElementById('errorBox').innerHTML = '';
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    initPage();
  </script>
</body>
</html>
