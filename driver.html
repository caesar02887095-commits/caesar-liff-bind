<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAESAR 司機任務</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 10px;
    }

    .topbar {
      background: #2c3e50;
      color: #fff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .sub {
      font-size: 14px;
      line-height: 1.55;
      opacity: 0.95;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin: 12px 0;
    }

    .tab-btn {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 11px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #d9dde3;
      color: #333;
    }

    .tab-btn.active {
      background: #EBA13A;
      color: #fff;
    }

    .panel {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #555;
    }

    .refresh-btn {
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 14px;
      font-weight: bold;
      background: #d9dde3;
      color: #333;
      cursor: pointer;
      white-space: nowrap;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: all 0.2s ease;
      border-left: 4px solid #cbd5e1;
    }

    .card.store {
      border-left-color: #60a5fa;
    }

    .card.direct {
      border-left-color: #f59e0b;
    }

    .card.done {
      background: #e5e7eb;
      opacity: 0.72;
      margin-left: 12px;
      padding: 8px 12px;
      border-left-color: #9ca3af;
    }

    .card.done .card-top,
    .card.done .address-box,
    .card.done .btn-row,
    .card.done .order-box {
      display: none;
    }

    .card.done .display-name {
      font-size: 15px;
      margin-bottom: 0;
      color: #4b5563;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }

    .left-badges {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge-sort {
      background: #0f172a;
      color: #fff;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: bold;
      min-width: 20px;
      text-align: center;
    }

    .badge-route {
      background: #eef1f5;
      color: #333;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
    }

    .badge-type {
      background: #eef2ff;
      color: #4338ca;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: bold;
    }

    .badge-right {
      background: #e5e7eb;
      color: #374151;
      border-radius: 10px;
      padding: 6px 9px;
      font-size: 11px;
      font-weight: bold;
      line-height: 1.45;
      text-align: right;
      max-width: 175px;
      word-break: break-word;
    }

    .display-name {
      font-size: 19px;
      font-weight: bold;
      line-height: 1.35;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .order-box {
      margin-top: 8px;
      background: #f8fafc;
      border: 1px solid #dbe4ef;
      color: #334155;
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 13px;
      line-height: 1.6;
    }

    .address-box {
      margin-top: 8px;
      background: #fff7ed;
      border: 1px solid #fdba74;
      color: #9a3412;
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 13px;
      line-height: 1.55;
    }

    .depart-box {
      margin-top: 8px;
      background: #ecfeff;
      border: 1px solid #67e8f9;
      color: #0f766e;
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 13px;
      line-height: 1.55;
    }

    .travel-connector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #64748b;
      font-size: 13px;
      margin: 2px 0 10px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .btn {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 11px 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-nav {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .btn-done {
      background: #16a34a;
      color: #fff;
    }

    .btn-special {
      background: #d97706;
      color: #fff;
    }

    .btn-start {
      background: #0891b2;
      color: #fff;
    }

    .empty {
      text-align: center;
      color: #666;
      padding: 28px 14px;
      background: #fff;
      border-radius: 12px;
      font-size: 15px;
    }

    .loading {
      text-align: center;
      padding: 24px 14px;
      color: #666;
      font-size: 15px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 11px;
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 14px;
      line-height: 1.55;
    }

    .footer-note {
      margin-top: 12px;
      font-size: 12px;
      color: #777;
      text-align: center;
      line-height: 1.6;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .overlay.show {
      display: flex;
    }

    .overlay-box {
      background: #fff;
      border-radius: 14px;
      padding: 20px 24px;
      min-width: 180px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.18);
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 4px solid #e5e7eb;
      border-top: 4px solid #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    .overlay-text {
      font-size: 14px;
      color: #374151;
      font-weight: bold;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title">CAESAR 司機任務</div>
      <div class="sub" id="driverInfo">載入中...</div>
    </div>

    <div id="errorBox"></div>

    <div class="tabs">
      <button class="tab-btn" id="tabAM" onclick="switchPeriod('上午')">上午任務</button>
      <button class="tab-btn" id="tabPM" onclick="switchPeriod('下午')">下午任務</button>
    </div>

    <div class="panel">
      <div class="status-bar">
        <div id="summaryText">讀取中...</div>
        <button class="refresh-btn" onclick="loadTasks()">重新整理</button>
      </div>
    </div>

    <div id="taskContainer">
      <div class="loading">任務載入中...</div>
    </div>

    <div class="footer-note">
      本頁僅提供任務查看、導航與回報功能。<br />
      實際配送明細仍以紙本單據為準。
    </div>
  </div>

  <div class="overlay" id="loadingOverlay">
    <div class="overlay-box">
      <div class="spinner"></div>
      <div class="overlay-text" id="overlayText">處理中...</div>
    </div>
  </div>

  <script>
    const LIFF_ID = '2009380550-ow9SlJK4';
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxmUEj7tu2ZbqZaIESXhu9oS73QdE8qOGRKmHONqHXf-H6pL3zdYxuSvssjOExQNJjlhA/exec';

    let currentDriverName = '';
    let currentPeriod = '上午';
    let currentTasks = [];
    let currentBatchId = '';
    let departureStarted = false;
    let groupedStopsCache = [];

    function getQueryParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name) || '';
    }

    async function initPage() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        const queryDriver = getQueryParam('driver');
        const queryPeriod = getQueryParam('period');

        currentDriverName = queryDriver || profile.displayName || '';
        currentPeriod = queryPeriod || getDefaultPeriod();

        setTabs();
        await loadTasks();
      } catch (err) {
        showError('初始化失敗：' + (err.message || err));
      }
    }

    function setTabs() {
      document.getElementById('tabAM').classList.toggle('active', currentPeriod === '上午');
      document.getElementById('tabPM').classList.toggle('active', currentPeriod === '下午');
    }

    function switchPeriod(period) {
      currentPeriod = period;
      setTabs();
      loadTasks();
    }

    async function loadTasks() {
      try {
        clearError();
        renderLoading();

        document.getElementById('driverInfo').innerHTML =
          `司機：<b>${escapeHtml(currentDriverName || '未辨識')}</b><br>目前查看：<b>${currentPeriod}</b>`;

        const url =
          `${GAS_WEBAPP_URL}?action=get_driver_tasks` +
          `&driver=${encodeURIComponent(currentDriverName)}` +
          `&period=${encodeURIComponent(currentPeriod)}`;

        const resp = await fetch(url);
        const json = await resp.json();

        if (!json.ok) {
          throw new Error(json.error || '讀取任務失敗');
        }

        currentTasks = (json.data && json.data.tasks) ? json.data.tasks : [];
        currentBatchId = (json.data && json.data.batchId) ? json.data.batchId : '';
        renderTasks(currentTasks);
      } catch (err) {
        showError('讀取任務失敗：' + (err.message || err));
        renderEmpty('目前無法讀取任務。');
      }
    }

    function renderLoading() {
      document.getElementById('summaryText').textContent = '載入中...';
      document.getElementById('taskContainer').innerHTML =
        '<div class="loading">任務載入中...</div>';
    }

    function renderEmpty(text) {
      document.getElementById('summaryText').textContent = '目前沒有任務';
      document.getElementById('taskContainer').innerHTML =
        `<div class="empty">${escapeHtml(text)}</div>`;
    }

    function getStorageKey() {
      return `caesar_driver_state__${currentDriverName}__${currentPeriod}__${currentBatchId}`;
    }

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(getStorageKey());
        if (!raw) return { completedList: [], lastCompletedKey: '', departed: false };
        const parsed = JSON.parse(raw);
        return {
          completedList: Array.isArray(parsed.completedList) ? parsed.completedList : [],
          lastCompletedKey: parsed.lastCompletedKey || '',
          departed: !!parsed.departed
        };
      } catch (e) {
        return { completedList: [], lastCompletedKey: '', departed: false };
      }
    }

    function saveLocalState(state) {
      localStorage.setItem(getStorageKey(), JSON.stringify(state));
    }

    function groupTasksByStop(tasks) {
      const map = {};

      tasks.forEach(task => {
        const shopName = String(task.shopName || '').trim();
        const rawAddress = String(task.address || '').trim();
        const normalizedAddress = (!rawAddress || rawAddress === '送店') ? '__STORE__' : rawAddress;
        const key = `${shopName}__${normalizedAddress}`;

        if (!map[key]) {
          map[key] = {
            key,
            shopName,
            address: rawAddress,
            phone: String(task.phone || '').trim(),
            routeGroup: task.routeGroup || '',
            taskIds: [],
            orderNos: [],
            tasks: [],
            isStore: (!rawAddress || rawAddress === '送店'),
            sortOrder: task.sortOrder || ''
          };
        }

        map[key].taskIds.push(task.taskId || '');
        map[key].orderNos.push(task.orderNo || '');
        map[key].tasks.push(task);
      });

      return Object.values(map).sort((a, b) => {
        const orderA = Number(a.sortOrder || 999999);
        const orderB = Number(b.sortOrder || 999999);
        if (orderA !== orderB) return orderA - orderB;
        return String(a.shopName || '').localeCompare(String(b.shopName || ''), 'zh-Hant');
      });
    }

    function renderTasks(tasks) {
      const grouped = groupTasksByStop(tasks);
      const localState = loadLocalState();
      departureStarted = !!localState.departed;

      const completedList = localState.completedList || [];
      const completedKeys = new Set(completedList.map(x => x.key));
      const pendingGroups = grouped.filter(g => !completedKeys.has(g.key));

      groupedStopsCache = pendingGroups.slice();

      document.getElementById('summaryText').textContent =
        `剩 ${pendingGroups.length} 站 / ${pendingGroups.reduce((sum, g) => sum + g.taskIds.length, 0)} 張待配送單`;

      const htmlParts = [];

      htmlParts.push(`
        <div class="card" id="departure-card">
          <div class="card-top">
            <div class="left-badges">
              <div class="badge-sort">起點</div>
              <div class="badge-route">公司</div>
            </div>
            <div class="badge-right">出發</div>
          </div>
          <div class="display-name">公司出發</div>
          <div class="depart-box">
            出發前請確認：<br>
            1. 紙本單據齊全<br>
            2. 路線已確認<br>
            3. 手機 / 導航 / 聯絡正常
          </div>
          <div class="btn-row">
            <button class="btn btn-start" id="btn-start-departure">出發</button>
          </div>
        </div>
      `);

      if (departureStarted && pendingGroups.length > 0 && completedList.length === 0) {
        htmlParts.push(`
          <div class="travel-connector">
            <span>🚚 司機配送中</span>
          </div>
        `);
      }

      completedList.forEach((item, idx) => {
        htmlParts.push(`
          <div class="card done">
            <div class="display-name">${escapeHtml(item.label || '')}</div>
          </div>
        `);

        if (idx === completedList.length - 1 && pendingGroups.length > 0) {
          htmlParts.push(`
            <div class="travel-connector">
              <span>🚚 司機配送中</span>
            </div>
          `);
        }
      });

      if (!pendingGroups.length && !completedList.length) {
        htmlParts.push(`<div class="empty">目前 ${escapeHtml(currentPeriod)} 沒有待配送任務</div>`);
      } else {
        pendingGroups.forEach((group, index) => {
          const firstTask = group.tasks[0];
          const navTarget = getNavigationTarget(firstTask);
          const mergedOrderText = group.orderNos.filter(Boolean).join(', ');
          const cardClass = group.isStore ? 'store' : 'direct';

          const addressBlock = !group.isStore
            ? `
              <div class="address-box">
                <b>指定送達</b><br>
                地址：${escapeHtml(firstTask.address || '未填')}
                ${firstTask.phone ? `<br>電話：${escapeHtml(firstTask.phone)}` : ''}
              </div>
            `
            : '';

          htmlParts.push(`
            <div class="card ${cardClass}" id="card-${escapeHtml(group.key)}">
              <div class="card-top">
                <div class="left-badges">
                  <div class="badge-sort">${escapeHtml(String(index + 1))}</div>
                  <div class="badge-route">${escapeHtml(group.routeGroup || '未分組')}</div>
                  <div class="badge-type">${group.isStore ? '送店' : '指定送達'}</div>
                </div>
                <div class="badge-right">${escapeHtml(String(group.orderNos.length))} 張單</div>
              </div>

              <div class="display-name">${escapeHtml(group.shopName || '')}</div>
              <div class="order-box">單號：${escapeHtml(mergedOrderText)}</div>
              ${addressBlock}

              <div class="btn-row">
                <button class="btn btn-nav" data-nav="${escapeHtml(navTarget)}">導航</button>
                <button class="btn btn-done" data-group-key="${escapeHtml(group.key)}" data-taskids="${escapeHtml(encodeURIComponent(JSON.stringify(group.taskIds)))}">完成配送</button>
                <button class="btn btn-special" data-group-key="${escapeHtml(group.key)}" data-taskids="${escapeHtml(encodeURIComponent(JSON.stringify(group.taskIds)))}">特殊回報</button>
              </div>
            </div>
          `);
        });
      }

      document.getElementById('taskContainer').innerHTML = htmlParts.join('');
      bindActionButtons();
    }

    function bindActionButtons() {
      const startBtn = document.getElementById('btn-start-departure');
      if (startBtn) {
        startBtn.addEventListener('click', startDeparture);
      }

      document.querySelectorAll('.btn-nav').forEach(btn => {
        btn.addEventListener('click', () => {
          openMap(btn.getAttribute('data-nav') || '');
        });
      });

      document.querySelectorAll('.btn-done').forEach(btn => {
        btn.addEventListener('click', async () => {
          const groupKey = btn.getAttribute('data-group-key') || '';
          const taskIdsJson = decodeURIComponent(btn.getAttribute('data-taskids') || '');
          await submitGroupedStatus(taskIdsJson, 'DONE', groupKey);
        });
      });

      document.querySelectorAll('.btn-special').forEach(btn => {
        btn.addEventListener('click', async () => {
          const groupKey = btn.getAttribute('data-group-key') || '';
          const taskIdsJson = decodeURIComponent(btn.getAttribute('data-taskids') || '');
          await submitGroupedSpecial(taskIdsJson, groupKey);
        });
      });
    }

    async function startDeparture() {
      try {
        showOverlay('記錄出發並刷新 ETA...');
        const payload = {
          action: 'mark_driver_departure',
          driverName: currentDriverName,
          period: currentPeriod,
          routeDate: new Date().toISOString()
        };

        const resp = await fetch(GAS_WEBAPP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const text = await resp.text();
        let json = {};
        try {
          json = JSON.parse(text);
        } catch (e) {
          throw new Error(text || '記錄出發失敗');
        }

        if (!json.ok) {
          throw new Error(json.message || json.error || '記錄出發失敗');
        }

        const localState = loadLocalState();
        localState.departed = true;
        saveLocalState(localState);
        departureStarted = true;
        renderTasks(currentTasks);
      } catch (err) {
        alert('出發處理失敗：' + (err.message || err));
      } finally {
        hideOverlay();
      }
    }

    function isStoreTask(task) {
      const addr = String(task.address || '').trim();
      return !addr || addr === '送店';
    }

    function getNavigationTarget(task) {
      if (isStoreTask(task)) return task.shopName || task.displayName || '';
      return task.address || task.shopName || '';
    }

    function openMap(target) {
      if (!target) return;
      const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(target)}`;
      window.open(url, '_blank');
    }

    async function submitGroupStatus(taskIds, actionType, note = '') {
      let gpsInfo = '';
      try {
        gpsInfo = await getCurrentGpsText();
      } catch (gpsErr) {
        gpsInfo = '';
      }

      const payload = {
        action: 'update_driver_group_status',
        taskIds,
        driverName: currentDriverName,
        actionType,
        note,
        gpsInfo
      };

      const resp = await fetch(GAS_WEBAPP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });

      const text = await resp.text();
      let json = {};
      try {
        json = JSON.parse(text);
      } catch (e) {
        throw new Error(text || '回報失敗');
      }

      if (!json.ok) {
        throw new Error(json.message || json.error || '回報失敗');
      }

      return json;
    }

    async function submitGroupedStatus(taskIdsJson, actionType, groupKey, note = '') {
      let taskIds = [];
      try {
        taskIds = JSON.parse(taskIdsJson);
      } catch (e) {
        alert('任務資料格式錯誤');
        return;
      }

      try {
        showOverlay(actionType === 'DONE' ? '回報配送完成中...' : '送出特殊回報中...');
        await submitGroupStatus(taskIds, actionType, note);
        markGroupDone(groupKey);
      } catch (err) {
        alert('整站回報失敗：' + (err.message || err));
      } finally {
        hideOverlay();
      }
    }

    async function submitGroupedSpecial(taskIdsJson, groupKey) {
      let taskIds = [];
      try {
        taskIds = JSON.parse(taskIdsJson);
      } catch (e) {
        alert('任務資料格式錯誤');
        return;
      }

      const choice = prompt(
        '請輸入特殊回報代碼：\n' +
        '1 = 客戶同意放門口\n' +
        '2 = 改送隔壁\n' +
        '3 = 聯繫後改期\n' +
        '4 = 客戶取消\n' +
        '5 = 其他'
      );
      if (!choice) return;

      let actionType = 'OTHER';
      let note = '';

      if (choice === '1') {
        actionType = 'DROP_OFF';
        note = '客戶同意放門口';
      } else if (choice === '2') {
        actionType = 'NEIGHBOR';
        note = '改送隔壁';
      } else if (choice === '3') {
        actionType = 'RESCHEDULED';
        note = '聯繫後改期';
      } else if (choice === '4') {
        actionType = 'CANCELLED';
        note = '客戶取消';
      } else if (choice === '5') {
        actionType = 'OTHER';
        note = prompt('請輸入其他回報內容：') || '其他';
      } else {
        alert('代碼不正確');
        return;
      }

      await submitGroupedStatus(JSON.stringify(taskIds), actionType, groupKey, note);
    }

    function markGroupDone(groupKey) {
      const group = groupedStopsCache.find(x => x.key === groupKey);
      if (!group) {
        loadTasks();
        return;
      }

      const localState = loadLocalState();
      const completedList = Array.isArray(localState.completedList) ? localState.completedList : [];

      if (!completedList.some(x => x.key === groupKey)) {
        completedList.push({
          key: groupKey,
          label: `${group.shopName || ''}（${group.orderNos.join(', ')}）`
        });
      }

      localState.completedList = completedList;
      localState.lastCompletedKey = groupKey;
      saveLocalState(localState);
      renderTasks(currentTasks);
    }

    function getCurrentGpsText() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error('瀏覽器不支援定位'));
          return;
        }

        navigator.geolocation.getCurrentPosition(
          pos => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            resolve(`${lat},${lng}`);
          },
          err => {
            reject(err);
          },
          {
            enableHighAccuracy: true,
            timeout: 8000,
            maximumAge: 0
          }
        );
      });
    }

    function getDefaultPeriod() {
      const now = new Date();
      const hour = now.getHours();
      return hour < 12 ? '上午' : '下午';
    }

    function showOverlay(text) {
      const overlay = document.getElementById('loadingOverlay');
      const label = document.getElementById('overlayText');
      if (label) label.textContent = text || '處理中...';
      if (overlay) overlay.classList.add('show');
    }

    function hideOverlay() {
      const overlay = document.getElementById('loadingOverlay');
      if (overlay) overlay.classList.remove('show');
    }

    function showError(text) {
      document.getElementById('errorBox').innerHTML = `<div class="error">${escapeHtml(text || '')}</div>`;
    }

    function clearError() {
      document.getElementById('errorBox').innerHTML = '';
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    initPage();
  </script>
</body>
</html>
