<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAESAR 司機任務</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f5f6f8;
      color: #222;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }
    .topbar {
      background: #2c3e50;
      color: #fff;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .sub {
      font-size: 15px;
      line-height: 1.7;
      opacity: 0.95;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin: 16px 0;
    }
    .tab-btn {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #d9dde3;
      color: #333;
    }
    .tab-btn.active {
      background: #EBA13A;
      color: #fff;
    }
    .panel {
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      color: #555;
    }
    .refresh-btn {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      background: #d9dde3;
      color: #333;
      cursor: pointer;
      white-space: nowrap;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .left-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .badge-sort {
      background: #0f172a;
      color: #fff;
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 13px;
      font-weight: bold;
    }
    .badge-route {
      background: #eef1f5;
      color: #333;
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 13px;
    }
    .badge-taskid {
      background: #7c3aed;
      color: #fff;
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: bold;
    }
    .display-name {
      font-size: 30px;
      font-weight: bold;
      line-height: 1.45;
      margin-bottom: 10px;
    }
    .meta {
      font-size: 17px;
      color: #444;
      line-height: 1.8;
    }
    .address-box {
      margin-top: 10px;
      background: #fff7ed;
      border: 1px solid #fdba74;
      color: #9a3412;
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      line-height: 1.7;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .btn {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 14px 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-nav {
      background: #dbeafe;
      color: #1d4ed8;
    }
    .btn-done {
      background: #16a34a;
      color: #fff;
    }
    .btn-special {
      background: #d97706;
      color: #fff;
    }
    .empty {
      text-align: center;
      color: #666;
      padding: 36px 16px;
      background: #fff;
      border-radius: 12px;
      font-size: 16px;
    }
    .loading {
      text-align: center;
      padding: 30px 16px;
      color: #666;
      font-size: 16px;
    }
    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 14px;
      line-height: 1.6;
    }
    .footer-note {
      margin-top: 16px;
      font-size: 12px;
      color: #777;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title">CAESAR 司機任務</div>
      <div class="sub" id="driverInfo">載入中...</div>
    </div>

    <div id="errorBox"></div>

    <div class="tabs">
      <button class="tab-btn" id="tabAM" onclick="switchPeriod('上午')">上午任務</button>
      <button class="tab-btn" id="tabPM" onclick="switchPeriod('下午')">下午任務</button>
    </div>

    <div class="panel">
      <div class="status-bar">
        <div id="summaryText">讀取中...</div>
        <button class="refresh-btn" onclick="loadTasks()">重新整理</button>
      </div>
    </div>

    <div id="taskContainer">
      <div class="loading">任務載入中...</div>
    </div>

    <div class="footer-note">
      本頁僅提供任務查看、導航與回報功能。<br />
      實際配送明細仍以紙本單據為準。
    </div>
  </div>

  <script>
    const LIFF_ID = '請填入你的LIFF_ID';
    const GAS_WEBAPP_URL = '請填入你的GAS部署網址';

    let currentDriverName = '';
    let currentPeriod = getDefaultPeriod();
    let currentTasks = [];

    async function initPage() {
      try {
        setTabs();

        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        currentDriverName = profile.displayName || '';

        document.getElementById('driverInfo').innerHTML =
          `司機：<b>${escapeHtml(currentDriverName)}</b><br>目前查看：<b>${currentPeriod}</b>`;

        await loadTasks();
      } catch (err) {
        showError('初始化失敗：' + (err.message || err));
      }
    }

    async function loadTasks() {
      try {
        clearError();
        renderLoading();
        setTabs();

        document.getElementById('driverInfo').innerHTML =
          `司機：<b>${escapeHtml(currentDriverName || '未辨識')}</b><br>目前查看：<b>${currentPeriod}</b>`;

        const url =
          `${GAS_WEBAPP_URL}?action=get_driver_tasks` +
          `&driver=${encodeURIComponent(currentDriverName)}` +
          `&period=${encodeURIComponent(currentPeriod)}`;

        const resp = await fetch(url, { method: 'GET' });
        const json = await resp.json();

        if (!json.ok) {
          throw new Error(json.error || '讀取任務失敗');
        }

        currentTasks = (json.data && json.data.tasks) ? json.data.tasks : [];
        renderTasks(currentTasks);
      } catch (err) {
        showError('讀取任務失敗：' + (err.message || err));
        renderEmpty('目前無法讀取任務。');
      }
    }

    function switchPeriod(period) {
      currentPeriod = period;
      setTabs();
      loadTasks();
    }

    function setTabs() {
      document.getElementById('tabAM').classList.toggle('active', currentPeriod === '上午');
      document.getElementById('tabPM').classList.toggle('active', currentPeriod === '下午');
    }

    function renderLoading() {
      document.getElementById('summaryText').textContent = '載入中...';
      document.getElementById('taskContainer').innerHTML =
        '<div class="loading">任務載入中...</div>';
    }

    function renderEmpty(text) {
      document.getElementById('summaryText').textContent = '目前沒有任務';
      document.getElementById('taskContainer').innerHTML =
        `<div class="empty">${escapeHtml(text)}</div>`;
    }

    function renderTasks(tasks) {
      document.getElementById('summaryText').textContent =
        `共 ${tasks.length} 筆待配送任務`;

      if (!tasks.length) {
        renderEmpty(`目前 ${currentPeriod} 沒有待配送任務`);
        return;
      }

      const html = tasks.map(task => {
        const navTarget = getNavigationTarget(task);
        const shortTaskId = getShortTaskId(task.taskId);
        const isStore = isStoreTask(task);

        const addressBlock = !isStore
          ? `
            <div class="address-box">
              <b>非送店 / 工地配送</b><br>
              地址：${escapeHtml(task.address || '未填')}<br>
              電話：${escapeHtml(task.phone || '未填')}
            </div>
          `
          : '';

        return `
          <div class="card">
            <div class="card-top">
              <div class="left-badges">
                <div class="badge-sort">順序 ${escapeHtml(task.sortOrder || '未排')}</div>
                <div class="badge-route">${escapeHtml(task.routeGroup || '未分組')}</div>
              </div>
              <div class="badge-taskid">${escapeHtml(shortTaskId)}</div>
            </div>

            <div class="display-name">${escapeHtml(task.displayName || '')}</div>

            ${addressBlock}

            <div class="btn-row">
              <button class="btn btn-nav" onclick="openMap('${escapeJs(navTarget)}')">導航</button>
              <button class="btn btn-done" onclick="submitStatus('${escapeJs(task.taskId)}','DONE')">完成配送</button>
              <button class="btn btn-special" onclick="submitSpecial('${escapeJs(task.taskId)}')">特殊回報</button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('taskContainer').innerHTML = html;
    }

    function isStoreTask(task) {
      const addr = String(task.address || '').trim();
      return !addr || addr === '送店';
    }

    function getNavigationTarget(task) {
      if (isStoreTask(task)) {
        return task.shopName || task.displayName || '';
      }
      return task.address || task.shopName || '';
    }

    function getShortTaskId(taskId) {
      const s = String(taskId || '').trim();
      if (!s) return '#未編號';
      const parts = s.split('_');
      const tail = parts[parts.length - 1] || s;
      return '#' + tail;
    }

    function openMap(target) {
      if (!target) return;
      const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(target)}`;
      window.open(url, '_blank');
    }

    async function submitStatus(taskId, actionType, note = '') {
      try {
        let gpsInfo = '';
        try {
          gpsInfo = await getCurrentGpsText();
        } catch (gpsErr) {
          gpsInfo = '';
        }

        const payload = {
          action: 'update_driver_status',
          taskId: taskId,
          driverName: currentDriverName,
          actionType: actionType,
          note: note,
          gpsInfo: gpsInfo
        };

        const resp = await fetch(GAS_WEBAPP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const json = await resp.json();

        if (!json.ok) {
          throw new Error(json.message || json.error || '回報失敗');
        }

        alert('回報成功');
        await loadTasks();
      } catch (err) {
        alert('回報失敗：' + (err.message || err));
      }
    }

    async function submitSpecial(taskId) {
      const choice = prompt(
        '請輸入特殊回報代碼：\n' +
        '1 = 客戶同意放門口\n' +
        '2 = 改送隔壁\n' +
        '3 = 聯繫後改期\n' +
        '4 = 其他'
      );

      if (!choice) return;

      let actionType = 'OTHER';
      let note = '';

      if (choice === '1') {
        actionType = 'DROP_OFF';
        note = '客戶同意放門口';
      } else if (choice === '2') {
        actionType = 'NEIGHBOR';
        note = '改送隔壁';
      } else if (choice === '3') {
        actionType = 'RESCHEDULED';
        note = '聯繫後改期';
      } else if (choice === '4') {
        actionType = 'OTHER';
        note = prompt('請輸入補充說明') || '';
      } else {
        alert('無效選項');
        return;
      }

      await submitStatus(taskId, actionType, note);
    }

    function getCurrentGpsText() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error('裝置不支援定位'));
          return;
        }

        navigator.geolocation.getCurrentPosition(
          pos => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            resolve(`${lat},${lng}`);
          },
          err => reject(err),
          {
            enableHighAccuracy: true,
            timeout: 5000,
            maximumAge: 0
          }
        );
      });
    }

    function getDefaultPeriod() {
      const now = new Date();
      return now.getHours() < 12 ? '上午' : '下午';
    }

    function showError(msg) {
      document.getElementById('errorBox').innerHTML =
        `<div class="error">${escapeHtml(msg)}</div>`;
    }

    function clearError() {
      document.getElementById('errorBox').innerHTML = '';
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeJs(str) {
      return String(str || '')
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"')
        .replace(/\n/g, '\\n')
        .replace(/\r/g, '');
    }

    initPage();
  </script>
</body>
</html>
