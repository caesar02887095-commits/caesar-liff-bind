<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAESAR 司機工作</title>
  <!-- v70.5：修正照片選檔後上傳期間按鈕未鎖定 -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f5f6f8;
      color: #222;
      overflow-x: hidden;
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 10px;
    }
    .topbar {
      background: #2c3e50;
      color: #fff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 15px;
      line-height: 1.55;
      opacity: 0.95;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin: 12px 0;
    }
    .tab-btn {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 11px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #d9dde3;
      color: #333;
    }
    .tab-btn.active {
      background: #EBA13A;
      color: #fff;
    }
    .panel {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #555;
    }
    .refresh-btn {
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 14px;
      font-weight: bold;
      background: #d9dde3;
      color: #333;
      cursor: pointer;
      white-space: nowrap;
    }
    .driver-toolbar-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
    }
    .driver-sort-btn {
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }
    .driver-sort-btn:disabled {
      opacity: 0.58;
      cursor: not-allowed;
    }
    .driver-sort-edit {
      background: #c7d2fe;
      color: #3730a3;
    }
    .driver-sort-save {
      background: #16a34a;
      color: #fff;
      display: none;
    }
    .driver-sort-cancel {
      background: #e5e7eb;
      color: #374151;
      display: none;
    }
    .driver-sort-mode .driver-sort-edit { display: none; }
    .driver-sort-mode .driver-sort-save,
    .driver-sort-mode .driver-sort-cancel { display: inline-flex; }
    .driver-sort-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 6px;
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      touch-action: pan-y;
    }
    .driver-sort-row {
      background: #fff;
      border: 1px solid #dbe4ef;
      border-radius: 11px;
      padding: 7px 8px;
      display: flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 2px 7px rgba(0,0,0,0.05);
      min-height: 40px;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }
    .driver-sort-row .badge-sort {
      flex-shrink: 0;
      padding: 3px 8px;
      font-size: 13px;
    }
    .driver-sort-label {
      flex: 1;
      min-width: 0;
      font-size: 16px;
      font-weight: 900;
      color: #111827;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      word-break: break-word;
      line-height: 1.35;
      max-height: 2.8em;
    }
    .driver-sort-meta {
      flex-shrink: 0;
      font-size: 12px;
      color: #475569;
      font-weight: 900;
      max-width: 52px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: #eef2f7;
      border-radius: 999px;
      padding: 3px 7px;
    }
    .driver-sort-handle {
      flex-shrink: 0;
      color: #64748b;
      font-size: 22px;
      line-height: 1;
      cursor: grab;
      padding: 6px 2px;
      touch-action: none;
      user-select: none;
    }
    .sortable-drag,
    .sortable-fallback {
      max-width: calc(100vw - 28px);
      box-sizing: border-box;
      overflow: hidden;
    }
    .driver-sort-hint {
      margin: 6px 0 10px;
      padding: 9px 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      color: #475569;
      font-size: 13px;
      line-height: 1.5;
      font-weight: 700;
    }
    .sortable-ghost { opacity: 0.35; }
    .sortable-chosen { background: #eff6ff; border-color: #93c5fd; }
    body.driver-sorting-active {
      overflow-x: hidden;
      overscroll-behavior-x: none;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: all 0.2s ease;
    }
    .card.done {
      background: #e5e7eb;
      opacity: 0.78;
      margin-left: 12px;
      padding: 10px 12px;
    }
    .card.done .card-top,
    .card.done .address-box,
    .card.done .btn-row,
    .card.done .depart-box {
      display: none;
    }
    .card.done .display-name {
      font-size: 15px;
      margin-bottom: 0;
      color: #374151;
    }
    .done-note {
      margin-top: 6px;
      font-size: 13px;
      color: #4b5563;
      line-height: 1.5;
    }
    .completed-summary-card {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      color: #475569;
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 13px;
      line-height: 1.6;
    }
    .completed-toggle-card {
      width: 100%;
      border: 1px solid #dbe4ef;
      border-radius: 14px;
      background: #f8fafc;
      color: #334155;
      padding: 11px 12px;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 900;
      line-height: 1.5;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .completed-toggle-card::after {
      content: '展開';
      flex-shrink: 0;
      border-radius: 999px;
      background: #e5e7eb;
      color: #374151;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 900;
    }
    .completed-toggle-card.open::after {
      content: '收合';
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }
    .left-badges {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .badge-sort {
      background: #0f172a;
      color: #fff;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 13px;
      font-weight: bold;
      min-width: 20px;
      text-align: center;
    }
    .badge-route {
      background: #eef1f5;
      color: #333;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 13px;
    }
    .badge-right {
      background: #e5e7eb;
      color: #374151;
      border-radius: 10px;
      padding: 6px 9px;
      font-size: 12px;
      font-weight: bold;
      line-height: 1.45;
      text-align: right;
      max-width: 165px;
      word-break: break-word;
    }
    .display-name {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.35;
      margin-bottom: 6px;
      word-break: break-word;
    }
    .address-box {
      margin-top: 8px;
      background: #fff7ed;
      border: 1px solid #fdba74;
      color: #9a3412;
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 13px;
      line-height: 1.55;
    }
    .depart-box {
      margin-top: 8px;
      background: #ecfeff;
      border: 1px solid #67e8f9;
      color: #0f766e;
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 13px;
      line-height: 1.55;
    }
    .travel-connector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #64748b;
      font-size: 13px;
      margin: 2px 0 10px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .btn {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 13px 8px;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      line-height: 1.25;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-row.driver-main-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 2fr;
      gap: 8px;
      align-items: stretch;
    }
    .btn-nav {
      background: #dbeafe;
      color: #1d4ed8;
    }
    .btn-done {
      background: #16a34a;
      color: #fff;
      font-size: 18px;
    }
    .done-confirm-panel {
      margin-top: 10px;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid #86efac;
      background: #f0fdf4;
      color: #14532d;
    }
    .done-confirm-title {
      font-size: 20px;
      font-weight: 900;
      line-height: 1.5;
      margin-bottom: 10px;
    }
    .done-confirm-subtitle {
      font-size: 14px;
      color: #166534;
      line-height: 1.6;
      margin-bottom: 10px;
      font-weight: 700;
    }
    .done-confirm-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .done-confirm-btn {
      border: none;
      border-radius: 12px;
      padding: 13px 10px;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      line-height: 1.35;
      text-align: left;
    }
    .done-confirm-submit {
      background: #16a34a;
      color: #fff;
      text-align: center;
    }
    .done-confirm-cancel {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
      text-align: center;
    }
    .done-confirm-option {
      background: #ffffff;
      color: #14532d;
      border: 1px solid #bbf7d0;
    }
    .done-confirm-option.primary {
      background: #dcfce7;
      border-color: #86efac;
    }
    .done-other-box {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #86efac;
    }
    .done-other-box.show {
      display: block;
    }
    .done-other-input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #86efac;
      border-radius: 12px;
      padding: 12px;
      font-size: 17px;
      line-height: 1.4;
      min-height: 72px;
      resize: vertical;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }
.btn-start {
      background: #0891b2;
      color: #fff;
    }

    .btn-photo {
      background: #ede9fe;
      color: #5b21b6;
    }

    .photo-note {
      margin-top: 8px;
      font-size: 12px;
      color: #6b7280;
      line-height: 1.5;
    }
    .photo-preview-grid {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .photo-thumb {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      aspect-ratio: 1 / 1;
    }
    .photo-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo-delete-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 999px;
      background: rgba(17,24,39,0.78);
      color: #fff;
      font-size: 16px;
      line-height: 24px;
      text-align: center;
      cursor: pointer;
      padding: 0;
    }
    .photo-upload-badge {
      position: absolute;
      left: 6px;
      bottom: 6px;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
      color: #fff;
      background: rgba(37, 99, 235, 0.88);
    }
    .photo-upload-badge.ok { background: rgba(22, 101, 52, 0.9); }
    .photo-upload-badge.fail { background: rgba(153, 27, 27, 0.92); }
    .photo-retry-btn {
      position: absolute;
      left: 6px;
      right: 6px;
      bottom: 6px;
      border: none;
      border-radius: 9px;
      padding: 7px 8px;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .photo-upload-warning {
      position: fixed;
      left: 50%;
      bottom: calc(74px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(520px, calc(100% - 22px));
      margin: 0;
      padding: 14px 16px;
      border-radius: 16px;
      border: 2px solid #f59e0b;
      background: #fff7ed;
      color: #7c2d12;
      font-size: 17px;
      font-weight: 950;
      line-height: 1.55;
      letter-spacing: 0.02em;
      text-align: center;
      box-shadow: 0 14px 34px rgba(15, 23, 42, 0.24);
      z-index: 9000;
      pointer-events: none;
    }
    .photo-upload-warning.fail {
      border-color: #ef4444;
      background: #fef2f2;
      color: #991b1b;
      box-shadow: 0 14px 34px rgba(127, 29, 29, 0.24);
    }
    .empty {
      text-align: center;
      color: #666;
      padding: 28px 14px;
      background: #fff;
      border-radius: 12px;
      font-size: 15px;
    }
    .loading {
      text-align: center;
      padding: 24px 14px;
      color: #666;
      font-size: 15px;
    }
    .page-loading-panel {
      display: none;
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid #e5e7eb;
    }
    .page-loading-panel.show {
      display: block;
    }
    .page-loading-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 13px;
      color: #475569;
      font-weight: bold;
    }
    .page-loading-percent {
      color: #94a3b8;
      font-weight: bold;
      flex-shrink: 0;
    }
    .page-loading-bar {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: #e5e7eb;
      overflow: hidden;
    }
    .page-loading-fill {
      width: 8%;
      height: 100%;
      border-radius: 999px;
      background: #EBA13A;
      transition: width 0.25s ease;
    }
    .page-loading-note {
      margin-top: 8px;
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
    }
    .page-loading-retry {
      display: none;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      background: #d9dde3;
      color: #333;
    }
    .page-loading-retry.show {
      display: inline-block;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 11px;
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 14px;
      line-height: 1.55;
    }
    .footer-note {
      margin-top: 12px;
      font-size: 12px;
      color: #777;
      text-align: center;
      line-height: 1.6;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .overlay.show {
      display: flex;
    }
    .overlay-box {
      background: #fff;
      border-radius: 14px;
      padding: 20px 24px;
      min-width: 180px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.18);
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 4px solid #e5e7eb;
      border-top: 4px solid #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    .overlay-text {
      font-size: 14px;
      color: #374151;
      font-weight: bold;
    }
    .overlay-preview {
      display: none;
      gap: 8px;
      justify-content: center;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .overlay-preview.show {
      display: flex;
    }
    .overlay-preview img {
      width: 58px;
      height: 58px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      background: #f3f4f6;
    }

    .action-success-toast {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0.96);
      z-index: 10000;
      display: none;
      min-width: 220px;
      max-width: calc(100vw - 40px);
      background: #ecfdf5;
      border: 1px solid #86efac;
      color: #166534;
      border-radius: 16px;
      padding: 16px 20px;
      text-align: center;
      box-shadow: 0 12px 34px rgba(15, 23, 42, 0.18);
      font-weight: 900;
      line-height: 1.5;
      opacity: 0;
      transition: opacity 0.18s ease, transform 0.18s ease;
      pointer-events: none;
    }
    .action-success-toast.show {
      display: block;
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    .action-success-main {
      font-size: 20px;
      margin-bottom: 2px;
    }
    .action-success-sub {
      font-size: 15px;
      color: #15803d;
    }

    .manual-add-notice {
      display: none;
      background: #fffbeb;
      border: 1px solid #f59e0b;
      color: #92400e;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.5;
    }

    .manual-add-notice.show {
      display: block;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title">CAESAR 司機工作</div>
      <div class="sub" id="driverInfo">載入中...</div>
    </div>

    <div id="errorBox"></div>

    <div class="tabs">
      <button class="tab-btn" id="tabAM" onclick="switchPeriod('上午')">上午工作</button>
      <button class="tab-btn" id="tabPM" onclick="switchPeriod('下午')">下午工作</button>
    </div>

    <div class="panel" id="driverToolbarPanel">
      <div class="status-bar">
        <div id="summaryText">讀取中...</div>
        <div class="driver-toolbar-actions">
          <button class="driver-sort-btn driver-sort-edit" id="driverSortEditBtn" onclick="enterDriverSortMode()">修改排序</button>
          <button class="driver-sort-btn driver-sort-save" id="driverSortSaveBtn" onclick="saveDriverSortOrder()">儲存排序</button>
          <button class="driver-sort-btn driver-sort-cancel" id="driverSortCancelBtn" onclick="cancelDriverSortMode()">取消排序</button>
          <button class="refresh-btn" id="driverRefreshBtn" onclick="loadTasks()">重新整理</button>
        </div>
      </div>
    </div>

    <div class="manual-add-notice" id="manualAddNotice"></div>

    <div class="page-loading-panel" id="pageLoadingPanel">
      <div class="page-loading-row">
        <div id="pageLoadingText">正在讀取司機工作...</div>
        <div class="page-loading-percent" id="pageLoadingPercent">0%</div>
      </div>
      <div class="page-loading-bar">
        <div class="page-loading-fill" id="pageLoadingFill"></div>
      </div>
      <div class="page-loading-note" id="pageLoadingNote">請稍候，系統正在整理今日路線。</div>
      <button class="page-loading-retry" id="pageLoadingRetry" onclick="loadTasks()">重新整理</button>
    </div>

    <div id="taskContainer">
      <div class="loading">工作載入中...</div>
    </div>

    <div class="footer-note">
      本頁僅提供工作查看、導航與回報功能。<br />
      實際配送明細仍以紙本單據為準。
    </div>
  </div>


  <div class="action-success-toast" id="actionSuccessToast" role="status" aria-live="polite">
    <div class="action-success-main" id="actionSuccessMain">回報成功</div>
    <div class="action-success-sub" id="actionSuccessSub">畫面已更新</div>
  </div>

  <div class="overlay" id="loadingOverlay">
    <div class="overlay-box">
      <div class="spinner"></div>
      <div class="overlay-text" id="overlayText">處理中...</div>
      <div class="overlay-preview" id="overlayPreview"></div>
    </div>
  </div>

  <script>
    const LIFF_ID = '2009380550-ow9SlJK4';
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxmUEj7tu2ZbqZaIESXhu9oS73QdE8qOGRKmHONqHXf-H6pL3zdYxuSvssjOExQNJjlhA/exec';

    let currentDriverName = '';
    let pendingGroupStates = {};
    let localCompletedGroups = {};
    let pendingDeparture = false;
    let currentPeriod = '上午';
    let currentTasks = [];
    let currentBatchId = '';
    let departureStarted = false;
    let serverDepartureStarted = false;
    let groupedStopsCache = [];
    const PHOTO_SUPPLEMENT_WINDOW_MIN = 10;
    const PHOTO_UPLOAD_MAX_SIDE = 1024;
    const PHOTO_UPLOAD_JPEG_QUALITY = 0.65;
    let isUploadingPhotos = false;
    let photoUploadJobs = {};
    let photoUploadJobSeq = 1;
    let overlayPreviewUrls = [];
    let actionSuccessToastTimer = null;
    let driverActionDelegationBound = false;
    // 已關閉固定時間輪詢：司機頁只在開頁、手動重新整理、切回頁面、操作後重新讀取。
    let suppressAutoReloadUntil = 0;
    let pageLoadingTimer10 = null;
    let pageLoadingTimer30 = null;
    let showCompletedJobs = false;
    let pendingDoneConfirmTimer = null;
    const DONE_CONFIRM_PANEL_TIMEOUT_MS = 90000;
    let isDriverSortMode = false;
    let isSavingDriverSort = false;
    let driverSortableInstance = null;

    window.addEventListener('beforeunload', (event) => {
      if (hasActivePhotoUploads_()) {
        event.preventDefault();
        event.returnValue = '照片仍在上傳中，完成前請勿關閉頁面';
        return event.returnValue;
      }
    });

    function getQueryParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name) || '';
    }


    function isPerfDebugMode() {
      try {
        const qs = new URLSearchParams(window.location.search || '');
        return qs.get('debugPerf') === '1';
      } catch (e) { return false; }
    }

    function setPerfDebugText(text) {
      if (!isPerfDebugMode()) return;
      const el = document.getElementById('summaryText');
      if (el) el.textContent = text;
    }

    async function initPage() {
      try {
        showPageProgress('正在初始化司機頁...', 10, '請稍候，系統正在準備司機工作畫面。');
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        const queryDriver = getQueryParam('driver');
        const queryPeriod = getQueryParam('period');

        currentPeriod = (queryPeriod === '上午' || queryPeriod === '下午') ? queryPeriod : getDefaultPeriod();
        updatePageProgress('正在驗證司機權限...', 24, '系統正在確認此 LINE 帳號是否已綁定司機。');
        const auth = await verifyDriverAccess(profile.userId || '', queryDriver);
        currentDriverName = auth.driverName || '';

        setTabs();
        await loadTasks();
      } catch (err) {
        const msg = err.message || err;
        showError('初始化失敗：' + msg);
        renderAuthDenied(msg);
        completePageProgress('司機權限驗證失敗');
      }
    }

    function setTabs() {
      document.getElementById('tabAM').classList.toggle('active', currentPeriod === '上午');
      document.getElementById('tabPM').classList.toggle('active', currentPeriod === '下午');
    }

    function switchPeriod(period) {
      if (isSavingDriverSort) {
        showSyncWarning('排序儲存中，請稍候。');
        return;
      }
      currentPeriod = period;
      showCompletedJobs = false;
      isDriverSortMode = false;
      clearDoneConfirmState();
      setTabs();
      loadTasks();
    }



    async function verifyDriverAccess(uid, requestedDriver) {
      const url =
        `${GAS_WEBAPP_URL}?action=get_driver_access` +
        `&uid=${encodeURIComponent(uid || '')}` +
        `&driver=${encodeURIComponent(requestedDriver || '')}` +
        `&ts=${Date.now()}`;

      const resp = await fetch(url, { cache: 'no-store' });
      const json = await resp.json();
      if (!json.ok) {
        throw new Error(json.error || '司機權限驗證失敗');
      }

      const data = json.data || {};
      if (!data.authorized) {
        const code = data.code ? `（${data.code}）` : '';
        const uidNote = uid ? `｜LINE_UID：${uid}` : '';
        throw new Error((data.message || '此 LINE 帳號尚未綁定司機權限') + code + uidNote);
      }
      return data;
    }

    function renderAuthDenied(message) {
      const list = document.getElementById('taskContainer');
      if (!list) return;
      document.getElementById('driverInfo').innerHTML =
        `司機權限：<b>未通過</b><br>目前查看：<b>${escapeHtml(currentPeriod || '')}</b>`;
      list.innerHTML = `
        <div class="empty">
          <b>無法開啟司機工作</b><br>
          ${escapeHtml(message || '此 LINE 帳號尚未綁定司機權限。')}<br>
          請確認 DRIVER_DB 已填入此司機的 LINE_UID，且啟用欄位為 Y。
        </div>
      `;
    }

    function setPendingGroupState(groupKey, payload) {
      pendingGroupStates[groupKey] = {
        ...(pendingGroupStates[groupKey] || {}),
        ...payload,
        expireAt: Date.now() + 60000
      };
    }

    function cleanupPendingStates() {
      const now = Date.now();
      Object.keys(pendingGroupStates).forEach(key => {
        const item = pendingGroupStates[key];
        if (!item || !item.expireAt || item.expireAt < now) delete pendingGroupStates[key];
      });
    }

    function cleanupLocalCompletedGroups() {
      const now = Date.now();
      Object.keys(localCompletedGroups).forEach(key => {
        const item = localCompletedGroups[key];
        if (!item || !item.expireAt || item.expireAt < now) delete localCompletedGroups[key];
      });
    }

    function applyPendingStatesToTasks(tasks) {
      cleanupPendingStates();
      return (Array.isArray(tasks) ? tasks : []).map(task => {
        const shopName = String(task.shopName || '').trim();
        const rawAddress = String(task.address || '').trim();
        const normalizedAddress = (!rawAddress || rawAddress === '送店') ? '__STORE__' : rawAddress;
        const key = `${shopName}__${normalizedAddress}`;
        const pending = pendingGroupStates[key];
        if (!pending) return task;
        return {
          ...task,
          status: pending.status || task.status,
          reportedAt: pending.reportedAt || task.reportedAt,
          photoCount: typeof pending.photoCount === 'number' ? pending.photoCount : task.photoCount,
          draftPhotos: Array.isArray(pending.draftPhotos) ? pending.draftPhotos : task.draftPhotos,
          etaText: pending.clearEta ? '' : task.etaText
        };
      });
    }

    async function loadTasks(silent = false) {
      try {
        if (isSavingDriverSort) {
          if (!silent) showSyncWarning('排序儲存中，請稍候。');
          return;
        }
        if (silent && Date.now() < suppressAutoReloadUntil) return;
        clearError();
        if (!silent) {
          showPageProgress('正在讀取司機工作...', 35, '系統正在確認今日路線與配送狀態。');
          renderLoading();
        }

        document.getElementById('driverInfo').innerHTML =
          `司機：<b>${escapeHtml(currentDriverName || '未辨識')}</b><br>司機權限：<b>已通過</b><br>目前查看：<b>${currentPeriod}</b>`;

        const url =
          `${GAS_WEBAPP_URL}?action=get_driver_tasks` +
          `&driver=${encodeURIComponent(currentDriverName)}` +
          `&period=${encodeURIComponent(currentPeriod)}` +
          `&ts=${Date.now()}`;

        const apiStartedAt = Date.now();
        const resp = await fetch(url, { cache: 'no-store' });
        const json = await resp.json();
        const apiElapsed = Date.now() - apiStartedAt;

        if (!json.ok) {
          throw new Error(json.error || '讀取工作失敗');
        }

        if (!silent) updatePageProgress('正在整理配送順序...', 78, '系統正在整理站點、配送狀態與照片資訊。');
        currentTasks = applyPendingStatesToTasks((json.data && json.data.tasks) ? json.data.tasks : []);
        currentBatchId = (json.data && json.data.batchId) ? json.data.batchId : '';
        cleanupLocalCompletedGroups();
        const serverDoneStatuses = new Set(['已完成','放門口','改送隔壁','聯繫後改期','取消配送','特殊回報']);
        currentTasks.forEach(task => {
          const shopName = String(task.shopName || '').trim();
          const rawAddress = String(task.address || '').trim();
          const normalizedAddress = (!rawAddress || rawAddress === '送店') ? '__STORE__' : rawAddress;
          const key = `${shopName}__${normalizedAddress}`;
          if (serverDoneStatuses.has(String(task.status || '').trim()) && localCompletedGroups[key]) {
            delete localCompletedGroups[key];
          }
        });
        serverDepartureStarted = !!(json.data && json.data.departed);
        if (serverDepartureStarted) pendingDeparture = false;
        if (isPerfDebugMode()) setPerfDebugText('API：' + apiElapsed + 'ms｜正在渲染司機工作...');
        const renderStartedAt = Date.now();
        renderTasks(currentTasks);
        if (isPerfDebugMode()) setPerfDebugText('API：' + apiElapsed + 'ms｜Render：' + (Date.now() - renderStartedAt) + 'ms｜任務：' + currentTasks.length + ' 筆');
        loadManualAddNotice();
        if (!silent) completePageProgress('司機工作載入完成');
      } catch (err) {
        if (!silent) {
          updatePageProgress('司機工作讀取失敗', 100, '請確認網路狀態後重新整理。');
          showError('讀取工作失敗：' + (err.message || err));
          renderEmpty('目前無法讀取工作。');
        }
      }
    }


    async function loadManualAddNotice() {
      try {
        const resp = await fetch(`${GAS_WEBAPP_URL}?action=get_manual_add_status&ts=${Date.now()}`, { cache: 'no-store' });
        const json = await resp.json();
        const data = json && json.data ? json.data : {};
        const count = Number(data.pendingCount || 0);
        const box = document.getElementById('manualAddNotice');
        if (!box) return;
        if (count > 0) {
          box.classList.add('show');
          box.textContent = `目前有加單尚未排車：${count} 筆，請等待調度安排。`;
        } else {
          box.classList.remove('show');
          box.textContent = '';
        }
      } catch (err) {
        console.warn('loadManualAddNotice failed', err);
      }
    }

    function renderLoading() {
      document.getElementById('summaryText').textContent = '載入中...';
      document.getElementById('taskContainer').innerHTML = '<div class="loading">工作載入中...</div>';
    }

    function renderEmpty(text) {
      document.getElementById('summaryText').textContent = '目前沒有工作';
      document.getElementById('taskContainer').innerHTML = `<div class="empty">${escapeHtml(text)}</div>`;
    }

    function getStorageKey() {
      const scope = currentBatchId || currentPeriod;
      return `caesar_driver_state__${currentDriverName}__${scope}`;
    }

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(getStorageKey());
        if (!raw) return { completedList: [], lastCompletedKey: '', departed: false };
        const parsed = JSON.parse(raw);
        return {
          completedList: Array.isArray(parsed.completedList) ? parsed.completedList : [],
          lastCompletedKey: parsed.lastCompletedKey || '',
          departed: !!parsed.departed
        };
      } catch (e) {
        return { completedList: [], lastCompletedKey: '', departed: false };
      }
    }

    function saveLocalState(state) {
      localStorage.setItem(getStorageKey(), JSON.stringify(state));
    }

    function groupTasksByStop(tasks) {
      const map = {};

      tasks.forEach(task => {
        const shopName = String(task.shopName || '').trim();
        const rawAddress = String(task.address || '').trim();
        const normalizedAddress = (!rawAddress || rawAddress === '送店') ? '__STORE__' : rawAddress;
        const key = `${shopName}__${normalizedAddress}`;

        if (!map[key]) {
          map[key] = {
            key,
            shopName,
            address: rawAddress,
            phone: String(task.phone || '').trim(),
            routeGroup: task.routeGroup || '',
            taskIds: [],
            orderNos: [],
            tasks: [],
            isStore: (!rawAddress || rawAddress === '送店'),
            sortOrder: task.sortOrder || '',
            photoCount: 0,
            draftPhotos: [],
            status: task.status || '',
            reportedAt: task.reportedAt || '',
            note: ''
          };
        }

        map[key].taskIds.push(task.taskId || '');
        map[key].orderNos.push(task.orderNo || '');
        map[key].tasks.push(task);
        map[key].photoCount = Math.max(map[key].photoCount || 0, Number(task.photoCount || 0));
        const taskPhotos = Array.isArray(task.draftPhotos) ? task.draftPhotos : [];
        if (taskPhotos.length > (map[key].draftPhotos || []).length) {
          map[key].draftPhotos = taskPhotos;
        }
        map[key].status = task.status || map[key].status || '';
        map[key].reportedAt = task.reportedAt || map[key].reportedAt || '';
      });

      return Object.values(map).sort((a, b) => {
        const orderA = Number(a.sortOrder || 999999);
        const orderB = Number(b.sortOrder || 999999);
        if (orderA !== orderB) return orderA - orderB;
        return String(getMainLabel(a) || '').localeCompare(String(getMainLabel(b) || ''), 'zh-Hant');
      });
    }

    function getMainLabel(group) {
      const address = String(group.address || '').trim();
      const shopName = String(group.shopName || '').trim();
      if (group.isStore) return shopName || '未填店家';
      return '指定送達：' + (address || shopName || '未填地址');
    }

    function renderTasks(tasks) {
      const grouped = groupTasksByStop(tasks);

      const completedStatusSet = new Set(['已完成', '放門口', '改送隔壁', '聯繫後改期', '取消配送', '特殊回報']);
      const serverDeparted = !!serverDepartureStarted;
      departureStarted = !!pendingDeparture || serverDeparted;
      const serverCompletedGroups = grouped.filter(g => completedStatusSet.has(String(g.status || '').trim()));
      cleanupLocalCompletedGroups();
      const serverCompletedKeySet = new Set(serverCompletedGroups.map(g => g.key));
      const localCompletedList = Object.values(localCompletedGroups).filter(item => item && !serverCompletedKeySet.has(item.key));
      const pendingGroups = grouped.filter(g => !completedStatusSet.has(String(g.status || '').trim()) && !localCompletedGroups[g.key]);
      const completedList = serverCompletedGroups.map(g => ({
        key: g.key,
        label: getMainLabel(g),
        taskIds: g.taskIds || [],
        note: (g.status && g.status !== '已完成') ? g.status : '',
        photoCount: Number(g.photoCount || 0),
        draftPhotos: Array.isArray(g.draftPhotos) ? g.draftPhotos : [],
        reportedAt: g.reportedAt || '',
        completedAt: g.reportedAt ? new Date(g.reportedAt).getTime() : Date.now()
      })).concat(localCompletedList.sort((a,b)=> (a.completedAt||0)-(b.completedAt||0)));

      groupedStopsCache = pendingGroups.slice();

      document.getElementById('summaryText').textContent =
        isDriverSortMode
          ? `排序模式：${pendingGroups.length} 站未完成工作`
          : `剩 ${pendingGroups.length} 站 / ${pendingGroups.reduce((sum, g) => sum + g.taskIds.length, 0)} 張待配送單`;

      updateDriverSortToolbar(pendingGroups.length);

      const htmlParts = [];
      htmlParts.push(getPhotoUploadWarningHtml_());

      if (isDriverSortMode) {
        htmlParts.push(renderDriverSortMode(pendingGroups));
        document.getElementById('taskContainer').innerHTML = htmlParts.join('');
        initDriverSortable();
        return;
      }

      htmlParts.push(`
        <div class="card ${departureStarted ? 'done' : ''}" id="departure-card">
          <div class="card-top">
            <div class="left-badges">
              <div class="badge-sort">起點</div>
              <div class="badge-route">公司</div>
            </div>
            <div class="badge-right">出發</div>
          </div>
          <div class="display-name">公司出發</div>
          <div class="depart-box">
            出發前請確認：<br>
            1. 紙本單據齊全<br>
            2. 路線已確認<br>
            3. 手機 / 導航 / 聯絡正常
          </div>
          <div class="btn-row">
            <button class="btn btn-start" id="btn-start-departure">出發</button>
          </div>
        </div>
      `);

      if (completedList.length > 0) {
        htmlParts.push(`
          <button type="button" class="completed-toggle-card ${showCompletedJobs ? 'open' : ''}" id="completedToggleBtn">
            <span>已完成工作 ${completedList.length} 筆${showCompletedJobs ? '，點此收合' : '，點此查看'}</span>
          </button>
        `);
      }

      const completedVisibleList = showCompletedJobs ? completedList : [];
      completedVisibleList.forEach((item, idx) => {
        const doneText = item.note
          ? `${item.label || ''} (${item.note})`
          : `${item.label || ''}`;
        const canSupplement = canSupplementPhoto(item);
        const localPhotoCount = countLocalPhotoJobs_(item.key);
        const totalPhotoCount = Number(item.photoCount || 0) + localPhotoCount;
        const photoText = totalPhotoCount ? ` 已有${totalPhotoCount}張照片` : ' 可補照片';

        htmlParts.push(`
          <div class="card done">
            <div class="display-name">${escapeHtml(doneText)}</div>
            ${item.syncPending ? `<div class="done-note">已送出｜系統同步中</div>` : ''}
            ${renderDraftPhotoGrid(item)}
            ${canSupplement ? `<div class="btn-row" style="display:flex; margin-top:8px;"><button class="btn btn-photo btn-photo-upload" ${isUploadingPhotos ? 'disabled' : ''} data-group-key="${escapeHtml(item.key)}" data-taskids="${escapeHtml(encodeURIComponent(JSON.stringify(item.taskIds || [])))}">${isUploadingPhotos ? '照片上傳中' : ('補傳照片' + escapeHtml(photoText))}</button></div>` : ''}
          </div>
        `);
      });

      if (pendingGroups.length > 0 && (departureStarted || completedList.length > 0)) {
        htmlParts.push(`
          <div class="travel-connector">
            <span>🚚 司機配送中</span>
          </div>
        `);
      }

      if (!pendingGroups.length && !completedList.length) {
        htmlParts.push(`<div class="empty">目前 ${escapeHtml(currentPeriod)} 沒有待配送工作</div>`);
      } else {
        pendingGroups.forEach((group, index) => {
          const firstTask = group.tasks[0];
          const navTarget = getNavigationTarget(firstTask);
          const mainLabel = getMainLabel(group);

          htmlParts.push(`
            <div class="card" id="card-${escapeHtml(group.key)}">
              <div class="card-top">
                <div class="left-badges">
                  <div class="badge-sort">${escapeHtml(String(index + 1))}</div>
                  <div class="badge-route">${escapeHtml(group.routeGroup || '未分組')}</div>
                </div>
                <div class="badge-right">${escapeHtml(group.orderNos.join(', '))}</div>
              </div>

              <div class="display-name">${escapeHtml(mainLabel)}</div>

              <div class="btn-row driver-main-actions">
                <button class="btn btn-nav" data-nav="${escapeHtml(navTarget)}">導航</button>
                <button class="btn btn-photo btn-photo-upload" ${isUploadingPhotos ? 'disabled' : ''} data-group-key="${escapeHtml(group.key)}" data-taskids="${escapeHtml(encodeURIComponent(JSON.stringify(group.taskIds)))}">${isUploadingPhotos ? '照片上傳中' : `照片${(Number(group.photoCount || 0) + countLocalPhotoJobs_(group.key)) ? `(${Number(group.photoCount || 0) + countLocalPhotoJobs_(group.key)})` : ''}`}</button>
                <button class="btn btn-done" data-group-key="${escapeHtml(group.key)}" data-taskids="${escapeHtml(encodeURIComponent(JSON.stringify(group.taskIds)))}">配送完成</button>
              </div>
              ${renderDraftPhotoGrid(group)}
              ${!group.isStore ? `<div class="photo-note">指定送達建議拍照，最多 2 張。</div>` : ''}
            </div>
          `);
        });
      }

      document.getElementById('taskContainer').innerHTML = htmlParts.join('');
      bindActionButtons();
    }


    function updateDriverSortToolbar(pendingCount) {
      const panel = document.getElementById('driverToolbarPanel');
      const editBtn = document.getElementById('driverSortEditBtn');
      const saveBtn = document.getElementById('driverSortSaveBtn');
      const cancelBtn = document.getElementById('driverSortCancelBtn');
      const refreshBtn = document.getElementById('driverRefreshBtn');
      if (panel) panel.classList.toggle('driver-sort-mode', !!isDriverSortMode);
      if (editBtn) editBtn.disabled = isSavingDriverSort || Number(pendingCount || 0) <= 1;
      if (saveBtn) {
        saveBtn.disabled = isSavingDriverSort;
        saveBtn.textContent = isSavingDriverSort ? '儲存中...' : '儲存排序';
      }
      if (cancelBtn) cancelBtn.disabled = isSavingDriverSort;
      if (refreshBtn) refreshBtn.disabled = isSavingDriverSort;
    }

    function renderDriverSortMode(pendingGroups) {
      const list = Array.isArray(pendingGroups) ? pendingGroups : [];
      return `
        <div class="driver-sort-hint">
          拖曳右側把手調整順序。排序時只顯示未完成工作，已完成工作不參與排序。
        </div>
        <div class="driver-sort-list" id="driverSortList">
          ${list.map((group, idx) => `
            <div class="driver-sort-row" data-taskids="${escapeHtml(encodeURIComponent(JSON.stringify(group.taskIds || [])))}" data-group-key="${escapeHtml(group.key || '')}">
              <div class="badge-sort">${escapeHtml(String(idx + 1))}</div>
              <div class="driver-sort-meta">${escapeHtml(group.routeGroup || '')}</div>
              <div class="driver-sort-label">${escapeHtml(getMainLabel(group))}</div>
              <div class="driver-sort-handle">☰</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function initDriverSortable() {
      if (driverSortableInstance) {
        try { driverSortableInstance.destroy(); } catch (e) {}
        driverSortableInstance = null;
      }
      const el = document.getElementById('driverSortList');
      if (!el || typeof Sortable === 'undefined') return;
      driverSortableInstance = Sortable.create(el, {
        animation: 150,
        handle: '.driver-sort-handle',
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        direction: 'vertical',
        fallbackOnBody: false,
        dragoverBubble: false,
        scroll: true,
        forceAutoScrollFallback: false,
        onStart: () => { document.body.classList.add('driver-sorting-active'); },
        onEnd: () => {
          document.body.classList.remove('driver-sorting-active');
          renumberDriverSortRows();
        }
      });
    }

    function renumberDriverSortRows() {
      const rows = Array.from(document.querySelectorAll('#driverSortList .driver-sort-row'));
      rows.forEach((row, idx) => {
        const badge = row.querySelector('.badge-sort');
        if (badge) badge.textContent = String(idx + 1);
      });
    }

    function enterDriverSortMode() {
      if (isSavingDriverSort) return;
      clearDoneConfirmState();
      const pendingCount = groupedStopsCache.length;
      if (pendingCount <= 1) {
        showSyncWarning('目前未完成工作不足 2 站，不需要排序。');
        return;
      }
      isDriverSortMode = true;
      renderTasks(currentTasks);
    }

    function cancelDriverSortMode() {
      if (isSavingDriverSort) return;
      isDriverSortMode = false;
      if (driverSortableInstance) {
        try { driverSortableInstance.destroy(); } catch (e) {}
        driverSortableInstance = null;
      }
      renderTasks(currentTasks);
    }

    async function saveDriverSortOrder() {
      if (isSavingDriverSort) return;
      const rows = Array.from(document.querySelectorAll('#driverSortList .driver-sort-row'));
      if (!rows.length) return;

      const orderedTaskIds = [];
      rows.forEach(row => {
        const raw = decodeURIComponent(row.getAttribute('data-taskids') || '[]');
        try {
          const ids = JSON.parse(raw);
          if (Array.isArray(ids)) ids.forEach(id => { if (id) orderedTaskIds.push(id); });
        } catch (e) {}
      });

      if (!orderedTaskIds.length) {
        showSyncWarning('沒有可儲存的排序資料。');
        return;
      }

      isSavingDriverSort = true;
      updateDriverSortToolbar(rows.length);
      suppressAutoReloadUntil = Date.now() + 12000;

      try {
        const resp = await fetch(GAS_WEBAPP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'save_driver_order_now',
            driverName: currentDriverName,
            period: currentPeriod,
            routeDate: new Date().toISOString(),
            orderedTaskIds
          })
        });
        const text = await resp.text();
        let json = {};
        try { json = JSON.parse(text); } catch (e) { throw new Error(text || '排序儲存失敗'); }
        if (!json.ok) throw new Error(json.message || json.error || '排序儲存失敗');

        const orderMap = new Map();
        orderedTaskIds.forEach((taskId, idx) => orderMap.set(String(taskId), idx + 1));
        currentTasks = currentTasks.map(task => orderMap.has(String(task.taskId || ''))
          ? { ...task, sortOrder: String(orderMap.get(String(task.taskId || ''))) }
          : task
        );

        isDriverSortMode = false;
        showSyncNotice(json.message || '排序已儲存。');
        renderTasks(currentTasks);
        setTimeout(() => { suppressAutoReloadUntil = 0; loadTasks(true); }, 5000);
      } catch (err) {
        showSyncWarning('排序儲存失敗：' + (err.message || err));
      } finally {
        isSavingDriverSort = false;
        updateDriverSortToolbar(groupedStopsCache.length);
      }
    }


    function getPhotoJobsForGroup_(groupKey) {

    function bindActionButtons() {
      // v54 Android 載入優化：改用事件委派。
      // 原本每次 renderTasks() 都會 querySelectorAll 並重新綁定每顆按鈕，

    async function postDriverActionWithSoftTimeout(payload, timeoutMs = 1800) {
      const fetchPromise = fetch(GAS_WEBAPP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).then(async resp => {
        const text = await resp.text();
        let json = {};
        try { json = JSON.parse(text); } catch (e) { throw new Error(text || '系統回應格式錯誤'); }
        if (!json.ok) throw new Error(json.message || json.error || '送出失敗');
        return json;
      });

      let timeoutId = null;
      const timeoutPromise = new Promise(resolve => {
        timeoutId = setTimeout(() => resolve({ ok: true, timeout: true, message: '已送出，系統同步中' }), timeoutMs);
      });

      const result = await Promise.race([fetchPromise, timeoutPromise]);
      if (timeoutId) clearTimeout(timeoutId);

      if (result && result.timeout) {
        fetchPromise.catch(err => {
          console.warn('driver action background confirm failed:', err);
          showSyncWarning('已先更新畫面，但送出狀態尚未確認。請稍後重新整理確認。');
        });
      }
      return result;
    }

        const payload = {

        departureStarted = previousDeparture;
        pendingDeparture = false;

        alert('出發送出失敗：' + (err.message || err));

        localCompletedGroups = previousCompletedGroups;
        pendingGroupStates = previousPendingStates;
        renderTasks(currentTasks);

    function markGroupDone(groupKey, note = '', syncPending = false) {
      const group = groupedStopsCache.find(x => x.key === groupKey);
      if (!group) return;

      const finalStatus = note || '已完成';
      const now = new Date();
      setPendingGroupState(groupKey, { status: finalStatus, reportedAt: now.toISOString(), clearEta: true, photoCount: Number(group.photoCount || 0), draftPhotos: Array.isArray(group.draftPhotos) ? group.draftPhotos : [] });

      currentTasks = currentTasks.map(task => {
        const shopName = String(task.shopName || '').trim();
        const rawAddress = String(task.address || '').trim();
        const normalizedAddress = (!rawAddress || rawAddress === '送店') ? '__STORE__' : rawAddress;
        const key = `${shopName}__${normalizedAddress}`;
        if (key !== groupKey) return task;
        return {
          ...task,
          status: finalStatus,
          reportedAt: now.toISOString()
        };
      });

      groupedStopsCache = groupedStopsCache.filter(x => x.key !== groupKey);
      localCompletedGroups[groupKey] = {
        key: groupKey,
        label: getMainLabel(group),
        taskIds: group.taskIds || [],
        note: finalStatus !== '已完成' ? finalStatus : '',
        photoCount: Number(group.photoCount || 0),
        draftPhotos: Array.isArray(group.draftPhotos) ? group.draftPhotos : [],
        reportedAt: now.toISOString(),
        completedAt: now.getTime(),
        syncPending: !!syncPending,
        expireAt: Date.now() + 120000
      };
      renderTasks(currentTasks);
    }

    function canSupplementPhoto(item) {
      const completedAt = Number(item && item.completedAt || 0);
      if (!completedAt) return false;
      return (Date.now() - completedAt) <= PHOTO_SUPPLEMENT_WINDOW_MIN * 60 * 1000;
    }

    function chooseImageFiles_(maxCount) {
      return new Promise(resolve => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.multiple = true;

        let resolved = false;
        const done = (files) => {
          if (resolved) return;
          resolved = true;
          try { input.remove(); } catch (_) {}
          resolve(Array.isArray(files) ? files : []);
        };

        input.onchange = () => {
          const files = Array.from(input.files || []).slice(0, Math.max(1, maxCount || 2));
          done(files);
        };

        input.oncancel = () => done([]);

        // 部分手機瀏覽器取消選檔不會觸發 onchange / cancel。
        // 回到頁面後若沒有檔案，主動回傳空陣列，避免照片按鈕卡在鎖定狀態。
        const handleFocusBack = () => {
          setTimeout(() => {
            if (resolved) return;
            const files = Array.from(input.files || []).slice(0, Math.max(1, maxCount || 2));
            done(files);
          }, 650);
          window.removeEventListener('focus', handleFocusBack);
        };
        window.addEventListener('focus', handleFocusBack);

        document.body.appendChild(input);
        input.click();
      });
    }

    async function compressImageFile_(file) {
      const sourceUrl = URL.createObjectURL(file);
      try {
        const img = await new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = reject;
          image.src = sourceUrl;
        });

        const maxSide = PHOTO_UPLOAD_MAX_SIDE;
        let { width, height } = img;
        if (width > height && width > maxSide) {
          height = Math.round(height * (maxSide / width));
          width = maxSide;
        } else if (height >= width && height > maxSide) {
          width = Math.round(width * (maxSide / height));
          height = maxSide;
        }

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const compressed = canvas.toDataURL('image/jpeg', PHOTO_UPLOAD_JPEG_QUALITY);

        return {
          fileName: file.name || 'photo.jpg',
          mimeType: 'image/jpeg',
          dataBase64: compressed.split(',')[1],
          previewDataUrl: compressed
        };
      } finally {
        try { URL.revokeObjectURL(sourceUrl); } catch (e) {}
      }
    }

    function setPhotoUploadLocked_(locked) {
      isUploadingPhotos = !!locked;
      document.querySelectorAll('.btn-photo-upload').forEach(btn => {
        btn.disabled = !!locked;
        if (locked) {

          btn.textContent = '照片處理中';
        } else {

          if (original) btn.textContent = original;
          btn.removeAttribute('data-original-text');
        }

    }

    function getPhotoJobList_(groupKey) {

      return photoUploadJobs[key];

    function setPhotoJobStatus_(groupKey, localId, status, errorText = '') {

    function removeUploadedPhotoJobs_(groupKey, localIds) {
      const key = String(groupKey || '');
      const idSet = new Set((Array.isArray(localIds) ? localIds : []).map(String));
      if (!photoUploadJobs[key]) return;
      photoUploadJobs[key] = photoUploadJobs[key].filter(job => !idSet.has(String(job.localId || '')));
      if (!photoUploadJobs[key].length) delete photoUploadJobs[key];
    }

    async function uploadPhotoJobsToServer_(groupKey, jobs) {
      const uploadJobs = (Array.isArray(jobs) ? jobs : []).filter(job => job && job.dataBase64);
      if (!uploadJobs.length) return null;
      uploadJobs.forEach(job => job.status = 'uploading');
      renderTasks(currentTasks);

      try {
        const taskIds = uploadJobs[0].taskIds || [];
        const photos = uploadJobs.map(job => ({
          fileName: job.fileName,
          mimeType: job.mimeType,
          dataBase64: job.dataBase64
        }));

        const resp = await fetch(GAS_WEBAPP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'upload_driver_photos', taskIds, driverName: currentDriverName, photos })
        });
        const text = await resp.text();
        let json = {};
        try { json = JSON.parse(text); } catch (e) { throw new Error(text || '照片上傳失敗'); }
        if (!json.ok) throw new Error(json.message || json.error || '照片上傳失敗');

        syncPhotoStateToGroup_(groupKey, Number(json.totalCount || 0), Array.isArray(json.photos) ? json.photos : []);
        removeUploadedPhotoJobs_(groupKey, uploadJobs.map(job => job.localId));
        renderTasks(currentTasks);
        return json;
      } catch (err) {
        uploadJobs.forEach(job => {
          job.status = 'failed';
          job.errorText = err && err.message ? err.message : String(err || '照片上傳失敗');
        });
        renderTasks(currentTasks);
        showSyncWarning('照片上傳失敗，可在縮圖上按「重新上傳」。');
        return null;
      } finally {
        setPhotoUploadLocked_(false);
      }
    }

    function startBackgroundPhotoUpload_(groupKey, jobs) {
      uploadPhotoJobsToServer_(groupKey, jobs).catch(err => {
        const list = Array.isArray(jobs) ? jobs : [];
        list.forEach(job => {
          job.status = 'failed';
          job.errorText = err && err.message ? err.message : String(err || '照片上傳失敗');
        });
        renderTasks(currentTasks);
      });
    }

    async function chooseAndUploadPhotos(taskIdsJson, groupKey) {
      let taskIds = [];
      try { taskIds = JSON.parse(taskIdsJson); } catch (e) { alert('工作資料格式錯誤'); return; }

      const group = groupedStopsCache.find(x => x.key === groupKey) || localCompletedGroups[groupKey] || {};
      const existingPhotos = Array.isArray(group.draftPhotos) ? group.draftPhotos : [];
      const localJobs = getPhotoJobsForGroup_(groupKey);
      const remainCount = Math.max(0, 2 - existingPhotos.length - localJobs.length);
      if (remainCount <= 0) {
        alert('最多只能上傳 2 張照片');
        return;
      }

      suppressAutoReloadUntil = Date.now() + 20000;
      try {
        const files = await chooseImageFiles_(remainCount);
        if (!files.length) {
          setPhotoUploadLocked_(false);
          return;
        }
        const picked = files.slice(0, remainCount);
        if (!picked.length) {
          setPhotoUploadLocked_(false);
          return;
        }

        setPhotoUploadLocked_(true);
        const compressedJobs = [];
        for (let i = 0; i < picked.length; i++) {
          const compressed = await compressImageFile_(picked[i]);
          compressedJobs.push({
            localId: 'local_' + (photoUploadJobSeq++),
            status: 'uploading',
            taskIds: taskIds,
            createdAt: Date.now(),
            fileName: compressed.fileName,
            mimeType: compressed.mimeType,
            dataBase64: compressed.dataBase64,
            previewDataUrl: compressed.previewDataUrl,
            errorText: ''
          });
        }

        const list = getPhotoJobList_(groupKey);
        compressedJobs.forEach(job => list.push(job));
        renderTasks(currentTasks);
        startBackgroundPhotoUpload_(groupKey, compressedJobs);
      } catch (err) {
        setPhotoUploadLocked_(false);
        alert('照片處理失敗：' + (err.message || err));
      }
    }

    function retryPhotoUpload_(groupKey, localId) {
      const list = getPhotoJobList_(groupKey);
      const job = list.find(item => item && item.localId === localId);
      if (!job) {
        alert('照片暫存已不存在，請重新選擇照片');
        return;
      }
      if (!job.dataBase64) {
        alert('照片暫存已不存在，請重新選擇照片');
        return;
      }
      setPhotoUploadLocked_(true);
      job.status = 'uploading';
      job.errorText = '';
      renderTasks(currentTasks);
      startBackgroundPhotoUpload_(groupKey, [job]);
    }

    async function deleteUploadedPhoto(taskIdsJson, groupKey, photoIndex, fileId = '') {
      let taskIds = [];
      try { taskIds = JSON.parse(taskIdsJson); } catch (e) { alert('工作資料格式錯誤'); return; }
      if (photoIndex < 0) return;
      showOverlay('刪除照片中...');
      suppressAutoReloadUntil = Date.now() + 5000;
      try {
        const resp = await fetch(GAS_WEBAPP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'delete_driver_photo', taskIds, driverName: currentDriverName, photoIndex, fileId })
        });
        const text = await resp.text();
        let json = {};
        try { json = JSON.parse(text); } catch (e) { throw new Error(text || '照片刪除失敗'); }
        if (!json.ok) throw new Error(json.message || json.error || '照片刪除失敗');
        syncPhotoStateToGroup_(groupKey, Number(json.totalCount || 0), Array.isArray(json.photos) ? json.photos : []);
        renderTasks(currentTasks);
      } catch (err) {
        alert('照片刪除失敗：' + (err.message || err));
      } finally {
        hideOverlay();
      }
    }

    function syncPhotoStateToGroup_(groupKey, count, photos) {
      groupedStopsCache = groupedStopsCache.map(item => item.key === groupKey ? { ...item, photoCount: count, draftPhotos: Array.isArray(photos) ? photos : [] } : item);
      currentTasks = currentTasks.map(task => {
        const shopName = String(task.shopName || '').trim();
        const rawAddress = String(task.address || '').trim();
        const normalizedAddress = (!rawAddress || rawAddress === '送店') ? '__STORE__' : rawAddress;
        const key = `${shopName}__${normalizedAddress}`;
        return key === groupKey ? { ...task, photoCount: count, draftPhotos: Array.isArray(photos) ? photos : [] } : task;
      });
      setPendingGroupState(groupKey, { photoCount: count, draftPhotos: Array.isArray(photos) ? photos : [] });
    }

    function getCurrentGpsText() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error('裝置不支援定位'));
          return;
        }

        navigator.geolocation.getCurrentPosition(
          pos => {
            resolve(`${pos.coords.latitude},${pos.coords.longitude}`);
          },
          err => reject(err),
          {
            enableHighAccuracy: true,
            timeout: 1200,
            maximumAge: 0
          }
        );
      });
    }

    function showPageProgress(text, percent, note) {
      const panel = document.getElementById('pageLoadingPanel');
      if (!panel) return;
      panel.classList.add('show');
      updatePageProgress(text || '正在讀取資料...', percent || 8, note || '請稍候。');
      clearPageProgressTimers();
      pageLoadingTimer10 = setTimeout(() => {
        updatePageProgress('資料較多，系統仍在整理中...', 88, '請不要關閉頁面，系統仍在讀取司機工作。');
      }, 10000);
      pageLoadingTimer30 = setTimeout(() => {
        const retry = document.getElementById('pageLoadingRetry');
        if (retry) retry.classList.add('show');
        updatePageProgress('系統仍在讀取中', 92, '若等待過久，可按「重新整理」。');
      }, 30000);
    }

    function updatePageProgress(text, percent, note) {
      const p = Math.max(0, Math.min(100, Number(percent || 0)));
      const textEl = document.getElementById('pageLoadingText');
      const percentEl = document.getElementById('pageLoadingPercent');
      const fillEl = document.getElementById('pageLoadingFill');
      const noteEl = document.getElementById('pageLoadingNote');
      const retryEl = document.getElementById('pageLoadingRetry');
      if (textEl) textEl.textContent = text || '正在讀取資料...';
      if (percentEl) percentEl.textContent = `${Math.round(p)}%`;
      if (fillEl) fillEl.style.width = `${p}%`;
      if (noteEl) noteEl.textContent = note || '';
      if (retryEl && p < 100) retryEl.classList.remove('show');
    }

    function completePageProgress(text) {
      clearPageProgressTimers();
      updatePageProgress(text || '載入完成', 100, '資料已更新。');
      setTimeout(() => {
        const panel = document.getElementById('pageLoadingPanel');
        const retry = document.getElementById('pageLoadingRetry');
        if (panel) panel.classList.remove('show');
        if (retry) retry.classList.remove('show');
      }, 450);
    }

    function clearPageProgressTimers() {
      if (pageLoadingTimer10) clearTimeout(pageLoadingTimer10);
      if (pageLoadingTimer30) clearTimeout(pageLoadingTimer30);
      pageLoadingTimer10 = null;
      pageLoadingTimer30 = null;
    }


    function showActionSuccessToast(mainText, subText, durationMs) {
      const toast = document.getElementById('actionSuccessToast');
      const mainEl = document.getElementById('actionSuccessMain');
      const subEl = document.getElementById('actionSuccessSub');
      if (!toast || !mainEl || !subEl) return;

      if (actionSuccessToastTimer) {
        clearTimeout(actionSuccessToastTimer);
        actionSuccessToastTimer = null;
      }

      mainEl.textContent = mainText || '回報成功';
      subEl.textContent = subText || '畫面已更新';
      toast.classList.add('show');

      actionSuccessToastTimer = setTimeout(() => {
        toast.classList.remove('show');
        actionSuccessToastTimer = null;
      }, Number(durationMs || 2600));
    }

    function showOverlay(text, previewUrls) {
      document.getElementById('overlayText').textContent = text || '處理中...';

      if (Array.isArray(previewUrls)) {
        clearOverlayPreviewUrls_();
        overlayPreviewUrls = previewUrls;
        const previewEl = document.getElementById('overlayPreview');
        if (previewEl) {
          previewEl.innerHTML = previewUrls.map(url => `<img src="${escapeHtml(url)}" alt="upload-preview">`).join('');
          previewEl.classList.toggle('show', previewUrls.length > 0);
        }
      }

      document.getElementById('loadingOverlay').classList.add('show');
    }

    function clearOverlayPreviewUrls_() {
      overlayPreviewUrls.forEach(url => {
        try { URL.revokeObjectURL(url); } catch (e) {}
      });
      overlayPreviewUrls = [];
      const previewEl = document.getElementById('overlayPreview');
      if (previewEl) {
        previewEl.innerHTML = '';
        previewEl.classList.remove('show');
      }
    }

    function hideOverlay() {
      document.getElementById('loadingOverlay').classList.remove('show');
      clearOverlayPreviewUrls_();
    }

    function getDefaultPeriod() {
      const now = new Date();
      return now.getHours() < 12 ? '上午' : '下午';
    }

    function showError(msg) {
      document.getElementById('errorBox').innerHTML = `<div class="error">${escapeHtml(msg)}</div>`;
    }

    function clearError() {
      document.getElementById('errorBox').innerHTML = '';
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) loadTasks(true);
    });

    initPage();
  </script>
</body>
</html>
