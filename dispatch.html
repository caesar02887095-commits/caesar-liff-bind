<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>排車頁</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f5f6f8;
      color: #222;
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 12px;
    }
    .topbar {
      background: #2c3e50;
      color: #fff;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 14px;
      line-height: 1.6;
      opacity: 0.95;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-period {
      background: #d9dde3;
      color: #333;
    }
    .btn-period.active {
      background: #EBA13A;
      color: #fff;
    }
    .btn-save {
      background: #2563eb;
      color: #fff;
      margin-left: auto;
    }
    .save-status {
      font-size: 13px;
      color: #666;
      margin: 8px 0 12px;
      min-height: 18px;
    }
    .dispatch-group {
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .dispatch-group-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .dispatch-group-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .dispatch-stop-card {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .dispatch-stop-main {
      flex: 1;
      min-width: 0;
    }
    .dispatch-stop-label {
      font-size: 14px;
      font-weight: bold;
      line-height: 1.5;
      word-break: break-word;
    }
    .dispatch-stop-orders {
      font-size: 12px;
      color: #666;
      margin-top: 2px;
      word-break: break-word;
    }
    .dispatch-stop-driver select {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
      background: #fff;
    }
    .loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.35);
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .loading-box {
      background: #fff;
      border-radius: 12px;
      padding: 18px 22px;
      min-width: 180px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title">排車頁</div>
      <div class="sub">拖曳調整站點順序，選擇司機後再儲存。</div>
    </div>

    <div class="toolbar">
      <button class="btn btn-period active" id="btn-am" onclick="switchDispatchPeriod('上午')">上午</button>
      <button class="btn btn-period" id="btn-pm" onclick="switchDispatchPeriod('下午')">下午</button>
      <button class="btn btn-save" onclick="saveDispatchBoard()">儲存排車</button>
    </div>

    <div id="dispatch-save-status" class="save-status"></div>
    <div id="dispatch-board-container"></div>
  </div>

  <div id="dispatch-loading-overlay" class="loading-overlay">
    <div class="loading-box">
      <div id="dispatch-loading-text">處理中...</div>
    </div>
  </div>

  <script>
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxmUEj7tu2ZbqZaIESXhu9oS73QdE8qOGRKmHONqHXf-H6pL3zdYxuSvssjOExQNJjlhA/exec';

    let dispatchBoardData = null;
    let lastSavedDispatchBoardData = null;
    let currentPeriod = '上午';
    let currentDateText = '';
    let isSavingDispatch = false;
    let dragSource = null;

    function deepClone(obj) {
      return JSON.parse(JSON.stringify(obj));
    }

    function getDispatchDateText() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function setPeriodButtons() {
      document.getElementById('btn-am').classList.toggle('active', currentPeriod === '上午');
      document.getElementById('btn-pm').classList.toggle('active', currentPeriod === '下午');
    }

    async function loadDispatchBoard(showLoading = true) {
      try {
        if (showLoading) {
          showDispatchLoading('載入排車資料中...');
        }

        currentDateText = getDispatchDateText();

        const url =
          `${GAS_WEBAPP_URL}?action=get_dispatch_board` +
          `&period=${encodeURIComponent(currentPeriod)}` +
          `&date=${encodeURIComponent(currentDateText)}`;

        const resp = await fetch(url);
        const json = await resp.json();

        if (!json.ok) {
          throw new Error(json.error || '載入排車資料失敗');
        }

        dispatchBoardData = deepClone(json.data || {});
        lastSavedDispatchBoardData = deepClone(json.data || {});
        renderDispatchBoard(dispatchBoardData);
        setPeriodButtons();

      } catch (err) {
        alert('載入排車資料失敗：' + (err.message || err));
      } finally {
        hideDispatchLoading();
      }
    }

    async function syncDispatchBoardSilently() {
      try {
        const url =
          `${GAS_WEBAPP_URL}?action=get_dispatch_board` +
          `&period=${encodeURIComponent(currentPeriod)}` +
          `&date=${encodeURIComponent(currentDateText || getDispatchDateText())}`;

        const resp = await fetch(url);
        const json = await resp.json();
        if (!json.ok) return;

        dispatchBoardData = deepClone(json.data || {});
        lastSavedDispatchBoardData = deepClone(json.data || {});
        renderDispatchBoard(dispatchBoardData);
        setDispatchSaveStatus('已同步最新排車結果');
      } catch (err) {
        console.error('syncDispatchBoardSilently error', err);
      }
    }

    function setDispatchSaveStatus(text) {
      const el = document.getElementById('dispatch-save-status');
      if (el) el.textContent = text || '';
    }

    function showDispatchLoading(text) {
      const overlay = document.getElementById('dispatch-loading-overlay');
      const label = document.getElementById('dispatch-loading-text');
      if (label) label.textContent = text || '處理中...';
      if (overlay) overlay.style.display = 'flex';
    }

    function hideDispatchLoading() {
      const overlay = document.getElementById('dispatch-loading-overlay');
      if (overlay) overlay.style.display = 'none';
    }

    function ensureDispatchGroupsShape(board) {
      if (!board.groups) board.groups = {};
      ['調度', '市區', '竹東', '湖口'].forEach(name => {
        if (!Array.isArray(board.groups[name])) board.groups[name] = [];
      });
    }

    function renderDispatchBoard(board) {
      ensureDispatchGroupsShape(board);

      const container = document.getElementById('dispatch-board-container');
      if (!container) return;

      const html = ['調度', '市區', '竹東', '湖口'].map(groupName => {
        const list = board.groups[groupName] || [];

        return `
          <div class="dispatch-group">
            <div class="dispatch-group-title">${groupName}</div>
            <div class="dispatch-group-list">
              ${list.map((stop, idx) => renderDispatchStop(stop, groupName, idx)).join('')}
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = html;
      bindDispatchControls();
    }

    function renderDispatchStop(stop, groupName, idx) {
      const label = stop.displayLabel || stop.shopName || stop.address || '未命名';
      const driverName = stop.driverName || '';
      const orderNos = Array.isArray(stop.orderNos) ? stop.orderNos : [];

      return `
        <div class="dispatch-stop-card"
             draggable="true"
             data-group="${escapeHtml(groupName)}"
             data-index="${idx}">
          <div class="dispatch-stop-main">
            <div class="dispatch-stop-label">${escapeHtml(label)}</div>
            <div class="dispatch-stop-orders">${escapeHtml(orderNos.join(', '))}</div>
          </div>
          <div class="dispatch-stop-driver">
            <select onchange="updateStopDriver('${escapeJs(groupName)}', ${idx}, this.value)">
              <option value="">未指派</option>
              <option value="阿凱" ${driverName === '阿凱' ? 'selected' : ''}>阿凱</option>
              <option value="小王" ${driverName === '小王' ? 'selected' : ''}>小王</option>
              <option value="阿明" ${driverName === '阿明' ? 'selected' : ''}>阿明</option>
            </select>
          </div>
        </div>
      `;
    }

    function bindDispatchControls() {
      const cards = document.querySelectorAll('.dispatch-stop-card');
      cards.forEach(card => {
        card.addEventListener('dragstart', onDispatchDragStart);
        card.addEventListener('dragover', onDispatchDragOver);
        card.addEventListener('drop', onDispatchDrop);
      });
    }

    function onDispatchDragStart(e) {
      const el = e.currentTarget;
      dragSource = {
        groupName: el.dataset.group,
        index: Number(el.dataset.index)
      };
    }

    function onDispatchDragOver(e) {
      e.preventDefault();
    }

    function onDispatchDrop(e) {
      e.preventDefault();
      if (!dragSource || !dispatchBoardData) return;

      const targetEl = e.currentTarget;
      const targetGroup = targetEl.dataset.group;
      const targetIndex = Number(targetEl.dataset.index);

      if (!dispatchBoardData.groups[dragSource.groupName]) return;
      if (!dispatchBoardData.groups[targetGroup]) return;

      const sourceList = dispatchBoardData.groups[dragSource.groupName];
      const targetList = dispatchBoardData.groups[targetGroup];

      const [movedItem] = sourceList.splice(dragSource.index, 1);
      if (!movedItem) return;

      targetList.splice(targetIndex, 0, movedItem);

      renderDispatchBoard(dispatchBoardData);
      setDispatchSaveStatus('尚未儲存');
    }

    function updateStopDriver(groupName, index, driverName) {
      if (!dispatchBoardData || !dispatchBoardData.groups || !dispatchBoardData.groups[groupName]) return;
      if (!dispatchBoardData.groups[groupName][index]) return;

      dispatchBoardData.groups[groupName][index].driverName = driverName || '';
      setDispatchSaveStatus('尚未儲存');
    }

    async function saveDispatchBoard() {
      if (!dispatchBoardData || isSavingDispatch) return;

      isSavingDispatch = true;
      setDispatchSaveStatus('儲存中...');
      showDispatchLoading('儲存排車結果中...');

      const payload = {
        action: 'save_dispatch_board',
        groups: deepClone(dispatchBoardData.groups)
      };

      try {
        const resp = await fetch(GAS_WEBAPP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const text = await resp.text();
        let json = {};
        try {
          json = JSON.parse(text);
        } catch (e) {
          throw new Error(text || '儲存排車失敗');
        }

        if (!json.ok) {
          throw new Error(json.message || json.error || '儲存排車失敗');
        }

        lastSavedDispatchBoardData = deepClone(dispatchBoardData);
        setDispatchSaveStatus('已儲存，背景同步中...');

        setTimeout(() => {
          syncDispatchBoardSilently();
        }, 1800);

      } catch (err) {
        alert('儲存失敗：' + (err.message || err));

        if (lastSavedDispatchBoardData) {
          dispatchBoardData = deepClone(lastSavedDispatchBoardData);
          renderDispatchBoard(dispatchBoardData);
        }

        setDispatchSaveStatus('儲存失敗');
      } finally {
        isSavingDispatch = false;
        hideDispatchLoading();
      }
    }

    function switchDispatchPeriod(period) {
      currentPeriod = period;
      setDispatchSaveStatus('');
      loadDispatchBoard(true);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeJs(str) {
      return String(str || '')
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"')
        .replace(/\n/g, '\\n')
        .replace(/\r/g, '');
    }

    loadDispatchBoard(true);
  </script>
</body>
</html>
