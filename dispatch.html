<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAESAR 排車頁</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f5f6f8;
      color: #222;
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 12px;
    }
    .topbar {
      background: #2c3e50;
      color: #fff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 14px;
      line-height: 1.6;
      opacity: 0.95;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin: 12px 0;
    }
    .tab-btn {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #d9dde3;
      color: #333;
    }
    .tab-btn.active {
      background: #EBA13A;
      color: #fff;
    }
    .route-panel, .toolbar {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .route-title {
      font-size: 15px;
      font-weight: bold;
      color: #334155;
      margin-bottom: 10px;
    }
    .route-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .route-btn {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      background: #dbeafe;
      color: #1d4ed8;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .toolbar-right {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-save {
      background: #16a34a;
      color: #fff;
    }
    .btn-refresh {
      background: #d9dde3;
      color: #333;
    }
    .btn-sort {
      background: #c7d2fe;
      color: #3730a3;
    }
    .btn-cancel {
      background: #e5e7eb;
      color: #374151;
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .group-block {
      margin-bottom: 14px;
    }
    .group-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .group-title {
      font-size: 16px;
      font-weight: bold;
      color: #334155;
    }
    .group-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .group-count {
      font-size: 12px;
      color: #64748b;
    }
    .group-driver {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px;
      font-size: 13px;
      min-width: 110px;
      background: #fff;
    }
    .group-list {
      min-height: 60px;
      background: #eef2f7;
      border-radius: 12px;
      padding: 8px;
    }
    .row {
      background: #fff;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .row-left {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .type-box {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
      font-weight: 800;
      line-height: 1;
      background: #e5e7eb;
      color: #334155;
    }
    .type-box.alert {
      background: #fee2e2;
      color: #dc2626;
      font-size: 15px;
    }
    .row-title {
      flex: 1;
      min-width: 0;
      font-size: 16px;
      font-weight: bold;
      line-height: 1.35;
      word-break: break-word;
      color: #111827;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .order-count {
      color: #6b7280;
      font-weight: 600;
      margin-left: 4px;
    }
    .addon-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 6px;
      padding: 2px 7px;
      border-radius: 999px;
      background: #fef3c7;
      color: #92400e;
      font-size: 12px;
      font-weight: 800;
      vertical-align: 1px;
    }
    .row-right {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 8px;
    }
    .drag-handle {
      font-size: 18px;
      color: #94a3b8;
      padding: 0 4px;
      flex-shrink: 0;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    .drag-handle.disabled {
      opacity: 0.35;
      cursor: default;
    }
    .empty {
      color: #64748b;
      font-size: 13px;
      padding: 8px;
    }
    .sortable-ghost {
      opacity: 0.35;
    }
    .sortable-chosen {
      background: #eff6ff;
      border: 1px dashed #60a5fa;
    }
    .page-loading-panel {
      display: none;
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid #e5e7eb;
    }
    .page-loading-panel.show {
      display: block;
    }
    .page-loading-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 13px;
      color: #475569;
      font-weight: bold;
    }
    .page-loading-percent {
      color: #94a3b8;
      font-weight: bold;
      flex-shrink: 0;
    }
    .page-loading-bar {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: #e5e7eb;
      overflow: hidden;
    }
    .page-loading-fill {
      width: 8%;
      height: 100%;
      border-radius: 999px;
      background: #EBA13A;
      transition: width 0.25s ease;
    }
    .page-loading-note {
      margin-top: 8px;
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
    }
    .page-loading-retry {
      display: none;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      background: #d9dde3;
      color: #333;
    }
    .page-loading-retry.show {
      display: inline-block;
    }


    @media (max-width: 640px) {
      .row {
        padding: 9px 10px;
        gap: 8px;
      }
      .row-left {
        gap: 8px;
      }
      .type-box {
        width: 26px;
        height: 26px;
        font-size: 13px;
      }
      .type-box.alert {
        font-size: 14px;
      }
      .row-title {
        font-size: 15px;
      }
      .order-count {
        font-size: 13px;
      }
      .row-right {
        gap: 4px;
        margin-left: 6px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title">CAESAR 排車頁</div>
      <div class="sub" id="dispatchInfo">載入中...</div>
    </div>

    <div class="tabs">
      <button class="tab-btn" id="tabAM" onclick="switchPeriod('上午')">上午任務</button>
      <button class="tab-btn" id="tabPM" onclick="switchPeriod('下午')">下午任務</button>
    </div>

    <div class="route-panel">
      <div class="route-title">查看司機路線</div>
      <div class="route-btns" id="driverRouteButtons">
        <span style="color:#64748b;font-size:13px;">司機名單載入中...</span>
      </div>
    </div>

    <div class="toolbar">
      <div id="summaryText">讀取中...</div>
      <div class="toolbar-right">
        <button class="btn btn-sort" id="sortToggleBtn" onclick="toggleSortMode()">修改排序</button>
        <button class="btn btn-save" id="saveBtn" onclick="saveDispatchBoard()">儲存排車</button>
        <button class="btn btn-cancel" id="cancelSortBtn" onclick="cancelSortMode()" style="display:none;">取消排序</button>
        <button class="btn btn-refresh" id="refreshBtn" onclick="loadDispatchBoard()">重新整理</button>
      </div>
    </div>



    <div class="page-loading-panel" id="pageLoadingPanel">
      <div class="page-loading-row">
        <div id="pageLoadingText">正在讀取排車資料...</div>
        <div class="page-loading-percent" id="pageLoadingPercent">0%</div>
      </div>
      <div class="page-loading-bar">
        <div class="page-loading-fill" id="pageLoadingFill"></div>
      </div>
      <div class="page-loading-note" id="pageLoadingNote">請稍候，系統正在整理路線資料。</div>
      <button class="page-loading-retry" id="pageLoadingRetry" onclick="loadDispatchBoard()">重新讀取</button>
    </div>

    <div class="group-block">
      <div class="group-head">
        <div class="group-title">調度</div>
        <div class="group-meta">
          <div class="group-count" id="count-調度">0 站 / 0 張單</div>
          <select class="group-driver" id="driver-調度"></select>
        </div>
      </div>
      <div class="group-list" id="group-調度"></div>
    </div>

    <div class="group-block">
      <div class="group-head">
        <div class="group-title">市區</div>
        <div class="group-meta">
          <div class="group-count" id="count-市區">0 站 / 0 張單</div>
          <select class="group-driver" id="driver-市區"></select>
        </div>
      </div>
      <div class="group-list" id="group-市區"></div>
    </div>

    <div class="group-block">
      <div class="group-head">
        <div class="group-title">竹東</div>
        <div class="group-meta">
          <div class="group-count" id="count-竹東">0 站 / 0 張單</div>
          <select class="group-driver" id="driver-竹東"></select>
        </div>
      </div>
      <div class="group-list" id="group-竹東"></div>
    </div>

    <div class="group-block">
      <div class="group-head">
        <div class="group-title">湖口</div>
        <div class="group-meta">
          <div class="group-count" id="count-湖口">0 站 / 0 張單</div>
          <select class="group-driver" id="driver-湖口"></select>
        </div>
      </div>
      <div class="group-list" id="group-湖口"></div>
    </div>
  </div>

  <script>
    const LIFF_ID = '2009380550-ow9SlJK4';
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxmUEj7tu2ZbqZaIESXhu9oS73QdE8qOGRKmHONqHXf-H6pL3zdYxuSvssjOExQNJjlhA/exec';
    const DEFAULT_DRIVER_OPTIONS = ['莊主任','王經理','阿勇','阿凱','小老闆'];
    const GROUP_NAMES = ['調度','市區','竹東','湖口'];
    const LOCAL_KEY_PREFIX = 'caesar_dispatch_board_snapshot_';
    const RETURN_URL_KEY = 'caesar_return_url';
    const RETURN_RESTORED_KEY = 'caesar_return_restored';

    let currentPeriod = '上午';
    let currentBatchId = '';
    let dispatchBoard = null;
    let sortableRefs = [];
    let dispatchRenderToken = 0;
    let sortMode = false;
    let isSaving = false;
    let driverOptions = [...DEFAULT_DRIVER_OPTIONS];
    let pageLoadingTimer10 = null;
    let pageLoadingTimer30 = null;

    async function initPage() {
      try {
        saveCurrentPageState_();

        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          prepareLoginRedirect_();
          liff.login({ redirectUri: window.location.href });
          return;
        }

        if (restoreReturnPageIfNeeded_()) {
          return;
        }

        cleanupAuthNoise_();
        setTabs();
        showPageProgress('正在初始化排車頁...', 10, '請稍候，系統正在準備排車畫面。');
        await loadDriverOptions();
        initDriverSelects();
        renderDriverRouteButtons();
        await loadDispatchBoard();
      } catch (err) {
        updatePageProgress('排車頁載入失敗', 100, '請重新整理頁面，或稍後再試。');
        alert('排車頁載入失敗：' + (err.message || err));
      }
    }

    function saveCurrentPageState_() {
      try {
        if (window.location.search.includes('liff.state=') || window.location.search.includes('code=')) {
          return;
        }
        sessionStorage.setItem(RETURN_URL_KEY, window.location.href);
      } catch (e) {}
    }

    function prepareLoginRedirect_() {
      try {
        sessionStorage.setItem(RETURN_URL_KEY, window.location.href);
        sessionStorage.removeItem(RETURN_RESTORED_KEY);
      } catch (e) {}
    }

    function restoreReturnPageIfNeeded_() {
      try {
        const savedUrl = sessionStorage.getItem(RETURN_URL_KEY) || '';
        const restored = sessionStorage.getItem(RETURN_RESTORED_KEY) || '';

        if (!savedUrl) return false;

        const currentUrl = window.location.href;
        const savedClean = normalizeUrlForCompare_(savedUrl);
        const currentClean = normalizeUrlForCompare_(currentUrl);

        if (savedClean && currentClean && savedClean !== currentClean && restored !== '1') {
          sessionStorage.setItem(RETURN_RESTORED_KEY, '1');
          window.location.replace(savedUrl);
          return true;
        }

        sessionStorage.removeItem(RETURN_RESTORED_KEY);
        sessionStorage.removeItem(RETURN_URL_KEY);
        return false;
      } catch (e) {
        return false;
      }
    }

    function normalizeUrlForCompare_(url) {
      try {
        const u = new URL(url);
        const params = new URLSearchParams(u.search);
        params.delete('code');
        params.delete('state');
        params.delete('friendship_status_changed');
        params.delete('liffClientId');
        params.delete('liffRedirectUri');
        params.delete('access_token');
        params.delete('id_token');
        params.delete('expires_in');
        params.delete('token_type');

        const search = params.toString();
        return u.origin + u.pathname + (search ? '?' + search : '') + (u.hash || '');
      } catch (e) {
        return url;
      }
    }

    function cleanupAuthNoise_() {
      try {
        const url = new URL(window.location.href);
        const params = url.searchParams;
        const noisyKeys = ['code','state','friendship_status_changed','liffClientId','liffRedirectUri','access_token','id_token','expires_in','token_type'];
        let changed = false;
        noisyKeys.forEach(key => {
          if (params.has(key)) {
            params.delete(key);
            changed = true;
          }
        });
        if (changed) {
          const newUrl = url.origin + url.pathname + (params.toString() ? '?' + params.toString() : '') + (url.hash || '');
          window.history.replaceState({}, '', newUrl);
        }
      } catch (e) {}
    }

    async function loadDriverOptions() {
      try {
        updatePageProgress('正在讀取司機名單...', 25, '系統正在讀取 DRIVER_DB 司機資料。');
        const resp = await fetch(`${GAS_WEBAPP_URL}?action=get_driver_list&_=${Date.now()}`);
        const text = await resp.text();
        const json = JSON.parse(text);
        const drivers = json && json.data && Array.isArray(json.data.drivers) ? json.data.drivers : [];
        const names = drivers
          .map(item => typeof item === 'string' ? item : (item.name || ''))
          .map(name => String(name || '').trim())
          .filter(Boolean);

        driverOptions = names.length ? names : [...DEFAULT_DRIVER_OPTIONS];
        updatePageProgress(names.length ? '司機名單讀取完成' : '司機名單使用預設資料', 38, names.length ? '已取得 DRIVER_DB 司機名單。' : '未取得 DRIVER_DB 名單，暫用預設司機名單。');
      } catch (err) {
        console.warn('loadDriverOptions failed, use default drivers', err);
        driverOptions = [...DEFAULT_DRIVER_OPTIONS];
        updatePageProgress('司機名單讀取失敗，改用預設名單', 38, '排車頁仍可使用；請稍後檢查 DRIVER_DB 或 get_driver_list。');
      }
    }

    function initDriverSelects() {
      const renderStartedAt = Date.now();
      const token = ++dispatchRenderToken;

      GROUP_NAMES.forEach(groupName => {
        const box = document.getElementById(`group-${groupName}`);
        if (box) box.innerHTML = '<div class="empty">路線資料整理中...</div>';
      });

      GROUP_NAMES.forEach((groupName, idx) => {
        setTimeout(() => {
          if (token !== dispatchRenderToken) return;
          renderDispatchGroup_(groupName, groups);
          if (idx === GROUP_NAMES.length - 1) {
            initSortables();
            if (isPerfDebugMode()) {
              document.getElementById('summaryText').textContent = `共 ${totalStops} 站 / ${totalOrders} 張單等待排車｜Render ${Date.now() - renderStartedAt}ms`;
            }
          }
        }, idx * 20);
      });
    }

    function initSortables() {
      // v54 Android 載入優化：未進入排序模式前，不建立 Sortable 實例。
      // Android LINE WebView 對拖曳元件初始化較敏感；排車頁開頁時先只渲染清單，
      // 使用者按「修改排序」後才啟用拖曳，避免每次讀取都產生多組拖曳監聽器。
      sortableRefs.forEach(x => {
        try { x.destroy(); } catch (e) {}
      });
      sortableRefs = [];

      if (!sortMode) return;

      GROUP_NAMES.forEach(groupName => {
        const el = document.getElementById(`group-${groupName}`);
        if (!el || typeof Sortable === 'undefined') return;
        const sortable = new Sortable(el, {
          group: 'dispatch-board',
          animation: 150,
          ghostClass: 'sortable-ghost',
          chosenClass: 'sortable-chosen',
          draggable: '.row',
          handle: '.drag-handle',
          disabled: false,
          onEnd: function () {
            syncLocalBoardFromDOM();
          }
        });
        sortableRefs.push(sortable);
      });
    }

    function toggleSortMode() {
      sortMode = true;
      document.getElementById('sortToggleBtn').style.display = 'none';
      document.getElementById('cancelSortBtn').style.display = 'inline-block';
      initSortables();
      document.querySelectorAll('.drag-handle').forEach(el => el.classList.remove('disabled'));
    }

    function cancelSortMode() {
      sortMode = false;
      document.getElementById('sortToggleBtn').style.display = 'inline-block';
      document.getElementById('cancelSortBtn').style.display = 'none';
      initSortables();
      document.querySelectorAll('.drag-handle').forEach(el => el.classList.add('disabled'));

      // 取消排序時回到目前從後端讀取的 dispatchBoard，不再套用 localStorage 舊快照。
      clearLocalSnapshot(currentPeriod);
      renderDispatchBoard();
    }

    function syncLocalBoardFromDOM() {
      const snapshot = buildSnapshotFromDOM();
      saveLocalSnapshot(snapshot);
    }

    function buildSnapshotFromDOM() {
      const groups = {};

      GROUP_NAMES.forEach(groupName => {
        const box = document.getElementById(`group-${groupName}`);
        const rows = Array.from(box.querySelectorAll('.row'));
        const driverSelect = document.getElementById(`driver-${groupName}`);
        const driverName = driverSelect ? driverSelect.value : '';

        groups[groupName] = {
          driverName: driverName,
          items: rows.map(row => ({
            stopKey: row.getAttribute('data-stop-key') || '',
            taskIds: JSON.parse(decodeURIComponent(row.getAttribute('data-taskids') || '[]'))
          }))
        };
      });

      return {
        period: currentPeriod,
        groups: groups
      };
    }

    async function saveDispatchBoard() {
      if (isSaving) return;

      const groups = {
        '調度': collectGroup('調度'),
        '市區': collectGroup('市區'),
        '竹東': collectGroup('竹東'),
        '湖口': collectGroup('湖口')
      };

      const payload = {
        action: 'save_dispatch_board',
        period: currentPeriod,
        groups: groups
      };

      // v3 起不再依賴 localStorage 保存跨頁排車快照，避免清空 / 重產後畫面沿用舊位置。

      isSaving = true;
      setSavingState(true);

      try {
        const resp = await fetch(GAS_WEBAPP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const text = await resp.text();
        let json = {};
        try {
          json = JSON.parse(text);
        } catch (e) {
          alert(text || '儲存排車失敗');
          return;
        }

        if (!json.ok) {
          alert(json.message || json.error || '儲存排車失敗');
          return;
        }

        sortMode = false;
        document.getElementById('sortToggleBtn').style.display = 'inline-block';
        document.getElementById('cancelSortBtn').style.display = 'none';
        document.querySelectorAll('.drag-handle').forEach(el => el.classList.add('disabled'));
        initSortables();

        clearLocalSnapshot(currentPeriod);
        document.getElementById('summaryText').textContent = json.message || '排車已儲存';
        alert(json.message || '排車看板已儲存');
      } catch (err) {
        console.error(err);
        alert('儲存排車失敗');
      } finally {
        isSaving = false;
        setSavingState(false);
      }
    }

    function setSavingState(saving) {
      const saveBtn = document.getElementById('saveBtn');
      const refreshBtn = document.getElementById('refreshBtn');
      const sortBtn = document.getElementById('sortToggleBtn');
      const cancelBtn = document.getElementById('cancelSortBtn');

      if (saveBtn) {
        saveBtn.disabled = saving;
        saveBtn.textContent = saving ? '儲存中...' : '儲存排車';
      }
      if (refreshBtn) refreshBtn.disabled = saving;
      if (sortBtn) sortBtn.disabled = saving;
      if (cancelBtn) cancelBtn.disabled = saving;
    }

    function collectGroup(groupName) {
      const box = document.getElementById(`group-${groupName}`);
      const rows = Array.from(box.querySelectorAll('.row'));
      const driverSelect = document.getElementById(`driver-${groupName}`);
      const driverName = driverSelect ? driverSelect.value : '';

      return rows.map((row, index) => {
        const taskIds = JSON.parse(decodeURIComponent(row.getAttribute('data-taskids') || '[]'));
        return {
          stopKey: row.getAttribute('data-stop-key') || '',
          taskIds: taskIds,
          driverName: driverName,
          displayOrder: index + 1
        };
      });
    }

    function getOrderCount(item) {
      if (Array.isArray(item.orderNos) && item.orderNos.length) return item.orderNos.length;
      if (Array.isArray(item.taskIds) && item.taskIds.length) return item.taskIds.length;
      return 1;
    }


    function getRouteShortName(groupName) {
      switch (String(groupName || '').trim()) {
        case '調度': return '調';
        case '市區': return '市';
        case '竹東': return '東';
        case '湖口': return '湖';
        default: return String(groupName || '').trim();
      }
    }

    function isStoreStop(item) {      const deliveryType = String(item.deliveryType || '').trim();
      if (deliveryType === '送店') return true;
      const address = String(item.address || '').trim();
      return !address || address === '送店';
    }

    function getMainLabel(item) {
      const address = String(item.address || '').trim();
      const shopName = String(item.shopName || '').trim();
      return isStoreStop(item) ? (shopName || address || '未填店家') : (address || shopName || '未填地址');
    }

    function openDriverRoute(driverName) {
      const finalDriver = driverName || '';
      const target = `driver.html?driver=${encodeURIComponent(finalDriver)}&period=${encodeURIComponent(currentPeriod)}`;
      window.open(target, '_blank');
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showPageProgress(text, percent, note) {
      const panel = document.getElementById('pageLoadingPanel');
      if (!panel) return;
      panel.classList.add('show');
      updatePageProgress(text || '正在讀取資料...', percent || 8, note || '請稍候。');
      clearPageProgressTimers();
      pageLoadingTimer10 = setTimeout(() => {
        updatePageProgress('資料較多，系統仍在整理中...', 88, '請不要關閉頁面，系統仍在讀取排車資料。');
      }, 10000);
      pageLoadingTimer30 = setTimeout(() => {
        const retry = document.getElementById('pageLoadingRetry');
        if (retry) retry.classList.add('show');
        updatePageProgress('系統仍在讀取中', 92, '若等待過久，可按「重新讀取」。');
      }, 30000);
    }

    function updatePageProgress(text, percent, note) {
      const p = Math.max(0, Math.min(100, Number(percent || 0)));
      const textEl = document.getElementById('pageLoadingText');
      const percentEl = document.getElementById('pageLoadingPercent');
      const fillEl = document.getElementById('pageLoadingFill');
      const noteEl = document.getElementById('pageLoadingNote');
      const retryEl = document.getElementById('pageLoadingRetry');
      if (textEl) textEl.textContent = text || '正在讀取資料...';
      if (percentEl) percentEl.textContent = `${Math.round(p)}%`;
      if (fillEl) fillEl.style.width = `${p}%`;
      if (noteEl) noteEl.textContent = note || '';
      if (retryEl && p < 100) retryEl.classList.remove('show');
    }

    function completePageProgress(text) {
      clearPageProgressTimers();
      updatePageProgress(text || '載入完成', 100, '資料已更新。');
      setTimeout(() => {
        const panel = document.getElementById('pageLoadingPanel');
        const retry = document.getElementById('pageLoadingRetry');
        if (panel) panel.classList.remove('show');
        if (retry) retry.classList.remove('show');
      }, 450);
    }

    function clearPageProgressTimers() {
      if (pageLoadingTimer10) clearTimeout(pageLoadingTimer10);
      if (pageLoadingTimer30) clearTimeout(pageLoadingTimer30);
      pageLoadingTimer10 = null;
      pageLoadingTimer30 = null;
    }

    document.addEventListener('change', function(e) {
      const targetId = e.target && e.target.id ? e.target.id : '';
      if (GROUP_NAMES.some(name => targetId === `driver-${name}`)) {
        syncLocalBoardFromDOM();
      }
    });

    initPage();
  </script>
</body>
</html>
