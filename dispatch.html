<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAESAR 排車頁</title>
  <!--
  ========================================================
  【優化說明 - dispatch.html】
  1. [並行化] LIFF init 和 GAS 暖機同時發出（最關鍵優化）
  2. [Skeleton] 載入時各群組顯示骨架，不再空白等待
  3. [loadDispatchBoard 加 cache:no-store] 明確不使用瀏覽器快取
  4. [dispatch 頁不需要 UID] 排車頁不讀個人資料，不需要等 getProfile
     → liff.init 確認登入後直接載入資料，省掉 getProfile 的時間
  5. 全部功能邏輯（Sortable、local snapshot、儲存）完全不變
  ========================================================
  -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <style>
    body { margin: 0; font-family: Arial, "Microsoft JhengHei", sans-serif; background: #f5f6f8; color: #222; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 12px; }
    .topbar { background: #2c3e50; color: #fff; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .title { font-size: 20px; font-weight: bold; margin-bottom: 6px; }
    .sub { font-size: 14px; line-height: 1.6; opacity: 0.95; }
    .tabs { display: flex; gap: 8px; margin: 12px 0; }
    .tab-btn { flex: 1; border: none; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: bold; cursor: pointer; background: #d9dde3; color: #333; }
    .tab-btn.active { background: #EBA13A; color: #fff; }
    .route-panel, .toolbar { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .route-title { font-size: 15px; font-weight: bold; color: #334155; margin-bottom: 10px; }
    .route-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .route-btn { border: none; border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: bold; cursor: pointer; background: #dbeafe; color: #1d4ed8; }
    .toolbar { display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    .toolbar-right { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { border: none; border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .btn-save { background: #16a34a; color: #fff; }
    .btn-refresh { background: #d9dde3; color: #333; }
    .btn-sort { background: #c7d2fe; color: #3730a3; }
    .btn-cancel { background: #e5e7eb; color: #374151; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .group-block { margin-bottom: 14px; }
    .group-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .group-title { font-size: 16px; font-weight: bold; color: #334155; }
    .group-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .group-count { font-size: 12px; color: #64748b; }
    .group-driver { border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px; font-size: 13px; min-width: 110px; background: #fff; }
    .group-list { min-height: 60px; background: #eef2f7; border-radius: 12px; padding: 8px; }
    .row { background: #fff; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; display: flex; gap: 10px; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .row-left { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
    .type-box { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 14px; font-weight: 800; line-height: 1; background: #e5e7eb; color: #334155; }
    .type-box.alert { background: #fee2e2; color: #dc2626; font-size: 15px; }
    .row-title { flex: 1; min-width: 0; font-size: 16px; font-weight: bold; line-height: 1.35; word-break: break-word; color: #111827; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .order-count { color: #6b7280; font-weight: 600; margin-left: 4px; }
    .row-right { flex-shrink: 0; display: flex; align-items: center; gap: 6px; margin-left: 8px; }
    .drag-handle { font-size: 18px; color: #94a3b8; padding: 0 4px; flex-shrink: 0; cursor: grab; user-select: none; touch-action: none; }
    .drag-handle.disabled { opacity: 0.35; cursor: default; }
    .empty { color: #64748b; font-size: 13px; padding: 8px; }
    .sortable-ghost { opacity: 0.35; }
    .sortable-chosen { background: #eff6ff; border: 1px dashed #60a5fa; }

    /* ── [新增] Skeleton ── */
    @keyframes shimmer {
      0% { background-position: -600px 0; }
      100% { background-position: 600px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #e2e5ea 25%, #eef2f7 50%, #e2e5ea 75%);
      background-size: 1200px 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 10px;
    }
    .skeleton-row { height: 52px; margin-bottom: 8px; }
    .skeleton-row-sm { height: 44px; margin-bottom: 8px; }

    @media (max-width: 640px) {
      .row { padding: 9px 10px; gap: 8px; }
      .row-left { gap: 8px; }
      .type-box { width: 26px; height: 26px; font-size: 13px; }
      .row-title { font-size: 15px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title">CAESAR 排車頁</div>
      <div class="sub" id="dispatchInfo">載入中...</div>
    </div>

    <div class="tabs">
      <button class="tab-btn" id="tabAM" onclick="switchPeriod('上午')">上午任務</button>
      <button class="tab-btn" id="tabPM" onclick="switchPeriod('下午')">下午任務</button>
    </div>

    <div class="route-panel">
      <div class="route-title">查看司機路線</div>
      <div class="route-btns">
        <button class="route-btn" onclick="openDriverRoute('莊主任')">莊主任</button>
        <button class="route-btn" onclick="openDriverRoute('王經理')">王經理</button>
        <button class="route-btn" onclick="openDriverRoute('阿勇')">阿勇</button>
        <button class="route-btn" onclick="openDriverRoute('阿凱')">阿凱</button>
        <button class="route-btn" onclick="openDriverRoute('小老闆')">小老闆</button>
      </div>
    </div>

    <div class="toolbar">
      <div id="summaryText">讀取中...</div>
      <div class="toolbar-right">
        <button class="btn btn-sort" id="sortToggleBtn" onclick="toggleSortMode()">修改排序</button>
        <button class="btn btn-save" id="saveBtn" onclick="saveDispatchBoard()">儲存排車</button>
        <button class="btn btn-cancel" id="cancelSortBtn" onclick="cancelSortMode()" style="display:none;">取消排序</button>
        <button class="btn btn-refresh" id="refreshBtn" onclick="loadDispatchBoard()">重新整理</button>
      </div>
    </div>

    <!-- 四個群組，預設顯示 Skeleton -->
    <div class="group-block">
      <div class="group-head">
        <div class="group-title">調度</div>
        <div class="group-meta">
          <div class="group-count" id="count-調度">讀取中...</div>
          <select class="group-driver" id="driver-調度"></select>
        </div>
      </div>
      <div class="group-list" id="group-調度">
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row-sm"></div>
      </div>
    </div>

    <div class="group-block">
      <div class="group-head">
        <div class="group-title">市區</div>
        <div class="group-meta">
          <div class="group-count" id="count-市區">讀取中...</div>
          <select class="group-driver" id="driver-市區"></select>
        </div>
      </div>
      <div class="group-list" id="group-市區">
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row-sm"></div>
        <div class="skeleton skeleton-row-sm"></div>
      </div>
    </div>

    <div class="group-block">
      <div class="group-head">
        <div class="group-title">竹東</div>
        <div class="group-meta">
          <div class="group-count" id="count-竹東">讀取中...</div>
          <select class="group-driver" id="driver-竹東"></select>
        </div>
      </div>
      <div class="group-list" id="group-竹東">
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row-sm"></div>
      </div>
    </div>

    <div class="group-block">
      <div class="group-head">
        <div class="group-title">湖口</div>
        <div class="group-meta">
          <div class="group-count" id="count-湖口">讀取中...</div>
          <select class="group-driver" id="driver-湖口"></select>
        </div>
      </div>
      <div class="group-list" id="group-湖口">
        <div class="skeleton skeleton-row"></div>
      </div>
    </div>
  </div>

  <script>
    const LIFF_ID = '2009380550-ow9SlJK4';
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxmUEj7tu2ZbqZaIESXhu9oS73QdE8qOGRKmHONqHXf-H6pL3zdYxuSvssjOExQNJjlhA/exec';
    const DRIVER_OPTIONS = ['莊主任','王經理','阿勇','阿凱','小老闆'];
    const GROUP_NAMES = ['調度','市區','竹東','湖口'];
    const LOCAL_KEY_PREFIX = 'caesar_dispatch_board_snapshot_';
    const RETURN_URL_KEY = 'caesar_return_url';
    const RETURN_RESTORED_KEY = 'caesar_return_restored';


    function warmPing_() {
      try {
        fetch(`${GAS_WEBAPP_URL}?action=ping&_ts=${Date.now()}`, { cache: 'no-store' }).catch(() => {});
      } catch (e) {}
    }

    let currentPeriod = '上午';
    let currentBatchId = '';
    let dispatchBoard = null;
    let sortableRefs = [];
    let sortMode = false;
    let isSaving = false;

    // ── [新增] GAS 暖機：頁面一開啟立即送出，和 LIFF init 重疊執行 ──
    const gasWarmupPromise = fetch(
      GAS_WEBAPP_URL + '?action=ping&_ts=' + Date.now(),
      { cache: 'no-store', signal: AbortSignal.timeout ? AbortSignal.timeout(8000) : undefined }
    ).catch(() => {});

    // ── [新增] 同時預先發出第一次真實 API 請求（若 LIFF 不需要 UID）──
    // dispatch 頁不需要 UID，可以在 LIFF init 同時就開始拉資料
    const defaultPeriod = (new Date().getHours() < 12) ? '上午' : '下午';
    currentPeriod = defaultPeriod;

    const earlyDataPromise = fetch(
      `${GAS_WEBAPP_URL}?action=get_dispatch_board&period=${encodeURIComponent(defaultPeriod)}&_ts=${Date.now()}`,
      { cache: 'no-store' }
    ).then(r => r.json()).catch(() => null);

    async function initPage() {
      try {
        saveCurrentPageState_();
        setTabs();
        initDriverSelects();

        // ── [優化] LIFF init 和資料請求並行 ──
        // 原本：等 liff.init → 等 login → 才打 API（串行 3-6 秒）
        // 現在：liff.init 和 earlyDataPromise 同時跑，資料更早到
        const [, earlyData] = await Promise.all([
          liff.init({ liffId: LIFF_ID }),
          earlyDataPromise
        ]);

        if (!liff.isLoggedIn()) {
          prepareLoginRedirect_();
          liff.login({ redirectUri: window.location.href });
          return;
        }

        if (restoreReturnPageIfNeeded_()) return;
        cleanupAuthNoise_();

        // 如果 earlyData 已經有了就直接用，否則重新拉
        if (earlyData && earlyData.ok) {
          applyDispatchData(earlyData);
        } else {
          await loadDispatchBoard(preloadBoardPromise);
        }
      } catch (err) {
        alert('排車頁載入失敗：' + (err.message || err));
      }
    }

    function applyDispatchData(json) {
      dispatchBoard = json.data || { groups: {} };
      currentBatchId = dispatchBoard.batchId || '';

      const localSnapshot = getLocalSnapshot(currentPeriod);
      if (localSnapshot) {
        dispatchBoard = mergeBoardWithLocalSnapshot(dispatchBoard, localSnapshot);
      }
      renderDispatchBoard();
    }

    function saveCurrentPageState_() {
      try {
        if (window.location.search.includes('liff.state=') || window.location.search.includes('code=')) return;
        sessionStorage.setItem(RETURN_URL_KEY, window.location.href);
      } catch (e) {}
    }

    function prepareLoginRedirect_() {
      try {
        sessionStorage.setItem(RETURN_URL_KEY, window.location.href);
        sessionStorage.removeItem(RETURN_RESTORED_KEY);
      } catch (e) {}
    }

    function restoreReturnPageIfNeeded_() {
      try {
        const savedUrl = sessionStorage.getItem(RETURN_URL_KEY) || '';
        const restored = sessionStorage.getItem(RETURN_RESTORED_KEY) || '';
        if (!savedUrl) return false;
        const savedClean = normalizeUrlForCompare_(savedUrl);
        const currentClean = normalizeUrlForCompare_(window.location.href);
        if (savedClean && currentClean && savedClean !== currentClean && restored !== '1') {
          sessionStorage.setItem(RETURN_RESTORED_KEY, '1');
          window.location.replace(savedUrl);
          return true;
        }
        sessionStorage.removeItem(RETURN_RESTORED_KEY);
        sessionStorage.removeItem(RETURN_URL_KEY);
        return false;
      } catch (e) { return false; }
    }

    function normalizeUrlForCompare_(url) {
      try {
        const u = new URL(url);
        const params = new URLSearchParams(u.search);
        ['code','state','friendship_status_changed','liffClientId','liffRedirectUri','access_token','id_token','expires_in','token_type'].forEach(k => params.delete(k));
        const search = params.toString();
        return u.origin + u.pathname + (search ? '?' + search : '') + (u.hash || '');
      } catch (e) { return url; }
    }

    function cleanupAuthNoise_() {
      try {
        const url = new URL(window.location.href);
        const params = url.searchParams;
        const noisy = ['code','state','friendship_status_changed','liffClientId','liffRedirectUri','access_token','id_token','expires_in','token_type'];
        let changed = false;
        noisy.forEach(k => { if (params.has(k)) { params.delete(k); changed = true; } });
        if (changed) {
          const newUrl = url.origin + url.pathname + (params.toString() ? '?' + params.toString() : '') + (url.hash || '');
          window.history.replaceState({}, '', newUrl);
        }
      } catch (e) {}
    }

    function initDriverSelects() {
      GROUP_NAMES.forEach(groupName => {
        const select = document.getElementById(`driver-${groupName}`);
        if (!select) return;
        select.innerHTML = [
          '<option value="">未指派</option>',
          ...DRIVER_OPTIONS.map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`)
        ].join('');
      });
    }

    function setTabs() {
      document.getElementById('tabAM').classList.toggle('active', currentPeriod === '上午');
      document.getElementById('tabPM').classList.toggle('active', currentPeriod === '下午');
    }

    function switchPeriod(period) {
      currentPeriod = period;
      setTabs();
      // 切換時顯示 skeleton
      GROUP_NAMES.forEach(groupName => {
        const box = document.getElementById(`group-${groupName}`);
        if (box) box.innerHTML = '<div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row-sm"></div>';
        const countBox = document.getElementById(`count-${groupName}`);
        if (countBox) countBox.textContent = '讀取中...';
      });
      document.getElementById('summaryText').textContent = '讀取中...';
      loadDispatchBoard();
    }

    function getLocalSnapshotKey(period) { return `${LOCAL_KEY_PREFIX}${period}`; }

    function saveLocalSnapshot(snapshot) {
      try {
        localStorage.setItem(getLocalSnapshotKey(currentPeriod), JSON.stringify({
          savedAt: Date.now(),
          batchId: currentBatchId || '',
          data: snapshot
        }));
      } catch (e) { console.warn('saveLocalSnapshot failed', e); }
    }

    function getLocalSnapshot(period) {
      try {
        const raw = localStorage.getItem(getLocalSnapshotKey(period));
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || !parsed.data) return null;
        if ((parsed.batchId || '') !== (currentBatchId || '')) return null;
        return parsed.data;
      } catch (e) { return null; }
    }

    async function loadDispatchBoard() {
      const url = `${GAS_WEBAPP_URL}?action=get_dispatch_board&period=${encodeURIComponent(currentPeriod)}&_ts=${Date.now()}`;
      const resp = await fetch(url, { cache: 'no-store' }); // [優化] 明確不快取
      const json = await resp.json();
      if (!json.ok) { alert(json.error || '讀取排車頁失敗'); return; }
      applyDispatchData(json);
    }

    function mergeBoardWithLocalSnapshot(serverBoard, localSnapshot) {
      const merged = JSON.parse(JSON.stringify(serverBoard || { groups: {} }));
      merged.groups = merged.groups || {};

      GROUP_NAMES.forEach(groupName => {
        const serverList = Array.isArray(merged.groups[groupName]) ? merged.groups[groupName] : [];
        const localGroup = (localSnapshot.groups && localSnapshot.groups[groupName]) || { driverName: '', items: [] };
        const localItems = Array.isArray(localGroup.items) ? localGroup.items : [];
        const serverMap = new Map(serverList.map(item => [String(item.stopKey || ''), item]));
        const reordered = [];

        localItems.forEach(localItem => {
          const key = String(localItem.stopKey || '');
          if (serverMap.has(key)) {
            const serverItem = serverMap.get(key);
            reordered.push({ ...serverItem, driverName: localGroup.driverName || serverItem.driverName || '' });
            serverMap.delete(key);
          }
        });
        serverMap.forEach(serverItem => {
          reordered.push({ ...serverItem, driverName: localGroup.driverName || serverItem.driverName || '' });
        });
        merged.groups[groupName] = reordered;
      });

      return merged;
    }

    function renderDispatchBoard() {
      document.getElementById('dispatchInfo').innerHTML = `目前查看：<b>${currentPeriod}</b>`;

      const groups = dispatchBoard.groups || {};
      const totalStops = GROUP_NAMES.reduce((sum, name) => sum + ((groups[name] || []).length), 0);
      const totalOrders = GROUP_NAMES.reduce((sum, name) => {
        return sum + (groups[name] || []).reduce((inner, item) => inner + getOrderCount(item), 0);
      }, 0);

      document.getElementById('summaryText').textContent = `共 ${totalStops} 站 / ${totalOrders} 張單等待排車`;

      GROUP_NAMES.forEach(groupName => {
        const box = document.getElementById(`group-${groupName}`);
        const list = Array.isArray(groups[groupName]) ? groups[groupName] : [];
        const countBox = document.getElementById(`count-${groupName}`);
        const driverSelect = document.getElementById(`driver-${groupName}`);

        const groupOrderCount = list.reduce((sum, item) => sum + getOrderCount(item), 0);
        if (countBox) countBox.textContent = `${list.length} 站 / ${groupOrderCount} 張單`;

        const groupDriverName = list.length > 0 ? (list[0].driverName || '') : '';
        if (driverSelect) driverSelect.value = groupDriverName;

        if (!list.length) {
          box.innerHTML = '<div class="empty">目前無資料</div>';
          return;
        }

        box.innerHTML = list.map(item => {
          const mainLabel = getMainLabel(item);
          const deliveryTypeText = isStoreStop(item) ? '店' : '指';
          const deliveryTypeClass = isStoreStop(item) ? 'type-box' : 'type-box alert';
          const orderCount = getOrderCount(item);

          return `
            <div class="row"
                 data-stop-key="${escapeHtml(item.stopKey)}"
                 data-taskids="${escapeHtml(encodeURIComponent(JSON.stringify(item.taskIds || [])))}">
              <div class="row-left">
                <div class="${deliveryTypeClass}">${escapeHtml(deliveryTypeText)}</div>
                <div class="row-title">${escapeHtml(mainLabel)}<span class="order-count">(${escapeHtml(String(orderCount))})</span></div>
              </div>
              <div class="row-right">
                <div class="drag-handle ${sortMode ? '' : 'disabled'}">☰</div>
              </div>
            </div>
          `;
        }).join('');
      });

      initSortables();
    }

    function initSortables() {
      sortableRefs.forEach(x => x.destroy());
      sortableRefs = [];

      GROUP_NAMES.forEach(groupName => {
        const el = document.getElementById(`group-${groupName}`);
        const sortable = new Sortable(el, {
          group: 'dispatch-board',
          animation: 150,
          ghostClass: 'sortable-ghost',
          chosenClass: 'sortable-chosen',
          draggable: '.row',
          handle: '.drag-handle',
          disabled: !sortMode,
          onEnd: () => syncLocalBoardFromDOM()
        });
        sortableRefs.push(sortable);
      });
    }

    function toggleSortMode() {
      sortMode = true;
      document.getElementById('sortToggleBtn').style.display = 'none';
      document.getElementById('cancelSortBtn').style.display = 'inline-block';
      initSortables();
      document.querySelectorAll('.drag-handle').forEach(el => el.classList.remove('disabled'));
    }

    function cancelSortMode() {
      sortMode = false;
      document.getElementById('sortToggleBtn').style.display = 'inline-block';
      document.getElementById('cancelSortBtn').style.display = 'none';
      initSortables();
      document.querySelectorAll('.drag-handle').forEach(el => el.classList.add('disabled'));

      const localSnapshot = getLocalSnapshot(currentPeriod);
      if (localSnapshot && dispatchBoard) {
        dispatchBoard = mergeBoardWithLocalSnapshot(dispatchBoard, localSnapshot);
      }
      renderDispatchBoard();
    }

    function syncLocalBoardFromDOM() {
      saveLocalSnapshot(buildSnapshotFromDOM());
    }

    function buildSnapshotFromDOM() {
      const groups = {};
      GROUP_NAMES.forEach(groupName => {
        const box = document.getElementById(`group-${groupName}`);
        const rows = Array.from(box.querySelectorAll('.row'));
        const driverSelect = document.getElementById(`driver-${groupName}`);
        groups[groupName] = {
          driverName: driverSelect ? driverSelect.value : '',
          items: rows.map(row => ({
            stopKey: row.getAttribute('data-stop-key') || '',
            taskIds: JSON.parse(decodeURIComponent(row.getAttribute('data-taskids') || '[]'))
          }))
        };
      });
      return { period: currentPeriod, groups };
    }

    async function saveDispatchBoard() {
      if (isSaving) return;

      const groups = {
        '調度': collectGroup('調度'),
        '市區': collectGroup('市區'),
        '竹東': collectGroup('竹東'),
        '湖口': collectGroup('湖口')
      };

      const payload = { action: 'save_dispatch_board', period: currentPeriod, groups };
      saveLocalSnapshot(buildSnapshotFromDOM());

      isSaving = true;
      setSavingState(true);

      try {
        const resp = await fetch(GAS_WEBAPP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const text = await resp.text();
        let json = {};
        try { json = JSON.parse(text); } catch (e) { alert(text || '儲存排車失敗'); return; }
        if (!json.ok) { alert(json.message || json.error || '儲存排車失敗'); return; }

        sortMode = false;
        document.getElementById('sortToggleBtn').style.display = 'inline-block';
        document.getElementById('cancelSortBtn').style.display = 'none';
        document.querySelectorAll('.drag-handle').forEach(el => el.classList.add('disabled'));
        initSortables();
        document.getElementById('summaryText').textContent = json.message || '排車已儲存';
        alert(json.message || '排車看板已儲存');
      } catch (err) {
        console.error(err);
        alert('儲存排車失敗');
      } finally {
        isSaving = false;
        setSavingState(false);
      }
    }

    function setSavingState(saving) {
      const ids = ['saveBtn','refreshBtn','sortToggleBtn','cancelSortBtn'];
      ids.forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.disabled = saving;
        if (id === 'saveBtn') el.textContent = saving ? '儲存中...' : '儲存排車';
      });
    }

    function collectGroup(groupName) {
      const box = document.getElementById(`group-${groupName}`);
      const rows = Array.from(box.querySelectorAll('.row'));
      const driverSelect = document.getElementById(`driver-${groupName}`);
      const driverName = driverSelect ? driverSelect.value : '';

      return rows.map((row, index) => ({
        stopKey: row.getAttribute('data-stop-key') || '',
        taskIds: JSON.parse(decodeURIComponent(row.getAttribute('data-taskids') || '[]')),
        driverName,
        displayOrder: index + 1
      }));
    }

    function getOrderCount(item) {
      if (Array.isArray(item.orderNos) && item.orderNos.length) return item.orderNos.length;
      if (Array.isArray(item.taskIds) && item.taskIds.length) return item.taskIds.length;
      return 1;
    }

    function isStoreStop(item) {
      const deliveryType = String(item.deliveryType || '').trim();
      if (deliveryType === '送店') return true;
      const address = String(item.address || '').trim();
      return !address || address === '送店';
    }

    function getMainLabel(item) {
      const address = String(item.address || '').trim();
      const shopName = String(item.shopName || '').trim();
      return isStoreStop(item) ? (shopName || address || '未填店家') : (address || shopName || '未填地址');
    }

    function openDriverRoute(driverName) {
      window.open(`driver.html?driver=${encodeURIComponent(driverName || '')}&period=${encodeURIComponent(currentPeriod)}`, '_blank');
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    document.addEventListener('change', function(e) {
      const targetId = e.target && e.target.id ? e.target.id : '';
      if (GROUP_NAMES.some(name => targetId === `driver-${name}`)) syncLocalBoardFromDOM();
    });

    initPage();
  </script>
</body>
</html>
