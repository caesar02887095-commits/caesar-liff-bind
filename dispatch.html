<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAESAR 排車頁</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <style>
    body { margin:0; font-family: Arial, "Microsoft JhengHei", sans-serif; background:#f5f6f8; color:#222; }
    .wrap { max-width: 760px; margin:0 auto; padding:12px; }
    .topbar { background:#2c3e50; color:#fff; border-radius:14px; padding:14px; margin-bottom:12px; }
    .title { font-size:20px; font-weight:bold; margin-bottom:6px; }
    .sub { font-size:14px; line-height:1.6; opacity:0.95; }
    .tabs { display:flex; gap:8px; margin:12px 0; }
    .tab-btn { flex:1; border:none; border-radius:10px; padding:12px; font-size:15px; font-weight:bold; cursor:pointer; background:#d9dde3; }
    .tab-btn.active { background:#EBA13A; color:#fff; }
    .toolbar { display:flex; gap:8px; justify-content:space-between; align-items:center; background:#fff; padding:12px; border-radius:12px; margin-bottom:12px; }
    .toolbar-right { display:flex; gap:8px; flex-wrap:wrap; }
    .btn { border:none; border-radius:10px; padding:10px 14px; font-size:14px; font-weight:bold; cursor:pointer; }
    .btn-save { background:#16a34a; color:#fff; }
    .btn-refresh { background:#d9dde3; color:#333; }
    .group-block { margin-bottom:14px; }
    .group-title { font-size:16px; font-weight:bold; margin-bottom:8px; color:#334155; }
    .group-list { min-height:60px; background:#eef2f7; border-radius:12px; padding:8px; }
    .row { background:#fff; border-radius:12px; padding:10px 12px; margin-bottom:8px; display:flex; gap:10px; align-items:center; box-shadow:0 2px 8px rgba(0,0,0,0.05); }
    .row-left { flex:1; min-width:0; }
    .row-title { font-size:15px; font-weight:bold; line-height:1.4; word-break:break-word; }
    .row-sub { font-size:12px; color:#6b7280; line-height:1.5; margin-top:4px; }
    .row-right { display:flex; gap:8px; align-items:center; flex-shrink:0; }
    .driver-select { border:1px solid #cbd5e1; border-radius:8px; padding:8px; font-size:13px; }
    .route-btn { background:#dbeafe; color:#1d4ed8; }
    .drag-handle { font-size:18px; color:#94a3b8; padding:0 4px; }
    .empty { color:#64748b; font-size:13px; padding:8px; }
    .sortable-ghost { opacity:0.35; }
    .sortable-chosen { background:#eff6ff; border:1px dashed #60a5fa; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title">CAESAR 排車頁</div>
      <div class="sub" id="dispatchInfo">載入中...</div>
    </div>

    <div class="tabs">
      <button class="tab-btn" id="tabAM" onclick="switchPeriod('上午')">上午任務</button>
      <button class="tab-btn" id="tabPM" onclick="switchPeriod('下午')">下午任務</button>
    </div>

    <div class="toolbar">
      <div id="summaryText">讀取中...</div>
      <div class="toolbar-right">
        <button class="btn btn-save" onclick="saveDispatchBoard()">儲存排車</button>
        <button class="btn btn-refresh" onclick="loadDispatchBoard()">重新整理</button>
      </div>
    </div>

    <div class="group-block">
      <div class="group-title">調度</div>
      <div class="group-list" id="group-調度"></div>
    </div>
    <div class="group-block">
      <div class="group-title">市區</div>
      <div class="group-list" id="group-市區"></div>
    </div>
    <div class="group-block">
      <div class="group-title">竹東</div>
      <div class="group-list" id="group-竹東"></div>
    </div>
    <div class="group-block">
      <div class="group-title">湖口</div>
      <div class="group-list" id="group-湖口"></div>
    </div>
  </div>

  <script>
    const LIFF_ID = '2009380550-ow9SlJK4';
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxmUEj7tu2ZbqZaIESXhu9oS73QdE8qOGRKmHONqHXf-H6pL3zdYxuSvssjOExQNJjlhA/exec';
    const DRIVER_OPTIONS = ['莊主任','王經理','阿勇','阿凱','小老闆'];

    let currentPeriod = '上午';
    let dispatchBoard = null;
    let sortableRefs = [];

    async function initPage() {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      setTabs();
      await loadDispatchBoard();
    }

    function setTabs() {
      document.getElementById('tabAM').classList.toggle('active', currentPeriod === '上午');
      document.getElementById('tabPM').classList.toggle('active', currentPeriod === '下午');
    }

    function switchPeriod(period) {
      currentPeriod = period;
      setTabs();
      loadDispatchBoard();
    }

    async function loadDispatchBoard() {
      const url = `${GAS_WEBAPP_URL}?action=get_dispatch_board&period=${encodeURIComponent(currentPeriod)}`;
      const resp = await fetch(url);
      const json = await resp.json();
      if (!json.ok) {
        alert(json.error || '讀取排車頁失敗');
        return;
      }

      dispatchBoard = json.data;
      renderDispatchBoard();
    }

    function renderDispatchBoard() {
      document.getElementById('dispatchInfo').innerHTML =
        `目前查看：<b>${currentPeriod}</b>`;

      const groups = dispatchBoard.groups || {};
      const totalStops = ['調度','市區','竹東','湖口']
        .reduce((sum, name) => sum + ((groups[name] || []).length), 0);
      document.getElementById('summaryText').textContent = `共 ${totalStops} 站待排車`;

      ['調度','市區','竹東','湖口'].forEach(groupName => {
        const box = document.getElementById(`group-${groupName}`);
        const list = Array.isArray(groups[groupName]) ? groups[groupName] : [];

        if (!list.length) {
          box.innerHTML = '<div class="empty">目前無資料</div>';
          return;
        }

        box.innerHTML = list.map(item => {
          const optionHtml = DRIVER_OPTIONS.map(name => {
            const selected = item.driverName === name ? 'selected' : '';
            return `<option value="${escapeHtml(name)}" ${selected}>${escapeHtml(name)}</option>`;
          }).join('');

          return `
            <div class="row" data-stop-key="${escapeHtml(item.stopKey)}" data-taskids="${escapeHtml(encodeURIComponent(JSON.stringify(item.taskIds)))}">
              <div class="row-left">
                <div class="row-title">${escapeHtml(item.displayLabel || '')}</div>
                <div class="row-sub">${escapeHtml(item.deliveryType || '')} / ${escapeHtml(item.orderNos.join(', '))}</div>
              </div>
              <div class="row-right">
                <select class="driver-select">
                  <option value="">未指派</option>
                  ${optionHtml}
                </select>
                <button class="btn route-btn" onclick="openDriverRoute('${escapeJs(item.driverName || '')}')">查看路線</button>
                <div class="drag-handle">☰</div>
              </div>
            </div>
          `;
        }).join('');
      });

      initSortables();
    }

    function initSortables() {
      sortableRefs.forEach(x => x.destroy());
      sortableRefs = [];

      ['調度','市區','竹東','湖口'].forEach(groupName => {
        const el = document.getElementById(`group-${groupName}`);
        const sortable = new Sortable(el, {
          group: 'dispatch-board',
          animation: 150,
          ghostClass: 'sortable-ghost',
          chosenClass: 'sortable-chosen',
          draggable: '.row'
        });
        sortableRefs.push(sortable);
      });
    }

    async function saveDispatchBoard() {
      const groups = {
        '調度': collectGroup('調度'),
        '市區': collectGroup('市區'),
        '竹東': collectGroup('竹東'),
        '湖口': collectGroup('湖口')
      };

      const payload = {
        action: 'save_dispatch_board',
        period: currentPeriod,
        groups: groups
      };

      const resp = await fetch(GAS_WEBAPP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });

      const text = await resp.text();
      let json = {};
      try {
        json = JSON.parse(text);
      } catch (e) {
        alert(text || '儲存排車失敗');
        return;
      }

      if (!json.ok) {
        alert(json.message || json.error || '儲存排車失敗');
        return;
      }

      alert('排車看板已儲存');
      loadDispatchBoard();
    }

    function collectGroup(groupName) {
      const box = document.getElementById(`group-${groupName}`);
      const rows = Array.from(box.querySelectorAll('.row'));

      return rows.map(row => {
        const taskIds = JSON.parse(decodeURIComponent(row.getAttribute('data-taskids') || '[]'));
        const driverName = row.querySelector('.driver-select') ? row.querySelector('.driver-select').value : '';

        return {
          stopKey: row.getAttribute('data-stop-key') || '',
          taskIds: taskIds,
          driverName: driverName
        };
      });
    }

    function openDriverRoute(driverName) {
      const finalDriver = driverName || '';
      const target = `driver.html?driver=${encodeURIComponent(finalDriver)}&period=${encodeURIComponent(currentPeriod)}`;
      window.open(target, '_blank');
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeJs(str) {
      return String(str || '')
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"')
        .replace(/\n/g, '\\n')
        .replace(/\r/g, '');
    }

    initPage();
  </script>
</body>
</html>
