<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CAESAR 排車頁</title>
  <!-- v60.3：快捷分類按鈕手機/電腦皆四等分滿版，並改為低飽和溫和配色 -->
  <!-- v63：新增第五條路線「機動」；快捷分類按鈕維持市區 / 竹東 / 湖口 / 其他；請假系統暫緩 -->
  <!-- v65：儲存排車按鈕主動作強化；未儲存時更醒目，已儲存時降低干擾 -->
  <!-- v72：調度快捷分類改為排序模式才顯示；新增「返回上一步」可回退最近一次排序 / 分類操作 -->
  <!-- v72.1：返回上一步最多保留 5 步，並改為修改排序期間左側浮動按鈕 -->
  <!-- v72.2：左側返回鍵下移，並降低手機連點觸發放大的機率 -->
  <!-- v72.3：排車頁全頁套用防連點放大，避免連續點擊返回或操作按鈕時觸發縮放 -->
  <!-- v72.4：移除攔截連續 touchend 的點擊節流，保留不限制連點速度的防縮放設定 -->
  <!-- v75.25：調度快捷分類按鈕加入觸覺回饋與按下視覺回饋，提升修改排序時的按鍵確認感 -->
  <!-- v75.26：快捷分類後移入目標路線的站點加入上滑出現動畫，避免看起來像閃現 -->
  <!-- v75.28：排車頁工具列改為下滑時固定在上方，方便長頁面操作修改排序與儲存排車 -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <style>
    html {
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }
    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f5f6f8;
      color: #222;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    body, button, a, .card, .route-box, .task-card, .quick-route-btn, .route-column, .route-list {
      touch-action: manipulation;
    }
    button, .btn, .quick-route-btn, .undo-floating-btn, .drag-handle {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 12px;
    }
    .topbar {
      background: #2c3e50;
      color: #fff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 16px;
      line-height: 1.65;
      opacity: 0.95;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin: 12px 0;
    }
    .tab-btn {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #d9dde3;
      color: #333;
    }
    .tab-btn.active {
      background: #EBA13A;
      color: #fff;
    }
    .route-panel, .toolbar {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .route-title {
      font-size: 17px;
      font-weight: bold;
      color: #334155;
      margin-bottom: 10px;
    }
    .route-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .route-btn {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #dbeafe;
      color: #1d4ed8;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      position: sticky;
      top: 8px;
      z-index: 45;
      border: 1px solid rgba(226, 232, 240, 0.95);
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.10);
    }

    .sticky-dispatch-actions {
      position: sticky;
      top: 8px;
      z-index: 45;
      margin-bottom: 12px;
      background: #fff;
      border: 1px solid rgba(226, 232, 240, 0.95);
      border-radius: 12px;
      padding: 10px 12px 8px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.10);
    }
    .sticky-dispatch-actions .toolbar {
      position: static;
      top: auto;
      z-index: auto;
      margin-bottom: 6px;
      padding: 0;
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
    }
    .route-jump-panel {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 3px 0 0;
      box-shadow: none;
      overflow: hidden;
      border-top: 1px solid rgba(226, 232, 240, 0.75);
    }
    .route-jump-row {
      display: flex;
      flex-wrap: nowrap;
      gap: 0;
      width: 100%;
      min-width: 0;
      align-items: stretch;
    }
    .route-jump-btn {
      flex: 1 1 0;
      min-width: 0;
      border: none;
      border-radius: 0;
      padding: 8px 2px 7px;
      background: transparent;
      color: #475569;
      font-size: 15px;
      font-weight: 900;
      line-height: 1.2;
      white-space: nowrap;
      text-align: center;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      border-bottom: 2px solid transparent;
      transition: transform 0.12s ease, color 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }
    .route-jump-btn:active,
    .route-jump-btn.tap-active {
      transform: translateY(1px);
      color: #92400e;
      border-bottom-color: #dcab00;
      background: rgba(220, 171, 0, 0.08);
    }
    .toolbar-right {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    .btn-save {
      background: #16a34a;
      color: #fff;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }
    .btn-save.unsaved-active {
      background: #15803d;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.18), 0 6px 14px rgba(21, 128, 61, 0.22);
      transform: translateY(-1px);
    }
    .btn-save.clean-state {
      background: #e5f7ec;
      color: #166534;
      box-shadow: none;
    }
    .btn-refresh {
      background: #d9dde3;
      color: #333;
    }
    .btn-sort {
      background: #c7d2fe;
      color: #3730a3;
    }
    .btn-cancel {
      background: #e5e7eb;
      color: #374151;
    }
    .btn-undo {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
    }
    .floating-undo-wrap {
      display: none;
      position: fixed;
      left: max(8px, calc((100vw - 760px) / 2 + 8px));
      top: 68vh;
      z-index: 50;
      pointer-events: none;
    }
    .floating-undo-wrap.show {
      display: block;
    }
    .floating-undo-wrap .btn-undo {
      pointer-events: auto;
      width: 64px;
      min-height: 74px;
      padding: 10px 6px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 900;
      line-height: 1.25;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.16);
      writing-mode: horizontal-tb;
      white-space: normal;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .floating-undo-wrap .btn-undo:disabled {
      background: #f1f5f9;
      color: #94a3b8;
      border-color: #e2e8f0;
      box-shadow: none;
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .unsaved-notice {
      display: none;
      margin: -2px 0 12px;
      background: #fffbeb;
      border: 1px solid #f59e0b;
      color: #92400e;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.55;
    }
    .unsaved-notice.show {
      display: block;
    }
    .save-status-panel {
      display: none;
      position: fixed;
      left: 14px;
      right: 14px;
      bottom: calc(18px + env(safe-area-inset-bottom));
      z-index: 80;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 12px 34px rgba(15, 23, 42, 0.18);
      padding: 14px 14px 13px;
      max-width: 560px;
      margin: 0 auto;
    }
    .save-status-panel.show {
      display: block;
    }
    .save-status-title {
      font-size: 17px;
      font-weight: 950;
      color: #0f172a;
      line-height: 1.35;
    }
    .save-status-note {
      margin-top: 4px;
      font-size: 14px;
      font-weight: 800;
      color: #64748b;
      line-height: 1.5;
    }
    .save-progress-bar {
      height: 9px;
      border-radius: 999px;
      overflow: hidden;
      background: #e2e8f0;
      margin-top: 11px;
    }
    .save-progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #f59e0b, #d97706);
      transition: width 0.22s ease;
    }
    .save-status-panel.error {
      border-color: #fecaca;
      background: #fffafa;
    }
    .save-status-panel.error .save-status-title {
      color: #991b1b;
    }
    .save-status-panel.error .save-progress-fill {
      width: 100%;
      background: #ef4444;
    }
    .save-status-panel.success {
      border-color: #bbf7d0;
      background: #f7fef9;
    }
    .save-status-panel.success .save-status-title {
      color: #166534;
    }
    .save-status-panel.success .save-progress-fill {
      width: 100%;
      background: #22c55e;
    }
    .save-retry-btn {
      display: none;
      width: 100%;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      padding: 13px 12px;
      background: #991b1b;
      color: #ffffff;
      font-size: 17px;
      font-weight: 950;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .save-status-panel.error .save-retry-btn {
      display: block;
    }
    .quick-route-actions {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
      margin-top: 10px;
    }
    .quick-route-btn {
      border: 1px solid #dbe4ef;
      border-radius: 12px;
      padding: 12px 6px;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      color: #334155;
      white-space: nowrap;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.08s ease;
    }
    .quick-route-btn.city {
      background: #eef6ff;
      border-color: #bfdbfe;
      color: #1e3a8a;
    }
    .quick-route-btn.east {
      background: #f0fdf4;
      border-color: #bbf7d0;
      color: #166534;
    }
    .quick-route-btn.lake {
      background: #fff7ed;
      border-color: #fed7aa;
      color: #9a3412;
    }
    .quick-route-btn.other {
      background: #f8fafc;
      border-color: #cbd5e1;
      color: #475569;
    }
    .quick-route-btn:hover {
      filter: brightness(0.985);
    }
    .quick-route-btn:active,
    .quick-route-btn.tap-active {
      transform: scale(0.96);
      box-shadow: inset 0 2px 5px rgba(15, 23, 42, 0.16);
      filter: brightness(0.97);
    }

    .row.route-move-enter {
      animation: routeMoveEnterUpStrong 0.72s cubic-bezier(0.16, 1, 0.3, 1) both;
      transform-origin: center bottom;
      will-change: transform, opacity, box-shadow, background-color;
      border: 2px solid rgba(220, 171, 0, 0.70);
    }
    @keyframes routeMoveEnterUpStrong {
      0% {
        opacity: 0.05;
        transform: translateY(72px) scale(0.965);
        background: #fffbeb;
        box-shadow: 0 20px 34px rgba(15, 23, 42, 0.18);
      }
      55% {
        opacity: 1;
        transform: translateY(-8px) scale(1.012);
        background: #fffbeb;
        box-shadow: 0 10px 18px rgba(15, 23, 42, 0.10);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        background: #fff;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      }
    }

    .row.dispatch-shift-enter {
      animation: dispatchShiftEnterUp 0.52s cubic-bezier(0.16, 1, 0.3, 1) both;
      will-change: transform, background-color, box-shadow;
    }
    @keyframes dispatchShiftEnterUp {
      0% {
        transform: translateY(78px);
        background: #fff8db;
        box-shadow: 0 14px 26px rgba(15, 23, 42, 0.14);
      }
      52% {
        transform: translateY(-5px);
        background: #fff8db;
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.10);
      }
      100% {
        transform: translateY(0);
        background: #fff;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      }
    }


    .group-list.route-target-pulse {
      animation: routeTargetPulseStrong 1.35s ease-out both;
      border-color: rgba(220, 171, 0, 0.85);
    }
    @keyframes routeTargetPulseStrong {
      0% {
        background: #fff7d6;
        box-shadow: 0 0 0 0 rgba(220, 171, 0, 0.45), 0 12px 28px rgba(15, 23, 42, 0.16);
        transform: translateY(8px);
      }
      22% {
        background: #fff7d6;
        box-shadow: 0 0 0 6px rgba(220, 171, 0, 0.20), 0 10px 24px rgba(15, 23, 42, 0.12);
        transform: translateY(0);
      }
      100% {
        background: #fff;
        box-shadow: none;
        transform: translateY(0);
      }
    }

    .route-move-toast {
      position: fixed;
      left: 50%;
      bottom: 86px;
      transform: translate(-50%, 34px);
      z-index: 80;
      min-width: 168px;
      max-width: calc(100vw - 48px);
      padding: 12px 18px;
      border-radius: 999px;
      background: #111827;
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      text-align: center;
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.24);
      opacity: 0;
      pointer-events: none;
    }
    .route-move-toast.show {
      animation: routeToastSlideUp 1.15s ease-out both;
    }
    @keyframes routeToastSlideUp {
      0% { opacity: 0; transform: translate(-50%, 38px); }
      18% { opacity: 1; transform: translate(-50%, 0); }
      76% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -18px); }
    }

    .group-block {
      margin-bottom: 14px;
    }
    .group-block {
      scroll-margin-top: 150px;
    }
    .group-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .group-title {
      font-size: 19px;
      font-weight: 900;
      color: #334155;
    }
    .group-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .group-count {
      font-size: 15px;
      color: #64748b;
      font-weight: 800;
    }
    .group-driver {
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px;
      font-size: 16px;
      min-width: 132px;
      background: #fff;
    }
    .group-list {
      min-height: 60px;
      background: #eef2f7;
      border-radius: 12px;
      padding: 8px;
    }
    .row {
      background: #fff;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .row-main {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }
    .row-left {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .type-box {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
      font-weight: 800;
      line-height: 1;
      background: #e5e7eb;
      color: #334155;
    }
    .type-box.alert {
      background: #fee2e2;
      color: #dc2626;
      font-size: 15px;
    }
    .row-title {
      flex: 1;
      min-width: 0;
      font-size: 19px;
      font-weight: 900;
      line-height: 1.4;
      word-break: break-word;
      color: #111827;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .order-count {
      color: #6b7280;
      font-weight: 600;
      margin-left: 4px;
    }
    .addon-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 6px;
      padding: 2px 7px;
      border-radius: 999px;
      background: #fef3c7;
      color: #92400e;
      font-size: 12px;
      font-weight: 800;
      vertical-align: 1px;
    }
    .row-right {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 8px;
    }
    .drag-handle {
      font-size: 22px;
      color: #94a3b8;
      padding: 0 4px;
      flex-shrink: 0;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    .drag-handle.disabled {
      opacity: 0.35;
      cursor: default;
    }
    .empty {
      color: #64748b;
      font-size: 15px;
      padding: 10px;
    }
    .sortable-ghost {
      opacity: 0.35;
    }
    .sortable-chosen {
      background: #eff6ff;
      border: 1px dashed #60a5fa;
    }
    .page-loading-panel {
      display: none;
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid #e5e7eb;
    }
    .page-loading-panel.show {
      display: block;
    }
    .page-loading-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 13px;
      color: #475569;
      font-weight: bold;
    }
    .page-loading-percent {
      color: #94a3b8;
      font-weight: bold;
      flex-shrink: 0;
    }
    .page-loading-bar {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: #e5e7eb;
      overflow: hidden;
    }
    .page-loading-fill {
      width: 8%;
      height: 100%;
      border-radius: 999px;
      background: #EBA13A;
      transition: width 0.25s ease;
    }
    .page-loading-note {
      margin-top: 8px;
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
    }
    .page-loading-retry {
      display: none;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      background: #d9dde3;
      color: #333;
    }
    .page-loading-retry.show {
      display: inline-block;
    }


    @media (max-width: 640px) {
      .row {
        padding: 11px 10px;
      }
      .row-main {
        gap: 8px;
      }
      .row-left {
        gap: 8px;
      }
      .type-box {
        width: 30px;
        height: 30px;
        font-size: 15px;
      }
      .type-box.alert {
        font-size: 14px;
      }
      .row-title {
        font-size: 18px;
      }
      .order-count {
        font-size: 15px;
      }
      .row-right {
        gap: 4px;
        margin-left: 6px;
      }
      .quick-route-actions {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        width: 100%;
      }
      .quick-route-btn {
        padding: 5px 4px;
        min-height: 32px;
        font-size: 17px;
        letter-spacing: 0.12em;
      }
    }
    @media (max-width: 520px) {

      .sticky-dispatch-actions {
        top: 6px;
        padding: 8px 8px 6px;
      }
      .sticky-dispatch-actions .toolbar {
        margin-bottom: 6px;
      }
      .route-jump-panel {
        padding: 2px 0 0;
      }
      .route-jump-row {
        gap: 0;
      }

</head>
<body>

  <script>
    const LIFF_ID = '2009380550-ow9SlJK4';
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxmUEj7tu2ZbqZaIESXhu9oS73QdE8qOGRKmHONqHXf-H6pL3zdYxuSvssjOExQNJjlhA/exec';
    const DEFAULT_DRIVER_OPTIONS = ['莊主任','王經理','阿勇','阿凱','小老闆'];
    const GROUP_NAMES = ['調度','市區','竹東','湖口','其他','機動'];
    const QUICK_ROUTE_GROUPS = ['市區','竹東','湖口','其他'];
    const LOCAL_KEY_PREFIX = 'caesar_dispatch_board_snapshot_';
    const RETURN_URL_KEY = 'caesar_return_url';
    const RETURN_RESTORED_KEY = 'caesar_return_restored';
    const SORT_UNDO_LIMIT = 5;

    let currentPeriod = getDefaultPeriod();
    let currentBatchId = '';
    let dispatchBoard = null;
    let lastLoadedDispatchBoard = null;
    let sortableRefs = [];
    let sortMode = false;
    let isSaving = false;
    let hasUnsavedChanges = false;
    let lastSavePayload = null;
    let saveProgressTimer = null;
    let sortUndoStack = [];
    let sortInitialSnapshot = null;
    let beforeDragSnapshot = null;
    let pendingRouteMoveAnimationStopKey = '';
    let pendingRouteMoveTargetGroup = '';
    let pendingDispatchShiftAnimationStopKey = '';
    let routeMoveToastTimer = null;
    let driverOptions = [...DEFAULT_DRIVER_OPTIONS];
    let pageLoadingTimer10 = null;
    let pageLoadingTimer30 = null;


    function getDefaultPeriod() {
      const now = new Date();
      return now.getHours() < 12 ? '上午' : '下午';
    }

    async function initPage() {
      try {
        saveCurrentPageState_();

        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          prepareLoginRedirect_();
          liff.login({ redirectUri: window.location.href });
          return;
        }

        if (restoreReturnPageIfNeeded_()) {
          return;
        }

        cleanupAuthNoise_();
        setTabs();
        showPageProgress('正在初始化排車頁...', 10, '請稍候，系統正在準備排車畫面。');
        await loadDriverOptions();
        initDriverSelects();
        renderDriverRouteButtons();
        await loadDispatchBoard();
      } catch (err) {
        updatePageProgress('排車頁載入失敗', 100, '請重新整理頁面，或稍後再試。');
        alert('排車頁載入失敗：' + (err.message || err));
      }
    }

    function saveCurrentPageState_() {
      try {
        if (window.location.search.includes('liff.state=') || window.location.search.includes('code=')) {
          return;
        }
        sessionStorage.setItem(RETURN_URL_KEY, window.location.href);
      } catch (e) {}
    }

    function prepareLoginRedirect_() {
      try {
        sessionStorage.setItem(RETURN_URL_KEY, window.location.href);
        sessionStorage.removeItem(RETURN_RESTORED_KEY);
      } catch (e) {}
    }

    function restoreReturnPageIfNeeded_() {
      try {
        const savedUrl = sessionStorage.getItem(RETURN_URL_KEY) || '';
        const restored = sessionStorage.getItem(RETURN_RESTORED_KEY) || '';

        if (!savedUrl) return false;

        const currentUrl = window.location.href;
        const savedClean = normalizeUrlForCompare_(savedUrl);
        const currentClean = normalizeUrlForCompare_(currentUrl);

        if (savedClean && currentClean && savedClean !== currentClean && restored !== '1') {
          sessionStorage.setItem(RETURN_RESTORED_KEY, '1');
          window.location.replace(savedUrl);
          return true;
        }

        sessionStorage.removeItem(RETURN_RESTORED_KEY);
        sessionStorage.removeItem(RETURN_URL_KEY);
        return false;
      } catch (e) {
        return false;
      }
    }

    function normalizeUrlForCompare_(url) {
      try {
        const u = new URL(url);
        const params = new URLSearchParams(u.search);
        params.delete('code');
        params.delete('state');
        params.delete('friendship_status_changed');
        params.delete('liffClientId');
        params.delete('liffRedirectUri');
        params.delete('access_token');
        params.delete('id_token');
        params.delete('expires_in');
        params.delete('token_type');

        const search = params.toString();
        return u.origin + u.pathname + (search ? '?' + search : '') + (u.hash || '');
      } catch (e) {
        return url;
      }
    }

    function cleanupAuthNoise_() {
      try {
        const url = new URL(window.location.href);
        const params = url.searchParams;
        const noisyKeys = ['code','state','friendship_status_changed','liffClientId','liffRedirectUri','access_token','id_token','expires_in','token_type'];
        let changed = false;
        noisyKeys.forEach(key => {
          if (params.has(key)) {
            params.delete(key);
            changed = true;
          }
        });
        if (changed) {
          const newUrl = url.origin + url.pathname + (params.toString() ? '?' + params.toString() : '') + (url.hash || '');
          window.history.replaceState({}, '', newUrl);
        }
      } catch (e) {}
    }

    async function loadDriverOptions() {
      try {
        updatePageProgress('正在讀取司機名單...', 25, '系統正在讀取 DRIVER_DB 司機資料。');
        const resp = await fetch(`${GAS_WEBAPP_URL}?action=get_driver_list&_=${Date.now()}`);
        const text = await resp.text();
        const json = JSON.parse(text);
        const drivers = json && json.data && Array.isArray(json.data.drivers) ? json.data.drivers : [];
        const names = drivers
          .map(item => typeof item === 'string' ? item : (item.name || ''))
          .map(name => String(name || '').trim())
          .filter(Boolean);

        driverOptions = names.length ? names : [...DEFAULT_DRIVER_OPTIONS];
        updatePageProgress(names.length ? '司機名單讀取完成' : '司機名單使用預設資料', 38, names.length ? '已取得 DRIVER_DB 司機名單。' : '未取得 DRIVER_DB 名單，暫用預設司機名單。');
      } catch (err) {
        console.warn('loadDriverOptions failed, use default drivers', err);
        driverOptions = [...DEFAULT_DRIVER_OPTIONS];
        updatePageProgress('司機名單讀取失敗，改用預設名單', 38, '排車頁仍可使用；請稍後檢查 DRIVER_DB 或 get_driver_list。');
      }
    }

    function initDriverSelects() {
      GROUP_NAMES.forEach(groupName => {
        const select = document.getElementById(`driver-${groupName}`);
        if (!select) return;
        select.innerHTML = [
          '<option value="">未指派</option>',
          ...driverOptions.map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`)
        ].join('');
        select.onchange = function() {
          markUnsavedChanges();
          syncLocalBoardFromDOM();
        };
      });
    }

    function renderDriverRouteButtons() {
      const box = document.getElementById('driverRouteButtons');
      if (!box) return;
      const names = driverOptions && driverOptions.length ? driverOptions : DEFAULT_DRIVER_OPTIONS;
      box.innerHTML = names.map(name => {
        return `<button class="route-btn" data-driver="${escapeHtml(name)}" onclick="openDriverRoute(this.getAttribute('data-driver'))">${escapeHtml(name)}</button>`;
      }).join('');
    }

    function ensureDriverOption(select, driverName) {
      const name = String(driverName || '').trim();
      if (!select || !name) return;
      const exists = Array.from(select.options).some(opt => opt.value === name);
      if (!exists) {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name + '（目前工作）';
        select.appendChild(option);
      }
    }

    function setTabs() {
      document.getElementById('tabAM').classList.toggle('active', currentPeriod === '上午');
      document.getElementById('tabPM').classList.toggle('active', currentPeriod === '下午');
    }

    function switchPeriod(period) {
      currentPeriod = period;
      sortMode = false;
      resetSortUndoState_();
      setTabs();
      loadDispatchBoard();
    }

    function getLocalSnapshotKey(period) {
      return `${LOCAL_KEY_PREFIX}${period}`;
    }

    function saveLocalSnapshot(snapshot) {
      try {
        localStorage.setItem(getLocalSnapshotKey(currentPeriod), JSON.stringify({
          savedAt: Date.now(),
          batchId: currentBatchId || '',
          data: snapshot
        }));
      } catch (e) {
        console.warn('saveLocalSnapshot failed', e);
      }
    }

    function getLocalSnapshot(period) {
      try {
        const raw = localStorage.getItem(getLocalSnapshotKey(period));
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || !parsed.data) return null;
        if ((parsed.batchId || '') !== (currentBatchId || '')) return null;
        return parsed.data;
      } catch (e) {
        console.warn('getLocalSnapshot failed', e);
        return null;
      }
    }

    function clearLocalSnapshot(period) {
      try {
        localStorage.removeItem(getLocalSnapshotKey(period));
      } catch (e) {
        console.warn('clearLocalSnapshot failed', e);
      }
    }

    async function loadDispatchBoard() {
      showPageProgress('正在讀取排車資料...', 45, '系統正在讀取每日工作與目前排車資料。');
      try {
        const url = `${GAS_WEBAPP_URL}?action=get_dispatch_board&period=${encodeURIComponent(currentPeriod)}`;
        const resp = await fetch(url, { cache: 'no-store' });
        const json = await resp.json();

        if (!json.ok) {
          alert(json.error || '讀取排車頁失敗');
          updatePageProgress('排車資料讀取失敗', 100, json.error || '請稍後重新讀取。');
          return;
        }

        updatePageProgress('正在整理路線順序...', 78, '系統正在整理路線群組、司機與站點順序。');
        dispatchBoard = normalizeDispatchBoardGroups_(json.data || { groups: {} });
        currentBatchId = dispatchBoard.batchId || '';
        lastLoadedDispatchBoard = cloneDispatchBoard_(dispatchBoard);
        hasUnsavedChanges = false;
        resetSortUndoState_();
        updateUnsavedNotice();

        // 2026-05-14 v3 修正：不再於開頁時套用 localStorage 排車快照。
        // 原本快照機制會在「清空任務 / 重新產生任務」後，仍把舊的拖拉位置覆蓋回畫面，
        // 造成後端已回到預設調度，但前端看起來還停在上一次人工排車位置。
        // 目前排車頁以後端「每日任務看板」為唯一畫面來源；拖拉中的畫面狀態保留在當前 DOM 即可。
        clearLocalSnapshot(currentPeriod);

        renderDispatchBoard();
        completePageProgress('排車資料載入完成');
      } catch (err) {
        console.error(err);
        updatePageProgress('排車資料讀取失敗', 100, '請確認網路狀態後重新讀取。');
        alert('讀取排車頁失敗：' + (err.message || err));
      }
    }

    function mergeBoardWithLocalSnapshot(serverBoard, localSnapshot) {
      const merged = JSON.parse(JSON.stringify(serverBoard || { groups: {} }));
      merged.groups = merged.groups || {};

      GROUP_NAMES.forEach(groupName => {
        const serverList = Array.isArray(merged.groups[groupName]) ? merged.groups[groupName] : [];
        const localGroup = localSnapshot.groups && localSnapshot.groups[groupName]
          ? localSnapshot.groups[groupName]
          : { driverName: '', items: [] };

        const localItems = Array.isArray(localGroup.items) ? localGroup.items : [];
        const serverMap = new Map(serverList.map(item => [String(item.stopKey || ''), item]));
        const reordered = [];

        localItems.forEach(localItem => {
          const key = String(localItem.stopKey || '');
          if (serverMap.has(key)) {
            const serverItem = serverMap.get(key);
            reordered.push({
              ...serverItem,
              driverName: localGroup.driverName || serverItem.driverName || ''
            });
            serverMap.delete(key);
          }
        });

        serverMap.forEach(serverItem => {
          reordered.push({
            ...serverItem,
            driverName: localGroup.driverName || serverItem.driverName || ''
          });
        });

        merged.groups[groupName] = reordered;
      });

      return merged;
    }

    function renderDispatchBoard() {
      document.getElementById('dispatchInfo').innerHTML = `目前查看：<b>${currentPeriod}</b>`;

      const groups = dispatchBoard.groups || {};
      const totalStops = GROUP_NAMES.reduce((sum, name) => sum + ((groups[name] || []).length), 0);
      const totalOrders = GROUP_NAMES.reduce((sum, name) => {
        return sum + (groups[name] || []).reduce((inner, item) => inner + getOrderCount(item), 0);
      }, 0);

      document.getElementById('summaryText').textContent = `共 ${totalStops} 站 / ${totalOrders} 張單等待排車`;

      GROUP_NAMES.forEach(groupName => {
        const box = document.getElementById(`group-${groupName}`);
        if (box && box.classList) {
          box.classList.toggle('route-target-pulse', String(groupName) === String(pendingRouteMoveTargetGroup || ''));
        }
        const list = Array.isArray(groups[groupName]) ? groups[groupName] : [];
        const countBox = document.getElementById(`count-${groupName}`);
        const driverSelect = document.getElementById(`driver-${groupName}`);

        const groupOrderCount = list.reduce((sum, item) => sum + getOrderCount(item), 0);
        if (countBox) {
          countBox.textContent = `${list.length} 站 / ${groupOrderCount} 張單`;
        }

        const groupDriverName = list.length > 0 ? (list[0].driverName || '') : '';
        if (driverSelect) {
          ensureDriverOption(driverSelect, groupDriverName);
          driverSelect.value = groupDriverName;
        }

        if (!list.length) {
          box.innerHTML = '<div class="empty">目前無資料</div>';
          return;
        }

        box.innerHTML = list.map(item => {
          const mainLabel = getMainLabel(item);
          const deliveryTypeText = isStoreStop(item) ? '店' : '指';
          const deliveryTypeClass = isStoreStop(item) ? 'type-box' : 'type-box alert';
          const orderCount = getOrderCount(item);
          const addonBadge = item.isManualAdd ? '<span class="addon-badge">加單</span>' : '';
          const quickActions = (sortMode && groupName === '調度') ? renderQuickRouteActions(item) : '';
          const stopKeyText = String(item.stopKey || '');
          const rowEnterClass = stopKeyText === pendingRouteMoveAnimationStopKey ? ' route-move-enter' : '';
          const dispatchShiftClass = (groupName === '調度' && stopKeyText === pendingDispatchShiftAnimationStopKey) ? ' dispatch-shift-enter' : '';

          return `
            <div class="row${rowEnterClass}${dispatchShiftClass}"
                 data-stop-key="${escapeHtml(item.stopKey)}"
                 data-taskids="${escapeHtml(encodeURIComponent(JSON.stringify(item.taskIds || [])))}">
              <div class="row-main">
                <div class="row-left">
                  <div class="${deliveryTypeClass}">${escapeHtml(deliveryTypeText)}</div>
                  <div class="row-title">${escapeHtml(mainLabel)}<span class="order-count">(${escapeHtml(String(orderCount))})</span>${addonBadge}</div>
                </div>
                <div class="row-right">
                  <div class="drag-handle ${sortMode ? '' : 'disabled'}">☰</div>
                </div>
              </div>
              ${quickActions}
            </div>
          `;
        }).join('');
      });

      if (pendingRouteMoveAnimationStopKey || pendingRouteMoveTargetGroup || pendingDispatchShiftAnimationStopKey) {
        const animatedKey = pendingRouteMoveAnimationStopKey;
        const animatedGroup = pendingRouteMoveTargetGroup;
        const shiftedKey = pendingDispatchShiftAnimationStopKey;
        window.setTimeout(function () {
          if (animatedKey) {
            const movedRow = document.querySelector(`.row.route-move-enter[data-stop-key="${cssEscape_(animatedKey)}"]`);
            if (movedRow) movedRow.classList.remove('route-move-enter');
            if (pendingRouteMoveAnimationStopKey === animatedKey) pendingRouteMoveAnimationStopKey = '';
          }
          if (animatedGroup) {
            const targetBox = document.getElementById(`group-${animatedGroup}`);
            if (targetBox) targetBox.classList.remove('route-target-pulse');
            if (pendingRouteMoveTargetGroup === animatedGroup) pendingRouteMoveTargetGroup = '';
          }
          if (shiftedKey) {
            const shiftedRow = document.querySelector(`.row.dispatch-shift-enter[data-stop-key="${cssEscape_(shiftedKey)}"]`);
            if (shiftedRow) shiftedRow.classList.remove('dispatch-shift-enter');
            if (pendingDispatchShiftAnimationStopKey === shiftedKey) pendingDispatchShiftAnimationStopKey = '';
          }
        }, 1380);
      }

      initSortables();
    }


    function renderQuickRouteActions(item) {
      const stopKey = String(item && item.stopKey ? item.stopKey : '');
      if (!stopKey) return '';
      return `
        <div class="quick-route-actions" aria-label="快捷分類">
          ${QUICK_ROUTE_GROUPS.map(groupName => `
            <button type="button" class="quick-route-btn ${getQuickRouteButtonClass_(groupName)}" data-target-group="${escapeHtml(groupName)}" data-stop-key="${escapeHtml(stopKey)}" onclick="moveStopToGroup(this.getAttribute('data-stop-key'), this.getAttribute('data-target-group'), this)">${escapeHtml(groupName)}</button>
          `).join('')}
        </div>
      `;
    }

    function getQuickRouteButtonClass_(groupName) {
      switch (String(groupName || '')) {
        case '市區': return 'city';
        case '竹東': return 'east';
        case '湖口': return 'lake';
        case '其他': return 'other';
        default: return '';
      }
    }

    function normalizeDispatchBoardGroups_(board) {
      const normalized = board || { groups: {} };
      normalized.groups = normalized.groups || {};
      GROUP_NAMES.forEach(groupName => {
        if (!Array.isArray(normalized.groups[groupName])) normalized.groups[groupName] = [];
      });
      return normalized;
    }

    function cloneDispatchBoard_(board) {
      return JSON.parse(JSON.stringify(normalizeDispatchBoardGroups_(board || { groups: {} })));
    }

    function markUnsavedChanges() {
      hasUnsavedChanges = true;
      updateUnsavedNotice();
    }

    function clearUnsavedChanges() {
      hasUnsavedChanges = false;
      updateUnsavedNotice();
    }


    function resetSortUndoState_() {
      sortUndoStack = [];
      sortInitialSnapshot = null;
      beforeDragSnapshot = null;
      updateSortActionButtons_();
    }

    function cloneSnapshot_(snapshot) {
      return JSON.parse(JSON.stringify(snapshot || { period: currentPeriod, groups: {} }));
    }

    function snapshotSignature_(snapshot) {
      const safe = snapshot || { groups: {} };
      const groups = {};
      GROUP_NAMES.forEach(groupName => {
        const group = safe.groups && safe.groups[groupName] ? safe.groups[groupName] : { driverName: '', items: [] };
        groups[groupName] = {
          driverName: String(group.driverName || ''),
          items: (Array.isArray(group.items) ? group.items : []).map(item => ({
            stopKey: String(item.stopKey || ''),
            taskIds: Array.isArray(item.taskIds) ? item.taskIds.map(x => String(x)) : []
          }))
        };
      });
      return JSON.stringify({ period: safe.period || currentPeriod, groups });
    }

    function pushSortUndoState_(snapshot) {
      if (!sortMode) return;
      const cloned = cloneSnapshot_(snapshot || buildSnapshotFromDOM());
      const nextSignature = snapshotSignature_(cloned);
      const last = sortUndoStack.length ? sortUndoStack[sortUndoStack.length - 1] : null;
      if (last && snapshotSignature_(last) === nextSignature) return;
      sortUndoStack.push(cloned);
      if (sortUndoStack.length > SORT_UNDO_LIMIT) sortUndoStack.shift();
      updateSortActionButtons_();
    }

    function updateSortActionButtons_() {
      const sortBtn = document.getElementById('sortToggleBtn');
      const cancelBtn = document.getElementById('cancelSortBtn');
      const undoBtn = document.getElementById('undoSortBtn');
      const undoFloating = document.getElementById('undoSortFloating');

      if (sortBtn) sortBtn.style.display = sortMode ? 'none' : 'inline-block';
      if (cancelBtn) cancelBtn.style.display = sortMode ? 'inline-block' : 'none';
      if (undoFloating) undoFloating.classList.toggle('show', !!sortMode);
      if (undoBtn) {
        undoBtn.disabled = isSaving || sortUndoStack.length === 0;
        undoBtn.innerHTML = sortUndoStack.length > 0 ? '返回<br>上一步' : '無<br>上一步';
        undoBtn.title = `最多保留最近 ${SORT_UNDO_LIMIT} 步，目前可返回 ${sortUndoStack.length} 步`;
      }
    }

    function applySnapshotToBoard_(snapshot) {
      const safeSnapshot = cloneSnapshot_(snapshot);
      const itemMap = new Map();

      [lastLoadedDispatchBoard, dispatchBoard].forEach(board => {
        const normalized = normalizeDispatchBoardGroups_(board || { groups: {} });
        GROUP_NAMES.forEach(groupName => {
          (normalized.groups[groupName] || []).forEach(item => {
            const key = String(item && item.stopKey ? item.stopKey : '');
            if (key) itemMap.set(key, { ...item });
          });
        });
      });

      const nextBoard = { ...(dispatchBoard || {}), groups: {} };
      GROUP_NAMES.forEach(groupName => {
        const group = safeSnapshot.groups && safeSnapshot.groups[groupName]
          ? safeSnapshot.groups[groupName]
          : { driverName: '', items: [] };
        const driverName = String(group.driverName || '');
        const items = Array.isArray(group.items) ? group.items : [];
        nextBoard.groups[groupName] = items.map(snapshotItem => {
          const key = String(snapshotItem.stopKey || '');
          const source = itemMap.get(key) || { stopKey: key, taskIds: snapshotItem.taskIds || [] };
          return {
            ...source,
            stopKey: key,
            taskIds: Array.isArray(snapshotItem.taskIds) ? snapshotItem.taskIds : (source.taskIds || []),
            routeGroup: groupName,
            driverName: driverName || source.driverName || ''
          };
        });
      });

      dispatchBoard = normalizeDispatchBoardGroups_(nextBoard);
    }

    function updateUnsavedAfterUndo_() {
      const current = buildSnapshotFromDOM();
      if (sortInitialSnapshot && snapshotSignature_(current) === snapshotSignature_(sortInitialSnapshot)) {
        clearLocalSnapshot(currentPeriod);
        clearUnsavedChanges();
      } else {
        saveLocalSnapshot(current);
        markUnsavedChanges();
      }
    }

    function undoLastSortStep() {
      if (!sortMode || isSaving || !sortUndoStack.length) return;
      const previous = sortUndoStack.pop();
      applySnapshotToBoard_(previous);
      renderDispatchBoard();
      updateUnsavedAfterUndo_();
      updateSortActionButtons_();
    }

    function updateUnsavedNotice() {
      const notice = document.getElementById('unsavedNotice');
      const saveBtn = document.getElementById('saveBtn');
      if (notice) notice.classList.toggle('show', !!hasUnsavedChanges);
      if (saveBtn && !isSaving) {
        saveBtn.textContent = '儲存排車';
        saveBtn.classList.toggle('unsaved-active', !!hasUnsavedChanges);
        saveBtn.classList.toggle('clean-state', !hasUnsavedChanges);
      }
      updateSortActionButtons_();
    }

    function triggerDispatchTapFeedback_(buttonEl) {
      // v75.25：排車頁快捷分類按鈕回饋。
      // 支援的手機會輕微震動；不支援時仍保留按下縮放 / 陰影回饋。
      try {
        if (navigator && typeof navigator.vibrate === 'function') {
          navigator.vibrate(12);
        }
      } catch (e) {}

      if (!buttonEl || !buttonEl.classList) return;
      buttonEl.classList.add('tap-active');
      window.setTimeout(function () {
        try { buttonEl.classList.remove('tap-active'); } catch (e) {}
      }, 140);
    }

    function showRouteMoveToast_(targetGroup) {
      const toast = document.getElementById('routeMoveToast');
      if (!toast) return;
      if (routeMoveToastTimer) {
        window.clearTimeout(routeMoveToastTimer);
        routeMoveToastTimer = null;
      }
      toast.textContent = `已加入 ${targetGroup}`;
      toast.classList.remove('show');
      void toast.offsetWidth;
      toast.classList.add('show');
      routeMoveToastTimer = window.setTimeout(function () {
        toast.classList.remove('show');
        routeMoveToastTimer = null;
      }, 1250);
    }



    function scrollToRouteGroup(groupName, sourceButton) {
      const name = String(groupName || '');
      if (!name) return;

      try {
        if (navigator && typeof navigator.vibrate === 'function') {
          navigator.vibrate(8);
        }
      } catch (e) {}

      if (sourceButton && sourceButton.classList) {
        sourceButton.classList.add('tap-active');
        window.setTimeout(function () {
          try { sourceButton.classList.remove('tap-active'); } catch (e) {}
        }, 160);
      }

      const list = document.getElementById(`group-${name}`);
      const block = list ? list.closest('.group-block') : null;
      if (!block) return;

      try {
        block.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } catch (e) {
        block.scrollIntoView(true);
      }

      // 捷徑導覽後，輕微標示目標路線，避免長頁面滑動後使用者找不到位置。
      try {
        if (list && list.classList) {
          list.classList.remove('route-target-pulse');
          void list.offsetWidth;
          list.classList.add('route-target-pulse');
          window.setTimeout(function () {
            try { list.classList.remove('route-target-pulse'); } catch (e) {}
          }, 1200);
        }
      } catch (e) {}
    }

    function moveStopToGroup(stopKey, targetGroup, sourceButton) {
      if (!sortMode || isSaving) return;

      const key = String(stopKey || '');
      const target = String(targetGroup || '');
      if (!key || QUICK_ROUTE_GROUPS.indexOf(target) === -1) return;

      dispatchBoard = normalizeDispatchBoardGroups_(dispatchBoard || { groups: {} });
      const fromList = dispatchBoard.groups['調度'] || [];
      const index = fromList.findIndex(item => String(item.stopKey || '') === key);
      if (index < 0) return;

      triggerDispatchTapFeedback_(sourceButton);
      pushSortUndoState_(buildSnapshotFromDOM());

      // v75.31：記錄被移走後會補上來的下一筆，讓調度清單有明確的上滑補位感。
      const nextDispatchItem = fromList[index + 1] || null;
      const nextDispatchKey = nextDispatchItem ? String(nextDispatchItem.stopKey || '') : '';

      const item = fromList.splice(index, 1)[0];
      item.routeGroup = target;

      const targetDriverSelect = document.getElementById(`driver-${target}`);
      const targetDriverName = targetDriverSelect ? targetDriverSelect.value : '';
      if (targetDriverName) item.driverName = targetDriverName;

      dispatchBoard.groups[target] = dispatchBoard.groups[target] || [];
      dispatchBoard.groups[target].push(item);
      pendingRouteMoveAnimationStopKey = key;
      pendingRouteMoveTargetGroup = target;
      pendingDispatchShiftAnimationStopKey = nextDispatchKey;

      renderDispatchBoard();
      showRouteMoveToast_(target);
      markUnsavedChanges();
      syncLocalBoardFromDOM();
      updateSortActionButtons_();
    }

    function initSortables() {
      // v54 Android 載入優化：未進入排序模式前，不建立 Sortable 實例。
      // Android LINE WebView 對拖曳元件初始化較敏感；排車頁開頁時先只渲染清單，
      // 使用者按「修改排序」後才啟用拖曳，避免每次讀取都產生多組拖曳監聽器。
      sortableRefs.forEach(x => {
        try { x.destroy(); } catch (e) {}
      });
      sortableRefs = [];

      if (!sortMode) return;

      GROUP_NAMES.forEach(groupName => {
        const el = document.getElementById(`group-${groupName}`);
        if (!el || typeof Sortable === 'undefined') return;
        const sortable = new Sortable(el, {
          group: 'dispatch-board',
          animation: 150,
          ghostClass: 'sortable-ghost',
          chosenClass: 'sortable-chosen',
          draggable: '.row',
          handle: '.drag-handle',
          disabled: false,
          onStart: function () {
            beforeDragSnapshot = buildSnapshotFromDOM();
          },
          onEnd: function () {
            if (beforeDragSnapshot) {
              pushSortUndoState_(beforeDragSnapshot);
              beforeDragSnapshot = null;
            }
            const currentSnapshot = buildSnapshotFromDOM();
            applySnapshotToBoard_(currentSnapshot);
            markUnsavedChanges();
            saveLocalSnapshot(currentSnapshot);
            updateSortActionButtons_();
          }
        });
        sortableRefs.push(sortable);
      });
    }

    function toggleSortMode() {
      sortMode = true;
      sortUndoStack = [];
      sortInitialSnapshot = buildSnapshotFromDOM();
      beforeDragSnapshot = null;
      updateSortActionButtons_();
      renderDispatchBoard();
      document.querySelectorAll('.drag-handle').forEach(el => el.classList.remove('disabled'));
    }

    function cancelSortMode() {
      sortMode = false;
      resetSortUndoState_();

      // 取消排序時回到目前從後端讀取的排車資料，不套用本次未儲存的拖拉 / 快捷分類變更。
      clearLocalSnapshot(currentPeriod);
      dispatchBoard = cloneDispatchBoard_(lastLoadedDispatchBoard || dispatchBoard || { groups: {} });
      clearUnsavedChanges();
      renderDispatchBoard();
    }

    function syncLocalBoardFromDOM() {
      const snapshot = buildSnapshotFromDOM();
      saveLocalSnapshot(snapshot);
    }

    function buildSnapshotFromDOM() {
      const groups = {};

      GROUP_NAMES.forEach(groupName => {
        const box = document.getElementById(`group-${groupName}`);
        const rows = Array.from(box.querySelectorAll('.row'));
        const driverSelect = document.getElementById(`driver-${groupName}`);
        const driverName = driverSelect ? driverSelect.value : '';

        groups[groupName] = {
          driverName: driverName,
          items: rows.map(row => ({
            stopKey: row.getAttribute('data-stop-key') || '',
            taskIds: JSON.parse(decodeURIComponent(row.getAttribute('data-taskids') || '[]'))
          }))
        };
      });

      return {
        period: currentPeriod,
        groups: groups
      };
    }

    function buildDispatchSavePayload_() {
      const groups = GROUP_NAMES.reduce((out, groupName) => {
        out[groupName] = collectGroup(groupName);
        return out;
      }, {});

      return {
        action: 'save_dispatch_board',
        period: currentPeriod,
        groups: groups
      };
    }

    function clearSaveProgressTimer_() {
      if (saveProgressTimer) {
        window.clearTimeout(saveProgressTimer);
        saveProgressTimer = null;
      }
    }

    function showSaveStatus_(mode, title, note) {
      const panel = document.getElementById('saveStatusPanel');
      const titleEl = document.getElementById('saveStatusTitle');
      const noteEl = document.getElementById('saveStatusNote');
      const fill = document.getElementById('saveProgressFill');
      if (!panel) return;

      clearSaveProgressTimer_();
      panel.classList.remove('error', 'success');
      panel.classList.add('show');
      if (mode) panel.classList.add(mode);

      if (titleEl) titleEl.textContent = title || '正在儲存排車...';
      if (noteEl) noteEl.textContent = note || '請稍候，系統正在寫入路線與順序。';

      if (fill) {
        if (mode === 'error' || mode === 'success') {
          fill.style.width = '100%';
        } else {
          fill.style.width = '18%';
          saveProgressTimer = window.setTimeout(function () {
            try { fill.style.width = '72%'; } catch (e) {}
          }, 120);
        }
      }
    }

    function hideSaveStatus_(delayMs) {
      const panel = document.getElementById('saveStatusPanel');
      clearSaveProgressTimer_();
      window.setTimeout(function () {
        try {
          if (panel) {
            panel.classList.remove('show', 'error', 'success');
          }
        } catch (e) {}
      }, delayMs || 0);
    }

    async function saveDispatchBoard() {
      if (isSaving) return;
      lastSavePayload = buildDispatchSavePayload_();
      await submitDispatchSave_(lastSavePayload);
    }

    async function retrySaveDispatchBoard() {
      if (isSaving) return;
      const payload = lastSavePayload || buildDispatchSavePayload_();
      lastSavePayload = payload;
      await submitDispatchSave_(payload);
    }

    async function submitDispatchSave_(payload) {
      if (!payload || isSaving) return;

      isSaving = true;
      setSavingState(true);
      showSaveStatus_('saving', '正在儲存排車...', '請稍候，系統正在寫入路線與順序。');

      try {
        const resp = await fetch(GAS_WEBAPP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const text = await resp.text();
        let json = {};
        try {
          json = JSON.parse(text);
        } catch (e) {
          throw new Error(text || '儲存排車失敗');
        }

        if (!json.ok) {
          throw new Error(json.message || json.error || '儲存排車失敗');
        }

        sortMode = false;
        resetSortUndoState_();

        dispatchBoard = normalizeDispatchBoardGroups_(dispatchBoard || { groups: {} });
        lastLoadedDispatchBoard = cloneDispatchBoard_(dispatchBoard);
        clearLocalSnapshot(currentPeriod);
        clearUnsavedChanges();
        renderDispatchBoard();
        document.getElementById('summaryText').textContent = json.message || '排車已儲存';
        showSaveStatus_('success', '排車已儲存', '路線與順序已更新。');
        hideSaveStatus_(900);
      } catch (err) {
        console.error(err);
        // v75.35：儲存失敗時不清除目前前端排序、不退出修改排序、不清空返回上一步。
        // 排車人可直接按「重新儲存」再次送出同一份畫面排序。
        showSaveStatus_('error', '儲存失敗，排車尚未更新。', '請不要重新整理頁面，直接按「重新儲存」再次嘗試。');
      } finally {
        isSaving = false;
        setSavingState(false);
      }
    }

    function setSavingState(saving) {
      const saveBtn = document.getElementById('saveBtn');
      const refreshBtn = document.getElementById('refreshBtn');
      const sortBtn = document.getElementById('sortToggleBtn');
      const cancelBtn = document.getElementById('cancelSortBtn');
      const undoBtn = document.getElementById('undoSortBtn');

      if (saveBtn) {
        saveBtn.disabled = saving;
        saveBtn.textContent = saving ? '儲存中...' : '儲存排車';
        saveBtn.classList.toggle('unsaved-active', !saving && !!hasUnsavedChanges);
        saveBtn.classList.toggle('clean-state', !saving && !hasUnsavedChanges);
      }
      if (refreshBtn) refreshBtn.disabled = saving;
      if (sortBtn) sortBtn.disabled = saving;
      if (cancelBtn) cancelBtn.disabled = saving;
      if (undoBtn) undoBtn.disabled = saving || sortUndoStack.length === 0;
    }

    function collectGroup(groupName) {
      const box = document.getElementById(`group-${groupName}`);
      const rows = Array.from(box.querySelectorAll('.row'));
      const driverSelect = document.getElementById(`driver-${groupName}`);
      const driverName = driverSelect ? driverSelect.value : '';

      return rows.map((row, index) => {
        const taskIds = JSON.parse(decodeURIComponent(row.getAttribute('data-taskids') || '[]'));
        return {
          stopKey: row.getAttribute('data-stop-key') || '',
          taskIds: taskIds,
          driverName: driverName,
          displayOrder: index + 1
        };
      });
    }

    function getOrderCount(item) {
      if (Array.isArray(item.orderNos) && item.orderNos.length) return item.orderNos.length;
      if (Array.isArray(item.taskIds) && item.taskIds.length) return item.taskIds.length;
      return 1;
    }


    function getRouteShortName(groupName) {
      switch (String(groupName || '').trim()) {
        case '調度': return '調';
        case '市區': return '市';
        case '竹東': return '東';
        case '湖口': return '湖';
        case '其他': return '其';
        case '機動': return '機';
        default: return String(groupName || '').trim();
      }
    }

    function isStoreStop(item) {      const deliveryType = String(item.deliveryType || '').trim();
      if (deliveryType === '送店') return true;
      const address = String(item.address || '').trim();
      return !address || address === '送店';
    }

    function getMainLabel(item) {
      const address = String(item.address || '').trim();
      const shopName = String(item.shopName || '').trim();
      return isStoreStop(item) ? (shopName || address || '未填店家') : (address || shopName || '未填地址');
    }

    function openDriverRoute(driverName) {
      const finalDriver = driverName || '';
      const target = `driver.html?driver=${encodeURIComponent(finalDriver)}&period=${encodeURIComponent(currentPeriod)}`;
      window.open(target, '_blank');
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function cssEscape_(value) {
      const text = String(value || '');
      if (window.CSS && typeof window.CSS.escape === 'function') {
        return window.CSS.escape(text);
      }
      return text.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
    }

    function showPageProgress(text, percent, note) {
      const panel = document.getElementById('pageLoadingPanel');
      if (!panel) return;
      panel.classList.add('show');
      updatePageProgress(text || '正在讀取資料...', percent || 8, note || '請稍候。');
      clearPageProgressTimers();
      pageLoadingTimer10 = setTimeout(() => {
        updatePageProgress('資料較多，系統仍在整理中...', 88, '請不要關閉頁面，系統仍在讀取排車資料。');
      }, 10000);
      pageLoadingTimer30 = setTimeout(() => {
        const retry = document.getElementById('pageLoadingRetry');
        if (retry) retry.classList.add('show');
        updatePageProgress('系統仍在讀取中', 92, '若等待過久，可按「重新讀取」。');
      }, 30000);
    }

    function updatePageProgress(text, percent, note) {
      const p = Math.max(0, Math.min(100, Number(percent || 0)));
      const textEl = document.getElementById('pageLoadingText');
      const percentEl = document.getElementById('pageLoadingPercent');
      const fillEl = document.getElementById('pageLoadingFill');
      const noteEl = document.getElementById('pageLoadingNote');
      const retryEl = document.getElementById('pageLoadingRetry');
      if (textEl) textEl.textContent = text || '正在讀取資料...';
      if (percentEl) percentEl.textContent = `${Math.round(p)}%`;
      if (fillEl) fillEl.style.width = `${p}%`;
      if (noteEl) noteEl.textContent = note || '';
      if (retryEl && p < 100) retryEl.classList.remove('show');
    }

    function completePageProgress(text) {
      clearPageProgressTimers();
      updatePageProgress(text || '載入完成', 100, '資料已更新。');
      setTimeout(() => {
        const panel = document.getElementById('pageLoadingPanel');
        const retry = document.getElementById('pageLoadingRetry');
        if (panel) panel.classList.remove('show');
        if (retry) retry.classList.remove('show');
      }, 450);
    }

    function clearPageProgressTimers() {
      if (pageLoadingTimer10) clearTimeout(pageLoadingTimer10);
      if (pageLoadingTimer30) clearTimeout(pageLoadingTimer30);
      pageLoadingTimer10 = null;
      pageLoadingTimer30 = null;
    }

    function setupPageZoomGuard() {
      // v72.4：不再攔截 touchend，避免正常連續點擊被節流。
      // 防縮放主要交由 viewport、touch-action、user-select 與 gesturestart 處理。
      document.addEventListener('gesturestart', function(e) {
        e.preventDefault();
      }, { passive: false });
    }

    document.addEventListener('change', function(e) {
      const targetId = e.target && e.target.id ? e.target.id : '';
      if (GROUP_NAMES.some(name => targetId === `driver-${name}`)) {
        syncLocalBoardFromDOM();
      }
    });

    setupPageZoomGuard();
    initPage();
  </script>
</body>
