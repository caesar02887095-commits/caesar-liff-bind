<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>凱撒衛浴查詢入口</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f5f6f8;
      color: #222;
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 12px;
    }
    .topbar {
      background: #2c3e50;
      color: #fff;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 14px;
      line-height: 1.6;
      opacity: 0.95;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .status {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .muted {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
    }
    .input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      margin-top: 8px;
      margin-bottom: 10px;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-primary {
      background: #EBA13A;
      color: #fff;
    }
    .btn-secondary {
      background: #d9dde3;
      color: #333;
      margin-top: 8px;
    }
    .btn-toggle {
      background: #dbeafe;
      color: #1d4ed8;
      margin-top: 10px;
    }
    .order-card {
      border: 1px solid #d8dee8;
      border-radius: 14px;
      padding: 14px;
      margin-top: 14px;
      background: #ffffff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .order-title {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 12px;
      padding: 10px 12px;
      background: #eef4fb;
      border-left: 4px solid #2c3e50;
      border-radius: 8px;
      color: #1f2937;
    }
    .row {
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 6px;
      color: #374151;
    }
    .merge-box {
      margin: 4px 0 12px 0;
      padding: 10px 12px;
      background: #f8fafc;
      border: 1px solid #dbe4ef;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.7;
      color: #334155;
    }
    .detail-block {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #cfd8e3;
    }
    .detail-title {
      font-size: 14px;
      font-weight: bold;
      color: #374151;
      margin-bottom: 6px;
    }
    .detail-line {
      font-size: 14px;
      line-height: 1.8;
      color: #374151;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .progress-shell {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed #d1d5db;
      display: none;
    }
    .progress-shell.show {
      display: block;
    }
    .status-big {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .eta-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
      border-radius: 12px;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 10px;
    }
    .eta-title {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .eta-time {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.2;
    }
    .flow {
      margin-top: 10px;
    }
    .flow-step {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }
    .flow-dot {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      margin-top: 3px;
      flex-shrink: 0;
      background: #cbd5e1;
    }
    .flow-dot.active {
      background: #2563eb;
    }
    .flow-dot.done {
      background: #16a34a;
    }
    .flow-text {
      font-size: 14px;
      line-height: 1.6;
    }
    .flow-main {
      font-weight: bold;
    }
    .flow-sub {
      color: #6b7280;
      font-size: 13px;
    }
    .loading {
      text-align: center;
      color: #666;
      padding: 28px 12px;
      font-size: 15px;
    }
    .ok { color: #166534; }
    .warn { color: #9a3412; }
    .bad { color: #991b1b; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title">凱撒衛浴查詢入口</div>
      <div class="sub" id="userInfo">載入中...</div>
    </div>

    <div id="app">
      <div class="card">
        <div class="loading">系統載入中...</div>
      </div>
    </div>
  </div>

  <script>
    const LIFF_ID = '2009380550-ow9SlJK4';
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxmUEj7tu2ZbqZaIESXhu9oS73QdE8qOGRKmHONqHXf-H6pL3zdYxuSvssjOExQNJjlhA/exec';

    const RETURN_URL_KEY = 'caesar_return_url';
    const RETURN_RESTORED_KEY = 'caesar_return_restored';

    let currentUid = '';
    let currentDisplayName = '';

    async function initPage() {
      try {
        saveCurrentPageState_();

        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          prepareLoginRedirect_();
          liff.login({ redirectUri: window.location.href });
          return;
        }

        if (restoreReturnPageIfNeeded_()) {
          return;
        }

        cleanupAuthNoise_();

        const profile = await liff.getProfile();
        currentUid = profile.userId || '';
        currentDisplayName = profile.displayName || '';

        document.getElementById('userInfo').innerHTML =
          `LINE 使用者：<b>${escapeHtml(currentDisplayName || '未辨識')}</b>`;

        await loadPortal();
        startAutoRefresh();
      } catch (err) {
        renderMessage('載入失敗：' + (err.message || err), 'bad');
      }
    }

    function saveCurrentPageState_() {
      try {
        if (window.location.search.includes('liff.state=') || window.location.search.includes('code=')) {
          return;
        }
        sessionStorage.setItem(RETURN_URL_KEY, window.location.href);
      } catch (e) {}
    }

    function prepareLoginRedirect_() {
      try {
        sessionStorage.setItem(RETURN_URL_KEY, window.location.href);
        sessionStorage.removeItem(RETURN_RESTORED_KEY);
      } catch (e) {}
    }

    function restoreReturnPageIfNeeded_() {
      try {
        const savedUrl = sessionStorage.getItem(RETURN_URL_KEY) || '';
        const restored = sessionStorage.getItem(RETURN_RESTORED_KEY) || '';

        if (!savedUrl) return false;

        const currentUrl = window.location.href;
        const savedClean = normalizeUrlForCompare_(savedUrl);
        const currentClean = normalizeUrlForCompare_(currentUrl);

        if (savedClean && currentClean && savedClean !== currentClean && restored !== '1') {
          sessionStorage.setItem(RETURN_RESTORED_KEY, '1');
          window.location.replace(savedUrl);
          return true;
        }

        sessionStorage.removeItem(RETURN_RESTORED_KEY);
        sessionStorage.removeItem(RETURN_URL_KEY);
        return false;
      } catch (e) {
        return false;
      }
    }

    function normalizeUrlForCompare_(url) {
      try {
        const u = new URL(url);
        const params = new URLSearchParams(u.search);
        params.delete('code');
        params.delete('state');
        params.delete('friendship_status_changed');
        params.delete('liffClientId');
        params.delete('liffRedirectUri');
        params.delete('access_token');
        params.delete('id_token');
        params.delete('expires_in');
        params.delete('token_type');

        const search = params.toString();
        return u.origin + u.pathname + (search ? '?' + search : '') + (u.hash || '');
      } catch (e) {
        return url;
      }
    }

    function cleanupAuthNoise_() {
      try {
        const url = new URL(window.location.href);
        const params = url.searchParams;

        const noisyKeys = [
          'code',
          'state',
          'friendship_status_changed',
          'liffClientId',
          'liffRedirectUri',
          'access_token',
          'id_token',
          'expires_in',
          'token_type'
        ];

        let changed = false;
        noisyKeys.forEach(key => {
          if (params.has(key)) {
            params.delete(key);
            changed = true;
          }
        });

        if (changed) {
          const newUrl = url.origin + url.pathname + (params.toString() ? '?' + params.toString() : '') + (url.hash || '');
          window.history.replaceState({}, '', newUrl);
        }
      } catch (e) {}
    }

    let autoRefreshTimer = null;

    function startAutoRefresh() {
      stopAutoRefresh();
      autoRefreshTimer = setInterval(() => {
        if (document.hidden) return;
        loadPortal({ silent: true });
      }, 20000);
    }

    function stopAutoRefresh() {
      if (autoRefreshTimer) {
        clearInterval(autoRefreshTimer);
        autoRefreshTimer = null;
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        loadPortal({ silent: true });
      }
    });

    async function loadPortal(options = {}) {
      const silent = !!options.silent;
      const url = `${GAS_WEBAPP_URL}?action=get_customer_portal&uid=${encodeURIComponent(currentUid)}&_ts=${Date.now()}`;
      const resp = await fetch(url, { cache: 'no-store' });
      const json = await resp.json();

      if (!json.ok) {
        renderMessage(json.error || '讀取失敗', 'bad');
        return;
      }

      const data = json.data || {};
      const status = data.accessStatus || '';

      if (status === 'APPROVED') {
        renderApproved(data);
        return;
      }

      if (status === 'PENDING') {
        renderPending(data.requestCode || '');
        return;
      }

      if (status === 'REJECTED') {
        renderRejected();
        return;
      }

      renderRequestForm();
    }

    function renderApproved(data) {
      const orders = Array.isArray(data.orders) ? data.orders : [];
      const customerName = data.customerName || '';

      let html = `
        <div class="card">
          <div class="status ok">已開通查詢權限</div>
          <div class="muted">
            店家名稱：<b>${escapeHtml(customerName || '')}</b>
          </div>
        </div>
      `;

      if (!orders.length) {
        html += `
          <div class="card">
            <div class="status">目前沒有可查詢資料</div>
            <div class="muted">目前這批資料中沒有待配送或可查詢訂單。</div>
          </div>
        `;
      } else {
        html += `
          <div class="card">
            <div class="status">訂單 / 配送查詢</div>
            ${orders.map((order, idx) => renderOrderCard(order, idx)).join('')}
          </div>
        `;
      }

      html += `
        <div class="card">
          <button class="btn btn-secondary" onclick="loadPortal()">重新整理</button>
        </div>
      `;

      document.getElementById('app').innerHTML = html;
    }

    function renderOrderCard(order, idx) {
      const canTrack = !!order.hasTracking;
      const mergedOrderNos = Array.isArray(order.orderNos) ? order.orderNos.filter(Boolean) : [];
      const mergedCount = mergedOrderNos.length || (order.orderNo ? 1 : 0);
      const mergedOrderText = mergedOrderNos.length ? mergedOrderNos.join(' / ') : (order.orderNo || '');
      const detailLines = Array.isArray(order.detailLines) ? order.detailLines : [];

      return `
        <div class="order-card">
          <div class="order-title">配送批次單號：${escapeHtml(order.orderNo || '')}</div>

          ${mergedCount > 1 ? `
            <div class="merge-box">
              <div><b>合併單數：</b>${mergedCount} 張</div>
              <div><b>合併單號：</b>${escapeHtml(mergedOrderText)}</div>
            </div>
          ` : ''}

          <div class="row">送貨地址：${escapeHtml(order.address || '')}</div>
          ${order.phone ? `<div class="row">電話：${escapeHtml(order.phone)}</div>` : ''}
          <div class="row">送貨時間：${escapeHtml(formatDeliveryDisplay(order.deliveryDateText, order.deliveryTime))}</div>

          <div class="detail-block">
            <div class="detail-title">明細</div>
            ${detailLines.length
              ? detailLines.map(line => `<div class="detail-line">${escapeHtml(line)}</div>`).join('')
              : `<div class="detail-line">無明細資料</div>`
            }
          </div>

          ${canTrack ? `
            <button class="btn btn-toggle" onclick="toggleProgress(${idx})" id="toggle-btn-${idx}">
              展開送貨進度
            </button>
            <div class="progress-shell" id="progress-shell-${idx}">
              ${renderProgressDetail(order)}
            </div>
          ` : `
            <div class="progress-shell show">
              <div class="status-big warn">尚未排車</div>
              <div class="row">目前這批配送尚未安排路線。</div>
            </div>
          `}
        </div>
      `;
    }

    function renderProgressDetail(order) {
      const progressText = order.taskStatusText || '配送處理中';
      const taskStatus = order.taskStatus || '';
      const etaText = order.etaText || '';

      return `
        <div class="status-big ok">${escapeHtml(progressText)}</div>
        <div class="row">配送司機：${escapeHtml(order.driverName || '未排車')}</div>
        ${etaText ? `
          <div class="eta-box">
            <div class="eta-title">預估送達時間</div>
            <div class="eta-time">${escapeHtml(etaText)}</div>
          </div>
        ` : ''}
        <div class="flow">
          ${renderFlow(taskStatus)}
        </div>
      `;
    }

    function renderFlow(taskStatus) {
      if (taskStatus === '已完成') {
        return `
          <div class="flow-step">
            <div class="flow-dot done"></div>
            <div class="flow-text">
              <div class="flow-main">已排車</div>
            </div>
          </div>
          <div class="flow-step">
            <div class="flow-dot done"></div>
            <div class="flow-text">
              <div class="flow-main">司機配送中</div>
            </div>
          </div>
          <div class="flow-step">
            <div class="flow-dot done"></div>
            <div class="flow-text">
              <div class="flow-main">你的訂單已完成配送</div>
            </div>
          </div>
        `;
      }

      if (taskStatus === '聯繫後改期') {
        return `
          <div class="flow-step">
            <div class="flow-dot done"></div>
            <div class="flow-text">
              <div class="flow-main">已排車</div>
            </div>
          </div>
          <div class="flow-step">
            <div class="flow-dot active"></div>
            <div class="flow-text">
              <div class="flow-main">配送安排已異動</div>
              <div class="flow-sub">請等待後續通知</div>
            </div>
          </div>
        `;
      }

      if (taskStatus === '取消配送') {
        return `
          <div class="flow-step">
            <div class="flow-dot done"></div>
            <div class="flow-text">
              <div class="flow-main">已排車</div>
            </div>
          </div>
          <div class="flow-step">
            <div class="flow-dot active"></div>
            <div class="flow-text">
              <div class="flow-main">配送已取消</div>
            </div>
          </div>
        `;
      }

      if (taskStatus === '放門口' || taskStatus === '改送隔壁') {
        return `
          <div class="flow-step">
            <div class="flow-dot done"></div>
            <div class="flow-text">
              <div class="flow-main">已排車</div>
            </div>
          </div>
          <div class="flow-step">
            <div class="flow-dot done"></div>
            <div class="flow-text">
              <div class="flow-main">司機配送中</div>
            </div>
          </div>
          <div class="flow-step">
            <div class="flow-dot done"></div>
            <div class="flow-text">
              <div class="flow-main">${escapeHtml(taskStatus)}</div>
            </div>
          </div>
        `;
      }

      return `
        <div class="flow-step">
          <div class="flow-dot done"></div>
          <div class="flow-text">
            <div class="flow-main">已排車</div>
          </div>
        </div>
        <div class="flow-step">
          <div class="flow-dot active"></div>
          <div class="flow-text">
            <div class="flow-main">司機配送中</div>
            <div class="flow-sub">正依路線順序前往送達</div>
          </div>
        </div>
        <div class="flow-step">
          <div class="flow-dot"></div>
          <div class="flow-text">
            <div class="flow-main">等待送達</div>
          </div>
        </div>
      `;
    }

    function toggleProgress(idx) {
      const shell = document.getElementById(`progress-shell-${idx}`);
      const btn = document.getElementById(`toggle-btn-${idx}`);
      if (!shell || !btn) return;

      const isOpen = shell.classList.contains('show');
      if (isOpen) {
        shell.classList.remove('show');
        btn.textContent = '展開送貨進度';
      } else {
        shell.classList.add('show');
        btn.textContent = '收合送貨進度';
      }
    }

    function renderRequestForm() {
      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="status warn">尚未開通查詢權限</div>
          <div class="muted">
            請輸入你的 4 位客戶代號。<br>
            例如 389，系統會自動補成 0389。<br>
            送出後將進入待審查狀態。
          </div>
          <input id="clientCodeInput" class="input" type="text" inputmode="numeric" placeholder="請輸入客戶代號">
          <button class="btn btn-primary" onclick="submitRequest()">送出申請</button>
        </div>
      `;
    }

    function renderPending(requestCode) {
      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="status warn">申請審查中</div>
          <div class="muted">
            你送出的申請客編為：<b>${escapeHtml(requestCode || '')}</b><br>
            請等待凱撒衛浴確認開通。
          </div>
          <button class="btn btn-secondary" onclick="loadPortal()">重新整理</button>
        </div>
      `;
    }

    function renderRejected() {
      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="status bad">目前未開通查詢權限</div>
          <div class="muted">
            你的申請目前未通過。<br>
            如有需要，請洽凱撒衛浴協助確認。
          </div>
          <button class="btn btn-secondary" onclick="renderRequestForm()">重新申請</button>
        </div>
      `;
    }

    function renderMessage(msg, cls) {
      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="status ${cls || ''}">${escapeHtml(msg || '')}</div>
        </div>
      `;
    }

    async function submitRequest() {
      const input = document.getElementById('clientCodeInput');
      if (!input) return;

      let code = String(input.value || '').replace(/[^\d]/g, '');
      if (!code) {
        alert('請輸入客戶代號');
        return;
      }
      code = code.padStart(4, '0').slice(-4);

      const payload = {
        action: 'submit_customer_access_request',
        uid: currentUid,
        displayName: currentDisplayName,
        requestClientCode: code
      };

      const resp = await fetch(GAS_WEBAPP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });

      const text = await resp.text();
      let json = {};
      try {
        json = JSON.parse(text);
      } catch (e) {
        alert(text || '送出申請失敗');
        return;
      }

      if (!json.ok) {
        alert(json.message || json.error || '送出申請失敗');
        return;
      }

      renderPending(code);
    }

    function formatDeliveryDisplay(dateText, periodText) {
      const datePart = formatDateOnly(dateText);
      const periodPart = String(periodText || '').trim();
      return [datePart, periodPart].filter(Boolean).join(' ');
    }

    function formatDateOnly(value) {
      if (!value) return '';

      if (value instanceof Date && !isNaN(value.getTime())) {
        return formatDateObj(value);
      }

      const text = String(value).trim();

      const m = text.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
      if (m) {
        const y = m[1];
        const mm = String(m[2]).padStart(2, '0');
        const dd = String(m[3]).padStart(2, '0');
        return `${y}/${mm}/${dd}`;
      }

      const d = new Date(text);
      if (!isNaN(d.getTime())) {
        return formatDateObj(d);
      }

      return text;
    }

    function formatDateObj(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}/${m}/${day}`;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    initPage();
  </script>
</body>
</html>
