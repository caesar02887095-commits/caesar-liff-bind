<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>凱撒衛浴查詢入口</title>
  <!--
  ========================================================
  【優化說明 - query.html】
  1. [並行化] LIFF init 和 GAS 暖機請求同時發出，不再串行等待
  2. [Skeleton] 載入時顯示灰色骨架，用戶不會看到空白畫面
  3. [GAS 暖機] 頁面一開啟就發出 ping 請求，讓 GAS 實例預熱
  4. [快取 UID] 將 UID 存入 sessionStorage，同 session 內重整不需再打 getProfile
  5. 功能邏輯完全不變，只改載入流程
  ========================================================
  -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f5f6f8;
      color: #222;
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 12px;
    }
    .topbar {
      background: #2c3e50;
      color: #fff;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 14px;
      line-height: 1.6;
      opacity: 0.95;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .status {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .muted {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
    }
    .input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      margin-top: 8px;
      margin-bottom: 10px;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-primary {
      background: #EBA13A;
      color: #fff;
    }
    .btn-secondary {
      background: #d9dde3;
      color: #333;
      margin-top: 8px;
    }
    .order-card {
      border: 1px solid #d8dee8;
      border-radius: 14px;
      padding: 14px;
      margin-top: 14px;
      background: #ffffff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .order-title {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 12px;
      padding: 10px 12px;
      background: #eef4fb;
      border-left: 4px solid #2c3e50;
      border-radius: 8px;
      color: #1f2937;
    }
    .row {
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 6px;
      color: #374151;
    }
    .merge-box {
      margin: 4px 0 12px 0;
      padding: 10px 12px;
      background: #f8fafc;
      border: 1px solid #dbe4ef;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.7;
      color: #334155;
    }
    .detail-block {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #cfd8e3;
    }
    .detail-title {
      font-size: 14px;
      font-weight: bold;
      color: #374151;
      margin-bottom: 6px;
    }
    .detail-line {
      font-size: 14px;
      line-height: 1.8;
      color: #374151;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .photo-wrap { margin-top: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .photo-item { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid #dbe4ef; background: #fff; display:block; text-decoration:none; }
    .photo-item img { width: 100%; display: block; aspect-ratio: 1 / 1; object-fit: cover; }
    .photo-badge { position:absolute; right:6px; bottom:6px; background: rgba(17,24,39,0.7); color:#fff; font-size:11px; padding:3px 6px; border-radius:999px; }
    .status-pill {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed #d1d5db;
    }
    .status-banner {
      margin-top: 10px;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: bold;
      line-height: 1.6;
    }
    .status-banner.done { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .status-banner.active { background: #dbeafe; color: #1d4ed8; border: 1px solid #93c5fd; }
    .status-banner.preparing { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
    .status-banner.warn { background: #ffedd5; color: #9a3412; border: 1px solid #fdba74; }
    .status-banner.cancel { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .eta-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
      border-radius: 12px;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 10px;
    }
    .eta-title { font-size: 13px; font-weight: bold; margin-bottom: 4px; }
    .eta-time { font-size: 20px; font-weight: bold; line-height: 1.2; }
    .ok { color: #166534; }
    .warn { color: #9a3412; }
    .bad { color: #991b1b; }

    /* ── [新增] Skeleton 骨架動畫 ── */
    @keyframes shimmer {
      0% { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #e8eaf0 25%, #f5f6f8 50%, #e8eaf0 75%);
      background-size: 800px 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 8px;
    }
    .skeleton-line {
      height: 16px;
      margin-bottom: 10px;
    }
    .skeleton-line.short { width: 55%; }
    .skeleton-line.medium { width: 78%; }
    .skeleton-line.full { width: 100%; }
    .skeleton-title {
      height: 20px;
      width: 65%;
      margin-bottom: 14px;
    }
    .skeleton-block {
      height: 80px;
      margin-top: 14px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title">凱撒衛浴查詢入口</div>
      <div class="sub" id="userInfo">載入中...</div>
    </div>

    <div id="app">
      <!-- [新增] Skeleton 骨架佔位，讓用戶看到頁面有內容在載入 -->
      <div class="card">
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-line medium"></div>
        <div class="skeleton skeleton-line short"></div>
        <div class="skeleton skeleton-block"></div>
        <div class="skeleton skeleton-block"></div>
      </div>
    </div>
  </div>

  <script>
    const LIFF_ID = '2009380550-ow9SlJK4';
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxmUEj7tu2ZbqZaIESXhu9oS73QdE8qOGRKmHONqHXf-H6pL3zdYxuSvssjOExQNJjlhA/exec';

    const RETURN_URL_KEY = 'caesar_return_url';
    const RETURN_RESTORED_KEY = 'caesar_return_restored';
    const UID_CACHE_KEY = 'caesar_uid';
    const DNAME_CACHE_KEY = 'caesar_dname';


    function warmPing_() {
      try {
        fetch(`${GAS_WEBAPP_URL}?action=ping&_ts=${Date.now()}`, { cache: 'no-store' }).catch(() => {});
      } catch (e) {}
    }

    let currentUid = '';
    let currentDisplayName = '';

    // ── [新增] 步驟1：GAS 暖機 - 頁面一開啟就發出，不等 LIFF ──
    // GAS 冷啟動需要 2-4 秒，提早發出可以讓這段時間和 LIFF init 重疊
    let gasWarmupPromise = null;
    function warmupGas_() {
      if (gasWarmupPromise) return gasWarmupPromise;
      gasWarmupPromise = fetch(GAS_WEBAPP_URL + '?action=ping&_ts=' + Date.now(), {
        cache: 'no-store',
        signal: AbortSignal.timeout ? AbortSignal.timeout(8000) : undefined
      }).catch(() => {}); // 暖機失敗不影響後續流程
      return gasWarmupPromise;
    }
    warmupGas_(); // 立即執行，不等任何東西

    let autoRefreshTimer = null;

    function startAutoRefresh() {
      stopAutoRefresh();
      autoRefreshTimer = setInterval(() => {
        if (document.hidden) return;
        loadPortal({ silent: true });
      }, 30000);
    }

    function stopAutoRefresh() {
      if (autoRefreshTimer) {
        clearInterval(autoRefreshTimer);
        autoRefreshTimer = null;
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) loadPortal({ silent: true });
    });

    async function initPage() {
      try {
        saveCurrentPageState_();

        // ── [新增] 步驟2：快取 UID - 同 session 內不需再呼叫 getProfile ──
        const cachedUid = sessionStorage.getItem(UID_CACHE_KEY) || '';
        const cachedDname = sessionStorage.getItem(DNAME_CACHE_KEY) || '';

        // ── [優化] 步驟3：LIFF init 和暖機並行 ──
        // 原本：liff.init → getProfile → fetch API（完全串行，最慢）
        // 現在：liff.init 和暖機同時進行，節省 GAS 冷啟動等待時間
        const liffInitPromise = liff.init({ liffId: LIFF_ID });

        await liffInitPromise;

        if (!liff.isLoggedIn()) {
          prepareLoginRedirect_();
          liff.login({ redirectUri: window.location.href });
          return;
        }

        if (restoreReturnPageIfNeeded_()) return;
        cleanupAuthNoise_();

        // ── [優化] 步驟4：有 UID 快取就跳過 getProfile，直接查詢 ──
        if (cachedUid) {
          currentUid = cachedUid;
          currentDisplayName = cachedDname;
          document.getElementById('userInfo').innerHTML =
            `LINE 使用者：<b>${escapeHtml(currentDisplayName || '未辨識')}</b>`;
          // getProfile 和 loadPortal 並行
          liff.getProfile().then(p => {
            currentDisplayName = p.displayName || currentDisplayName;
            sessionStorage.setItem(DNAME_CACHE_KEY, currentDisplayName);
            document.getElementById('userInfo').innerHTML =
              `LINE 使用者：<b>${escapeHtml(currentDisplayName || '未辨識')}</b>`;
          }).catch(() => {});
        } else {
          const profile = await liff.getProfile();
          currentUid = profile.userId || '';
          currentDisplayName = profile.displayName || '';
          sessionStorage.setItem(UID_CACHE_KEY, currentUid);
          sessionStorage.setItem(DNAME_CACHE_KEY, currentDisplayName);
          document.getElementById('userInfo').innerHTML =
            `LINE 使用者：<b>${escapeHtml(currentDisplayName || '未辨識')}</b>`;
        }

        await loadPortal();
        startAutoRefresh();
      } catch (err) {
        renderMessage('載入失敗：' + (err.message || err), 'bad');
      }
    }

    function saveCurrentPageState_() {
      try {
        if (window.location.search.includes('liff.state=') || window.location.search.includes('code=')) return;
        sessionStorage.setItem(RETURN_URL_KEY, window.location.href);
      } catch (e) {}
    }

    function prepareLoginRedirect_() {
      try { sessionStorage.setItem(RETURN_RESTORED_KEY, '0'); } catch (e) {}
    }

    function restoreReturnPageIfNeeded_() {
      try {
        const params = new URLSearchParams(window.location.search);
        if (!params.has('code') && !params.has('liff.state')) return false;
        const restored = sessionStorage.getItem(RETURN_RESTORED_KEY);
        if (restored === '1') return false;
        const returnUrl = sessionStorage.getItem(RETURN_URL_KEY);
        if (!returnUrl) return false;
        sessionStorage.setItem(RETURN_RESTORED_KEY, '1');
        window.location.replace(returnUrl);
        return true;
      } catch (e) { return false; }
    }

    function cleanupAuthNoise_() {
      try {
        const url = new URL(window.location.href);
        if (url.searchParams.has('code') || url.searchParams.has('liff.state')) {
          url.searchParams.delete('code');
          url.searchParams.delete('state');
          url.searchParams.delete('liff.state');
          window.history.replaceState({}, '', url.toString());
        }
      } catch (e) {}
    }

    async function loadPortal(options = {}) {
      if (!options.silent) {
        // silent 模式不重置 skeleton，避免閃爍
        document.getElementById('app').innerHTML = `
          <div class="card">
            <div class="skeleton skeleton-title"></div>
            <div class="skeleton skeleton-line medium"></div>
            <div class="skeleton skeleton-line short"></div>
            <div class="skeleton skeleton-block"></div>
            <div class="skeleton skeleton-block"></div>
          </div>`;
      }

      const url =
        `${GAS_WEBAPP_URL}?action=get_customer_portal` +
        `&uid=${encodeURIComponent(currentUid)}` +
        `&_ts=${Date.now()}`;

      const resp = await fetch(url, { cache: 'no-store' });
      const json = await resp.json();

      if (!json.ok) {
        renderMessage(json.error || '讀取失敗', 'bad');
        return;
      }

      renderPortal(json.data || {});
    }

    function renderPortal(data) {
      const accessStatus = data.accessStatus || '';
      if (accessStatus === 'NEW' || accessStatus === 'NOT_APPROVED') {
        renderRequestForm();
        return;
      }
      if (accessStatus === 'PENDING') {
        renderPending(data.requestCode || '');
        return;
      }
      if (accessStatus === 'REJECTED') {
        renderRejected();
        return;
      }

      const orders = Array.isArray(data.orders) ? data.orders : [];
      const customerName = data.customerName || '';

      let html = `
        <div class="card">
          <div class="status ok">已開通查詢權限</div>
          <div class="muted">
            店家名稱：<b>${escapeHtml(customerName || '')}</b>
          </div>
        </div>
      `;

      if (!orders.length) {
        html += `
          <div class="card">
            <div class="status">目前沒有可查詢資料</div>
            <div class="muted">目前這批資料中沒有待配送或可查詢訂單。</div>
          </div>
        `;
      } else {
        html += `
          <div class="card">
            <div class="status">訂單 / 配送查詢</div>
            ${orders.map(order => renderOrderCard(order)).join('')}
          </div>
        `;
      }

      html += `
        <div class="card">
          <button class="btn btn-secondary" onclick="loadPortal()">重新整理</button>
        </div>
      `;

      document.getElementById('app').innerHTML = html;
    }

    function renderOrderCard(order) {
      const canTrack = !!order.hasTracking;
      const mergedOrderNos = Array.isArray(order.orderNos) ? order.orderNos.filter(Boolean) : [];
      const mergedCount = mergedOrderNos.length || (order.orderNo ? 1 : 0);
      const mergedOrderText = mergedOrderNos.length ? mergedOrderNos.join(' / ') : (order.orderNo || '');
      const detailLines = Array.isArray(order.detailLines) ? order.detailLines : [];
      const etaText = order.etaText || '';
      const statusInfo = getStatusInfo(order);
      const photos = Array.isArray(order.photos) ? order.photos : [];

      return `
        <div class="order-card">
          <div class="order-title">配送批次單號：${escapeHtml(order.orderNo || '')}</div>

          ${mergedCount > 1 ? `
            <div class="merge-box">
              <div><b>合併單數：</b>${mergedCount} 張</div>
              <div><b>合併單號：</b>${escapeHtml(mergedOrderText)}</div>
            </div>
          ` : ''}

          <div class="row">送貨地址：${escapeHtml(order.address || '')}</div>
          ${order.phone ? `<div class="row">電話：${escapeHtml(order.phone)}</div>` : ''}
          <div class="row">送貨時間：${escapeHtml(formatDeliveryDisplay(order.deliveryDateText, order.deliveryTime))}</div>

          <div class="detail-block">
            <div class="detail-title">明細</div>
            ${detailLines.length
              ? detailLines.map(line => `<div class="detail-line">${escapeHtml(line)}</div>`).join('')
              : `<div class="detail-line">無明細資料</div>`
            }
          </div>

          <div class="status-pill">
            <div class="status-banner ${statusInfo.className}">${escapeHtml(statusInfo.text)}</div>
            ${canTrack && etaText ? `
              <div class="eta-box">
                <div class="eta-title">預估送達時間</div>
                <div class="eta-time">${escapeHtml(etaText)}</div>
              </div>
            ` : ''}
            ${canTrack ? `<button class="btn btn-secondary" style="margin-top:10px" onclick="goToTracking('${escapeHtml(order.orderNo || '')}')">查看送貨進度</button>` : ''}
            ${photos.length ? `
              <div class="photo-wrap">
                ${photos.map((photo, idx) => `
                  <a class="photo-item" href="${escapeHtml(photo.url || '')}" target="_blank">
                    <img src="${escapeHtml(photo.previewUrl || photo.url || '')}" alt="送達照片${idx + 1}">
                    <span class="photo-badge">照片${idx + 1}</span>
                  </a>
                `).join('')}
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    function goToTracking(orderNo) {
      location.href = 'tracking-detail.html?orderNo=' + encodeURIComponent(orderNo);
    }

    function getStatusInfo(order) {
      if (!order.hasTracking) return { text: '尚未排車', className: 'warn' };

      const taskStatus = String(order.taskStatus || '').trim();
      const taskStatusText = String(order.taskStatusText || '').trim();
      const driverName = String(order.driverName || '').trim();
      const etaText = String(order.etaText || '').trim();
      const driverSuffix = driverName ? `｜司機 ${driverName}` : '';
      const timeSuffix = formatStatusTimeLabel(order);

      if (taskStatus === '已完成') return { text: taskStatusText || `送貨已完成${driverSuffix}${timeSuffix}`, className: 'done' };
      if (['放門口','改送隔壁','聯繫後改期','取消配送','特殊回報'].includes(taskStatus)) {
        return { text: taskStatusText || taskStatus, className: taskStatus === '取消配送' ? 'cancel' : 'warn' };
      }
      if (etaText) return { text: `司機配送中${driverSuffix}`, className: 'active' };
      return { text: `理貨中${driverSuffix}`, className: 'preparing' };
    }

    function formatStatusTimeLabel(order) {
      if (String(order.taskStatus || '').trim() !== '已完成') return '';
      const dt = new Date(String(order.updatedAt || '').trim());
      if (isNaN(dt.getTime())) return '';
      const hh = String(dt.getHours()).padStart(2, '0');
      const mm = String(dt.getMinutes()).padStart(2, '0');
      const periodLabel = order.deliveryTime ? `${order.deliveryTime} ` : '';
      return `｜${periodLabel}${hh}:${mm}`;
    }

    function renderRequestForm() {
      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="status warn">尚未開通查詢權限</div>
          <div class="muted">
            請輸入你的 4 位客戶代號。<br>
            例如 389，系統會自動補成 0389。<br>
            送出後將進入待審查狀態。
          </div>
          <input id="clientCodeInput" class="input" type="text" inputmode="numeric" placeholder="請輸入客戶代號">
          <button class="btn btn-primary" onclick="submitRequest()">送出申請</button>
        </div>
      `;
    }

    function renderPending(requestCode) {
      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="status warn">申請審查中</div>
          <div class="muted">
            你送出的申請客編為：<b>${escapeHtml(requestCode || '')}</b><br>
            請等待凱撒衛浴確認開通。
          </div>
          <button class="btn btn-secondary" onclick="loadPortal()">重新整理</button>
        </div>
      `;
    }

    function renderRejected() {
      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="status bad">目前未開通查詢權限</div>
          <div class="muted">
            你的申請目前未通過。<br>
            如有需要，請洽凱撒衛浴協助確認。
          </div>
          <button class="btn btn-secondary" onclick="renderRequestForm()">重新申請</button>
        </div>
      `;
    }

    function renderMessage(msg, cls) {
      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="status ${cls || ''}">${escapeHtml(msg || '')}</div>
        </div>
      `;
    }

    async function submitRequest() {
      const input = document.getElementById('clientCodeInput');
      if (!input) return;

      let code = String(input.value || '').replace(/[^\d]/g, '');
      if (!code) { alert('請輸入客戶代號'); return; }
      code = code.padStart(4, '0').slice(-4);

      const payload = {
        action: 'submit_customer_access_request',
        uid: currentUid,
        displayName: currentDisplayName,
        requestClientCode: code
      };

      const resp = await fetch(GAS_WEBAPP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const text = await resp.text();
      let json = {};
      try { json = JSON.parse(text); } catch (e) { alert(text || '送出申請失敗'); return; }
      if (!json.ok) { alert(json.message || json.error || '送出申請失敗'); return; }
      renderPending(code);
    }

    function formatDeliveryDisplay(dateText, periodText) {
      const datePart = formatDateOnly(dateText);
      const periodPart = String(periodText || '').trim();
      return [datePart, periodPart].filter(Boolean).join(' ');
    }

    function formatDateOnly(value) {
      if (!value) return '';
      const text = String(value).trim();
      const m = text.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
      if (m) return `${m[1]}/${String(m[2]).padStart(2,'0')}/${String(m[3]).padStart(2,'0')}`;
      const d = new Date(text);
      if (!isNaN(d.getTime())) {
        return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
      }
      return text;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    initPage();
  </script>
</body>
</html>
