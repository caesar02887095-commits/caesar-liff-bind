<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand-line">
        <div class="brand-title">凱撒衛浴配送查詢</div>
        <img class="brand-logo" src="LOGO.png" alt="CAESAR" />
      </div>
      <div class="sub" id="userInfo">載入中...</div>
    </div>

    <div id="app">
      <div class="card">
        <div class="loading"><div class="loading-spinner"></div><div id="loadingText" class="loading-main">正在讀取配送資料...</div><div id="loadingHint" class="loading-hint"></div></div>
      </div>
    </div>

    <div class="system-footer">
      <div class="system-footer-main">本頁由新竹凱撒總經銷配送系統提供</div>
      <div>新竹總經銷｜日生商行 / 正新衛浴有限公司</div>
    </div>
  </div>


  <script>
    const LIFF_ID = '2009380550-ow9SlJK4';
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxmUEj7tu2ZbqZaIESXhu9oS73QdE8qOGRKmHONqHXf-H6pL3zdYxuSvssjOExQNJjlhA/exec';
    const SELF_PICKUP_LOCATION = '新竹縣竹北市環北路一段278號 (凱撒衛浴)';

    const RETURN_URL_KEY = 'caesar_return_url';
    const RETURN_RESTORED_KEY = 'caesar_return_restored';

    let currentUid = '';
    let currentDisplayName = '';
    let currentSharePayload = null;
    let lastPortalUpdatedAt = null;
    const MANUAL_REFRESH_COOLDOWN_MS = 60000;
    let manualRefreshCooldownUntil = 0;
    let manualRefreshTimer = null;
    let manualRefreshInFlight = false;
    let shareProgressInFlight = false;
    let requestSubmitInFlight = false;
    let loadingTimers = [];

    function startPortalLoadingSequence() {
      renderLoadingState('正在讀取配送資料...', '');
      scheduleLoadingMessage(2000, '正在確認查詢權限...', '');
      scheduleLoadingMessage(5000, '資料較多，系統正在整理送貨進度，請稍候...', '');
      scheduleLoadingMessage(10000, '系統仍在讀取中，請不要關閉頁面。', '系統仍在處理資料，通常再等一下就會完成。');
      scheduleLoadingMessage(30000, '讀取時間較長，系統仍在處理中。', '若仍未完成，可按下方按鈕重新讀取配送資料。', true);
    }

    function renderLoadingState(mainText, hintText, showRetry) {
      const app = document.getElementById('app');
      if (!app) return;
      app.innerHTML = `
        <div class="card">
          <div class="loading">
            <div class="loading-spinner"></div>
            <div id="loadingText" class="loading-main">${escapeHtml(mainText || '正在讀取配送資料...')}</div>
            <div id="loadingHint" class="loading-hint">${escapeHtml(hintText || '')}</div>
            ${showRetry ? `<button class="btn btn-secondary loading-retry" onclick="retryInitialPortalLoad()">重新讀取配送資料</button>` : ''}
          </div>
        </div>
      `;
    }

    function scheduleLoadingMessage(ms, mainText, hintText, showRetry) {
      const timer = setTimeout(() => {
        renderLoadingState(mainText, hintText, showRetry);
      }, ms);
      loadingTimers.push(timer);
    }

    function stopLoadingSequence() {
      loadingTimers.forEach(timer => clearTimeout(timer));
      loadingTimers = [];
    }

    function retryInitialPortalLoad() {
      stopLoadingSequence();
      startPortalLoadingSequence();
      loadPortal().catch(err => renderMessage('載入失敗：' + ((err && err.message) ? err.message : err), 'bad'));
    }


    function stringifyLiffError_(err) {
      if (!err) return '';
      if (typeof err === 'string') return err;
      if (err.message) return err.message;
      if (err.stack) return err.stack;
      try { return JSON.stringify(err); } catch (e) { return String(err); }
    }

    function isLiffTokenExpiredError_(err) {
      const text = stringifyLiffError_(err).toLowerCase();
      return text.includes('access token expired') ||
        text.includes('token expired') ||
        text.includes('invalid access token') ||
        text.includes('expired token');
    }

    function retryLineVerification() {
      try {
        sessionStorage.removeItem(RETURN_RESTORED_KEY);
        prepareLoginRedirect_();
        if (typeof liff !== 'undefined' && liff.isLoggedIn && liff.isLoggedIn()) {
          try { liff.logout(); } catch (e) {}
        }
      } catch (e) {}
      window.location.reload();
    }

    function renderTokenExpiredMessage_() {
      stopLoadingSequence();
      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="status warn">登入狀態已過期</div>
          <div class="muted" style="margin-top:10px; line-height:1.8;">
            LINE 驗證資訊已過期，請重新驗證後再查詢配送進度。
          </div>
          <button class="btn btn-primary" style="margin-top:14px;" onclick="retryLineVerification()">重新驗證</button>
        </div>
      `;
    }

    async function initPage() {
      try {
        startPortalLoadingSequence();
        saveCurrentPageState_();

        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          prepareLoginRedirect_();
          liff.login({ redirectUri: window.location.href });
          return;
        }

        if (restoreReturnPageIfNeeded_()) {
          return;
        }

        cleanupAuthNoise_();

        const profile = await liff.getProfile();
        currentUid = profile.userId || '';
        currentDisplayName = profile.displayName || '';

        document.getElementById('userInfo').innerHTML =
          `LINE 使用者：<b>${escapeHtml(currentDisplayName || '未辨識')}</b>`;

        await loadPortal();
      } catch (err) {
        if (isLiffTokenExpiredError_(err)) {
          renderTokenExpiredMessage_();
          return;
        }
        renderMessage('載入失敗：' + (err.message || err), 'bad');

    function prepareLoginRedirect_() {

        sessionStorage.removeItem(RETURN_RESTORED_KEY);
      } catch (e) {}

    function restoreReturnPageIfNeeded_() {
      try {
        const savedUrl = sessionStorage.getItem(RETURN_URL_KEY) || '';
        const restored = sessionStorage.getItem(RETURN_RESTORED_KEY) || '';

        if (!savedUrl) return false;

        const currentUrl = window.location.href;
        const savedClean = normalizeUrlForCompare_(savedUrl);
        const currentClean = normalizeUrlForCompare_(currentUrl);

        if (savedClean && currentClean && savedClean !== currentClean && restored !== '1') {
          sessionStorage.setItem(RETURN_RESTORED_KEY, '1');
          window.location.replace(savedUrl);
          return true;
        }

        sessionStorage.removeItem(RETURN_RESTORED_KEY);
        sessionStorage.removeItem(RETURN_URL_KEY);
        return false;
      } catch (e) {
        return false;
      }
    }

    function normalizeUrlForCompare_(url) {
      try {
        const u = new URL(url);
        const params = new URLSearchParams(u.search);
        params.delete('code');
        params.delete('state');
        params.delete('friendship_status_changed');
        params.delete('liffClientId');
        params.delete('liffRedirectUri');
        params.delete('access_token');
        params.delete('id_token');
        params.delete('expires_in');
        params.delete('token_type');

        const search = params.toString();
        return u.origin + u.pathname + (search ? '?' + search : '') + (u.hash || '');
      } catch (e) {
        return url;
      }
    }

    function cleanupAuthNoise_() {
      try {
        const url = new URL(window.location.href);
        const params = url.searchParams;

        const noisyKeys = [
          'code',
          'state',
          'friendship_status_changed',
          'liffClientId',
          'liffRedirectUri',
          'access_token',
          'id_token',
          'expires_in',
          'token_type'
        ];

        let changed = false;
        noisyKeys.forEach(key => {
          if (params.has(key)) {
            params.delete(key);
            changed = true;
          }
        });

        if (changed) {
          const newUrl = url.origin + url.pathname + (params.toString() ? '?' + params.toString() : '') + (url.hash || '');
          window.history.replaceState({}, '', newUrl);
        }
      } catch (e) {}
    }

    function normalizeSummaryDate_(value) {
      if (!value) return '';

      if (value instanceof Date && !isNaN(value.getTime())) {
        return summaryDateFromDateObj_(value);
      }

      const text = String(value || '').trim();
      if (!text) return '';

      let m = text.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
      if (m) return String(Number(m[2])).padStart(2, '0') + '/' + String(Number(m[3])).padStart(2, '0');

      m = text.match(/^(\d{1,2})[\/\-](\d{1,2})/);
      if (m) return String(Number(m[1])).padStart(2, '0') + '/' + String(Number(m[2])).padStart(2, '0');

      const parsed = new Date(text);
      if (!isNaN(parsed.getTime())) {
        return summaryDateFromDateObj_(parsed);
      }

      return text;
    }

    function summaryDateFromDateObj_(dateObj) {
      const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      const dd = String(dateObj.getDate()).padStart(2, '0');
      return mm + '/' + dd;
    }

    function normalizeSummaryPeriod_(value) {
      const text = String(value || '').trim();
      if (!text) return '';
      if (text.indexOf('上午') !== -1) return '上午';
      if (text.indexOf('下午') !== -1) return '下午';
      if (/\bAM\b/i.test(text)) return '上午';
      if (/\bPM\b/i.test(text)) return '下午';
      return text;
    }

    function summaryPeriodSortValue_(period) {
      const text = String(period || '').trim();
      if (text === '上午') return 1;
      if (text === '下午') return 2;
      return 9;
    }

    async function refreshPortalManually() {

      manualRefreshInFlight = true;
      manualRefreshCooldownUntil = now + MANUAL_REFRESH_COOLDOWN_MS;
      updateManualRefreshButton();

      try {
        await loadPortal({ silent: true, manual: true });
      } catch (e) {
        alert((e && e.message) ? e.message : '更新失敗，請稍後再試');

    function updateManualRefreshButton() {
      if (manualRefreshTimer) {
        clearTimeout(manualRefreshTimer);
        manualRefreshTimer = null;
      }

      const btn = document.getElementById('manualRefreshBtn');
      if (!btn) return;

      const remainMs = manualRefreshCooldownUntil - Date.now();
      if (manualRefreshInFlight) {
        btn.disabled = true;
        btn.textContent = '更新配送進度中...';
        manualRefreshTimer = setTimeout(updateManualRefreshButton, 500);
      } else if (remainMs > 0) {
        const remainSec = Math.ceil(remainMs / 1000);
        btn.disabled = true;
        btn.textContent = `更新配送進度（${remainSec} 秒後可再次更新）`;

    function parseCustomerDeliveryDateClient(deliveryDateText) {
      const raw = deliveryDateText;
      const text = String(raw || '').trim();
      if (!text) return null;

      if (raw instanceof Date && !Number.isNaN(raw.getTime())) {
        return new Date(raw.getFullYear(), raw.getMonth(), raw.getDate(), 0, 0, 0);
      }

      let m = text.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
      if (m) {
        const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), 0, 0, 0);
        return Number.isNaN(d.getTime()) ? null : d;
      }

      // GAS / JSON 有時會把日期物件轉成：Tue May 19 2026 00:00:00 GMT+0800 (台北標準時間)
      // 或 ISO 日期字串。這類格式不含 yyyy/MM/dd，但瀏覽器可用 Date 解析。
      if (/GMT|UTC|^[A-Z][a-z]{2}\s+[A-Z][a-z]{2}\s+\d{1,2}\s+\d{4}|T\d{2}:\d{2}:\d{2}/.test(text)) {
        const nativeDate = new Date(text);
        if (!Number.isNaN(nativeDate.getTime())) {
          return new Date(nativeDate.getFullYear(), nativeDate.getMonth(), nativeDate.getDate(), 0, 0, 0);
        }
      }

      m = text.match(/(^|\D)(\d{1,2})[\/\-](\d{1,2})(\D|$)/);
      if (m) {
        const now = new Date();
        const d = new Date(now.getFullYear(), Number(m[2]) - 1, Number(m[3]), 0, 0, 0);
        return Number.isNaN(d.getTime()) ? null : d;
      }

      return null;
    }

    function getCustomerEtaEndDateClient(etaText, deliveryDateText, deliveryTimeText) {
      const baseDate = parseCustomerDeliveryDateClient(deliveryDateText);
      if (!baseDate) return null;

      const rawEta = String(etaText || '')
        .replace(/[－—~～]/g, '–')
        .replace(/上午/g, 'AM')
        .replace(/下午/g, 'PM')
        .replace(/中午/g, 'PM');
      const rawPeriod = String(deliveryTimeText || '')
        .replace(/上午/g, 'AM')
        .replace(/下午/g, 'PM')
        .replace(/中午/g, 'PM');

      const matches = [];
      const re = /(AM|PM)?\s*(\d{1,2})\s*[:：]\s*(\d{2})/gi;
      let match;
      while ((match = re.exec(rawEta)) !== null) {
        matches.push({
          meridiem: String(match[1] || '').toUpperCase(),
          hour: Number(match[2]),
          minute: Number(match[3])
        });
      }
      if (!matches.length) return null;

      const last = matches[matches.length - 1];
      let meridiem = last.meridiem;
      const meridiemFromEta = !!meridiem;
      if (!meridiem) {
        if (/PM/i.test(rawPeriod)) meridiem = 'PM';
        if (/AM/i.test(rawPeriod)) meridiem = 'AM';
      }

      let h = Number(last.hour);
      const min = Number(last.minute);
      if (Number.isNaN(h) || Number.isNaN(min) || h < 0 || h > 23 || min < 0 || min > 59) return null;

      // v52：配送 ETA 常見格式為「11:52–12:02」且時段欄位為「上午」。
      // 舊版會把沒有明確 AM/PM 的 12:02 套用上午並轉成凌晨 00:02，導致剛出發就被判定延遲。
      // 若 AM/PM 是由「送貨時間=上午」推導而來，12:xx 應視為中午 12:xx，不轉凌晨。
      if (meridiem === 'PM' && h < 12) h += 12;
      if (meridiem === 'AM' && h === 12 && meridiemFromEta) h = 0;

      return new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate(), h, min, 0);
    }

    function isCustomerEtaOverdueClient(etaText, deliveryDateText, deliveryTimeText, taskStatusText) {
      const eta = String(etaText || '').trim();
      if (!eta) return false;
      if (eta === getCustomerEtaDelayTextClient()) return true;

      const status = String(taskStatusText || '').trim();
      if (['已完成', '放門口', '改送隔壁', '聯繫後改期', '取消配送', '特殊回報'].includes(status)) return false;

      const etaEnd = getCustomerEtaEndDateClient(eta, deliveryDateText, deliveryTimeText);
      if (!etaEnd) return false;
      return Date.now() > etaEnd.getTime();
    }

    }

    function parseDetailLineForDisplay(line) {
      const raw = String(line || '').trim();
      if (!raw) return { orderNo: '', items: [] };

      let orderNo = '';
      let body = raw;
      const dashIndex = raw.indexOf(' - ');
      if (dashIndex >= 0) {
        orderNo = raw.slice(0, dashIndex).trim();
        body = raw.slice(dashIndex + 3).trim();
      }

      const items = body
        .split(/\s{2,}|\s*\/\s*/)
        .map(part => part.trim())
        .filter(Boolean)
        .map(part => {
          const pieces = part.split(/[＊*×xX]/);
          const model = String(pieces[0] || '').trim();
          const qty = String(pieces.slice(1).join('*') || '').trim();
          return { model, qty };
        })
        .filter(item => item.model);

      if (!items.length && body) {
        return { orderNo, fallback: body, items: [] };
      }
      return { orderNo, items };
    }

            <div class="info-row"><span class="info-label">取貨時間：</span><span class="info-value">${escapeHtml(formatDeliveryDisplay(etaFields.deliveryDateText || order.deliveryDateText, etaFields.deliveryTime || order.deliveryTime))}</span></div>
          ` : `
            <div class="info-row"><span class="info-label">送貨地址：</span><span class="info-value">${escapeHtml(order.address || '')}</span></div>
            ${formatPhoneForDisplay(order.phone) ? `<div class="info-row"><span class="info-label">電　　話：</span><span class="info-value">${escapeHtml(formatPhoneForDisplay(order.phone))}</span></div>` : ''}
            <div class="info-row"><span class="info-label">送貨時間：</span><span class="info-value">${escapeHtml(formatDeliveryDisplay(etaFields.deliveryDateText || order.deliveryDateText, etaFields.deliveryTime || order.deliveryTime))}</span></div>
          `}

          <details class="detail-block">
            <summary>
              <div class="detail-summary-row">
                <span class="detail-summary-label">訂單明細${detailLines.length ? `（${detailLines.length} 筆）` : ''}</span>
                <span class="detail-summary-action"></span>
              </div>
            </summary>
            <div class="detail-content-box">
              ${renderDetailLines(detailLines)}
            </div>
          </details>

          ${photos.length ? `
            <div class="photo-wrap">
              ${photos.map((photo, idx) => `
                <a class="photo-item" href="${escapeHtml(photo.url || '')}" target="_blank"><img loading="lazy" decoding="async" src="${escapeHtml(photo.previewUrl || photo.url || '')}" alt="送達照片${idx + 1}"><span class="photo-badge">照片${idx + 1}</span></a>
              `).join('')}
            </div>
          ` : ''}
          ${renderEtaDebugBoxClient(order)}

          ${canShareProgress ? `
            <div class="share-row">
              <button class="share-btn" onclick="openShareProgress('${escapeJs(order.orderNo || '')}')">分享送貨進度連結</button>
            </div>
          ` : ''}
        </div>
      `;
    }


    function getCustomerFriendlyStatusText(taskStatus, fallbackText) {
      const status = String(taskStatus || '').trim();
      const fallback = String(fallbackText || '').trim();
      if (status === '已完成') return '已完成配送';
      if (status === '放門口') return '已依客戶同意完成下貨';
      if (status === '聯繫後改期') return '已依客戶聯繫結果改期';
      if (status === '取消配送') return '已依客戶通知取消本次配送';
      if (status === '特殊回報') return '配送狀況已回報，請聯繫店家確認';
      if (status === '改送隔壁') return '已依客戶同意完成配送';
      return fallback || status;
    }

    function getStatusInfo(order) {
      if (isSelfPickupOrder(order)) {
        return { text: '待自取', className: 'pickup' };
      }

      if (!order.hasTracking) {
        return { text: '尚未排車', className: 'warn' };
      }

      const taskStatus = String(order.taskStatus || '').trim();
      const taskStatusText = String(order.taskStatusText || '').trim();
      const driverName = String(order.driverName || '').trim();
      const etaFields = getCustomerEtaFieldsClient(order);
      const etaText = getCustomerEtaDisplayTextClient(etaFields.etaText, etaFields.deliveryDateText, etaFields.deliveryTime, etaFields.taskStatusText);
      const etaOverdue = isCustomerEtaOverdueClient(etaFields.etaText, etaFields.deliveryDateText, etaFields.deliveryTime, etaFields.taskStatusText);
      const driverSuffix = driverName ? `｜司機 ${driverName}` : '';
      const timeSuffix = formatStatusTimeLabel(order);

      if (taskStatus === '已完成') {
        return { text: getCustomerFriendlyStatusText(taskStatus, taskStatusText) + timeSuffix, className: 'done' };
      }
      if (taskStatus === '放門口' || taskStatus === '改送隔壁' || taskStatus === '聯繫後改期' || taskStatus === '取消配送' || taskStatus === '特殊回報') {
        return {
          text: getCustomerFriendlyStatusText(taskStatus, taskStatusText),
          className: taskStatus === '取消配送' ? 'cancel' : 'warn'
        };
      }
      if (etaOverdue) {
        return { text: getCustomerEtaDelayTextClient(), className: 'warn' };
      }
      if (etaText) {
        return { text: `司機配送中${driverSuffix}`, className: 'active' };
      }
      return { text: `理貨中${driverSuffix}`, className: 'preparing' };
    }




    function isTerminalOrderStatus(order) {
      const status = String((order && order.taskStatus) || '').trim();
      return ['已完成', '放門口', '改送隔壁', '聯繫後改期', '取消配送', '特殊回報', '待自取'].includes(status);
    }

    function formatStatusTimeLabel(order) {
      const taskStatus = String(order.taskStatus || '').trim();
      if (taskStatus !== '已完成') return '';

      const raw = String(order.updatedAt || '').trim();
      if (!raw) return '';

      const dt = new Date(raw);
      if (isNaN(dt.getTime())) return '';

      const hh = String(dt.getHours()).padStart(2, '0');
      const mm = String(dt.getMinutes()).padStart(2, '0');
      const periodText = String(order.deliveryTime || '').trim();
      const periodLabel = periodText ? `${periodText} ` : '';
      return `｜${periodLabel}${hh}:${mm}`;
    }


    function renderAnnouncement(text) {
      const content = String(text || '').trim();
      if (!content) return '';
      return `
        <div class="card announcement-card">
          <div class="announcement-title">公告</div>
          <div class="announcement-content">${escapeHtml(content)}</div>
        </div>
      `;
    }

    function isSelfPickupText(text) {
      return String(text || '').indexOf('自取') !== -1;
    }

    function isSelfPickupOrder(order) {
      if (!order) return false;
      if (order.isSelfPickup === true) return true;
      if (String(order.taskStatus || '').trim() === '待自取') return true;
      return isSelfPickupText(order.address || '');
    }

    function isSpecifiedDelivery(address) {
      const text = String(address || '').trim();
      if (!text || isSelfPickupText(text)) return false;
      return text !== '送店';
    }

    function formatPhoneForDisplay(phone) {
      const text = String(phone || '').trim();
      if (!text) return '';
      const digits = text.replace(/\D/g, '');
      if (digits.length === 9 && digits.startsWith('9')) return '0' + digits;
      return text;
    }

    function escapeJs(str) {
      return String(str || '')
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/\n/g, '\\n')
        .replace(/\r/g, '');
    }

    async function copyOrderNo(orderNo) {
      const text = String(orderNo || '').trim();
      if (!text) return;
      const ok = await copyText(text);
      alert(ok ? '已複製單號：' + text : '複製失敗，請手動選取單號');
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (e) {}

      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(textarea);
        return ok;
      } catch (e) {
        return false;
      }
    }

    async function openShareProgress(orderNo) {
      if (shareProgressInFlight) return;
      const normalizedOrderNo = String(orderNo || '').trim();
      if (!normalizedOrderNo) return;

      shareProgressInFlight = true;
      updateShareProgressButtons(true);

      try {
        const payload = {
          action: 'create_delivery_share_token',
          uid: currentUid,
          orderNo: normalizedOrderNo
        };

        const resp = await fetch(GAS_WEBAPP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const text = await resp.text();
        let json = {};
        try {
          json = JSON.parse(text);
        } catch (e) {
          throw new Error(text || '產生分享連結失敗');
        }

        if (!json.ok) {
          throw new Error(json.message || json.error || '產生分享連結失敗');
        }

        const detail = json.detail || {};
        const shareUrl = buildShareUrl(json.token || '');
        currentSharePayload = {
          token: json.token || '',
          url: shareUrl,
          orderNo: detail.orderNo || normalizedOrderNo,
          storeName: detail.storeName || '',
          address: detail.address || '',
          etaText: detail.etaText || '',
          text: buildShareText(detail.storeName || '', detail.orderNo || normalizedOrderNo, detail.address || '', shareUrl)
        };
        await shareViaSystem();
      } catch (err) {
        alert(err.message || err || '產生分享連結失敗');
      } finally {
        shareProgressInFlight = false;
        updateShareProgressButtons(false);
      }
    }

    function updateShareProgressButtons(disabled) {
      document.querySelectorAll('.share-btn').forEach(btn => {
        btn.disabled = !!disabled;
        btn.textContent = disabled ? '產生分享內容中...' : '分享送貨進度連結';
      });
    }

    function buildShareUrl(token) {
      const url = new URL('tracking-detail.html', window.location.href);
      url.search = '';
      url.hash = '';
      url.searchParams.set('shareToken', token || '');
      return url.toString();
    }

    function buildShareText(storeName, orderNo, address, shareUrl) {
      return [
        '凱撒衛浴配送進度',
        '店家名稱：' + (storeName || ''),
        '單號：' + (orderNo || '') + '（訂單追蹤）',
        '送達地址：' + (address || ''),
        '網址：',
        shareUrl || ''
      ].join('\n');
    }

    function isMobileShareEnvironment_() {
      const ua = navigator.userAgent || '';
      return /Android|iPhone|iPad|iPod/i.test(ua);
    }

    async function shareViaSystem() {
      if (!currentSharePayload) return;

      // 桌機版瀏覽器的系統分享支援度不穩，直接複製文字較可靠。
      if (!isMobileShareEnvironment_()) {
        await copyShareLink();
        return;
      }

      // 手機版優先叫出原生分享選單；若 LINE 內建瀏覽器 / 系統分享失敗，立即退回複製分享文字。
      try {
        if (navigator.share) {
          const shareData = {
            title: '凱撒衛浴配送進度',
            text: currentSharePayload.text || ''
          };
          await navigator.share(shareData);
          return;
        }
      } catch (e) {
        console.warn('Native share failed, fallback to clipboard:', e);
      }

      await copyShareLink();
    }

    async function copyShareLink() {
      if (!currentSharePayload) return;
      const ok = await copyText(currentSharePayload.text || currentSharePayload.url || '');
      alert(ok ? '已複製分享內容' : '複製失敗，請手動複製連結');
    }

    function renderRequestForm() {
      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="status warn">尚未開通查詢權限</div>
          <div class="muted">
            請送出 LINE 查詢權限申請。<br>
            公司名稱與客戶編號可選填，不清楚也可送出，凱撒衛浴會協助確認。
          </div>
          <input id="companyNameInput" class="input" type="text" placeholder="公司名稱（選填）">
          <input id="clientCodeInput" class="input" type="text" inputmode="numeric" placeholder="客戶編號（選填，例如 389）">
          <button class="btn btn-primary" id="requestSubmitBtn" onclick="submitRequest()">送出申請</button>
        </div>
      `;
    }

    function renderPending(requestCode) {
      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="status warn">申請審查中</div>
          <div class="muted">
            ${requestCode ? `你送出的申請客編為：<b>${escapeHtml(requestCode)}</b><br>` : ''}
            請等待凱撒衛浴確認開通。
          </div>
          <button class="btn btn-secondary" onclick="loadPortal()">重新整理</button>
        </div>
      `;
    }

    function renderRejected() {
      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="status bad">目前未開通查詢權限</div>
          <div class="muted">
            你的申請目前未通過。<br>
            如有需要，請洽凱撒衛浴協助確認。
          </div>
          <button class="btn btn-secondary" onclick="renderRequestForm()">重新申請</button>
        </div>
      `;
    }

    function renderMessage(msg, cls) {
      stopLoadingSequence();
      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="status ${cls || ''}">${escapeHtml(msg || '')}</div>
        </div>
      `;
    }

    function setRequestSubmitLoading(isLoading) {
      requestSubmitInFlight = !!isLoading;
      const btn = document.getElementById('requestSubmitBtn');
      if (!btn) return;

      btn.disabled = !!isLoading;
      btn.innerHTML = isLoading
        ? '<span class="btn-inline-loading"><span class="btn-spinner"></span><span>申請送出中...</span></span>'
        : '送出申請';
    }

    async function submitRequest() {
      if (requestSubmitInFlight) return;

      const codeInput = document.getElementById('clientCodeInput');
      const companyInput = document.getElementById('companyNameInput');
      if (!codeInput) return;

      const rawCode = String(codeInput.value || '').replace(/[^\d]/g, '');
      const code = rawCode ? rawCode.padStart(4, '0').slice(-4) : '';
      const companyName = String(companyInput ? companyInput.value || '' : '').trim();

      const payload = {
        action: 'submit_customer_access_request',
        uid: currentUid,
        displayName: currentDisplayName,
        companyName: companyName,
        requestClientCode: code
      };

      setRequestSubmitLoading(true);

      try {
        const resp = await fetch(GAS_WEBAPP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const text = await resp.text();
        let json = {};
        try {
          json = JSON.parse(text);
        } catch (e) {
          alert(text || '送出申請失敗');
          setRequestSubmitLoading(false);
          return;
        }

        if (!json.ok) {
          alert(json.message || json.error || '送出申請失敗');
          setRequestSubmitLoading(false);
          return;
        }

        renderPending(code);
      } catch (e) {
        console.error('submitRequest failed:', e);
        alert('送出申請失敗，請稍後再試。');
        setRequestSubmitLoading(false);
      }
    }

    function formatDeliveryDisplay(dateText, periodText) {
      const datePart = formatDateOnly(dateText);
      const periodPart = String(periodText || '').trim();
      return [datePart, periodPart].filter(Boolean).join(' ');
    }

    function formatDateOnly(value) {
      if (!value) return '';

      if (value instanceof Date && !isNaN(value.getTime())) {
        return formatDateObj(value);
      }

      const text = String(value).trim();

      const m = text.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
      if (m) {
        const y = m[1];
        const mm = String(m[2]).padStart(2, '0');
        const dd = String(m[3]).padStart(2, '0');
        return `${y}/${mm}/${dd}`;
      }

      const d = new Date(text);
      if (!isNaN(d.getTime())) {
        return formatDateObj(d);
      }

      return text;
    }

    function formatDateObj(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}/${m}/${day}`;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    initPage();
  </script>
</body>
