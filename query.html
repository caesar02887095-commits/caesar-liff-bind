<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>凱撒衛浴查詢入口</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f5f6f8;
      color: #222;
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 12px;
    }
    .topbar {
      background: #2c3e50;
      color: #fff;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 14px;
      line-height: 1.6;
      opacity: 0.95;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .status {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .muted {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
    }
    .input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      margin-top: 8px;
      margin-bottom: 10px;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-primary {
      background: #EBA13A;
      color: #fff;
    }
    .btn-secondary {
      background: #d9dde3;
      color: #333;
      margin-top: 8px;
    }
    .order-card {
      border: 1px solid #d8dee8;
      border-radius: 14px;
      padding: 14px;
      margin-top: 14px;
      background: #ffffff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .order-title {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 12px;
      padding: 10px 12px;
      background: #eef4fb;
      border-left: 4px solid #2c3e50;
      border-radius: 8px;
      color: #1f2937;
    }
    .row {
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 6px;
      color: #374151;
    }
    .merge-box {
      margin: 4px 0 12px 0;
      padding: 10px 12px;
      background: #f8fafc;
      border: 1px solid #dbe4ef;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.7;
      color: #334155;
    }
    .detail-block {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #cfd8e3;
    }
    .detail-title {
      font-size: 14px;
      font-weight: bold;
      color: #374151;
      margin-bottom: 6px;
    }
    .detail-line {
      font-size: 14px;
      line-height: 1.8;
      color: #374151;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .photo-wrap { margin-top: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .photo-item { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid #dbe4ef; background: #fff; display:block; text-decoration:none; }
    .photo-item img { width: 100%; display: block; aspect-ratio: 1 / 1; object-fit: cover; }
    .photo-badge { position:absolute; right:6px; bottom:6px; background: rgba(17,24,39,0.7); color:#fff; font-size:11px; padding:3px 6px; border-radius:999px; }
    .status-pill {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed #d1d5db;
    }
    .status-banner {
      margin-top: 10px;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: bold;
      line-height: 1.6;
    }
    .status-banner.done {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }
    .status-banner.active {
      background: #dbeafe;
      color: #1d4ed8;
      border: 1px solid #93c5fd;
    }
    .status-banner.preparing {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fcd34d;
    }
    .status-banner.warn {
      background: #ffedd5;
      color: #9a3412;
      border: 1px solid #fdba74;
    }
    .status-banner.cancel {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
    .eta-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
      border-radius: 12px;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 10px;
    }
    .eta-title {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .eta-time {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.2;
    }
    .loading {
      text-align: center;
      color: #666;
      padding: 28px 12px;
      font-size: 15px;
    }
    .ok { color: #166534; }
    .warn { color: #9a3412; }
    .bad { color: #991b1b; }

    .announcement-card {
      background: #fff7ed;
      border: 1px solid #fdba74;
      color: #9a3412;
    }
    .announcement-title {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .announcement-content {
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-line;
      word-break: break-word;
    }
    .order-title-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .mini-btn {
      border: none;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      background: #e5e7eb;
      color: #374151;
      white-space: nowrap;
    }
    .share-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .share-btn {
      flex: 1;
      min-width: 120px;
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      background: #EBA13A;
      color: #fff;
    }
    .share-sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.45);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 9999;
      padding: 12px;
      box-sizing: border-box;
    }
    .share-sheet-backdrop.show {
      display: flex;
    }
    .share-sheet {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.18);
      box-sizing: border-box;
    }
    .share-sheet-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #111827;
    }
    .share-sheet-desc {
      font-size: 13px;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 12px;
      word-break: break-word;
    }
    .share-option {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 12px;
      margin-top: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #f3f4f6;
      color: #111827;
    }
    .share-option.primary {
      background: #06c755;
      color: #fff;
    }
    .share-option.orange {
      background: #EBA13A;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title">凱撒衛浴查詢入口</div>
      <div class="sub" id="userInfo">載入中...</div>
    </div>

    <div id="app">
      <div class="card">
        <div class="loading">系統載入中...</div>
      </div>
    </div>
  </div>


  <div class="share-sheet-backdrop" id="shareSheetBackdrop" onclick="handleShareBackdropClick(event)">
    <div class="share-sheet">
      <div class="share-sheet-title">分享送貨進度</div>
      <div class="share-sheet-desc" id="shareSheetDesc">產生分享連結中...</div>
      <button class="share-option primary" onclick="shareViaLine()">LINE 分享卡片</button>
      <button class="share-option orange" onclick="shareViaSystem()">系統分享 / 複製文字</button>
      <button class="share-option" onclick="copyShareLink()">複製連結</button>
      <button class="share-option" onclick="hideShareSheet()">取消</button>
    </div>
  </div>

  <script>
    const LIFF_ID = '2009380550-ow9SlJK4';
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxmUEj7tu2ZbqZaIESXhu9oS73QdE8qOGRKmHONqHXf-H6pL3zdYxuSvssjOExQNJjlhA/exec';

    const RETURN_URL_KEY = 'caesar_return_url';
    const RETURN_RESTORED_KEY = 'caesar_return_restored';

    let currentUid = '';
    let currentDisplayName = '';
    let currentSharePayload = null;

    async function initPage() {
      try {
        saveCurrentPageState_();

        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          prepareLoginRedirect_();
          liff.login({ redirectUri: window.location.href });
          return;
        }

        if (restoreReturnPageIfNeeded_()) {
          return;
        }

        cleanupAuthNoise_();

        const profile = await liff.getProfile();
        currentUid = profile.userId || '';
        currentDisplayName = profile.displayName || '';

        document.getElementById('userInfo').innerHTML =
          `LINE 使用者：<b>${escapeHtml(currentDisplayName || '未辨識')}</b>`;

        await loadPortal();
        startAutoRefresh();
      } catch (err) {
        renderMessage('載入失敗：' + (err.message || err), 'bad');
      }
    }

    function saveCurrentPageState_() {
      try {
        if (window.location.search.includes('liff.state=') || window.location.search.includes('code=')) {
          return;
        }
        sessionStorage.setItem(RETURN_URL_KEY, window.location.href);
      } catch (e) {}
    }

    function prepareLoginRedirect_() {
      try {
        sessionStorage.setItem(RETURN_URL_KEY, window.location.href);
        sessionStorage.removeItem(RETURN_RESTORED_KEY);
      } catch (e) {}
    }

    function restoreReturnPageIfNeeded_() {
      try {
        const savedUrl = sessionStorage.getItem(RETURN_URL_KEY) || '';
        const restored = sessionStorage.getItem(RETURN_RESTORED_KEY) || '';

        if (!savedUrl) return false;

        const currentUrl = window.location.href;
        const savedClean = normalizeUrlForCompare_(savedUrl);
        const currentClean = normalizeUrlForCompare_(currentUrl);

        if (savedClean && currentClean && savedClean !== currentClean && restored !== '1') {
          sessionStorage.setItem(RETURN_RESTORED_KEY, '1');
          window.location.replace(savedUrl);
          return true;
        }

        sessionStorage.removeItem(RETURN_RESTORED_KEY);
        sessionStorage.removeItem(RETURN_URL_KEY);
        return false;
      } catch (e) {
        return false;
      }
    }

    function normalizeUrlForCompare_(url) {
      try {
        const u = new URL(url);
        const params = new URLSearchParams(u.search);
        params.delete('code');
        params.delete('state');
        params.delete('friendship_status_changed');
        params.delete('liffClientId');
        params.delete('liffRedirectUri');
        params.delete('access_token');
        params.delete('id_token');
        params.delete('expires_in');
        params.delete('token_type');

        const search = params.toString();
        return u.origin + u.pathname + (search ? '?' + search : '') + (u.hash || '');
      } catch (e) {
        return url;
      }
    }

    function cleanupAuthNoise_() {
      try {
        const url = new URL(window.location.href);
        const params = url.searchParams;

        const noisyKeys = [
          'code',
          'state',
          'friendship_status_changed',
          'liffClientId',
          'liffRedirectUri',
          'access_token',
          'id_token',
          'expires_in',
          'token_type'
        ];

        let changed = false;
        noisyKeys.forEach(key => {
          if (params.has(key)) {
            params.delete(key);
            changed = true;
          }
        });

        if (changed) {
          const newUrl = url.origin + url.pathname + (params.toString() ? '?' + params.toString() : '') + (url.hash || '');
          window.history.replaceState({}, '', newUrl);
        }
      } catch (e) {}
    }

    let autoRefreshTimer = null;

    function startAutoRefresh() {
      stopAutoRefresh();
      autoRefreshTimer = setInterval(() => {
        if (document.hidden) return;
        loadPortal({ silent: true });
      }, 20000);
    }

    function stopAutoRefresh() {
      if (autoRefreshTimer) {
        clearInterval(autoRefreshTimer);
        autoRefreshTimer = null;
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        loadPortal({ silent: true });
      }
    });

    async function loadPortal(options = {}) {
      const silent = !!options.silent;
      const url = `${GAS_WEBAPP_URL}?action=get_customer_portal&uid=${encodeURIComponent(currentUid)}&_ts=${Date.now()}`;
      const resp = await fetch(url, { cache: 'no-store' });
      const json = await resp.json();

      if (!json.ok) {
        renderMessage(json.error || '讀取失敗', 'bad');
        return;
      }

      const data = json.data || {};
      const status = data.accessStatus || '';

      if (status === 'APPROVED') {
        renderApproved(data);
        return;
      }

      if (status === 'PENDING') {
        renderPending(data.requestCode || '');
        return;
      }

      if (status === 'REJECTED') {
        renderRejected();
        return;
      }

      renderRequestForm();
    }

    function renderApproved(data) {
      const orders = Array.isArray(data.orders) ? data.orders : [];
      const customerName = data.customerName || '';

      let html = `
        <div class="card">
          <div class="status ok">已開通查詢權限</div>
          <div class="muted">
            店家名稱：<b>${escapeHtml(customerName || '')}</b>
          </div>
        </div>
        ${renderAnnouncement(data.announcement || '')}
      `;

      if (!orders.length) {
        html += `
          <div class="card">
            <div class="status">目前沒有可查詢資料</div>
            <div class="muted">目前這批資料中沒有待配送或可查詢訂單。</div>
          </div>
        `;
      } else {
        html += `
          <div class="card">
            <div class="status">訂單 / 配送查詢</div>
            ${orders.map(order => renderOrderCard(order)).join('')}
          </div>
        `;
      }

      html += `
        <div class="card">
          <button class="btn btn-secondary" onclick="loadPortal()">重新整理</button>
        </div>
      `;

      document.getElementById('app').innerHTML = html;
    }

    function renderOrderCard(order) {
      const canTrack = !!order.hasTracking;
      const mergedOrderNos = Array.isArray(order.orderNos) ? order.orderNos.filter(Boolean) : [];
      const mergedCount = mergedOrderNos.length || (order.orderNo ? 1 : 0);
      const mergedOrderText = mergedOrderNos.length ? mergedOrderNos.join(' / ') : (order.orderNo || '');
      const detailLines = Array.isArray(order.detailLines) ? order.detailLines : [];
      const etaText = order.etaText || '';
      const statusInfo = getStatusInfo(order);
      const photos = Array.isArray(order.photos) ? order.photos : [];
      const canShareProgress = canTrack && isSpecifiedDelivery(order.address || '');

      return `
        <div class="order-card">
          <div class="order-title order-title-line">
            <span>配送批次單號：${escapeHtml(order.orderNo || '')}</span>
            <button class="mini-btn" onclick="copyOrderNo('${escapeJs(order.orderNo || '')}')">複製單號</button>
          </div>

          ${mergedCount > 1 ? `
            <div class="merge-box">
              <div><b>合併單數：</b>${mergedCount} 張</div>
              <div><b>合併單號：</b>${escapeHtml(mergedOrderText)}</div>
            </div>
          ` : ''}

          <div class="row">送貨地址：${escapeHtml(order.address || '')}</div>
          ${formatPhoneForDisplay(order.phone) ? `<div class="row">電話：${escapeHtml(formatPhoneForDisplay(order.phone))}</div>` : ''}
          <div class="row">送貨時間：${escapeHtml(formatDeliveryDisplay(order.deliveryDateText, order.deliveryTime))}</div>

          <div class="detail-block">
            <div class="detail-title">明細</div>
            ${detailLines.length
              ? detailLines.map(line => `<div class="detail-line">${escapeHtml(line)}</div>`).join('')
              : `<div class="detail-line">無明細資料</div>`
            }
          </div>

          <div class="status-pill">
            <div class="status-banner ${statusInfo.className}">${escapeHtml(statusInfo.text)}</div>
            ${canTrack && etaText ? `
              <div class="eta-box">
                <div class="eta-title">預估送達時間</div>
                <div class="eta-time">${escapeHtml(etaText)}</div>
              </div>
            ` : ''}
            ${photos.length ? `
              <div class="photo-wrap">
                ${photos.map((photo, idx) => `
                  <a class="photo-item" href="${escapeHtml(photo.url || '')}" target="_blank"><img src="${escapeHtml(photo.previewUrl || photo.url || '')}" alt="送達照片${idx + 1}"><span class="photo-badge">照片${idx + 1}</span></a>
                `).join('')}
              </div>
            ` : ''}
          </div>

          ${canShareProgress ? `
            <div class="share-row">
              <button class="share-btn" onclick="openShareProgress('${escapeJs(order.orderNo || '')}')">分享送貨進度</button>
            </div>
          ` : ''}
        </div>
      `;
    }

    function getStatusInfo(order) {
      if (!order.hasTracking) {
        return { text: '尚未排車', className: 'warn' };
      }

      const taskStatus = String(order.taskStatus || '').trim();
      const taskStatusText = String(order.taskStatusText || '').trim();
      const driverName = String(order.driverName || '').trim();
      const etaText = String(order.etaText || '').trim();
      const driverSuffix = driverName ? `｜司機 ${driverName}` : '';
      const timeSuffix = formatStatusTimeLabel(order);

      if (taskStatus === '已完成') {
        return { text: taskStatusText || `送貨已完成${driverSuffix}${timeSuffix}`, className: 'done' };
      }
      if (taskStatus === '放門口' || taskStatus === '改送隔壁' || taskStatus === '聯繫後改期' || taskStatus === '取消配送' || taskStatus === '特殊回報') {
        return {
          text: taskStatusText || taskStatus,
          className: taskStatus === '取消配送' ? 'cancel' : 'warn'
        };
      }
      if (etaText) {
        return { text: `司機配送中${driverSuffix}`, className: 'active' };
      }
      return { text: `理貨中${driverSuffix}`, className: 'preparing' };
    }


    function formatStatusTimeLabel(order) {
      const taskStatus = String(order.taskStatus || '').trim();
      if (taskStatus !== '已完成') return '';

      const raw = String(order.updatedAt || '').trim();
      if (!raw) return '';

      const dt = new Date(raw);
      if (isNaN(dt.getTime())) return '';

      const hh = String(dt.getHours()).padStart(2, '0');
      const mm = String(dt.getMinutes()).padStart(2, '0');
      const periodText = String(order.deliveryTime || '').trim();
      const periodLabel = periodText ? `${periodText} ` : '';
      return `｜${periodLabel}${hh}:${mm}`;
    }


    function renderAnnouncement(text) {
      const content = String(text || '').trim();
      if (!content) return '';
      return `
        <div class="card announcement-card">
          <div class="announcement-title">公告</div>
          <div class="announcement-content">${escapeHtml(content)}</div>
        </div>
      `;
    }

    function isSpecifiedDelivery(address) {
      const text = String(address || '').trim();
      return !!text && text !== '送店';
    }

    function formatPhoneForDisplay(phone) {
      const text = String(phone || '').trim();
      if (!text) return '';
      const digits = text.replace(/\D/g, '');
      if (digits.length === 9 && digits.startsWith('9')) return '0' + digits;
      return text;
    }

    function escapeJs(str) {
      return String(str || '')
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/\n/g, '\\n')
        .replace(/\r/g, '');
    }

    async function copyOrderNo(orderNo) {
      const text = String(orderNo || '').trim();
      if (!text) return;
      const ok = await copyText(text);
      alert(ok ? '已複製單號：' + text : '複製失敗，請手動選取單號');
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (e) {}

      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(textarea);
        return ok;
      } catch (e) {
        return false;
      }
    }

    async function openShareProgress(orderNo) {
      const normalizedOrderNo = String(orderNo || '').trim();
      if (!normalizedOrderNo) return;

      try {
        const payload = {
          action: 'create_delivery_share_token',
          uid: currentUid,
          orderNo: normalizedOrderNo
        };

        const resp = await fetch(GAS_WEBAPP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const text = await resp.text();
        let json = {};
        try {
          json = JSON.parse(text);
        } catch (e) {
          throw new Error(text || '產生分享連結失敗');
        }

        if (!json.ok) {
          throw new Error(json.message || json.error || '產生分享連結失敗');
        }

        const detail = json.detail || {};
        const shareUrl = buildShareUrl(json.token || '');
        currentSharePayload = {
          token: json.token || '',
          url: shareUrl,
          orderNo: detail.orderNo || normalizedOrderNo,
          storeName: detail.storeName || '',
          address: detail.address || '',
          etaText: detail.etaText || '',
          text: buildShareText(detail.storeName || '', detail.orderNo || normalizedOrderNo, detail.address || '', shareUrl)
        };
        await shareViaSystem();
      } catch (err) {
        alert(err.message || err || '產生分享連結失敗');
      }
    }

    function buildShareUrl(token) {
      const url = new URL('tracking-detail.html', window.location.href);
      url.search = '';
      url.hash = '';
      url.searchParams.set('shareToken', token || '');
      return url.toString();
    }

    function buildShareText(storeName, orderNo, address, shareUrl) {
      return [
        '凱撒衛浴配送進度',
        '',
        `店家名稱：${storeName || ''}`,
        `單號：${orderNo || ''}（訂單追蹤）`,
        '',
        `送達地址：${address || ''}`,
        '預估送達：請查看連結',
        '',
        '網址：',
        shareUrl || ''
      ].join('\n');
    }

    async function sharePreparedProgress() {
      if (!currentSharePayload) return;
      try {
        if (typeof liff !== 'undefined' && liff.isApiAvailable && liff.isApiAvailable('shareTargetPicker')) {
          const msg = buildLineShareMessage(currentSharePayload);
          await liff.shareTargetPicker([msg]);
          return;
        }
      } catch (e) {
        console.warn('LINE share failed', e);
      }

      try {
        if (navigator.share) {
          await navigator.share({
            title: '凱撒衛浴配送進度',
            text: currentSharePayload.text || ''
          });
          return;
        }
      } catch (e) {
        if (e && e.name === 'AbortError') return;
      }

      const ok = await copyText(currentSharePayload.text || currentSharePayload.url || '');
      alert(ok ? '已複製分享內容' : '分享功能無法開啟，請手動複製連結');
    }

    function showShareSheet() {
      const backdrop = document.getElementById('shareSheetBackdrop');
      const desc = document.getElementById('shareSheetDesc');
      if (desc && currentSharePayload) {
        desc.textContent = `${currentSharePayload.storeName || ''}｜單號 ${currentSharePayload.orderNo || ''}`;
      }
      if (backdrop) backdrop.classList.add('show');
    }

    function hideShareSheet() {
      const backdrop = document.getElementById('shareSheetBackdrop');
      if (backdrop) backdrop.classList.remove('show');
    }

    function handleShareBackdropClick(event) {
      if (event.target && event.target.id === 'shareSheetBackdrop') hideShareSheet();
    }

    async function shareViaLine() {
      if (!currentSharePayload) return;

      if (!(typeof liff !== 'undefined' && liff.isApiAvailable && liff.isApiAvailable('shareTargetPicker'))) {
        alert('目前環境無法開啟 LINE 分享卡片，將改用系統分享 / 複製文字。');
        await shareViaSystem();
        return;
      }

      try {
        const msg = buildLineShareMessage(currentSharePayload);
        await liff.shareTargetPicker([msg]);
        hideShareSheet();
        return;
      } catch (e) {
        console.warn('LINE share failed', e);
        alert('LINE 分享卡片開啟失敗，將改用系統分享 / 複製文字。');
      }

      await shareViaSystem();
    }

    function buildLineShareMessage(payload) {
      const etaText = '請查看連結';
      return {
        type: 'flex',
        altText: '凱撒衛浴配送進度 ' + (payload.orderNo || ''),
        contents: {
          type: 'bubble',
          size: 'mega',
          header: {
            type: 'box',
            layout: 'vertical',
            backgroundColor: '#EBA13A',
            paddingAll: '16px',
            contents: [
              { type: 'text', text: '凱撒衛浴配送進度', color: '#FFFFFF', weight: 'bold', size: 'lg' }
            ]
          },
          body: {
            type: 'box',
            layout: 'vertical',
            spacing: 'sm',
            contents: [
              { type: 'text', text: '店家名稱：' + (payload.storeName || ''), size: 'sm', wrap: true, color: '#374151' },
              { type: 'text', text: '單號：' + (payload.orderNo || ''), weight: 'bold', size: 'md', wrap: true },
              { type: 'text', text: '送達地址：' + (payload.address || ''), size: 'sm', wrap: true, color: '#374151' },
              { type: 'text', text: '預估送達：' + etaText, size: 'sm', wrap: true, color: '#374151' }
            ]
          },
          footer: {
            type: 'box',
            layout: 'vertical',
            contents: [
              {
                type: 'button',
                style: 'primary',
                color: '#2c3e50',
                action: { type: 'uri', label: '查看訂單追蹤', uri: payload.url || '' }
              }
            ]
          }
        }
      };
    }

    async function shareViaSystem() {
      if (!currentSharePayload) return;
      try {
        if (navigator.share) {
          await navigator.share({
            title: '凱撒衛浴配送進度',
            text: currentSharePayload.text || ''
          });
          hideShareSheet();
          return;
        }
      } catch (e) {
        if (e && e.name === 'AbortError') return;
      }
      await copyShareLink();
    }

    async function copyShareLink() {
      if (!currentSharePayload) return;
      const ok = await copyText(currentSharePayload.text || currentSharePayload.url || '');
      alert(ok ? '已複製分享內容' : '複製失敗，請手動複製連結');
      if (ok) hideShareSheet();
    }

    function renderRequestForm() {
      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="status warn">尚未開通查詢權限</div>
          <div class="muted">
            請輸入你的 4 位客戶代號。<br>
            例如 389，系統會自動補成 0389。<br>
            送出後將進入待審查狀態。
          </div>
          <input id="clientCodeInput" class="input" type="text" inputmode="numeric" placeholder="請輸入客戶代號">
          <button class="btn btn-primary" onclick="submitRequest()">送出申請</button>
        </div>
      `;
    }

    function renderPending(requestCode) {
      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="status warn">申請審查中</div>
          <div class="muted">
            你送出的申請客編為：<b>${escapeHtml(requestCode || '')}</b><br>
            請等待凱撒衛浴確認開通。
          </div>
          <button class="btn btn-secondary" onclick="loadPortal()">重新整理</button>
        </div>
      `;
    }

    function renderRejected() {
      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="status bad">目前未開通查詢權限</div>
          <div class="muted">
            你的申請目前未通過。<br>
            如有需要，請洽凱撒衛浴協助確認。
          </div>
          <button class="btn btn-secondary" onclick="renderRequestForm()">重新申請</button>
        </div>
      `;
    }

    function renderMessage(msg, cls) {
      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="status ${cls || ''}">${escapeHtml(msg || '')}</div>
        </div>
      `;
    }

    async function submitRequest() {
      const input = document.getElementById('clientCodeInput');
      if (!input) return;

      let code = String(input.value || '').replace(/[^\d]/g, '');
      if (!code) {
        alert('請輸入客戶代號');
        return;
      }
      code = code.padStart(4, '0').slice(-4);

      const payload = {
        action: 'submit_customer_access_request',
        uid: currentUid,
        displayName: currentDisplayName,
        requestClientCode: code
      };

      const resp = await fetch(GAS_WEBAPP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });

      const text = await resp.text();
      let json = {};
      try {
        json = JSON.parse(text);
      } catch (e) {
        alert(text || '送出申請失敗');
        return;
      }

      if (!json.ok) {
        alert(json.message || json.error || '送出申請失敗');
        return;
      }

      renderPending(code);
    }

    function formatDeliveryDisplay(dateText, periodText) {
      const datePart = formatDateOnly(dateText);
      const periodPart = String(periodText || '').trim();
      return [datePart, periodPart].filter(Boolean).join(' ');
    }

    function formatDateOnly(value) {
      if (!value) return '';

      if (value instanceof Date && !isNaN(value.getTime())) {
        return formatDateObj(value);
      }

      const text = String(value).trim();

      const m = text.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
      if (m) {
        const y = m[1];
        const mm = String(m[2]).padStart(2, '0');
        const dd = String(m[3]).padStart(2, '0');
        return `${y}/${mm}/${dd}`;
      }

      const d = new Date(text);
      if (!isNaN(d.getTime())) {
        return formatDateObj(d);
      }

      return text;
    }

    function formatDateObj(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}/${m}/${day}`;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    initPage();
  </script>
</body>
