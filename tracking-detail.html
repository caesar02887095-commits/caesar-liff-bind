<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>送貨進度</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f5f6f8;
      color: #222;
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 12px;
    }
    .topbar {
      background: #ffffff;
      color: #1f2937;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      border: 1px solid #d8dee8;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .brand-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand-title {
      font-size: 19px;
      font-weight: 800;
      line-height: 1.35;
      color: #1f2937;
      letter-spacing: 0.5px;
    }
    .brand-logo {
      width: 108px;
      max-width: 34%;
      height: auto;
      display: block;
      object-fit: contain;
      flex-shrink: 0;
    }
    .sub {
      margin-top: 8px;
      font-size: 14px;
      line-height: 1.6;
      color: #64748b;
    }
    .system-footer {
      text-align: center;
      color: #6b7280;
      font-size: 12px;
      line-height: 1.7;
      padding: 10px 6px 18px;
    }
    .system-footer-main {
      font-weight: 600;
      color: #4b5563;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .status {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .row {
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 4px;
    }
    .photo-wrap { margin-top: 12px; display:flex; gap:8px; flex-wrap:wrap; }
    .photo-item { width: calc(50% - 4px); border-radius: 10px; overflow: hidden; border: 1px solid #dbe4ef; background:#fff; }
    .photo-item img { width:100%; display:block; aspect-ratio:4 / 3; object-fit:cover; }
    .photo-link { display:block; padding:6px 8px; font-size:12px; color:#1d4ed8; text-align:center; text-decoration:none; }
    .items {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #d1d5db;
      font-size: 14px;
      line-height: 1.7;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #d9dde3;
      color: #333;
    }
    .loading {
      text-align: center;
      color: #666;
      padding: 28px 12px;
      font-size: 15px;
    }
    .loading-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #e5e7eb;
      border-top: 3px solid #EBA13A;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 12px;
    }
    .loading-main {
      font-weight: bold;
      color: #374151;
      line-height: 1.7;
    }
    .loading-hint {
      margin-top: 8px;
      color: #777;
      font-size: 13px;
      line-height: 1.6;
    }
    .loading-retry {
      margin-top: 14px;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .ok { color: #166534; }
    .warn { color: #9a3412; }
    .bad { color: #991b1b; }

    .eta-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
      border-radius: 12px;
      padding: 12px;
      margin-top: 8px;
    }
    .eta-title {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .eta-time {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.2;
    }

    .status-banner {
      margin-top: 10px;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: bold;
      line-height: 1.6;
    }
    .status-banner.done {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }
    .status-banner.active {
      background: #dbeafe;
      color: #1d4ed8;
      border: 1px solid #93c5fd;
    }
    .status-banner.preparing {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fcd34d;
    }
    .status-banner.warn {
      background: #ffedd5;
      color: #9a3412;
      border: 1px solid #fdba74;
    }
    .status-banner.cancel {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      pointer-events: none;
    }

    .copy-order-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .copy-order-btn {
      border: none;
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: bold;
      background: #e5e7eb;
      color: #374151;
      cursor: pointer;
    }
    .copy-order-btn:disabled {
      opacity: 0.65;
      cursor: default;
    }
    .copy-order-hint {
      margin-top: 6px;
      font-size: 13px;
      line-height: 1.6;
      color: #64748b;
    }
    .copy-order-status {
      font-size: 12px;
      color: #166534;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand-line">
        <div class="brand-title">凱撒衛浴配送進度</div>
        <img class="brand-logo" src="LOGO.png" alt="CAESAR" />
      </div>
      <div class="sub" id="topInfo">載入中...</div>
    </div>

    <div id="app">
      <div class="card">
        <div class="loading"><div class="loading-spinner"></div><div id="loadingText" class="loading-main">正在讀取送貨進度...</div><div id="loadingHint" class="loading-hint"></div></div>
      </div>
    </div>

    <div class="system-footer">
      <div class="system-footer-main">本頁由新竹凱撒總經銷配送系統提供</div>
      <div>新竹總經銷｜日生商行 / 正新衛浴有限公司</div>
    </div>
  </div>

  <script>
    const LIFF_ID = '2009380550-ow9SlJK4';
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxmUEj7tu2ZbqZaIESXhu9oS73QdE8qOGRKmHONqHXf-H6pL3zdYxuSvssjOExQNJjlhA/exec';
    let currentUid = '';
    let currentOrderNo = '';
    let currentShareToken = '';
    let shareRepairRedirectCount = 0;
    let isShareMode = false;
    let lastDetailUpdatedAt = null;
    const MANUAL_REFRESH_COOLDOWN_MS = 60000;
    let manualRefreshCooldownUntil = 0;
    let manualRefreshTimer = null;
    let manualRefreshInFlight = false;
    let loadingTimers = [];

    function startDetailLoadingSequence() {
      renderLoadingState('正在讀取送貨進度...', '');
      scheduleLoadingMessage(2000, '正在確認追蹤連結...', '');
      scheduleLoadingMessage(5000, '系統正在整理最新配送狀態，請稍候...', '');
      scheduleLoadingMessage(10000, '系統仍在讀取中，請不要關閉頁面。', '系統仍在處理資料，通常再等一下就會完成。');
      scheduleLoadingMessage(30000, '讀取時間較長，系統仍在處理中。', '若仍未完成，可按下方按鈕重新讀取配送資料。', true);
    }

    function renderLoadingState(mainText, hintText, showRetry) {
      const app = document.getElementById('app');
      if (!app) return;
      app.innerHTML = `
        <div class="card">
          <div class="loading">
            <div class="loading-spinner"></div>
            <div id="loadingText" class="loading-main">${escapeHtml(mainText || '正在讀取送貨進度...')}</div>
            <div id="loadingHint" class="loading-hint">${escapeHtml(hintText || '')}</div>
            ${showRetry ? `<button class="btn loading-retry" onclick="retryInitialDetailLoad()">重新讀取配送資料</button>` : ''}
          </div>
        </div>
      `;
    }

    function scheduleLoadingMessage(ms, mainText, hintText, showRetry) {
      const timer = setTimeout(() => {
        renderLoadingState(mainText, hintText, showRetry);
      }, ms);
      loadingTimers.push(timer);
    }

    function stopLoadingSequence() {
      loadingTimers.forEach(timer => clearTimeout(timer));
      loadingTimers = [];
    }

    function retryInitialDetailLoad() {
      stopLoadingSequence();
      startDetailLoadingSequence();
      loadDetail().catch(err => renderMessage('讀取失敗：' + ((err && err.message) ? err.message : err), 'bad'));
    }

    function getQueryParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name) || '';
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        loadDetail({ silent: true });
      }
    });

    async function initPage() {
      try {
        startDetailLoadingSequence();
        const shareToken = getQueryParam('shareToken');
        if (shareToken) {
          isShareMode = true;
          currentShareToken = shareToken;
          document.getElementById('topInfo').innerHTML = '指定送貨進度查詢';
          await loadDetail();
          return;
        }

        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        const uid = profile.userId || '';
        const orderNo = getQueryParam('orderNo');

        document.getElementById('topInfo').innerHTML =
          `查詢單號：<b>${escapeHtml(orderNo || '')}</b>`;

        currentUid = uid;
        currentOrderNo = orderNo;
        await loadDetail();
      } catch (err) {
        renderMessage('讀取失敗：' + (err.message || err), 'bad');
      }
    }

    async function loadDetail(options = {}) {
      const url = isShareMode
        ? `${GAS_WEBAPP_URL}?action=get_customer_tracking_detail_by_token` +
          `&shareToken=${encodeURIComponent(currentShareToken)}` +
          `&_ts=${Date.now()}`
        : `${GAS_WEBAPP_URL}?action=get_customer_tracking_detail` +
          `&uid=${encodeURIComponent(currentUid)}` +
          `&orderNo=${encodeURIComponent(currentOrderNo)}` +
          `&_ts=${Date.now()}`;

      const resp = await fetch(url, { cache: 'no-store' });
      const json = await resp.json();

      if (!json.ok) {
        renderMessage(json.error || '讀取失敗', 'bad');
        return;
      }

      const data = json.data || {};

      if (data.shareMode && data.repaired && data.redirectShareToken) {
        if (shareRepairRedirectCount >= 1) {
          stopLoadingSequence();
          renderMessage('配送連結已更新，但目前無法自動開啟。請向店家重新索取最新連結。', 'warn');
          return;
        }

        shareRepairRedirectCount++;
        currentShareToken = data.redirectShareToken || '';
        updateShareTokenInUrl_(currentShareToken);
        renderLoadingState('配送連結已更新，正在重新開啟...', '請稍候，系統正在切換至最新追蹤連結。', false);
        await loadDetail({ silent: true, repaired: true });
        return;
      }

      lastDetailUpdatedAt = new Date();
      stopLoadingSequence();
      renderDetail(data);
      updateManualRefreshButton();
    }

    function updateShareTokenInUrl_(token) {
      if (!token) return;
      try {
        const url = new URL(window.location.href);
        url.searchParams.set('shareToken', token);
        window.history.replaceState({}, '', url.toString());
      } catch (e) {}
    }

    function renderDetail(data) {
      if (data.shareMode) {
        renderShareDetail(data);
        return;
      }

      if (!data.found) {
        document.getElementById('app').innerHTML = `
          <div class="card">
            <div class="status warn">目前無法查看送貨進度</div>
            <div class="row">此單尚未排車，或你沒有查看權限。</div>
          </div>
          <div class="card">
            <button class="btn" onclick="goBack()">返回查詢頁</button>
          </div>
        `;
        return;
      }

      const items = Array.isArray(data.items) ? data.items : [];
      const showEta = !!data.etaText && !isCompletedStatusData(data);
      const photos = Array.isArray(data.photos) ? data.photos : [];
      const statusInfo = getDetailStatusInfo(data);
      const placeText = isSpecifiedDelivery(data.address)
        ? '指定送達'
        : escapeHtml(data.storeName || '');

      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="status ${statusInfo.className}">${escapeHtml(statusInfo.text)}</div>
          <div class="row">單號：${escapeHtml(data.orderNo || '')}</div>
          <div class="row">店家名稱：${escapeHtml(data.storeName || '')}</div>
          <div class="row">送貨地點：${placeText}</div>
          ${data.phone ? `<div class="row">電話：${escapeHtml(data.phone)}</div>` : ''}
          <div class="row">送貨時間：${escapeHtml(formatDeliveryDisplay(data.deliveryDateText, data.deliveryTime))}</div>

          <div class="status-banner ${statusInfo.className}">${escapeHtml(statusInfo.text)}</div>

          ${showEta ? `
            <div class="eta-box">
              <div class="eta-title">預估送達時間</div>
              <div class="eta-time">${escapeHtml(data.etaText || '')}</div>
            </div>
          ` : ''}

          ${photos.length ? `<div class="photo-wrap">${photos.map((photo, idx) => `<a class="photo-item" href="${escapeHtml(photo.url || '')}" target="_blank"><img src="${escapeHtml(photo.previewUrl || photo.url || '')}" alt="送達照片${idx + 1}"><span class="photo-badge">照片${idx + 1}</span></a>`).join('')}</div>` : ''}
          <div class="items">
            ${items.map(item => `• ${escapeHtml(item.model || '')} x${escapeHtml(item.qty || '')}`).join('<br>')}
          </div>
          ${renderManualRefreshBlock()}
        </div>
        <div class="card">
          <button class="btn" onclick="goBack()">返回查詢頁</button>
        </div>
      `;
    }


    function renderShareDetail(data) {
      if (!data.found) {
        const expiredText = data.expired
          ? '此配送連結已失效，請向店家重新索取。'
          : (data.message || '此配送連結已更新或失效，請向店家重新索取。');
        document.getElementById('app').innerHTML = `
          <div class="card">
            <div class="status warn">目前無法查看送貨進度</div>
            <div class="row">${escapeHtml(expiredText)}</div>
          </div>
        `;
        return;
      }

      const statusInfo = getDetailStatusInfo(data);
      const etaText = data.etaText || '尚未產生 ETA';
      const phoneLast3 = data.phoneLast3 || '';
      const showEta = !!etaText && !isCompletedStatusData(data);

      document.getElementById('topInfo').innerHTML = `單號：<b>${escapeHtml(data.orderNo || '')}</b>`;
      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="status ${statusInfo.className}">凱撒衛浴配送進度</div>
          <div class="status-banner ${statusInfo.className}">${escapeHtml(statusInfo.text)}</div>
          ${showEta ? `
          <div class="eta-box">
            <div class="eta-title">預估送達時間</div>
            <div class="eta-time">${escapeHtml(etaText)}</div>
          </div>
          ` : ''}
          <div class="row">店家名稱：${escapeHtml(data.storeName || '')}</div>
          <div class="row">指定送達地址：${escapeHtml(data.address || '')}</div>
          ${phoneLast3 ? `<div class="row">聯絡電話末三碼：${escapeHtml(phoneLast3)}</div>` : ''}
          <div class="row copy-order-row">
            <span>單號：${escapeHtml(data.orderNo || '')}</span>
            ${data.orderNo ? `<button class="copy-order-btn" onclick="copyShareOrderNo('${escapeJs(data.orderNo || '')}')">複製</button><span class="copy-order-status" id="copyOrderStatus"></span>` : ''}
          </div>
          <div class="copy-order-hint">如需詢問或更改配送資訊，請將本單號提供給店家，方便協助查詢。</div>
          ${renderManualRefreshBlock()}
        </div>
        <div class="card">
          <div class="row">※ 本頁僅供指定收件人查看配送進度。</div>
          <div class="row">※ 預估時間會依司機回報與路況變動。</div>
        </div>
      `;
    }

    function renderManualRefreshBlock() {
      return `
        <div style="margin-top:12px;">
          <button class="btn" id="manualRefreshBtn" onclick="refreshDetailManually()">更新配送進度</button>
          <div class="row" style="text-align:center;color:#666;margin-top:8px;">最後更新：${escapeHtml(formatLastUpdateTime())}</div>
        </div>
      `;
    }

    async function refreshDetailManually() {
      const now = Date.now();
      if (manualRefreshInFlight || now < manualRefreshCooldownUntil) {
        updateManualRefreshButton();
        return;
      }

      manualRefreshInFlight = true;
      manualRefreshCooldownUntil = now + MANUAL_REFRESH_COOLDOWN_MS;
      updateManualRefreshButton();

      try {
        await loadDetail({ silent: true, manual: true });
      } catch (e) {
        alert((e && e.message) ? e.message : '更新失敗，請稍後再試');
      } finally {
        manualRefreshInFlight = false;
        updateManualRefreshButton();
      }
    }

    function updateManualRefreshButton() {
      if (manualRefreshTimer) {
        clearTimeout(manualRefreshTimer);
        manualRefreshTimer = null;
      }

      const btn = document.getElementById('manualRefreshBtn');
      if (!btn) return;

      const remainMs = manualRefreshCooldownUntil - Date.now();
      if (manualRefreshInFlight) {
        btn.disabled = true;
        btn.textContent = '更新配送進度中...';
        manualRefreshTimer = setTimeout(updateManualRefreshButton, 500);
      } else if (remainMs > 0) {
        const remainSec = Math.ceil(remainMs / 1000);
        btn.disabled = true;
        btn.textContent = `更新配送進度（${remainSec} 秒後可再次更新）`;
        manualRefreshTimer = setTimeout(updateManualRefreshButton, 1000);
      } else {
        btn.disabled = false;
        btn.textContent = '更新配送進度';
      }
    }


    function isCompletedStatusData(data) {
      const step = String(data && data.progressStep || '').trim();
      const text = String(data && data.progressText || '').trim();
      return step === 'DONE' || text === '送貨已完成' || text === '已完成';
    }

    function formatLastUpdateTime() {
      if (!lastDetailUpdatedAt) return '尚未更新';
      const hh = String(lastDetailUpdatedAt.getHours()).padStart(2, '0');
      const mm = String(lastDetailUpdatedAt.getMinutes()).padStart(2, '0');
      return `${hh}:${mm}`;
    }

    function getDetailStatusInfo(data) {
      const step = String(data.progressStep || '').trim();
      const text = String(data.progressText || '').trim();
      const driverName = String(data.driverName || '').trim();
      const etaText = String(data.etaText || '').trim();
      const driverSuffix = driverName ? `｜司機 ${driverName}` : '';
      const timeSuffix = formatDetailStatusTimeLabel(data);

      if (step === 'DONE' || text === '送貨已完成' || text === '已完成') {
        return { text: text || `送貨已完成${timeSuffix}`, className: 'done' };
      }
      if (step === 'CANCEL') {
        return { text: text || '配送已取消', className: 'cancel' };
      }
      if (step === 'DELAY') {
        return { text: text || '聯繫後改期', className: 'warn' };
      }
      if (text === '放門口' || text === '改送隔壁' || text === '特殊回報' || text.includes('已放門口') || text.includes('已改送隔壁') || text.includes('已改期')) {
        return { text: text, className: 'warn' };
      }
      if (etaText) {
        return { text: `司機配送中${driverSuffix}`, className: 'active' };
      }
      return { text: `理貨中${driverSuffix}`, className: 'preparing' };
    }


    function formatDetailStatusTimeLabel(data) {
      const step = String(data.progressStep || '').trim();
      const text = String(data.progressText || '').trim();
      if (!(step === 'DONE' || text === '送貨已完成' || text === '已完成')) return '';

      const raw = String(data.updatedAt || '').trim();
      if (!raw) return '';

      const dt = new Date(raw);
      if (isNaN(dt.getTime())) return '';

      const hh = String(dt.getHours()).padStart(2, '0');
      const mm = String(dt.getMinutes()).padStart(2, '0');
      const periodText = String(data.deliveryTime || '').trim();
      const periodLabel = periodText ? `${periodText} ` : '';
      return `｜${periodLabel}${hh}:${mm}`;
    }

    function isSpecifiedDelivery(address) {
      const text = String(address || '').trim();
      return !!text && text !== '送店';
    }

    function formatDeliveryDisplay(dateText, periodText) {
      const datePart = formatDateOnly(dateText);
      const periodPart = String(periodText || '').trim();
      return [datePart, periodPart].filter(Boolean).join(' ');
    }

    function formatDateOnly(value) {
      if (!value) return '';

      const text = String(value).trim();
      const m1 = text.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})$/);
      if (m1) {
        const y = m1[1];
        const m = m1[2].padStart(2, '0');
        const d = m1[3].padStart(2, '0');
        return `${y}/${m}/${d}`;
      }

      const d = new Date(value);
      if (!isNaN(d.getTime())) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}/${m}/${day}`;
      }

      return text;
    }

    function renderMessage(msg, cls) {
      stopLoadingSequence();
      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="status ${cls || ''}">${escapeHtml(msg || '')}</div>
        </div>
      `;
    }

    function goBack() {
      location.href = 'query.html';
    }

    async function copyShareOrderNo(orderNo) {
      const text = String(orderNo || '').trim();
      if (!text) return;

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          fallbackCopyText_(text);
        }
        showCopyOrderStatus_('已複製單號');
      } catch (e) {
        try {
          fallbackCopyText_(text);
          showCopyOrderStatus_('已複製單號');
        } catch (err) {
          alert('複製失敗，請手動長按單號複製');
        }
      }
    }

    function fallbackCopyText_(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
    }

    function showCopyOrderStatus_(message) {
      const el = document.getElementById('copyOrderStatus');
      if (!el) return;
      el.textContent = message || '';
      setTimeout(() => {
        const current = document.getElementById('copyOrderStatus');
        if (current) current.textContent = '';
      }, 1800);
    }

    function escapeJs(str) {
      return String(str || '')
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"')
        .replace(/\n/g, '\\n')
        .replace(/\r/g, '\\r');
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    initPage();
  </script>
</body>
</html>
