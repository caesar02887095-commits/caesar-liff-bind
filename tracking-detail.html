<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>送貨進度</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f5f6f8;
      color: #222;
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 12px;
    }
    .topbar {
      background: #2c3e50;
      color: #fff;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 14px;
      line-height: 1.6;
      opacity: 0.95;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .status {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .row {
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 4px;
    }
    .items {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #d1d5db;
      font-size: 14px;
      line-height: 1.7;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #d9dde3;
      color: #333;
    }
    .loading {
      text-align: center;
      color: #666;
      padding: 28px 12px;
      font-size: 15px;
    }
    .ok { color: #166534; }
    .warn { color: #9a3412; }
    .bad { color: #991b1b; }

    .eta-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
      border-radius: 12px;
      padding: 12px;
      margin-top: 8px;
    }
    .eta-title {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .eta-time {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.2;
    }

    .status-line {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #d1d5db;
      font-size: 16px;
      font-weight: bold;
      line-height: 1.6;
    }
    .status-line.done { color: #166534; }
    .status-line.active { color: #1d4ed8; }
    .status-line.warn { color: #9a3412; }
    .status-line.cancel { color: #991b1b; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title">送貨進度</div>
      <div class="sub" id="topInfo">載入中...</div>
    </div>

    <div id="app">
      <div class="card">
        <div class="loading">系統載入中...</div>
      </div>
    </div>
  </div>

  <script>
    const LIFF_ID = '2009380550-ow9SlJK4';
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxmUEj7tu2ZbqZaIESXhu9oS73QdE8qOGRKmHONqHXf-H6pL3zdYxuSvssjOExQNJjlhA/exec';
    let currentUid = '';
    let currentOrderNo = '';

    function getQueryParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name) || '';
    }

    let autoRefreshTimer = null;

    function startAutoRefresh() {
      stopAutoRefresh();
      autoRefreshTimer = setInterval(() => {
        if (document.hidden) return;
        loadDetail({ silent: true });
      }, 20000);
    }

    function stopAutoRefresh() {
      if (autoRefreshTimer) {
        clearInterval(autoRefreshTimer);
        autoRefreshTimer = null;
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        loadDetail({ silent: true });
      }
    });

    async function initPage() {
      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        const uid = profile.userId || '';
        const orderNo = getQueryParam('orderNo');

        document.getElementById('topInfo').innerHTML =
          `查詢單號：<b>${escapeHtml(orderNo || '')}</b>`;

        currentUid = uid;
        currentOrderNo = orderNo;
        await loadDetail();
        startAutoRefresh();
      } catch (err) {
        renderMessage('讀取失敗：' + (err.message || err), 'bad');
      }
    }

    async function loadDetail(options = {}) {
      const url =
        `${GAS_WEBAPP_URL}?action=get_customer_tracking_detail` +
        `&uid=${encodeURIComponent(currentUid)}` +
        `&orderNo=${encodeURIComponent(currentOrderNo)}` +
        `&_ts=${Date.now()}`;

      const resp = await fetch(url, { cache: 'no-store' });
      const json = await resp.json();

      if (!json.ok) {
        renderMessage(json.error || '讀取失敗', 'bad');
        return;
      }

      renderDetail(json.data || {});
    }

    function renderDetail(data) {
      if (!data.found) {
        document.getElementById('app').innerHTML = `
          <div class="card">
            <div class="status warn">目前無法查看送貨進度</div>
            <div class="row">此單尚未排車，或你沒有查看權限。</div>
          </div>
          <div class="card">
            <button class="btn" onclick="goBack()">返回查詢頁</button>
          </div>
        `;
        return;
      }

      const items = Array.isArray(data.items) ? data.items : [];
      const showEta = !!data.etaText;
      const statusInfo = getDetailStatusInfo(data);
      const placeText = isSpecifiedDelivery(data.address)
        ? '指定送達'
        : escapeHtml(data.storeName || '');

      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="status ${statusInfo.className}">${escapeHtml(statusInfo.text)}</div>
          <div class="row">單號：${escapeHtml(data.orderNo || '')}</div>
          <div class="row">店家名稱：${escapeHtml(data.storeName || '')}</div>
          <div class="row">送貨地點：${placeText}</div>
          ${data.phone ? `<div class="row">電話：${escapeHtml(data.phone)}</div>` : ''}
          <div class="row">送貨時間：${escapeHtml(formatDeliveryDisplay(data.deliveryDateText, data.deliveryTime))}</div>
          ${data.driverName ? `<div class="row">配送司機：${escapeHtml(data.driverName)}</div>` : ''}

          ${showEta ? `
            <div class="eta-box">
              <div class="eta-title">預估送達時間</div>
              <div class="eta-time">${escapeHtml(data.etaText || '')}</div>
            </div>
          ` : ''}

          <div class="status-line ${statusInfo.className}">${escapeHtml(statusInfo.text)}</div>

          <div class="items">
            ${items.map(item => `• ${escapeHtml(item.model || '')} x${escapeHtml(item.qty || '')}`).join('<br>')}
          </div>
        </div>
        <div class="card">
          <button class="btn" onclick="goBack()">返回查詢頁</button>
        </div>
      `;
    }

    function getDetailStatusInfo(data) {
      const step = String(data.progressStep || '').trim();
      const text = String(data.progressText || '').trim();

      if (step === 'DONE' || text === '送貨已完成' || text === '已完成') {
        return { text: '送貨已完成', className: 'done' };
      }
      if (step === 'CANCEL') {
        return { text: text || '配送已取消', className: 'cancel' };
      }
      if (step === 'DELAY') {
        return { text: text || '聯繫後改期', className: 'warn' };
      }
      if (text === '放門口' || text === '改送隔壁' || text === '特殊回報') {
        return { text: text, className: 'warn' };
      }
      return { text: '司機配送中', className: 'active' };
    }

    function isSpecifiedDelivery(address) {
      const text = String(address || '').trim();
      return !!text && text !== '送店';
    }

    function formatDeliveryDisplay(dateText, periodText) {
      const datePart = formatDateOnly(dateText);
      const periodPart = String(periodText || '').trim();
      return [datePart, periodPart].filter(Boolean).join(' ');
    }

    function formatDateOnly(value) {
      if (!value) return '';

      const text = String(value).trim();
      const m1 = text.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})$/);
      if (m1) {
        const y = m1[1];
        const m = m1[2].padStart(2, '0');
        const d = m1[3].padStart(2, '0');
        return `${y}/${m}/${d}`;
      }

      const d = new Date(value);
      if (!isNaN(d.getTime())) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}/${m}/${day}`;
      }

      return text;
    }

    function renderMessage(msg, cls) {
      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="status ${cls || ''}">${escapeHtml(msg || '')}</div>
        </div>
      `;
    }

    function goBack() {
      location.href = 'query.html';
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    initPage();
  </script>
</body>
</html>
