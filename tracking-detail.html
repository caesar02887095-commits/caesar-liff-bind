<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>送貨進度</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f5f6f8;
      color: #222;
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 12px;
    }
    .topbar {
      background: #2c3e50;
      color: #fff;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 14px;
      line-height: 1.6;
      opacity: 0.95;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .status {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .row {
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 4px;
    }
    .items {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #d1d5db;
      font-size: 14px;
      line-height: 1.7;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #d9dde3;
      color: #333;
    }
    .loading {
      text-align: center;
      color: #666;
      padding: 28px 12px;
      font-size: 15px;
    }
    .ok { color: #166534; }
    .warn { color: #9a3412; }
    .bad { color: #991b1b; }

    .eta-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
      border-radius: 12px;
      padding: 12px;
      margin-top: 8px;
    }
    .eta-title {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .eta-time {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.2;
    }

    .flow {
      margin-top: 10px;
    }
    .flow-step {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }
    .flow-dot {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      margin-top: 3px;
      flex-shrink: 0;
      background: #cbd5e1;
    }
    .flow-dot.active {
      background: #2563eb;
    }
    .flow-dot.done {
      background: #16a34a;
    }
    .flow-text {
      font-size: 14px;
      line-height: 1.6;
    }
    .flow-main {
      font-weight: bold;
    }
    .flow-sub {
      color: #6b7280;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title">送貨進度</div>
      <div class="sub" id="topInfo">載入中...</div>
    </div>

    <div id="app">
      <div class="card">
        <div class="loading">系統載入中...</div>
      </div>
    </div>
  </div>

  <script>
    const LIFF_ID = '2009380550-ow9SlJK4';
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxmUEj7tu2ZbqZaIESXhu9oS73QdE8qOGRKmHONqHXf-H6pL3zdYxuSvssjOExQNJjlhA/exec';
    const UID_CACHE_KEY = 'caesar_uid';

    fetch(GAS_WEBAPP_URL + '?action=ping&_ts=' + Date.now(), { cache: 'no-store' }).catch(() => {});

    function getQueryParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name) || '';
    }

    async function initPage() {
      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        let uid = sessionStorage.getItem(UID_CACHE_KEY) || '';
        if (uid) {
          liff.getProfile().then(profile => {
            sessionStorage.setItem(UID_CACHE_KEY, profile.userId || uid);
          }).catch(() => {});
        } else {
          const profile = await liff.getProfile();
          uid = profile.userId || '';
          sessionStorage.setItem(UID_CACHE_KEY, uid);
        }
        const orderNo = getQueryParam('orderNo');

        document.getElementById('topInfo').innerHTML =
          `查詢單號：<b>${escapeHtml(orderNo || '')}</b>`;

        const url =
          `${GAS_WEBAPP_URL}?action=get_customer_tracking_detail` +
          `&uid=${encodeURIComponent(uid)}` +
          `&orderNo=${encodeURIComponent(orderNo)}` +
          `&_ts=${Date.now()}`;

        const resp = await fetch(url, { cache: 'no-store' });
        const json = await resp.json();

        if (!json.ok) {
          renderMessage(json.error || '讀取失敗', 'bad');
          return;
        }

        renderDetail(json.data || {});
      } catch (err) {
        renderMessage('讀取失敗：' + (err.message || err), 'bad');
      }
    }

    function renderDetail(data) {
      if (!data.found) {
        document.getElementById('app').innerHTML = `
          <div class="card">
            <div class="status warn">目前無法查看送貨進度</div>
            <div class="row">此單尚未排車，或你沒有查看權限。</div>
          </div>
          <div class="card">
            <button class="btn" onclick="goBack()">返回查詢頁</button>
          </div>
        `;
        return;
      }

      const items = Array.isArray(data.items) ? data.items : [];
      const progressText = data.progressText || '';
      const progressStep = data.progressStep || '';
      const showEta = !!data.etaText;

      const placeText = isSpecifiedDelivery(data.address)
        ? '指定送達'
        : escapeHtml(data.storeName || '');

      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="status ok">${escapeHtml(progressText)}</div>
          <div class="row">單號：${escapeHtml(data.orderNo || '')}</div>
          <div class="row">店家名稱：${escapeHtml(data.storeName || '')}</div>
          <div class="row">送貨地點：${placeText}</div>
          ${data.phone ? `<div class="row">電話：${escapeHtml(data.phone)}</div>` : ''}
          <div class="row">送貨時間：${escapeHtml(formatDeliveryDisplay(data.deliveryDateText, data.deliveryTime))}</div>
          <div class="row">配送司機：${escapeHtml(data.driverName || '')}</div>

          ${showEta ? `
            <div class="eta-box">
              <div class="eta-title">預估送達時間</div>
              <div class="eta-time">${escapeHtml(data.etaText || '')}</div>
            </div>
          ` : ''}

          <div class="flow">
            ${renderFlow(progressStep)}
          </div>

          <div class="items">
            ${items.map(item => `• ${escapeHtml(item.model || '')} x${escapeHtml(item.qty || '')}`).join('<br>')}
          </div>
        </div>
        <div class="card">
          <button class="btn" onclick="goBack()">返回查詢頁</button>
        </div>
      `;
    }

    function renderFlow(step) {
      if (step === 'DONE') {
        return `
          <div class="flow-step">
            <div class="flow-dot done"></div>
            <div class="flow-text">
              <div class="flow-main">已排車</div>
            </div>
          </div>
          <div class="flow-step">
            <div class="flow-dot done"></div>
            <div class="flow-text">
              <div class="flow-main">司機配送中</div>
            </div>
          </div>
          <div class="flow-step">
            <div class="flow-dot done"></div>
            <div class="flow-text">
              <div class="flow-main">你的訂單已完成配送</div>
            </div>
          </div>
        `;
      }

      if (step === 'DELAY') {
        return `
          <div class="flow-step">
            <div class="flow-dot done"></div>
            <div class="flow-text">
              <div class="flow-main">已排車</div>
            </div>
          </div>
          <div class="flow-step">
            <div class="flow-dot active"></div>
            <div class="flow-text">
              <div class="flow-main">配送安排已異動</div>
              <div class="flow-sub">請等待後續通知</div>
            </div>
          </div>
        `;
      }

      if (step === 'CANCEL') {
        return `
          <div class="flow-step">
            <div class="flow-dot done"></div>
            <div class="flow-text">
              <div class="flow-main">已排車</div>
            </div>
          </div>
          <div class="flow-step">
            <div class="flow-dot active"></div>
            <div class="flow-text">
              <div class="flow-main">配送已取消</div>
            </div>
          </div>
        `;
      }

      return `
        <div class="flow-step">
          <div class="flow-dot done"></div>
          <div class="flow-text">
            <div class="flow-main">已排車</div>
          </div>
        </div>
        <div class="flow-step">
          <div class="flow-dot active"></div>
          <div class="flow-text">
            <div class="flow-main">司機配送中</div>
            <div class="flow-sub">正依路線順序前往送達</div>
          </div>
        </div>
        <div class="flow-step">
          <div class="flow-dot"></div>
          <div class="flow-text">
            <div class="flow-main">即將送達你的訂單</div>
          </div>
        </div>
      `;
    }

    function isSpecifiedDelivery(address) {
      const text = String(address || '').trim();
      return !!text && text !== '送店';
    }

    function formatDeliveryDisplay(dateText, periodText) {
      const datePart = formatDateOnly(dateText);
      const periodPart = String(periodText || '').trim();
      return [datePart, periodPart].filter(Boolean).join(' ');
    }

    function formatDateOnly(value) {
      if (!value) return '';

      const text = String(value).trim();
      const m1 = text.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})$/);
      if (m1) {
        const y = m1[1];
        const m = m1[2].padStart(2, '0');
        const d = m1[3].padStart(2, '0');
        return `${y}/${m}/${d}`;
      }

      const d = new Date(value);
      if (!isNaN(d.getTime())) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}/${m}/${day}`;
      }

      return text;
    }

    function renderMessage(msg, cls) {
      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="status ${cls || ''}">${escapeHtml(msg || '')}</div>
        </div>
      `;
    }

    function goBack() {
      location.href = 'query.html';
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    initPage();
  </script>
</body>
</html>
