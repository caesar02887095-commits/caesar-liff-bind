<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAESAR 凱撒衛浴</title>
  <style>
    body {
      background: #121212;
      color: white;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }

    #card {
      padding: 40px;
      border-radius: 15px;
      background: #1e1e1e;
      border: 1px solid #333;
      width: 85%;
      max-width: 460px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h2 {
      color: #EBA13A;
      letter-spacing: 5px;
      margin-bottom: 20px;
    }

    #loader {
      border: 3px solid #333;
      border-top: 3px solid #EBA13A;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    p {
      color: #BBBBBB;
      line-height: 1.7;
      white-space: pre-line;
      word-break: break-word;
    }

    .success {
      color: #2ecc71;
      font-weight: bold;
      font-size: 18px;
    }

    .error {
      color: #ff6b6b;
      font-weight: bold;
      font-size: 17px;
    }

    .sub {
      color: #999;
      font-size: 14px;
      margin-top: 12px;
      white-space: pre-line;
      word-break: break-word;
    }

    .debug {
      color: #888;
      font-size: 12px;
      margin-top: 14px;
      text-align: left;
      background: #151515;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="card">
    <h2>CAESAR</h2>
    <div id="loader"></div>
    <p id="msg">正在驗證身分，請稍候...</p>
    <div id="detail" class="sub"></div>
    <div id="debug" class="debug" style="display:none;"></div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    const LIFF_ID = "2009380550-ow9SlJK4";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxmUEj7tu2ZbqZaIESXhu9oS73QdE8qOGRKmHONqHXf-H6pL3zdYxuSvssjOExQNJjlhA/exec";

    let currentStep = "未開始";

    function setStep(stepText) {
      currentStep = stepText;
      document.getElementById("msg").innerHTML = stepText;
    }

    function setSuccess(titleHtml, detailHtml = "") {
      document.getElementById("loader").style.display = "none";
      document.getElementById("msg").innerHTML = titleHtml;
      document.getElementById("msg").className = "success";
      document.getElementById("detail").innerHTML = detailHtml;
      document.getElementById("debug").style.display = "none";
    }

    function setError(titleHtml, detailHtml = "", debugText = "") {
      document.getElementById("loader").style.display = "none";
      document.getElementById("msg").innerHTML = titleHtml;
      document.getElementById("msg").className = "error";
      document.getElementById("detail").innerHTML = detailHtml;

      const debugEl = document.getElementById("debug");
      if (debugText) {
        debugEl.style.display = "block";
        debugEl.textContent = debugText;
      } else {
        debugEl.style.display = "none";
        debugEl.textContent = "";
      }
    }

    function stringifyError(err) {
      if (!err) return "未知錯誤";
      if (typeof err === "string") return err;
      if (err.stack) return err.stack;
      if (err.message) return err.message;
      try {
        return JSON.stringify(err);
      } catch (_) {
        return String(err);
      }
    }

    async function main() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const cid = urlParams.get("cid") || "NEW";

        // Step 1
        setStep("步驟 1/5：檢查 LIFF SDK...");
        if (typeof liff === "undefined") {
          throw new Error("LIFF SDK 未載入，可能是網路或 SDK 載入失敗");
        }

        // Step 2
        setStep("步驟 2/5：初始化 LIFF...");
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          setStep("步驟 2/5：尚未登入，導向 LINE 登入...");
          liff.login();
          return;
        }

        // Step 3
        setStep("步驟 3/5：取得 LINE 使用者資料...");
        const profile = await liff.getProfile();

        const payload = {
          uid: profile.userId,
          displayName: profile.displayName || "客戶",
          cid: cid
        };

        // Step 4
        setStep("步驟 4/5：送出驗證請求到系統...");
        const query = new URLSearchParams(payload).toString();

        let response;
        try {
          response = await fetch(`${GAS_URL}?${query}`, {
            method: "GET"
          });
        } catch (fetchErr) {
          throw new Error(
            "無法連線到 Apps Script。\n" +
            "請優先檢查：\n" +
            "1. Web App 是否重新部署\n" +
            "2. GAS URL 是否為最新 exec\n" +
            "3. Web App 權限是否允許任何人存取\n" +
            "原始訊息：" + stringifyError(fetchErr)
          );
        }

        const rawText = await response.text();

        if (!response.ok) {
          throw new Error(
            "系統有回應，但 HTTP 狀態異常。\n" +
            "HTTP " + response.status + "\n" +
            "回應內容：" + rawText.substring(0, 300)
          );
        }

        // Step 5
        setStep("步驟 5/5：解析系統回應...");
        let result;
        try {
          result = JSON.parse(rawText);
        } catch (parseErr) {
          throw new Error(
            "系統回傳格式不是 JSON。\n" +
            "這通常表示 Apps Script 端出錯，或回了 HTML/錯誤頁。\n" +
            "原始內容：" + rawText.substring(0, 300)
          );
        }

        if (result.ok) {
          setSuccess(
            "✅ 綁定成功",
            `${profile.displayName} 您好<br>系統已完成通知綁定，視窗即將關閉`
          );

          setTimeout(() => {
            try {
              liff.closeWindow();
            } catch (_) {}
          }, 1800);

          return;
        }

        setError(
          "⚠️ 驗證未完成",
          result.error || "系統已回覆失敗訊息",
          [
            "步驟位置：" + currentStep,
            "LIFF ID：" + LIFF_ID,
            "CID：" + cid,
            "後端回應：" + JSON.stringify(result, null, 2)
          ].join("\n")
        );

      } catch (err) {
        const detail = stringifyError(err);

        setError(
          "❌ 系統連線異常",
          detail,
          [
            "步驟位置：" + currentStep,
            "LIFF ID：" + LIFF_ID,
            "GAS URL：" + GAS_URL,
            "UserAgent：" + navigator.userAgent,
            "錯誤內容：",
            detail
          ].join("\n")
        );
      }
    }

    main();
  </script>
</body>
</html>
