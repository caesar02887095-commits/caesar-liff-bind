<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAESAR 凱撒衛浴</title>
  <style>
    :root {
      --caesar-orange: #f28c28;
      --caesar-gray: #3f3f46;
      --bg: #f7f7f8;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      --success: #15803d;
      --error: #b91c1c;
      --warn: #92400e;
    }

    * { box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      text-align: center;
      min-height: 100vh;
      margin: 0;
      padding: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    .auth-page {
      min-height: calc(100vh - 36px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
    }

    #card {
      padding: 28px 24px;
      border-radius: 20px;
      background: var(--card);
      border: 1px solid var(--line);
      width: min(92vw, 480px);
      box-shadow: var(--shadow);
    }

    .brand-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 18px;
    }

    .brand-logo {
      width: 108px;
      max-width: 42vw;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.04em;
      margin-top: -4px;
    }

    .footer {
      width: min(92vw, 480px);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
    }

    h2 {
      color: #111827;
      letter-spacing: 4px;
      margin: 0;
      font-size: 24px;
      font-weight: 900;
    }

    .progress-wrap {
      margin: 12px 0 16px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .progress-bar {
      width: 100%;
      height: 12px;
      border-radius: 999px;
      background: #e5e7eb;
      overflow: hidden;
      border: 1px solid #d1d5db;
    }

    .progress-fill {
      width: 8%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #f59e0b, var(--caesar-orange));
      transition: width .22s ease;
    }

    p {
      color: var(--text);
      line-height: 1.7;
      white-space: pre-line;
      word-break: break-word;
      margin: 8px 0 0;
      font-size: 16px;
      font-weight: 800;
    }

    .success {
      color: var(--success);
      font-weight: 900;
      font-size: 18px;
    }

    .error {
      color: var(--error);
      font-weight: 900;
      font-size: 17px;
    }

    .warn {
      color: var(--warn);
      font-weight: 900;
      font-size: 17px;
    }

    .sub {
      color: var(--muted);
      font-size: 14px;
      margin-top: 12px;
      white-space: pre-line;
      word-break: break-word;
      line-height: 1.65;
    }

    .debug {
      color: #4b5563;
      font-size: 12px;
      margin-top: 14px;
      text-align: left;
      background: #f9fafb;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    @media (max-width: 480px) {
      #card { padding: 24px 20px; }
      .brand-logo { width: 96px; }
      h2 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <main class="auth-page">
    <div id="card">
      <div class="brand-head">
        <img class="brand-logo" src="LOGO.png" alt="CAESAR" />
        <h2>CAESAR</h2>
        <div class="brand-subtitle">凱撒衛浴配送服務</div>
      </div>
      <div class="progress-wrap" id="progressWrap">
      <div class="progress-row">
        <span id="progressLabel">正在驗證身分</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <p id="msg">正在驗證身分，請稍候...</p>
      <div id="detail" class="sub"></div>
      <div id="debug" class="debug" style="display:none;"></div>
    </div>
    <footer class="footer">
      凱撒衛浴｜配送查詢與 LINE 綁定服務<br />
      新竹縣竹北市環北路一段278號<br />
      本頁僅供客戶配送查詢與通知綁定使用
    </footer>
  </main>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    const LIFF_ID = "2009380550-ow9SlJK4";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxmUEj7tu2ZbqZaIESXhu9oS73QdE8qOGRKmHONqHXf-H6pL3zdYxuSvssjOExQNJjlhA/exec";

    const CODE = {
      LIFF_INITING: 'LIFF-1-01',
      LIFF_GET_PROFILE: 'LIFF-1-02',
      LIFF_SEND_REQUEST: 'LIFF-1-03',
      LIFF_PARSE_RESPONSE: 'LIFF-1-04',

      LIFF_NOT_LOGGED_IN: 'LIFF-4-01',
      LIFF_PROFILE_FAILED: 'LIFF-4-02',
      LIFF_FETCH_FAILED: 'LIFF-5-02',
      LIFF_INVALID_RESPONSE: 'LIFF-5-05',
      LIFF_UNKNOWN: 'LIFF-5-90'
    };

    let currentStep = "未開始";
    let DEBUG_MODE = false;

    function updateProgress(percent, label) {
      const safePercent = Math.max(0, Math.min(100, Number(percent || 0)));
      const fill = document.getElementById("progressFill");
      const percentEl = document.getElementById("progressPercent");
      const labelEl = document.getElementById("progressLabel");
      if (fill) fill.style.width = safePercent + "%";
      if (percentEl) percentEl.textContent = safePercent + "%";
      if (labelEl && label) labelEl.textContent = label;
    }

    function inferProgressFromStep(stepText) {
      const text = String(stepText || '');
      if (text.includes('步驟 1/5')) return { percent: 12, label: '檢查環境' };
      if (text.includes('步驟 2/5')) return { percent: 30, label: '初始化 LINE' };
      if (text.includes('尚未登入')) return { percent: 38, label: '導向登入' };
      if (text.includes('步驟 3/5')) return { percent: 52, label: '取得 LINE 資料' };
      if (text.includes('步驟 4/5')) return { percent: 72, label: '送出驗證' };
      if (text.includes('步驟 5/5')) return { percent: 90, label: '解析回應' };
      return { percent: 8, label: '正在驗證身分' };
    }

    function setStep(stepText) {
      currentStep = stepText;
      const progress = inferProgressFromStep(stepText);
      updateProgress(progress.percent, progress.label);
      document.getElementById("msg").innerHTML = stepText;
    }

    function setSuccess(titleHtml, detailHtml = "") {
      updateProgress(100, "完成");
      const msg = document.getElementById("msg");
      msg.innerHTML = titleHtml;
      msg.className = "success";
      document.getElementById("detail").innerHTML = detailHtml;

      const debugEl = document.getElementById("debug");
      debugEl.style.display = "none";
      debugEl.textContent = "";
    }

    function setWarn(titleHtml, detailHtml = "", debugText = "") {
      updateProgress(100, "需要確認");
      const msg = document.getElementById("msg");
      msg.innerHTML = titleHtml;
      msg.className = "warn";
      document.getElementById("detail").innerHTML = "";

      const debugEl = document.getElementById("debug");
      if (DEBUG_MODE && debugText) {
        debugEl.style.display = "block";
        debugEl.textContent = debugText;
      } else {
        debugEl.style.display = "none";
        debugEl.textContent = "";
      }
    }

    function setError(titleHtml, detailHtml = "", debugText = "") {
      updateProgress(100, "驗證失敗");
      const msg = document.getElementById("msg");
      msg.innerHTML = titleHtml;
      msg.className = "error";
      document.getElementById("detail").innerHTML = "";

      const debugEl = document.getElementById("debug");
      if (DEBUG_MODE && debugText) {
        debugEl.style.display = "block";
        debugEl.textContent = debugText;
      } else {
        debugEl.style.display = "none";
        debugEl.textContent = "";
      }
    }

    function stringifyError(err) {
      if (!err) return "未知錯誤";
      if (typeof err === "string") return err;
      if (err.stack) return err.stack;
      if (err.message) return err.message;
      try {
        return JSON.stringify(err);
      } catch (_) {
        return String(err);
      }
    }

    function stripApiCodePrefix(message) {
      return String(message || "").replace(/^\s*\[[A-Z]+-\d+-\d+\]\s*/, "");
    }

    async function main() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const cid = urlParams.get("cid") || "NEW";
        DEBUG_MODE = urlParams.get("debug") === "1";

        setStep(`[${CODE.LIFF_INITING}] 步驟 1/5：檢查 LIFF SDK...`);
        if (typeof liff === "undefined") {
          throw new Error(`[${CODE.LIFF_UNKNOWN}] LIFF SDK 未載入，可能是網路或 SDK 載入失敗`);
        }

        setStep(`[${CODE.LIFF_INITING}] 步驟 2/5：初始化 LIFF...`);
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          setStep(`[${CODE.LIFF_NOT_LOGGED_IN}] 尚未登入，導向 LINE 登入...`);
          liff.login();
          return;
        }

        setStep(`[${CODE.LIFF_GET_PROFILE}] 步驟 3/5：取得 LINE 使用者資料...`);
        let profile;
        try {
          profile = await liff.getProfile();
        } catch (profileErr) {
          throw new Error(`[${CODE.LIFF_PROFILE_FAILED}] 無法取得 LINE 使用者資料：${stringifyError(profileErr)}`);
        }

        const payload = {
          uid: profile.userId,
          displayName: profile.displayName || "客戶",
          cid: cid
        };

        setStep(`[${CODE.LIFF_SEND_REQUEST}] 步驟 4/5：送出驗證請求到系統...`);
        const query = new URLSearchParams(payload).toString();

        let response;
        try {
          response = await fetch(`${GAS_URL}?${query}`, {
            method: "GET"
          });
        } catch (fetchErr) {
          throw new Error(
            `[${CODE.LIFF_FETCH_FAILED}] 無法連線到 Apps Script。\n` +
            `請檢查：\n` +
            `1. Web App 是否重新部署\n` +
            `2. GAS URL 是否為最新 exec\n` +
            `3. Web App 權限是否允許任何人存取\n` +
            `原始訊息：${stringifyError(fetchErr)}`
          );
        }

        const rawText = await response.text();

        if (!response.ok) {
          throw new Error(
            `[${CODE.LIFF_FETCH_FAILED}] 系統有回應，但 HTTP 狀態異常。\n` +
            `HTTP ${response.status}\n` +
            `回應內容：${rawText.substring(0, 300)}`
          );
        }

        setStep(`[${CODE.LIFF_PARSE_RESPONSE}] 步驟 5/5：解析系統回應...`);
        let result;
        try {
          result = JSON.parse(rawText);
        } catch (parseErr) {
          throw new Error(
            `[${CODE.LIFF_INVALID_RESPONSE}] 系統回傳格式不是 JSON。\n` +
            `原始內容：${rawText.substring(0, 300)}`
          );
        }

        if (result.ok) {
          setSuccess(
            stripApiCodePrefix(result.message || "✅ 綁定成功"),
            `${profile.displayName} 您好<br>系統已完成通知綁定，視窗即將關閉`
          );

          setTimeout(() => {
            try {
              liff.closeWindow();
            } catch (_) {}
          }, 1800);

          return;
        }

        setWarn(
          result.error || `[${CODE.LIFF_UNKNOWN}] 驗證未完成`,
          "",
          [
            "步驟位置：" + currentStep,
            "LIFF ID：" + LIFF_ID,
            "CID：" + cid,
            "後端回應：" + JSON.stringify(result, null, 2)
          ].join("\n")
        );

      } catch (err) {
        const detail = stringifyError(err);

        setError(
          detail,
          "",
          [
            "步驟位置：" + currentStep,
            "LIFF ID：" + LIFF_ID,
            "GAS URL：" + GAS_URL,
            "UserAgent：" + navigator.userAgent,
            "錯誤內容：",
            detail
          ].join("\n")
        );
      }
    }

    main();
  </script>
</body>
</html>
