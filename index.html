<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAESAR 凱撒衛浴</title>
  <style>
    body {
      background: #121212;
      color: white;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }

    #card {
      padding: 40px;
      border-radius: 15px;
      background: #1e1e1e;
      border: 1px solid #333;
      width: 85%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h2 {
      color: #EBA13A;
      letter-spacing: 5px;
      margin-bottom: 20px;
    }

    #loader {
      border: 3px solid #333;
      border-top: 3px solid #EBA13A;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    p {
      color: #BBBBBB;
      line-height: 1.7;
      white-space: pre-line;
    }

    .success {
      color: #2ecc71;
      font-weight: bold;
      font-size: 18px;
    }

    .error {
      color: #ff6b6b;
      font-weight: bold;
      font-size: 17px;
    }

    .sub {
      color: #999;
      font-size: 14px;
      margin-top: 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="card">
    <h2>CAESAR</h2>
    <div id="loader"></div>
    <p id="msg">正在驗證身分，請稍候...</p>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    const LIFF_ID = "2009380550-ow9SlJK4";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxmUEj7tu2ZbqZaIESXhu9oS73QdE8qOGRKmHONqHXf-H6pL3zdYxuSvssjOExQNJjlhA/exec";

    function setMessage(html, className = "") {
      const loader = document.getElementById("loader");
      const msg = document.getElementById("msg");
      loader.style.display = "none";
      msg.className = className;
      msg.innerHTML = html;
    }

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        const urlParams = new URLSearchParams(window.location.search);
        const cid = urlParams.get("cid") || "NEW";

        const payload = {
          uid: profile.userId,
          displayName: profile.displayName || "客戶",
          cid: cid
        };

        const response = await fetch(GAS_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const text = await response.text();

        let result;
        try {
          result = JSON.parse(text);
        } catch (e) {
          throw new Error("後端回傳格式異常：" + text);
        }

        if (result.ok) {
          setMessage(
            `<div class="success">✅ 綁定成功</div>
             <div class="sub">${profile.displayName} 您好<br>系統已完成通知綁定，視窗即將關閉</div>`
          );

          setTimeout(() => {
            liff.closeWindow();
          }, 1800);

        } else {
          const errMsg = result.error || "綁定失敗，請稍後再試";
          setMessage(
            `<div class="error">⚠️ ${errMsg}</div>
             <div class="sub">如需協助，請聯絡公司處理</div>`
          );
        }

      } catch (err) {
        console.error("LIFF Frontend Error:", err);
        setMessage(
          `<div class="error">❌ 系統連線異常</div>
           <div class="sub">${err.message || "請稍後再試"}</div>`
        );
      }
    }

    main();
  </script>
</body>
</html>
